module:
  functionUnderTest:
    modulePath: "../../server/genericFunctions/p1ResolveEsAddress/P1ResolveEsAddress.js"
    exportName: "run"

processingSteps:
  - stepId: "onfAdapter"
    modulePath: "../../server/infra/onf/onfAdapter.js"
    isAsync: false

dependencies:
  - name: "pino"
  - name: "@confluentinc/kafka-javascript"

errorMapping: {}

