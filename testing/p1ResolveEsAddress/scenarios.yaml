  # Input validation
  # -------------------------

  - id: "errMissingParameters"
    description: "Should return error when input.parameters is missing (required)"
    inputFixture: "input.json"
    mocks:
      - stepId: "onfAdapter.getOnfAttributes"
        type: "return"
        fixture: "getOnfAttributes.json"
    expected:
      type: "error"
      errorEnum: "unknown error occurred"

  - id: "errMissingConfigFile"
    description: "Should return error when input.configFile is missing (required)"
    inputFixture: "input.json"
    mocks:
      - stepId: "onfAdapter.getOnfAttributes"
