module:
  functionUnderTest:
    modulePath: "../../server/specificFunctions/p1StreamPmData/p1ProcessDevice/p1CreateResultCc/p1PrepareTxModes/P1PrepareTxModes.js"
    exportName: ""

processingSteps:
  - stepId: "p1CalculateAiCapacity"
    modulePath: "../../server/genericFunctions/p1CalculateAiCapacity/P1CalculateAiCapacity.js"
    exportName: ""
    isAsync: true

errorMapping: {}

scenarios:
  # --------------------------------
  # input validation
  # --------------------------------

  - id: "errGeneralProcessingErrorNoInput"
    description: "Should return General processing error when input is not provided"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "General processing error"
    mocks: []

  - id: "errGeneralProcessingErrorBothListsMissing"
    description: "Should return General processing error when both historical-performance-data-list and transmission-mode-list are missing"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "General processing error"
    mocks: []

  - id: "errHistoricalPerformanceDataListNotProvided"
    description: "Should return error when historical-performance-data-list is missing"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "historicalPerformanceDataList not provided"
    mocks: []

  - id: "errHistoricalPerformanceDataListInvalid"
    description: "Should return error when historical-performance-data-list is not an array"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "historicalPerformanceDataList invalid"
    mocks: []

  - id: "errHistoricalPerformanceDataListIncomplete"
    description: "Should return error when a historical-performance-data-list entry is missing performance-data"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "historicalPerformanceDataList incomplete"
    mocks: []

  - id: "errTransmissionModeListNotProvided"
    description: "Should return error when transmission-mode-list is missing"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList not provided"
    mocks: []

  - id: "errTransmissionModeListInvalid"
    description: "Should return error when transmission-mode-list is not an array"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList invalid"
    mocks: []

  - id: "errTransmissionModeListIncomplete"
    description: "Should return error when a transmission-mode-list entry is missing one of channel-bandwidth, symbol-rate-reduction-factor, modulation-scheme, or code-rate"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList incomplete"
    mocks: []

  # --------------------------------
  # historical-performance-data-list behavior
  # --------------------------------

  - id: "errHistoricalPerformanceDataListCouldNotBeProvidedEmptyList"
    description: "Should return historicalPerformanceDataList could not be provided when historical-performance-data-list is empty"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "historicalPerformanceDataList could not be provided"
    mocks: []

  - id: "errHistoricalPerformanceDataListCouldNotBeProvidedNoPositiveTimeEntries"
    description: "Should return historicalPerformanceDataList could not be provided when all time-xstates-list entries have time equal to 0"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "historicalPerformanceDataList could not be provided"
    mocks: []

  - id: "okSkipHistoricalEntryWithoutTimeXstatesList"
    description: "Should remove historical-performance-data-list entries where performance-data.time-xstates-list is not an array"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "okRemoveZeroTimeEntries"
    description: "Should delete time-xstates-list entries where time equals 0"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "okKeepPositiveTimeEntries"
    description: "Should keep time-xstates-list entries where time is greater than 0"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  # --------------------------------
  # transmission-mode-list filtering
  # --------------------------------

  - id: "errTransmissionModeListCouldNotBeProvidedNoUsedModes"
    description: "Should return transmissionModeList could not be provided when no transmission mode matches any used positive-time transmission-mode"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList could not be provided"
    mocks: []

  - id: "errTransmissionModeListCouldNotBeProvidedMissingTransmissionModeName"
    description: "Should return transmissionModeList could not be provided when used transmission modes cannot be matched because transmission-mode-name is missing"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList could not be provided"
    mocks: []

  - id: "okRemoveUnusedTransmissionModes"
    description: "Should remove transmission-mode-list entries not referenced by any positive-time time-xstates-list entry"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "okKeepOnlyUsedTransmissionModes"
    description: "Should keep only transmission modes referenced by positive-time time-xstates-list entries"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "okDuplicateUsageAcrossHistoricalEntries"
    description: "Should keep a transmission mode used in multiple historical entries only once in transmission-mode-list and complement it with capacity"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "okMixedUsedAndUnusedTransmissionModes"
    description: "Should remove unused transmission modes, keep used ones, and add capacity only to the kept entries"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  # --------------------------------
  # capacity enrichment
  # --------------------------------

  - id: "okAddCapacityToUsedTransmissionModes"
    description: "Should complement each used transmission mode with capacity from p1CalculateAiCapacity"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.output.json"

  - id: "errTransmissionModeListCouldNotBeProvidedWhenCapacityReturnsErrorString"
    description: "Should return transmissionModeList could not be provided when p1CalculateAiCapacity returns an error string for a used transmission mode"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "transmissionModeList could not be provided"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "return"
        fixture: "p1CalculateAiCapacity.error.json"

  - id: "errGeneralProcessingErrorWhenCapacityThrows"
    description: "Should return General processing error when p1CalculateAiCapacity throws unexpectedly"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "General processing error"
    mocks:
      - stepId: "p1CalculateAiCapacity"
        type: "throw"
        error: "unexpected capacity calculation failure"