#
# Spec sources:
# - spec/Functions/p2StreamPmData/p2ProcessDevice/p2LoadRawCc/1.0.0/interface.yaml
# - spec/Functions/p2StreamPmData/p2ProcessDevice/p2LoadRawCc/1.0.0/variables.yaml
#

module:
  functionUnderTest:
    modulePath: "../../server/specificFunctions/p2StreamPmData/p2ProcessDevice/p2LoadRawCc/P2LoadRawCc.js"
    exportName: "run"

processingSteps:
  - stepId: "onfAdapter.getEsClient"
    modulePath: "../../server/infra/onf/onfAdapter.js"
    exportName: "getEsClient"
    isAsync: true

  - stepId: "p1FieldsFilter"
    modulePath: "../../server/genericFunctions/p1FieldsFilter/P1FieldsFilter.js"
    exportName: ""
    isAsync: true

  - stepId: "p2DiscardIrrelevantPmRecords"
    modulePath: "../../server/genericFunctions/p2DiscardIrrelevantPmRecords/P2DiscardIrrelevantPmRecords.js"
    exportName: ""
    isAsync: true

  - stepId: "p1CalculateInterfacePmDataQuality"
    modulePath: "../../server/genericFunctions/p1CalculateInterfacePmDataQuality/P1CalculateInterfacePmDataQuality.js"
    exportName: ""
    isAsync: true

dependencies: []

errorMapping: {}

scenarios:
  # -------------------------
  # Input validation
  # -------------------------

  - id: "errParametersNotProvided"
    description: "Should return 'parameters not provided' when parameters is missing"
    inputFixture: "input_missing_parameters.json"
    expected:
      type: "error"
      errorEnum: "parameters not provided"
    mocks: []

  - id: "errParametersInvalid"
    description: "Should return 'parameters invalid' when parameters is not an object"
    inputFixture: "input_invalid_parameters.json"
    expected:
      type: "error"
      errorEnum: "parameters invalid"
    mocks: []

  - id: "errMwdiReplicaEsClientNotProvided"
    description: "Should return 'mwdiReplicaEsClient not provided' when mwdi-replica-es-client is missing"
    inputFixture: "input_missing_mwdi_replica_es_client.json"
    expected:
      type: "error"
      errorEnum: "mwdiReplicaEsClient not provided"
    mocks: []

  - id: "errMwdiReplicaEsClientInvalid"
    description: "Should return 'mwdiReplicaEsClient invalid' when mwdi-replica-es-client is invalid"
    inputFixture: "input_invalid_mwdi_replica_es_client.json"
    expected:
      type: "error"
      errorEnum: "mwdiReplicaEsClient invalid"
    mocks: []

  - id: "errMountNameNotProvided"
    description: "Should return 'mountName not provided' when mount-name is missing"
    inputFixture: "input_missing_mount_name.json"
    expected:
      type: "error"
      errorEnum: "mountName not provided"
    mocks: []

  - id: "errMountNameInvalid"
    description: "Should return 'mountName invalid' when mount-name is blank"
    inputFixture: "input_invalid_mount_name.json"
    expected:
      type: "error"
      errorEnum: "mountName invalid"
    mocks: []

  - id: "errOffsetsNotProvided"
    description: "Should return 'offsets not provided' when offsets is missing"
    inputFixture: "input_missing_offsets.json"
    expected:
      type: "error"
      errorEnum: "offsets not provided"
    mocks: []

  - id: "errOffsetsInvalid"
    description: "Should return 'offsets invalid' when offsets is not an array"
    inputFixture: "input_invalid_offsets.json"
    expected:
      type: "error"
      errorEnum: "offsets invalid"
    mocks: []

  # -------------------------
  # Happy paths
  # -------------------------


  - id: "okLoadRawCcWithFieldsFilter"
    description: "Should apply p1FieldsFilter before PM processing when raw-cc fields filter is configured"
    inputFixture: "input_with_fields_filter.json"
    expected:
      type: "success"
      outputFixture: "output_with_fields_filter.json"
      outputSchemaFixture: "output.schema.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p1FieldsFilter"
        type: "return"
        fixture: "p1FieldsFilter.output.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "return"
        fixture: "p2DiscardIrrelevantPmRecords.output.json"
      - stepId: "p1CalculateInterfacePmDataQuality"
        type: "return"
        fixture: "p1CalculateInterfacePmDataQuality.output.json"

  - id: "okInitializeFunctionOffsetWhenMissing"
    description: "Should initialize p2LoadRawCc function offset and interface offsets when missing"
    inputFixture: "input_missing_function_offset.json"
    expected:
      type: "success"
      outputFixture: "output_missing_function_offset.json"
      outputSchemaFixture: "output.schema.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "return"
        fixture: "p2DiscardIrrelevantPmRecords.output.json"
      - stepId: "p1CalculateInterfacePmDataQuality"
        type: "return"
        fixture: "p1CalculateInterfacePmDataQuality.output.json"

  - id: "okProcessMultipleInterfaces"
    description: "Should process multiple interfaces and append PM data quality for each interface"
    inputFixture: "input_multiple_interfaces.json"
    expected:
      type: "success"
      outputFixture: "output_multiple_interfaces.json"
      outputSchemaFixture: "output.schema.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "returnSequence"
        fixtureSequence:
          - "p2DiscardIrrelevantPmRecords.output.interface1.json"
          - "p2DiscardIrrelevantPmRecords.output.interface2.json"
        repeatLast: false
      - stepId: "p1CalculateInterfacePmDataQuality"
        type: "returnSequence"
        fixtureSequence:
          - "p1CalculateInterfacePmDataQuality.output.interface1.json"
          - "p1CalculateInterfacePmDataQuality.output.interface2.json"
        repeatLast: false

  - id: "okIgnoreLayerProtocolsWithoutHistoricalPerformanceDataList"
    description: "Should ignore layer protocols that do not contain historical-performance-data-list"
    inputFixture: "input_without_historical_performance_list.json"
    expected:
      type: "success"
      outputFixture: "output_without_historical_performance_list.json"
      outputSchemaFixture: "output.schema.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.no_history.json"

  - id: "okUpdateBatchTimestampFromLatestCurrentPerformanceTimestamp"
    description: "Should set raw-cc batch-timestamp to the latest valid current performance timestamp"
    inputFixture: "input_batch_timestamp_update.json"
    expected:
      type: "success"
      outputFixture: "output_batch_timestamp_update.json"
      outputSchemaFixture: "output.schema.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.batch_timestamp.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "return"
        fixture: "p2DiscardIrrelevantPmRecords.output.json"
      - stepId: "p1CalculateInterfacePmDataQuality"
        type: "return"
        fixture: "p1CalculateInterfacePmDataQuality.output.json"

  # -------------------------
  # Processing step failures
  # -------------------------

  - id: "errRawCcCouldNotBeProvidedWhenReplicaClientCreationFails"
    description: "Should return 'rawCc could not be provided' when Replica ES client creation fails during read"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "rawCc could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "throw"
        error: "replica client creation failed"

  - id: "errRawCcCouldNotBeProvidedWhenReplicaReadFails"
    description: "Should return 'rawCc could not be provided' when reading ControlConstruct from Replica fails"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "rawCc could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.erroring.json"

  - id: "errRawCcCouldNotBeProvidedWhenFieldsFilterReturnsInvalidStructure"
    description: "Should return 'rawCc could not be provided' when p1FieldsFilter returns malformed output"
    inputFixture: "input_with_fields_filter.json"
    expected:
      type: "error"
      errorEnum: "rawCc could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p1FieldsFilter"
        type: "return"
        fixture: "p1FieldsFilter.invalid-output.json"

  - id: "errRawCcCouldNotBeProvidedWhenFieldsFilterThrows"
    description: "Should return 'rawCc could not be provided' when p1FieldsFilter throws"
    inputFixture: "input_with_fields_filter.json"
    expected:
      type: "error"
      errorEnum: "rawCc could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p1FieldsFilter"
        type: "throw"
        error: "fields filter failure"

  - id: "errPmDataQualityCouldNotBeProvidedWhenP1CalculateInterfacePmDataQualityReturnsInvalidOutput"
    description: "Should return 'pmDataQuality could not be provided' when p1CalculateInterfacePmDataQuality returns invalid output"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "pmDataQuality could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "return"
        fixture: "p2DiscardIrrelevantPmRecords.output.json"
      - stepId: "p1CalculateInterfacePmDataQuality"
        type: "return"
        fixture: "p1CalculateInterfacePmDataQuality.invalid-output.json"

  - id: "errPmDataQualityCouldNotBeProvidedWhenP1CalculateInterfacePmDataQualityMissing"
    description: "Should return 'pmDataQuality could not be provided' when p1CalculateInterfacePmDataQuality implementation is unavailable"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "pmDataQuality could not be provided"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.replica.json"
      - stepId: "p2DiscardIrrelevantPmRecords"
        type: "return"
        fixture: "p2DiscardIrrelevantPmRecords.output.json"