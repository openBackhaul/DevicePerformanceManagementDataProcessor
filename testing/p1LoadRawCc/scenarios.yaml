module:
  functionUnderTest:
    modulePath: "../../server/specificFunctions/p1StreamPmData/p1ProcessDevice/p1LoadRawCc/P1LoadRawCc.js"
    exportName: "run"

processingSteps:
  - stepId: "onfAdapter.getEsClient"
    modulePath: "../../server/infra/onf/onfAdapter.js"
    exportName: "getEsClient"
    isAsync: true

  - stepId: "retry.withRetry"
    modulePath: "../../server/utils/retry.js"
    exportName: "withRetry"
    isAsync: true

  - stepId: "p1FieldsFilter.run"
    modulePath: "../../server/genericFunctions/p1FieldsFilter/P1FieldsFilter.js"
    exportName: "run"
    isAsync: true

  - stepId: "p1DiscardIrrelevantPmRecords"
    modulePath: "../../server/genericFunctions/p1DiscardIrrelevantPmRecords/P1DiscardIrrelevantPmRecords.js"
    exportName: ""
    isAsync: true

# Transitive deps that may be imported elsewhere in the require stack
dependencies:
  - name: "pino"
  - name: "@confluentinc/kafka-javascript"

errorMapping: {}

scenarios:
  # -------------------------
  # Input validation
  # -------------------------
 
  - id: "okMixedLayerProtocolsProcessed"
    description: "Should process both air-interface and ethernet-container layer protocols"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks:
      - stepId: "onfAdapter.getEsClient"
        type: "return"
        fixture: "onfAdapter.getEsClient.bothClients.json"
      - stepId: "retry.withRetry"
        type: "return"
        fixture: "withRetry.sequence.json"
      - stepId: "p1FieldsFilter.run"
        type: "return"
        fixture: "p1FieldsFilter.output.withMixedProtocols.json"
