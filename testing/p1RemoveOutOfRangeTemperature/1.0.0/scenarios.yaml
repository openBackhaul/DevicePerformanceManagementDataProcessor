    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okTemperatureAboveUpperDeleted"
    description: "Should delete temperature when temperature > upperTemperatureLimit"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okMultipleEquipmentMixed"
    description: "Should delete temperature only for equipment entries out of range; keep others"
