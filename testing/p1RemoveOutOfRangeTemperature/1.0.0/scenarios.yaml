  - id: "okNoParameterList"
    description: "Should succeed when parameters.parameter list is missing (no temperature removal performed)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okEmptyParameterList"
    description: "Should succeed when parameters.parameter is empty (no temperature removal performed)"
    inputFixture: "input.json"
