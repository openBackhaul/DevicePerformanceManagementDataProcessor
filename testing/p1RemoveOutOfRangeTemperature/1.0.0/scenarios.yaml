  - id: "errParametersInvalid"
    description: "Should return error when parameters is not an object"
    inputFixture: "input.json"
    expected:
      type: "error"
      errorEnum: "parameters invalid"
    mocks: []

  # -------------------------
  # equipment validation
  # -------------------------

  - id: "errEquipmentNotProvided"
    description: "Should return error when equipment is missing"
