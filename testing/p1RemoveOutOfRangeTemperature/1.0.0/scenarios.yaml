      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okLowerLimitMissing"
    description: "Should succeed when lowerTemperatureLimit is missing (temperature not removed because range is incomplete)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okUpperLimitMissing"
    description: "Should succeed when upperTemperatureLimit is missing (temperature not removed because range is incomplete)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okLimitsInvalidNonNumeric"
    description: "Should succeed when limits are non-numeric strings (implementation should not crash; treat as cannot-compare => keep temperature)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okLimitsReversed"
    description: "Should succeed when lower limit > upper limit (treat as invalid configuration; keep temperature values)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  # -------------------------
  # removal behavior
  # -------------------------

  - id: "okEquipmentEmptyList"
    description: "Should return success with empty equipment list"
