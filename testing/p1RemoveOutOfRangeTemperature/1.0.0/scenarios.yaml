  - id: "okTemperatureMissing"
    description: "Should keep equipment unchanged when temperature attribute is missing"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okTemperatureWithinRangeKeep"
    description: "Should keep temperature when within configured inclusive range"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okTemperatureEqualsLowerLimitKeep"
    description: "Should keep temperature when exactly equal to lower limit (spec says delete if < lower)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okTemperatureEqualsUpperLimitKeep"
    description: "Should keep temperature when exactly equal to upper limit (spec says delete if > upper)"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
    mocks: []

  - id: "okTemperatureBelowLowerDeleted"
    description: "Should delete temperature when temperature < lowerTemperatureLimit"
