  - id: "errGeneralProcessingErrorWhenLayerProtocolNameIsNotString"
    description: "Should return General processing error when layer-protocol-name is not a string and endsWith fails"
    inputFixture: "input_invalid_layer_protocol_name.json"
    expected:
      type: "error"
      errorEnum: "General processing error"
