scenarios:
  # -------------------------
  # Happy path
  # -------------------------

  - id: "okAptOutputFormatted"
    description: "Should transform resultCc into apt-output-format and return format-name and output-format"
    inputFixture: "input.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputFormattedAirInterfacesOnly"
    description: "Should transform valid result-cc containing only AIR_LAYER entries"
    inputFixture: "input_air_only.json"
    expected:
      type: "success"
      outputFixture: "output_air_only.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputFormattedEthernetContainersOnly"
    description: "Should transform valid result-cc containing only ETHERNET_CONTAINER entries"
    inputFixture: "input_ethernet_only.json"
    expected:
      type: "success"
      outputFixture: "output_ethernet_only.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputFormattedEmptyLists"
    description: "Should return apt-output-format with empty interface lists when no matching layer protocols are found"
    inputFixture: "input_no_matching_protocols.json"
    expected:
      type: "success"
      outputFixture: "output_empty_lists.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputUsesCpuTemperature"
    description: "Should prefer CPU temperature over subrack temperature when both are present"
    inputFixture: "input_cpu_and_subrack_temperature.json"
    expected:
      type: "success"
      outputFixture: "output_cpu_temperature.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputUsesSubrackTemperatureFallback"
    description: "Should use subrack temperature when CPU temperature is not present"
    inputFixture: "input_subrack_temperature_only.json"
    expected:
      type: "success"
      outputFixture: "output_subrack_temperature.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputUsesEmptyTemperatureFallback"
    description: "Should set idu-cpu-temperature to empty string when no temperature is available"
    inputFixture: "input_no_temperature.json"
    expected:
      type: "success"
      outputFixture: "output_no_temperature.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputWithParallelAirAndWireLinks"
    description: "Should populate link-aggregation-identifiers for parallel AIR and WIRE LTPs"
    inputFixture: "input_parallel_links.json"
    expected:
      type: "success"
      outputFixture: "output_parallel_links.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []


  - id: "okAptOutputFiltersZeroTimeTransmissionModes"
    description: "Should include only operated transmission modes with time greater than zero"
    inputFixture: "input_operated_modes_filter.json"
    expected:
      type: "success"
      outputFixture: "output_operated_modes_filter.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []

  - id: "okAptOutputWithMissingCapabilityModeMatch"
    description: "Should set configured modulation objects to null when transmission mode names are not found in capability list"
    inputFixture: "input_missing_mode_match.json"
    expected:
      type: "success"
      outputFixture: "output_missing_mode_match.json"
      outputSchemaFixture: "output.schema.json"
    mocks: []



  - id: "errResultCcNotProvidedWhenResultCcMissing"
