#
# testing/p1LoadParameters/1.0.0/scenarios.yaml
#
# Spec sources:
# - spec/Functions/p1StreamPmData/p1LoadParameters/1.0.0/interface.yaml
# - spec/Functions/p1StreamPmData/p1LoadParameters/1.0.0/variables.yaml
#

module:
  functionUnderTest:
    modulePath: "../../server/genericFunctions/p1LoadParameters/P1LoadParameters.js"
    exportName: "run"

processingSteps:
  - stepId: "onf.readControlConstruct"
    modulePath: "../../server/infra/onf/onfAdapter.js"
    exportName: "readControlConstruct"
    isAsync: true

  - stepId: "config.loadConfigFile"
    modulePath: "../../server/utils/config"
    exportName: "loadConfigFile"
    isAsync: false

  - stepId: "functionTree.loadFunctionParameters"
    modulePath: "../../server/utils/functionTree"
    exportName: "loadFunctionParameters"
    isAsync: false

dependencies:
  - name: "pino"
  - name: "@confluentinc/kafka-javascript"

errorMapping: {}

scenarios:
  # -------------------------
  # happy path
  # -------------------------

  - id: "okConfigProvidedInRequest"
    description: "Should use configFile from request and return expected parameters + configFile"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  - id: "okFunctionNameKebabCase"
    description: "Should accept function-name from request"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  - id: "okConfigFileKebabCase"
    description: "Should accept config-file from request"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  - id: "okFallbackToOnfReadControlConstruct"
    description: "Should read configFile from onfAdapter when configFile not provided in request"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  - id: "okFallbackToLoadConfigFile"
    description: "Should fallback to loadConfigFile when configFile not provided and ONF returns null"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  - id: "okFunctionWithoutSubFunctionList"
    description: "Should return expected parameters + configFile when function profile has no subFunctionList"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "success"
      outputFixture: "output.json"
      outputSchemaFixture: "output.schema.json"

  # -------------------------
  # input validation
  # -------------------------

  - id: "errInvalidRequestNull"
    description: "Should throw unknown error when request is null"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "unknown error occurred"
      errorSchemaFixture: "error.schema.json"

  - id: "errInvalidRequestPrimitive"
    description: "Should throw unknown error when request is not an object"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "unknown error occurred"
      errorSchemaFixture: "error.schema.json"

  - id: "errFunctionNameNotProvided"
    description: "Should throw error when functionName/function-name is missing"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "functionName is mandatory"
      errorSchemaFixture: "error.schema.json"

  # -------------------------
  # ONF config access errors
  # -------------------------

  - id: "errOnfConfigNotAccessible"
    description: "Should fail with configFile not found or not accessible when onfAdapter.readControlConstruct throws non-SyntaxError"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "throw"
        error:
          message: "connection failed"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "configFile not found or not accessible"
      errorSchemaFixture: "error.schema.json"

  - id: "errOnfConfigInvalidJson"
    description: "Should fail with configFile is not valid JSON when onfAdapter.readControlConstruct throws SyntaxError"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "throw"
        error:
          name: "SyntaxError"
          message: "Unexpected token"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "configFile is not valid JSON"
      errorSchemaFixture: "error.schema.json"

  # -------------------------
  # local config loading errors
  # -------------------------

  - id: "errConfigFileNotFoundOrNotAccessible"
    description: "Should fail with configFile not found or not accessible when loadConfigFile throws non-SyntaxError"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "throw"
        error:
          message: "ENOENT"
    expected:
      type: "error"
      errorEnum: "configFile not found or not accessible"
      errorSchemaFixture: "error.schema.json"

  - id: "errConfigFileIsNotValidJson"
    description: "Should fail with configFile is not valid JSON when loadConfigFile throws SyntaxError"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "throw"
        error:
          name: "SyntaxError"
          message: "Unexpected token"
    expected:
      type: "error"
      errorEnum: "configFile is not valid JSON"
      errorSchemaFixture: "error.schema.json"

  # -------------------------
  # schema validation
  # -------------------------

  - id: "errConfigFileDoesNotConformToExpectedSchema"
    description: "Should fail when configFile does not contain profile-collection.profile array"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "configFile does not conform to the expected schema"
      errorSchemaFixture: "error.schema.json"

  - id: "errProfileArrayMissing"
    description: "Should fail when profile-collection.profile is missing"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "configFile does not conform to the expected schema"
      errorSchemaFixture: "error.schema.json"

  - id: "errProfileNotArray"
    description: "Should fail when profile-collection.profile is not an array"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "nullObject.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "configFile does not conform to the expected schema"
      errorSchemaFixture: "error.schema.json"

  # -------------------------
  # real loadFunctionParameters behavior
  # -------------------------

  - id: "errFunctionNameNotFoundInConfigFile"
    description: "Should fail when the function profile does not exist"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
    expected:
      type: "error"
      errorEnum: "functionName not found in configFile"
      errorSchemaFixture: "error.schema.json"

  # -------------------------
  # forced unknown error from functionTree
  # -------------------------

  - id: "errUnknownErrorOccurred"
    description: "Should fail with unknown error occurred when loadFunctionParameters throws an unexpected error"
    inputFixture: "input.json"
    mocks:
      - stepId: "onf.readControlConstruct"
        type: "return"
        fixture: "onfControlConstruct.json"
      - stepId: "config.loadConfigFile"
        type: "return"
        fixture: "configFile.json"
      - stepId: "functionTree.loadFunctionParameters"
        type: "throw"
        error:
          message: "some unexpected error"
    expected:
      type: "error"
      errorEnum: "unknown error occurred"
      errorSchemaFixture: "error.schema.json"