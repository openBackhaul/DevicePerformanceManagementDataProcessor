  /p1/provide-air-interface-and-ethernet-container-interface-names:
    post:
      operationId: p1ProvideAirInterfaceAndEthernetContainerInterfaceNames
      summary: 'Provides the interface names for AirInterface and EthernetContainers derived from LTP structure and augment information'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ltp-structure-and-augment
              properties:
                ltp-structure-and-augment:
                  type: array
                  items:
                    type: object
                    properties:
                      logical-termination-point:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: 'The identifier of the current LTP'
                            layer-protocol:
                              type: array
                              items:
                                type: object
                                properties:
                                  local-id:
                                    type: string
                                    description: 'The local-id of the current LTP/layer-protocol'
                                  layer-protocol-name:
                                    type: string
                                    description: 'The layer-protocol-name of the current LTP/layer-protocol'
                            ltp-augment-1-0:ltp-augment-pac:
                              type: object
                              description: 'The ltp-augment of the current LTP'
                              properties:
                                external-label:
                                  type: string
                                original-ltp-name:
                                  type: string
                air-interface-list:
                  type: array
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: 'The uuid of the current AirInterface LTP (logical-termination-point-id)'
                ethernet-container-list:
                  type: array
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: 'The uuid of the current EthernetContainer LTP (logical-termination-point-id)'
      responses:
        '200':
          description: 'Interface names compiled'
          content:
            application/json:
              schema:
                type: object
                properties:
                  list-of-air-interface-names:
                    description: >
                      'This list holds the computed Ids for every air-interface from the air-interface list in the requestBody'
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          description: >
                            'The uuid of the currently traversed AirInterface LTP/LP
                            from {$request.body#air-interface-list/uuid}'
                        local-id:
                          type: string
                          description: >
                            'The local-id of the currently traversed AirInterface LTP/LP
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol/local-id}
                            where {request.body#ltp-structure-and-augment/logical-termination-point/uuid} == current uuid from {$request.body#air-interface-list/uuid}'
                        link-endpoint-id:
                          type: string
                          example: '513550010B'
                          description: >
                            'The unit-ID of the currently traversed AirInterface LTP/LP
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label}
                            where {request.body#ltp-structure-and-augment/logical-termination-point/uuid} == current uuid from {$request.body#air-interface-list/uuid}'
                        link-id:
                          type: string
                          example: '513550010'
                          description: >
                            'The link-ID of the currently traversed AirInterface LTP/LP. To be obtained by extracting the substring constituted by the 9 first characters
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label}
                            where {request.body#ltp-structure-and-augment/logical-termination-point/uuid} == current uuid from {$request.body#air-interface-list/uuid}'
                  list-of-ethernet-container-names:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          description: >
                            'The uuid of the currently traversed EthernetContainer LTP/LP
                            from {$request.body#ethernet-container-list/uuid}'
                        local-id:
                          type: string
                          description: >
                            'The local-id of the currently traversed EthernetContainer LTP/LP
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol/local-id}
                            where {request.body#ltp-structure-and-augment/logical-termination-point/uuid} == current uuid from {$request.body#ethernet-container-list/uuid}'
                        interface-name:
                          type: string
                          example: 'LAN 1/6/6'
                          description: >
                            'Interface name of the currently traversed EthernetContainer as it is represented at the vendors own management interface
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name}
                            where {request.body#ltp-structure-and-augment/logical-termination-point/uuid} == current uuid from {$request.body#air-interface-list/uuid}'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'