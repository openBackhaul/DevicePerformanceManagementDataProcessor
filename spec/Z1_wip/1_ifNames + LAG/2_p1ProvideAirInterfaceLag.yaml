  /p1/provide-air-interface-physical-link-aggregation:
    post:
      operationId: p1ProvideAirInterfacePhysicalLinkAggregation
      summary: 'Provides the AirInterface link aggregation information derived from LTP structure and augment information'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ltp-structure-and-augment
              properties:
                ltp-structure-and-augment:
                  type: array
                  items:
                    type: object
                    properties:
                      logical-termination-point:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: 'The identifier of the current LTP'
                            client-ltp:
                              type: array
                              description: 'The client-LTPs array of the current LTP'
                              items:
                                type: string
                            server-ltp:
                              type: array
                              description: 'The server-LTPs of the current LTP'
                              items:
                                type: string
                            layer-protocol:
                              type: array
                              items:
                                type: object
                                properties:
                                  local-id:
                                    type: string
                                    description: 'The local-id of the current LTP/layer-protocol'
                                  layer-protocol-name:
                                    type: string
                                    description: 'The layer-protocol-name of the current LTP/layer-protocol'
                            ltp-augment-1-0:ltp-augment-pac:
                              type: object
                              description: 'The ltp-augment of the current LTP'
                              properties:
                                external-label:
                                  type: string
                                original-ltp-name:
                                  type: string
                air-interface-list:
                  type: array
                  items:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: 'The uuid of the current AirInterface LTP (logical-termination-point-id)'
      responses:
        '200':
          description: 'Ltp augment for LAGs provided'
          content:
            application/json:
              schema:
                description: >
                  'This service determines the Link aggregation information for all air-interface instances of the device from the request.body#ltp-structure-and-augment.
                  Therefore it iterates over the all {$response.body#ltp-structure-and-augment/logical-termination-point}
                  array items and compute the link aggregation information where layer-protocol-name indicates AIR_LAYER.
                  The uuid for the retrieval from ltp-augment information is not the one of the AirInterface itself, but has to be determined by stepping through the hierarchy of LTPs on top of the AirInterface
                  as follows:
                    ClientLtp OF AirInterfaceUuid = ClientStructureUuid
                    ClientLtp OF ClientStructureUuid = ClientEthernetContainerUuid
                    ServerLtp OF ClientEthernetContainerUuid = LIST-OF ServingStructureUuid

                    FOR EACH ServingStructureUuid in LIST-OF ServingStructureUuid:
                    ServerLtp OF ServingStructureUuid = Wire/AirInterfaceUuid
                    
                    Result = List-of-Wire/AirInterfaceUuid'
                type: object
                properties:
                  air-interface-list: 
                    type: array
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                          description: >
                            'The uuid of the currently traversed EthernetContainer LTP/LP
                            from {$request.body#ltp-structure-and-augment/logical-termination-point/uuid}'
                        link-aggregation-identifiers:
                          type: array
                          items:
                            oneOf:
                              - description: 'AirInterfaces'
                                type: object
                                required:
                                  - link-id
                                properties:
                                  link-id:
                                    type: string
                                    example: '513550010'
                                    description: >
                                      'The link-ID for the current AirInterface uuid from List-of-Wire/AirInterfaceUuids to be obtained by extracting the substring constituted by the 9 first characters
                                      from {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label}'
                              - description: 'WireInterface'
                                type: object
                                required:
                                  - interface-name
                                properties:
                                  interface-name:
                                    type: string
                                    description: >
                                      'Interface name for the current WireInterface uuid from List-of-Wire/InterfaceUuids
                                      from {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name}'
          '400':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '401':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '403':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '404':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '500':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          default:
            $ref: '#/components/responses/responseForErroredServiceRequests'