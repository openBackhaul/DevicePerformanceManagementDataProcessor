# Input: LTP structure + augment
# Beim Aufruf im Service für if-on-demand -> es muss erst vom MWDI die LTP structure + augment abgerufen werden (siehe APTP)
# das dient dann als input für den lookup

  /p1/provide-control-construct-identifiers-for-air-interface:
    post:
      operationId: p1ProvideControlConstructIdentifiersForAirInterface
      summary: 'Provides the mapped AirInterface uuid and localid for mountname and linkId input'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
                - link-id
                - ltp-structure-and-augment
              properties:
                mount-name:
                  type: string
                  description: 'The mountName of the device for which the translation into ControlConstruct IDs shall be done'
                link-id:
                  type: string
                  description: 'The linkId on the device for which the translation into ControlConstruct IDs shall be done'
                ltp-structure-and-augment:
                  type: array
                  description: 'The data where the ControlConstruct IDs for mountName and linkId shall be looked up'
                  items:
                    type: object
                    properties:
                      logical-termination-point:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: 'The identifier of the logical-termination-point'
                            layer-protocol:
                              type: array
                              items:
                                type: object
                                properties:
                                  local-id:
                                    type: string
                                    description: 'The local-id of the layer-protocol'
                                  layer-protocol-name:
                                    type: string
                                    description: 'The layer-protocol-name of the current LTP/layer-protocol'
                            ltp-augment-1-0:ltp-augment-pac:
                              type: object
                              description: 'The ltp-augment of the current LTP'
                              properties:
                                external-label:
                                  type: string
                                original-ltp-name:
                                  type: string
      responses:
        '200':
          description: 'Mapped ControlConstruct IDs for AirInterface provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - uuid
                  - local-id
                properties:
                  mount-name:
                    type: string
                    description: >
                      'The mountName of the device
                      from {$request.body#mount-name}'
                  uuid:
                    type: string
                    description: >
                      'The uuid of the AirInterface LTP on the device belonging to the input linkId
                      from {$request.body#ltp-structure-and-augment/logical-termination-point/uuid}
                      where {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol-name} indicates AIR_LAYER
                      and {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label} contains {$request.body#link-id}'
                  local-id:
                    type: string
                    description: >
                      'The localId of the AirInterface layerProtocol on the device belonging to the input linkId
                      from {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol/local-id}
                      where {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol-name} indicates AIR_LAYER
                      and {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label} contains {$request.body#link-id}'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'