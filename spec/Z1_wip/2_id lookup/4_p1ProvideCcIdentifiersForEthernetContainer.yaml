

  /p1/provide-control-construct-identifiers-for-ethernet-container:
    post:
      operationId: p1ProvideControlConstructIdentifiersForEthernetContainer
      summary: 'Provides the mapped EthernetContainer uuid and localid for mountname and portId input'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
                - port-id
                - ltp-structure-and-augment
              properties:
                mount-name:
                  type: string
                  description: 'The mountName of the device for which the translation into ControlConstruct IDs shall be done'
                port-id:
                  type: string
                  description: 'The portId on the device for which the translation into ControlConstruct IDs shall be done'
                ltp-structure-and-augment:
                  type: array
                  description: 'The data where the ControlConstruct IDs for mountName and portId shall be looked up'
                  items:
                    type: object
                    properties:
                      logical-termination-point:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                              description: 'The identifier of the logical-termination-point'
                            layer-protocol:
                              type: array
                              items:
                                type: object
                                properties:
                                  local-id:
                                    type: string
                                    description: 'The local-id of the layer-protocol'
                                  layer-protocol-name:
                                    type: string
                                    description: 'The layer-protocol-name of the current LTP/layer-protocol'
                            ltp-augment-1-0:ltp-augment-pac:
                              type: object
                              description: 'The ltp-augment of the current LTP'
                              properties:
                                external-label:
                                  type: string
                                original-ltp-name:
                                  type: string
      responses:
        '200':
          description: 'Mapped ControlConstruct IDs for EthernetContainer provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - uuid
                  - local-id
                properties:
                  mount-name:
                    type: string
                    description: >
                      'The mountName of the device
                      from {$request.body#mount-name}'
                  uuid:
                    type: string
                    description: >
                      'The uuid of the EthernetContainer LTP on the device belonging to the input portId
                      from {$request.body#ltp-structure-and-augment/logical-termination-point/uuid}
                      where {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol-name} indicates ETHERNET_CONTAINER_LAYER
                      and {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name} contains {$request.body#port-id}'
                  local-id:
                    type: string
                    description: >
                      'The localId of the EthernetContainer layerProtocol on the device belonging to the input portId
                      from {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol/local-id}
                      where {$request.body#ltp-structure-and-augment/logical-termination-point/layer-protocol-name} indicates ETHERNET_CONTAINER_LAYER
                      and {$request.body#ltp-structure-and-augment/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name} contains {$request.body#port-id}'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'