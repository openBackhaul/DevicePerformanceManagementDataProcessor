                    schema:
                      type: object
                      required:
                        - subscriber-application
                        - subscriber-release-number
                        - subscription
                      properties:
                        subscriber-application:
                          type: string
                          description: >
                            'Own application name
                            from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/application-name]'
                        subscriber-release-number:
                          type: string
                          description: >
                            'Own release number
                            from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/release-number]'
                        subscription:
                          type: string
                          description: >
                            'Name of operation that had been addressed for starting getting notifications. Requests have to be sent for the following subscriptions:
                            from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-c-is-mwdi-2-0-1-000/layer-protocol=0/operation-client-interface-1-0:operation-client-interface-pac/operation-client-interface-configuration/operation-name]'
                      example:
                        subscriber-application: 'DevicePerformanceManagementDataProcessor'
                        subscriber-release-number: '1.0.0'
                        subscription: '/v1/notify-attribute-value-changes'
              responses:
                '204':
                  description: 'Stopped sending notifications of a specific subscription'
                  headers:
                    x-correlator:
                      schema:
                        type: string
                        example: '550e8400-e29b-11d4-a716-446655440000'
                      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
                    exec-time:
                      schema:
                        type: integer
                        example: 1100
                      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
                    backend-time:
                      schema:
                        type: integer
                        example: 850
                      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
                    life-cycle-state:
                      schema:
                        type: string
                        enum:
                          - 'EXPERIMENTAL'
                          - 'OPERATIONAL'
                          - 'DEPRECATED'
                          - 'OBSOLETE'
                          - 'UNKNOWN'
                          - 'NOT_YET_DEFINED'
                        example: 'EXPERIMENTAL'
                      description: 'Life cycle state of the consumed service'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'

# todo: paths to be adapted to API GW requirements ("v1/" to be deleted)

  /regard-attribute-value-change:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: regardAttributeValueChange
      summary: 'Receives notifications about changes of values of attributes'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - description: 'AVC notification sent by MWDI'
                type: object
                required:
                  - microwave-device-inventory-1-0:attribute-value-changed-notification
                properties:
                  microwave-device-inventory-1-0:attribute-value-changed-notification:
                    type: object
                    required:
                      - counter
                      - timestamp
                      - object-path
                      - attribute-name
                      - new-value
                    properties:
                      counter:
                        type: integer
                        description: 'Sequence number of callbacks sent through this forwarding'
                      timestamp:
                        type: string
                        description: 'Time when the callback is send'
                      object-path:
                        type: string
                        description: 'Path (cache path as available at the MWDI API) to the object that holds the attribute that changed its value'
                      attribute-name:
                        type: string
                        description: 'Name of the attribute that changed its value'
                      new-value:
                        type: string
                        description: 'New value of the attribute'
              - description: 'AVC notification sent by cronjob'
                type: object
                required:
                  - cronjob-dpmdp-es-update:attribute-value-changed-notification
                properties:
                  cronjob-dpmdp-es-update:attribute-value-changed-notification:
                    type: object
                    required:
                      - timestamp
                    properties:
                      counter:
                        type: integer
                      timestamp:
                        type: string
                        description: 'Time when the callback is send'
                      object-path:
                        type: string
                      attribute-name:
                        type: string
                      new-value:
                        type: string
            examples:
              sent-by-mwdi:
                value:
                  microwave-device-inventory-1-0:attribute-value-changed-notification:
                    counter: 132
                    timestamp: '2010-11-20T14:00:00+01:00'
                    object-path: '/core-model-1-4:network-control-domain=cache/control-construct=513250009/logical-termination-point=RF-2146697857/layer-protocol=2146697857/air-interface-2-0:air-interface-pac/air-interface-historical-performances'
                    attribute-name: 'time-of-latest-change'
                    new-value: '2010-11-20T13:59:00+01:00'
              sent-by-cronjob:
                value:
                  cronjob-dpmdp-es-update:attribute-value-changed-notification:
                    counter: 99
                    timestamp: '2010-11-20T14:00:00+01:00'
                    object-path: '/'
                    attribute-name: 'time-of-latest-change'
                    new-value: '2010-11-20T14:00:00+01:00'
      responses:
        '204':
          description: 'Notification received'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-000/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '470':
          $ref: '#/components/responses/470'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        NotifiedValueChangeInTimeOfLatestChangeAttributeTriggersp1ProcessingPmData:
          x-javascript-interface:
            p1ProcessingPmData:
              summary: 'Creates DataStructureForProcessing and triggers the Functions that are processing the PM data provisioning'
              input:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - mount-name
                        - processing-start-time
                      properties:
                        mount-name:
                          type: string
                          description: >
                            'Extract mountName from objectPath in AVC notification sent by MWDI indicating change in timeOfLatestChange
                            from {$request.body#microwave-device-inventory-1-0:attribute-value-changed-notification/object-path}'
                        processing-start-time:
                          type: string
                          description: >
                            'Processing has been initiated by an AVC notification sent by the cronjob for updating the DPMDP ES
                            from {$request.body#cronjob-dpmdp-es-update:attribute-value-changed-notification/timestamp}'
              output:
                success:
                  description: 'PM data processed, sent and stored'
                error:
                  description: 'just for preventing an error in VSCode'
                  # todo: description potentially to be deleted; behavior in case of errors to be described
        # alternative processing orchestrators could be called here in future releases

