    uuid: 'dpmdp-1-1-0-string-p-061'
    capability:
      string-name: 'mwdiEsClient'
      purpose: 'UUID of the MWDI ES ElasticsearchClient LTP'
      pattern: '^dpmdp-([0-9]+)-([0-9]+)-([0-9]+)-es-c-es-([0-9]+)-([0-9]+)-([0-9]+)-[0-9]{3}$'
