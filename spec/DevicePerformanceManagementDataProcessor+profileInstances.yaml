          owner: 'platform'
        - parameter: 'dpmdp-1-1-0-string-p-062'
          owner: 'platform'
        - parameter: 'dpmdp-1-1-0-string-p-063'
          owner: 'platform'
        - parameter: 'dpmdp-1-1-0-string-p-064'
          owner: 'platform'
      sub-function-list:
    configuration:
      is-active: true

