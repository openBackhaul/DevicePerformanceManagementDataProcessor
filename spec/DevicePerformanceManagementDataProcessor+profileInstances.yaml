    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/application-name'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-001'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'applicationName'
      description: 'Name of this application'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/application-name'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-002'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'releaseNumber'
      description: 'Number of this release'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/release-number'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-003'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'applicationPurpose'
      description: 'Purpose of this application'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/application-purpose'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-004'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'dataUpdatePeriod'
      description: 'Period of updating the data inside this application'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/data-update-period'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-005'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'ownerName'
      description: 'Name of the ApplicationOwner'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/owner-name'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-006'
    capability:
      operation-name: '/v1/inform-about-application-in-generic-representation'
      static-field-name: 'ownerEmailAddress'
      description: 'Email address of the ApplicationOwner'
      datatype: 'string'
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/owner-email-address'

  - profile-name: 'GenericResponseProfile'
    uuid: 'dpmdp-1-0-0-response-p-007'
    capability:
      operation-name: '/v1/inform-about-release-history-in-generic-representation'
      field-name-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/release-list=0/release-number'
      description: 'Represents the first entry in the list of releases'
      datatype: string
    configuration:
      value-reference: '/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-http-s-000/layer-protocol=0/http-server-interface-1-0:http-server-interface-pac/http-server-interface-capability/release-list=0/changes'

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-000'
    capability:
      string-name: 'kafkaNotificationConsumptionSwitch'
      enumeration:
        - 'on'
        - 'off'
      #description: 'This profileInstance allows toggeling the receipt of notifications from Kafka on/off. Default is off.'
    configuration:
      string-value: 'off'

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-001'
    capability:
      string-name: 'kafkaDataProvisioningSwitch'
      enumeration:
        - 'on'
        - 'off'
      #description: 'This profileInstance allows toggeling the sending of processed PM data to Kafka on/off. Default is on.'
    configuration:
      string-value: 'on'

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-002'
    capability:
      string-name: 'mwdiNotificationSubscriptionSwitch'
      enumeration:
        - 'on'
        - 'off'
      #description: 'This profileInstance allows toggeling the subscription to notifications from MWDI on/off. Default is off.'
    configuration:
      string-value: 'off'

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-003'
    capability:
      string-name: 'PromptForProvidingInterfaceDataOnDemandCausesReadingMwdiLtpStructureAndAugment'
      #description: 'This profileInstance configures the fields filter for retrieving LtpStructureAndAugment data from MWDI'
    configuration:
      string-value: 'logical-termination-point(uuid;layer-protocol(local-id;layer-protocol-name);ltp-augment-1-0:ltp-augment-pac(external-label;original-ltp-name))'

  - profile-name: 'IntegerProfile'
    uuid: 'dpmdp-1-0-0-integer-p-000'
    capability:
      integer-name: 'waitingTimeForProcessingNotificationsForSameDevice'
      purpose: 'This profile configures how long DPMDP ignores additional received notifications for a given device, after having received the first notification for that device.'
      unit: seconds
      minimum: 1
      maximum: 180
    configuration:
      integer-value: 60

  - profile-name: 'IntegerProfile'
    uuid: 'dpmdp-1-0-0-integer-p-001'
    capability:
      integer-name: 'deviceTableCleanupPeriod'
      purpose: 'Time period for cleaning up expired entries in the DPMDP deviceTable'
      unit: hour
      minimum: 1
      maximum: 24
    configuration:
      integer-value: 24

  - profile-name: 'IntegerProfile'
    uuid: 'dpmdp-1-0-0-integer-p-002'
    capability:
      integer-name: 'deviceTableRetentionPeriod'
      purpose: 'Time period for which entries are kept in the deviceTable without an update of mostRecentTimestamp'
      unit: hour
      minimum: 1
      maximum: 48
    configuration:
      integer-value: 48

  - profile-name: 'IntegerProfile'
    uuid: 'dpmdp-1-0-0-integer-p-003'
    capability:
      integer-name: 'dataStoreCleanupPeriod'
      purpose: 'Time period for cleaning up expired entries in [/processing-orchestrator/data-store]'
      unit: hour
      minimum: 1
      maximum: 24
    configuration:
      integer-value: 24

  - profile-name: 'IntegerProfile'
    uuid: 'dpmdp-1-0-0-integer-p-004'
    capability:
      integer-name: 'dataStoreRetentionPeriod'
      purpose: 'Time period for which items are kept in the [/processing-orchestrator/data-store]'
      unit: hour
      minimum: 1
      maximum: 96
    configuration:
      integer-value: 96
