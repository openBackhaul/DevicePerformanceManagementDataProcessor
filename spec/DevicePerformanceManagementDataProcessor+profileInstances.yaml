  # p1ResolveEsAddress
  - profile-name: 'FunctionProfile'
    uuid: 'dpmdp-1-0-0-function-p-060'
    capability:
      function-name: 'p1ResolveEsAddress'
      function-description: 'Composes the address information of an ElasticSearchClient'
      parameter-list:
        - parameter: 'dpmdp-1-0-0-string-p-061'
          owner: 'platform'
        - parameter: 'dpmdp-1-0-0-string-p-062'
          owner: 'platform'
        - parameter: 'dpmdp-1-0-0-string-p-063'
          owner: 'platform'
        - parameter: 'dpmdp-1-0-0-string-p-064'
          owner: 'platform'
      sub-function-list:
    configuration:
      is-active: true

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-061'
    capability:
      string-name: 'mwdiEsClient'
      purpose: 'UUID of the MWDI ES ElasticsearchClient LTP'
      pattern: '^dpmdp-([0-9]+)-([0-9]+)-([0-9]+)-es-c-es-([0-9]+)-([0-9]+)-([0-9]+)-[0-9]{3}$'
    configuration:
      string-value: 'dpmdp-1-0-0-es-c-es-1-0-0-007'  

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-062'
    capability:
      string-name: 'mwdiReplicaEsClient'
      purpose: 'UUID of the MWDI ES Replica ElasticsearchClient LTP'
      pattern: '^dpmdp-([0-9]+)-([0-9]+)-([0-9]+)-es-c-es-([0-9]+)-([0-9]+)-([0-9]+)-[0-9]{3}$'
    configuration:
      string-value: 'dpmdp-1-0-0-es-c-es-1-0-0-018'

  - profile-name: 'StringProfile'
    uuid: 'dpmdp-1-0-0-string-p-063'
    capability:
      string-name: 'loggingEsClient'
      purpose: 'UUID of the ElasticsearchClient LTP for logging the replication activities'
      pattern: '^dpmdp-([0-9]+)-([0-9]+)-([0-9]+)-es-c-es-([0-9]+)-([0-9]+)-([0-9]+)-[0-9]{3}$'
    configuration:
      string-value: 'dpmdp-1-0-0-es-c-es-1-0-0-020'

  - profile-name: 'StringProfile'
