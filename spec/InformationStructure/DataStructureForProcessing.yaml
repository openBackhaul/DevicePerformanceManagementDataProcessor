data-structure-for-processing:
  type: object
  required:
    - mount-name
    - processing-start-time
    - device-type
    - processing
    - input
    - output
  properties:
    mount-name:
      type: string
      description: >
        'mountName
        from {$p1ProcessingOrchestratorFor15MinHistoricalPmData.request.body#/mount-name}'
    processing-start-time:
      type: string
      description: >
        'Processing has been initiated by an AVC notification sent by the cronjob for updating the DPMDP ES
        from {$p1ProcessingOrchestratorFor15MinHistoricalPmData.request.body#/processing-start-time}'
    device-type:
      type: string
      description: 'deviceType as investigated during the pre-processing'
    processing:
      type: array
      items:
        type: object
        required:
          - function-name
          - response-code
        properties:
          function-name:
            type: string
            description: 'functionName of the ProcessingFunction'
          response-code:
            type: integer
            description: 'responseCode that resulted from executing the ProcessingFunction'
    output:
      type: object
      description: 'Output - see T1out_Output.yaml'
