data-store:
  type: object
  required:
    - interface
  properties:
    interface:
      type: array
      x-key: object-path
      items:
        type: object
        required:
          - object-path
          - lot
        properties:
          object-path:
            type: string
            description: >
              'objectPath as it was identifying the class comprising the attribute indicated to have changed in the initial notification
              from [/data-structure-for-processing/object-path]'
          lot:
            type: array
            x-key: new-value
            items:
              type: object
              description: >
                'Content of the data-structure-for-processing to attached here
                key attribute new-value from [/data-structure-for-processing/new-value]'
