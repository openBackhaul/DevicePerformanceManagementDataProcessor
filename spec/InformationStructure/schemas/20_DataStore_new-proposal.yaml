# commment to be removed
# original data-store was meant to store data per interface:
# - i.e. object-path refers to interface instance at a specific device
# - and lot should store the new PM data objects (DSFP) per processed timeslot (=new-value)
# BUT: we now retrieve the complete ControlConstruct for a given device
# - data-store should instead store an array of items related to mount-name
#   - where object-path now indicates the device, not a specific interface on the device
#   - lot still represents the PM data for that timeslot, but now DSFP contains the complete device data


data-store:
  type: object
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - lot
        properties:
          mount-name:
            type: string
            description: >
              'mountName indicated in the objectPath of the original notification and read
              from [/data-structure-for-processing/mount-name].'
          lot:
            type: array
            x-key: new-value
            items:
              type: object
              description: >
                'Content of the data-structure-for-processing to attached here
                key attribute new-value from [/data-structure-for-processing/new-value]'
