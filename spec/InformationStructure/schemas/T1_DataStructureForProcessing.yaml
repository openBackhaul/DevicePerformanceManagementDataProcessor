data-structure-for-processing:
  type: object
  required:
    - object-path
    - attribute-name
    - new-value
    - mount-name
    - device-type
    - processing
    - input
    - output
  properties:
    counter:
      type: string
      description: 'counter from the initial notification'
    timestamp:
      type: string
      description: 'timestamp from the initial notification'
    object-path:
      type: string
      description: 'objectPath from the initial notification'
    mount-name:
      type: string
      description: 'mountName, extracted from objectPath of the initial notification'
    attribute-name:
      type: string
      description: 'attributeName from the initial notification'
    new-value:
      type: string
      description: 'newValue from the initial notification'
    device-type:
      type: string
      description: 'deviceType as investigated during the pre-processing'
    processing:
      type: array
      items:
        type: object
        required:
          - function-name
          - response-code
        properties:
          function-name:
            type: string
            description: 'functionName of the ProcessingFunction'
          response-code:
            type: integer
            description: 'responseCode that resulted from executing the ProcessingFunction'
    output:
      type: object
      description: 'Output - see T1out_Output.yaml'
