data-structure-for-processing:
  type: object
  required:
    - object-path
    - attribute-name
    - new-value
    - device-type
    - processing
    - input
    - output
  properties:
    counter:
      type: string
      description: 'counter from the initial notification'
    timestamp:
      type: string
      description: 'timestamp from the initial notification'
    object-path:
      type: string
      description: 'objectPath from the initial notification'
    attribute-name:
      type: string
      description: 'attributeName from the initial notification'
    new-value:
      type: string
      description: 'newValue from the initial notification'
    device-type:
      type: string
      description: 'deviceType as investigated during the pre-processing'
    processing:
      type: array
      items:
        type: object
        required:
          - function-name
          - response-code
        properties:
          function-name:
            type: string
            description: 'functionName of the ProcessingFunction'
          response-code:
            type: integer
            description: 'responseCode that resulted from executing the ProcessingFunction'
    input:
      type: object

      # Please develop the structure of the data as it has been retrieved from the MWDI 
      # and used as an input to the pre-processing here

    output:

      # Please develop the structure of the data that shall be send to the consumers here

      oneOf:
        - description: 'Successfully executed'
          type: object
          properties:
            request-id:
              type: string
              description: >
                'Identifier of the initial request (to /v1/provide-historical-pm-data-of-device) as it has been provided in its responseBody
                from {$response.body#request-id}'
            air-interface-list:
              description: 'List of microwave air interfaces found in the given devices'
              type: array
              items:
                type: object
                properties:
                  air-interface-identifiers:
                    type: object
                    properties:
                      mount-name:
                        type: string
                        description: 'Identifier of the device at the controller and in the Telefónica planning tools'
                      link-endpoint-id:
                        type: string
                        description: >
                          'Identifier of the microwave link endpoint as used in the Telefonica planning tools
                          from {$RequestForProvidingHistoricalPmDataCausesReadingNameOfAirAndEthernetInterfaces.LtpDesignation.response.body#external-label}'
                      link-id:
                        type: string
                        description: >
                          'Identifier of the microwave link as used in the Telefonica planning tools.To be obtained by extracting the substring constituted by the 9 first characters
                          from {$RequestForProvidingHistoricalPmDataCausesReadingNameOfAirAndEthernetInterfaces.LtpDesignation.response.body#external-label}'
                      logical-termination-point-id:
                        type: string
                        description: >
                          'Identifier of the microwave link endpoint within the MW SDN domain
                          from {$RequestForProvidingHistoricalPmDataCausesReadingLtpStructure.LtpStructure.response.body#uuid}'
                      link-aggregation-identifiers:
                        type: array
                        description: >
                          'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames
                          from {$RequestForProvidingHistoricalPmDataCausesIdentifyingPhysicalLinkAggregations.LtpDesignation.response.body#external-label} in case of AirInterface or
                          from {$RequestForProvidingHistoricalPmDataCausesIdentifyingPhysicalLinkAggregations.LtpDesignation.response.body#original-ltp-name} in case of WireInterface'
                        items:
                          oneOf:
                            - description: 'AirInterfaces'
                              type: object
                              required:
                                - link-id
                              properties:
                                link-id:
                                  type: string
                                  description: >
                                    'Identifier of the microwave link as used in the Telefonica planing tools'
                            - description: 'WireInterface'
                              type: object
                              required:
                                - interface-name
                              properties:
                                interface-name:
                                  type: string
                                  description: >
                                    'Interface name as it is represented at the vendor's own management interface'
                  air-interface-configuration:
                    type: object
                    properties:
                      configured-atpc-is-on:
                        type: boolean
                        description: >
                          'This configuration value is true, if automatic transmit power control (ATPC) is configured to be switched on
                          from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#atpc-is-on}'
                      configured-atpc-threshold-upper:
                        type: integer
                        description: >
                          'Configured upper automatic transmit power control (ATPC) threshold in dBm
                          from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#atpc-thresh-upper}'
                      configured-atpc-threshold-lower:
                        type: integer
                        description: >
                          'Configured lower automatic transmit power control (ATPC) threshold in dBm
                          from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#atpc-thresh-lower}'
                      configured-tx-power:
                        type: integer
                        description: >
                          'Configured transmit power that will be operated in maximum in dBm
                          from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#tx-power}'
                      configured-modulation-minimum:
                        type: object
                        description: >
                          'Configured minimum modulation scheme'
                        properties:
                          number-of-states:
                            type: integer
                            description: >
                              'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                              transmissionModeMin = {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#air-interface-2-0:air-interface-configuration/transmission-mode-min}
                              from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme}
                              where {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                          name-at-lct:
                            type: string
                            description: >
                              'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                              transmissionModeMin = {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#air-interface-2-0:air-interface-configuration/transmission-mode-min}
                              from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}
                              where {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                          configured-capacity-minimum:
                            type: integer
                            description: >
                              'Channel capacity in kbps of the configured minimum modulation scheme. To be filled with default value -1'
                      configured-modulation-maximum:
                        type: object
                        description: 'Configured maximum modulation scheme'
                        properties:
                          number-of-states:
                            type: integer
                            description: >
                              'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                              transmissionModeMax = {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#air-interface-2-0:air-interface-configuration/transmission-mode-max}
                              from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme}
                              where {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                          name-at-lct:
                            type: string
                            description: >
                              'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                              transmissionModeMax = {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceConfigurationFromCache.AirInterfaceConfigurationFromCache.response.body#air-interface-2-0:air-interface-configuration/transmission-mode-max}
                              from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}
                              where {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                          configured-capacity-maximum:
                            type: integer
                            description: >
                              'Channel capacity in kbps of the configured maximum modulation scheme. To be filled with default value -1'
                  air-interface-performance-measurements-list:
                    type: array
                    items:
                      type: object
                      properties:
                        granularity-period:
                          type: string
                          enum:
                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                          description: >
                            'Time period between reset of the underlying counter
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/granularity-period}'
                        period-end-time:
                          type: string
                          description: >
                            'Time when the counter values have been recorded and the counter reset
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/period-end-time}'
                        transmit-level-minimum:
                          type: integer
                          description: >
                            'Minimum transmit power in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/tx-level-min}'
                        transmit-level-maximum:
                          type: integer
                          description: >
                            'Maximum transmit power in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/tx-level-max}'
                        transmit-level-average:
                          type: integer
                          description: >
                            'Averaged transmit power in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/tx-level-avg}'
                        receive-level-minimum:
                          type: integer
                          description: >
                            'Minimum receive level in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/rx-level-min}'
                        receive-level-maximum:
                          type: integer
                          description: >
                            'Maximum receive level in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/rx-level-max}'
                        receive-level-average:
                          type: integer
                          description: >
                            'Averaged receive level in dBm
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/rx-level-avg}'
                        signal-to-noise-ratio-minimum:
                          type: integer
                          description: >
                            'Minimum signal to noise + interference ratio (SNIR)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/snir-min}'
                        signal-to-noise-ratio-maximum:
                          type: integer
                          description: >
                            'Maximum signal to noise + interference ratio (SNIR)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/snir-max}'
                        signal-to-noise-ratio-average:
                          type: integer
                          description: >
                            'Averaged signal to noise + interference ratio (SNIR)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/snir-avg}'
                        cross-polarization-discrimination-minimum:
                          type: integer
                          description: >
                            'Minimum cross polarization discrimination (XPD)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/xpd-min}'
                        cross-polarization-discrimination-maximum:
                          type: integer
                          description: >
                            'Maximum cross polarization discrimination (XPD)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/xpd-max}'
                        cross-polarization-discrimination-average:
                          type: integer
                          description: >
                            'Averaged cross polarization discrimination (XPD)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/xpd-avg}'
                        operated-transmission-modes-list:
                          description: 'List of operated transmission modes with respective operation time periods. Only those entries where operation time is greater than 0 seconds shall be listed'
                          type: array
                          items:
                            type: object
                            properties:
                              transmission-mode-name:
                                type: string
                                description: >
                                  'Key attribute, name of the transmission mode
                                  from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/time-xstates-list/transmission-mode'}
                              modulation-scheme-name-at-lct:
                                type: string
                                description: >
                                  'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                  transmissionMode = {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/time-xstates-list/transmission-mode'}
                                  from {$RequestForProvidingHistoricalPmDataCausesReadingCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}
                                  where {$RequestForProvidingHistoricalPmDataCausesReadingCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionMode'
                              time:
                                type: integer
                                description: >
                                  'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                  from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/time-xstates-list/time}'
                              capacity:
                                type: integer
                                description: 'Channel capacity in kbps of the modulation scheme. To be filled with default value -1'
                        interval-capacity:
                          type: integer
                          description: 'Channel capacity over the entire performance measurement interval in kbps. Calculated from the capacities of the operated transmission modes, by weighting the duration of each operated mode over the entire measurement period.To be filled with default value -1'
                        errorred-seconds:
                          type: integer
                          description: >
                            'Number of errored seconds
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/es}'
                        severely-errorred-seconds:
                          type: integer
                          description: >
                            'Number of severily errored seconds
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/ses}'
                        consecutive-severely-errorred-seconds:
                          type: integer
                          description: >
                            'Number of consecutive severily errored seconds
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/cses}'
                        total-unavailability:
                          type: integer
                          description: >
                            'Total time of unavailability in seconds
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/unavailability}'
                        defect-blocks:
                          type: integer
                          description: >
                            'Total number of blocks that were defect after receiving and could not be corrected by the FEC
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalAirInterfacePerformanceFromCache.AirInterfaceHistoricalPmFromCache.response.body#air-interface-2-0:air-interface-historical-performance/historical-performance-data-list/defect-blocks-sum}'
                  transmission-mode-list:
                    description: 'List of supported Transmission Modes'
                    type: array
                    items:
                      type: object
                      properties:
                        transmission-mode-name:
                          type: string
                          description: >
                            'Key attribute, name of the transmission mode
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/transmission-mode-name}'
                        number-of-states:
                          type: integer
                          description: >
                            'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme}'
                        modulation-scheme-name-at-lct:
                          type: string
                          description: >
                            'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}'
                        channel-bandwidth:
                          type: integer
                          description: >
                            'Bandwidth of the transmit channel in kHz
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/channel-bandwidth}'
                        code-rate:
                          type: integer
                          description: >
                            'Code rate of the coding scheme in %
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/code-rate}'
                        symbol-rate-reduction-factor:
                          type: integer
                          description: >
                            'Reduction factor for the symbol rate. Example: value would be 4 for 1/4BPSK
                            from {$RequestForProvidingHistoricalPmDataCausesReadingAirInterfaceCapabilitiesFromCache.CapabilitiesFromCache.response.body#air-interface-2-0:air-interface-capability/transmission-mode-list/symbol-rate-reduction-factor}'
            ethernet-container-list:
              description: 'List of ethernet containers found in the given devices'
              type: array
              items:
                type: object
                properties:
                  ethernet-container-identifiers:
                    type: object
                    properties:
                      mount-name:
                        type: string
                        description: 'Identifier of the device at the controller and in the Telefónica planning tools'
                      interface-name:
                        type: string
                        description: >
                          'Interface name of the EthernetContainer as it is represented at the vendors own management interface, e.g. LAN 1/6/6
                          from {$RequestForProvidingHistoricalPmDataCausesReadingNameOfAirAndEthernetInterfaces.LtpDesignation.response.body#original-ltp-name'
                      logical-termination-point-id:
                        type: string
                        description: >
                          'Identifier of the ethernet container within the MW SDN domain
                          from {$RequestForProvidingHistoricalPmDataCausesReadingLtpStructure.LtpStructure.response.body#uuid}'
                  ethernet-container-performance-measurements-list:
                    type: array
                    items:
                      type: object
                      properties:
                        granularity-period:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                          description: >
                            'Time period between reset of the underlying counter
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/granularity-period}'
                        period-end-time:
                          type: string
                          description: >
                            'Time when the counter values have been recorded and the counter reset
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/period-end-time}'
                        max-bytes-per-second-output:
                          type: string
                          description: >
                            'Counts the number of Bytes of Ethernet traffic (before header compression) transmitted within a second and keeps the highest value within the measurement period
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/max-bytes-per-second-output}'
                        total-bytes-input:
                          type: string
                          description: >
                            'Total number of Bytes of Ethernet traffic (before header compression) received during the measurement period
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/total-bytes-input}'
                        total-bytes-output:
                          type: string
                          description: >
                            'Total number of Bytes of Ethernet traffic (before header compression) transmitted (in direction out of the device) during the measurement period
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/total-bytes-output}'
                        total-frames-input:
                          type: string
                          description: >
                            'The total number of Ethernet frames received at this interface (including those received in error)
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/total-frames-input}'
                        total-frames-output:
                          type: string
                          description: >
                            'The total number of Ethernet frames sent at this interface
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/total-frames-output}'
                        forwarded-frames-input:
                          type: string
                          description: >
                            'Number of input frames at this interface, for which the device was not their final destination and for which the device attempted to find a route to forward them to that final destination
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/forwarded-frames-input}'
                        forwarded-frames-output:
                          type: string
                          description: >
                            'Number of frames at this interface, for which the device was not their final destination and for which it was successful in finding a path to their final destination
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/forwarded-frames-output}'
                        unicast-frames-input:
                          type: string
                          description: >
                            'Total number of unicast frames received at this interface
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/unicast-frames-input}'
                        unicast-frames-output:
                          type: string
                          description: >
                            'Total number of unicast frames sent at this interface
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/unicast-frames-output}'
                        multicast-frames-input:
                          type: integer
                          description: >
                            'Total number of multicast frames received at this interface
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/multicast-frames-input}'
