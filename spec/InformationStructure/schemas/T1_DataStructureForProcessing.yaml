                          description: >
                            'Number of Ethernet frames, which were locally generated and discarded due to errors, including no route found to the destination
                            from {$RequestForProvidingHistoricalPmDataCausesReadingHistoricalEthernetContainerPerformanceFromCache.EthernetContainerHistoricalPmFromCache.response.body#ethernet-container-2-0:ethernet-container-historical-performance/historical-performance-data-list/errored-frames-output}'
                        dropped-frames-input:
                          type: integer
                          description: >
