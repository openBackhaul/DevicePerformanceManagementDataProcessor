data-store:
  type: object
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - ltp
          - data-structure-for-processing
        properties:
          mount-name:
            type: string
            description: >
              'mountName indicated in the objectPath of the original notification and read
              from [/data-structure-for-processing/mount-name].'
          ltp:
            type: array
            x-key: uuid
            items:
              type: object
              required:
                - uuid
                - lp
              properties:
                uuid:
                  type: string
                lp:
                  type: array
                  x-key: local-id
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - latest-period-end-time
                    properties:
                      local-id:
                        type: string
                      layer-protocol-name:
                        type: string
                      latest-period-end-time:
                        type: string
          data-structure-for-processing-list:
            type: array
            x-key: processing-start-time
            items:
              type: object
              description: 'see T1_DataStructureForProcessing.yaml'
