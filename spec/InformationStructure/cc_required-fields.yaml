core-model-1-4:control-construct:
  type: array
  items:
    type: object
    # aus dem Equipment!
    # equipment-augment-1-0:control-construct-pac:
    # + externalLabel
    # + deviceModelName
    properties:
      logical-termination-point:
        type: array
        items:
          type: object
          properties:
            uuid:
              type: string
            client-ltp:
              type: array
              items:
                type: string
            server-ltp:
              type: array
              items:
                type: string
            ltp-augment-1-0:ltp-augment-pac:
              type: object
              properties:
                external-label:
                  type: string
                original-ltp-name:
                  type: string
            layer-protocol:
              type: array
              items:
                anyOf:
                  - description: 'default, (not required, included only for correct validation)'
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                    properties:
                      local-id:
                        type: string
                      layer-protocol-name:
                        type: string
                  - description: 'air-interface'
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - air-interface-2-0:air-interface-pac
                    properties:
                      local-id:
                        type: string
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                      air-interface-2-0:air-interface-pac:
                        type: object
                        properties:
                          air-interface-configuration:
                            type: object
                            properties:
                              transmission-mode-min:
                                type: string
                              transmission-mode-max:
                                type: string
                              tx-power:
                                type: integer
                              atpc-is-on:
                                type: boolean
                              atpc-thresh-upper:
                                type: integer
                              atpc-thresh-lower:
                                type: integer
                          air-interface-capability:
                            type: object
                            properties:
                              transmission-mode-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    transmission-mode-name:
                                      type: string
                                    channel-bandwidth:
                                      type: integer
                                    modulation-scheme:
                                      type: integer
                                    modulation-scheme-name-at-lct:
                                      type: string
                                    code-rate:
                                      type: integer
                                    symbol-rate-reduction-factor:
                                      type: integer
                          air-interface-historical-performances:
                            type: object
                            properties:
                              historical-performance-data-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                    period-end-time:
                                      type: string
                                    tx-level-min:
                                      type: integer
                                    tx-level-max:
                                      type: integer
                                    tx-level-avg:
                                      type: integer
                                    rx-level-min:
                                      type: integer
                                    rx-level-max:
                                      type: integer
                                    rx-level-avg:
                                      type: integer
                                    snir-min:
                                      type: integer
                                    snir-max:
                                      type: integer
                                    snir-avg:
                                      type: integer
                                    xpd-min:
                                      type: integer
                                    xpd-max:
                                      type: integer
                                    xpd-avg:
                                      type: integer
                                    time-xstates-list:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          transmission-mode:
                                            type: string
                                          time:
                                            type: integer
                                    es:
                                      type: integer
                                    ses:
                                      type: integer
                                    cses:
                                      type: integer
                                    unavailability:
                                      type: integer
                                    defect-blocks-sum:
                                      type: integer
                                    time-period:
                                      type: integer
                  - description: 'ethernet-container'
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - ethernet-container-2-0:ethernet-container-pac
                    properties:
                      local-id:
                        type: string
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                      ethernet-container-2-0:ethernet-container-pac:
                        type: object
                        properties:
                          ethernet-container-historical-performances:
                            type: object
                            properties:
                              historical-performance-data-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                    period-end-time:
                                      type: string
                                      description: 'If the period-end-time is not newer than the provided timestamp from the requestBody, the complete array item is to be ignored'
                                    max-bytes-per-second-output:
                                      type: integer
                                    total-bytes-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-bytes-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    forwarded-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    forwarded-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unicast-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unicast-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    multicast-frames-input:
                                      type: integer
                                    multicast-frames-output:
                                      type: integer
                                    broadcast-frames-input:
                                      type: integer
                                    broadcast-frames-output:
                                      type: integer
                                    fragmented-frames-input:
                                      type: integer
                                    errored-frames-input:
                                      type: integer
                                    errored-frames-output:
                                      type: integer
                                    dropped-frames-input:
                                      type: integer
                                    dropped-frames-output:
                                      type: integer
                                    oversized-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    undersized-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    jabber-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unknown-protocol-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    time-period:
                                      type: integer