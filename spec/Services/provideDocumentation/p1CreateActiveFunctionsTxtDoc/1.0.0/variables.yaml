create-active-functions-txt-doc:
  type: object
  required:
    - function-name
  properties:
    function-name:
      type: string
      description: >
        'Name of the Function for which documentation is to be created
        from {$input#/function-name}'
    parameters:
      type: object
      description: >
        'Parameters of the Function
        from {$p1LoadParameters.output#/parameters}'
    documentation:
      type: string
      description: >
        'Text documentation of active functions extracted from parameters
        from {$formatParameters.output#/documentation}'