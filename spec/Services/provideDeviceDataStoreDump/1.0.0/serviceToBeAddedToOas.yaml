  /v1/provide-device-data-store-dump:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: provideDeviceDataStoreDump
      summary: 'Returns the data for an input device read from dataStore'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
                  pattern: ^(?:\d{3}(?:25|27)\d{4}|\d{3}55\d{4}[AB]|CO\d{5})$
                  description: 'Identifier of the device at the Controller'
              example:
                mount-name: '513250010'
                link-id: '513550010'
      responses:
        '200':
          description: 'DataStore device data provided'
          content:
            application/json:
              schema:
                type: object
                properties:
                  device-data:
                    type: object
                    description: >
                      'Data structure containing the data for the input device read from dataStore
                      from {$PromptForDataDumpCausesReadingDataStoreDeviceData.p1ReadDataStoreDeviceData.output#/device-data}'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
              description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
            exec-time:
              schema:
                type: integer
                example: 1100
              description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
            backend-time:
              schema:
                type: integer
                example: 850
              description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-s-is-000/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        PromptForDataDumpCausesLoadingParameters:
          x-javascript-interface:
            p1LoadParameters:
              summary: 'Loads parameters'
              input:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        function-name:
                          type: string
                          enum:
                            # TODO: eigentlich sollte hier provideDeviceDataStoreDump übergeben werden, wenn das analog zu vorherigen Aufrufen sein soll
                            #       aber das ist kein functionName sondern der serviceName
                            #       abhängig davon ist profileInstances zu füllen
                            #- 'provideDeviceDataStoreDump'
                            - 'p1ReadDataStoreDeviceData'
                          description: >
                            'The functionName denoting which parameters should be loaded'
                output:
                  success:
                    description: 'Parameters successfully loaded'
                    content:
                      application/json:
                        schema:
                          type: object
                          properties:
                            parameters:
                              description: >
                                'Related parameters'
                            config-file:
                              type: object
                              description: >
                                'configFile content'
                  error:
                    description: 'Parameters could not be loaded'
                    content:
                      application/json:
                        schema:
                          type: string
        PromptForDataDumpCausesResolvingEsAddress:
          x-javascript-interface:
            p1ResolveEsAddress:
              summary: 'Resolves ES address'
              input:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - parameters
                        - config-file
                        - es-name
                      properties:
                        parameters:
                          type: object
                          description: >
                            'Hierarchical object holding the parameter settings
                            from {$PromptForDataDumpCausesLoadingParameters.p1LoadParameters.output#/parameters}'
                        config-file:
                          type: object
                          description: >
                            'configFile content
                            from {$PromptForDataDumpCausesLoadingParameters.p1LoadParameters.output#/config-file}'
                        es-name:
                          type: string
                          enum:
                            - 'dataStoreEsClient'
                          description: >
                            'ElasticSearch name'
              output:
                success:
                  description: 'ES address successfully resolved'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          es-address:
                            type: object
                            description: 'ElasticSearch address composed from input parameters and config-file'
                            properties:
                              url:
                                type: string
                                description: >
                                  'ElasticSearch URL'
                              api-key:
                                type: string
                                description: >
                                  'ElasticSearch API key'
                              index-alias:
                                type: string
                                description: >
                                  'ElasticSearch index alias'
                              service-records-policy:
                                type: string
                                description: >
                                  'Service records policy'
                              operational-state:
                                type: string
                                description: >
                                  'Operational state'
                              life-cycle-state:
                                type: string
                                description: >
                                  'Life cycle state'
                error:
                  description: 'ES address could not be resolved'
                  content:
                    application/json:
                      schema:
                        type: string
        PromptForDataDumpCausesReadingDataStoreDeviceData:
          x-javascript-interface:
            p1ReadDataStoreDeviceData:
              summary: 'Reads deviceData from dataStore'
              input:
                required: true
                content:
                  application/json:
                    schema:
                      properties:
                        ressource-path:
                          type: string
                          description: >
                            'The ressourcePath for targeting the deviceData in the dataStore
                            from {$PromptForDataDumpCausesResolvingEsAddress.p1ResolveEsAddress.output#/es-address/url}://data-store/device={$input#/mount-name}'
              output:
                success:
                  description: 'deviceData provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          device-data:
                            type: object
                            description: >
                              'The device data from dataStore addressed by the ressourcePath'
                error:
                  description: 'deviceData could not be provided'
                  content:
                    application/json:
                      schema:
                        type: string
