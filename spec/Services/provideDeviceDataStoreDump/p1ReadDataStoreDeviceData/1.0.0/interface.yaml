openapi: 3.0.0
info:
  title: p1ReadDataStoreDeviceData
  version: 1.0.0

x-javascript-interface:
  p1ReadDataStoreDeviceData:
    summary: 'Reads and returns device data from dataStore'
    input:
      required: true
      content:
        application/json:
          schema:
            required:
              - ressource-path
            properties:
              ressource-path:
                type: string
                description: >
                  'The ressourcePath for addressing the dataStore including ES client address information,
                  must target a specific device.'
                example: '<ES-client-address>://data-store/device=exampleMountName'
    output:
      success:
        description: 'deviceData provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - device-data
              properties:
                device-data:
                  type: object
                  description: >
                    'The device data from dataStore addressed by the ressourcePath'
      error:
        description: 'deviceData could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'ressourcePath not provided'
                - 'ressourcePath invalid'
                - 'deviceData could not be provided'
                - 'general processing error'
    processing:
      retrieveDeviceDataFromDs:
        url: # [/read-data-store-device-data/ressource-path]
          description: 'Load deviceData from dataStore'
          output:
            success:
              description: 'DeviceData from dataStore provided'
              content:
                application/json:
                  schema:
                    type: object
                    description: >
                      'Target data for the device'
            error:
              description: 'Device data from dataStore could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'ressourcePath not provided'
                      - 'ressourcePath invalid'
                      - 'ElasticSearch read error for deviceData'
                      - 'general processing error'

paths:
  /:
    description: 'no rest path provided by this module'
