openapi: 3.0.0
info:
  title: p1ReadDataStoreDeviceData
  version: 1.0.0

x-javascript-interface:
  p1ReadDataStoreDeviceData:
    summary: 'Loads PM data of a device from the DataStore'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - data-store-es-client
              - mount-name
            properties:
              data-store-es-client:
                type: object
                description: 'DataStore ElasticSearch address'
              mount-name:
                type: string
                description: 'mountName of the device for which PM data shall be read'
    output:
      success:
        description: 'PmData of the device provided'
        content:
          application/json:
            schema:
              type: object
              properties:
                device-pm-data:
                  type: array
                  description: >
                    'The PM data of the device as a list of resultCc of diverse batches
                    from [/read-data-store-device-data/device-pm-data]'
      error:
        description: 'PmData of the device could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'dataStoreUrl not provided'
                - 'dataStoreUrl invalid'
                - 'mountName not provided'
                - 'mountName invalid'
                - 'ElasticSearch read error'
                - 'mountName not found in DataStore'
                - 'general processing error'
    processing:
      retrieveDevicePmDataFromDs:
        url: # [{/read-data-store-device-data/data-store-es-client/url}][/data-store/device={/read-data-store-device-data/mount-name}/result-data]
          description: 'Load resultData from DataStore'
          output:
            success:
              description: 'resultData from DataStore provided'
              content:
                application/json:
                  schema:
                    type: array
                    description: >
                      'resultData for the device'
            error:
              description: 'resultData from DataStore could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'ElasticSearch read error'
                      - 'general processing error'

paths:
  /:
    description: 'no rest path provided by this module'
