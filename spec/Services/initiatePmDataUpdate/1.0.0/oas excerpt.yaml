                  :
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-port}]
