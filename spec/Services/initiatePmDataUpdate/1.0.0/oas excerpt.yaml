openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.1.0
  description: Collects and processes historical device performance data and streams it to consumers
  contact:
    name: Thorsten Heinze
    url: https://github.com/openBackhaul/DevicePerformanceManagementDataProcessor
    email: Thorsten.Heinze@telefonica.com
  x-api-id: u-1792-sdn-microwave-dpmdp

paths:
########################################################################################################################
#   Service Layer - Individual Part
########################################################################################################################
  /initiate-pm-data-update:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: initiatePmDataUpdate
      summary: 'Initiates process of updating PM data for specified devices'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-names
              properties:
                mount-names:
                  type: array
                  description: >
                    'mountNames for which PM data update shall be initiated'
                  items:
                    type: string
              example:
                mount-names:
                  - '305251234'
                  - '305251235'
      responses:
        '204':
          description: 'Updating PM data initiated'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
              description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
            exec-time:
              schema:
                type: integer
                example: 1100
              description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
            backend-time:
              schema:
                type: integer
                example: 850
              description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-s-is-001/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '200':
          description: 'Updating PM data initiated, but not for already up-to-date devices'
          content:
            application/json:
              schema:
                type: object
                required:
                  - already-up-to-date-mount-names
                properties:
                  already-up-to-date-mount-names:
                    type: array
                    description: >
                      'mountNames that are already up-to-date
                      from [/initiate-pm-data-update/already-up-to-date-mount-names]'
                    items:
                      type: string
              example:
                already-up-to-date-mount-names:
                  - '305251234'
                  - '305251235'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
              description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
            exec-time:
              schema:
                type: integer
                example: 1100
              description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
            backend-time:
              schema:
                type: integer
                example: 850
              description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-s-is-001/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '532':
          description: 'Updating PM data terminated, as some devices are not connected'
          content:
            application/json:
              schema:
                type: object
                required:
                  - unconnected-mount-names
                properties:
                  unconnected-mount-names:
                    type: array
                    description: >
                      'mountNames that are not connected
                      from [/initiate-pm-data-update/unconnected-mount-names]'
                    items:
                      type: string
              example:
                unconnected-mount-names:
                  - '305251234'
                  - '305251235'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
              description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
            exec-time:
              schema:
                type: integer
                example: 1100
              description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
            backend-time:
              schema:
                type: integer
                example: 850
              description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-s-is-001/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '533':
          description: 'Updating PM data terminated, as some devices are missing'
          content:
            application/json:
              schema:
                type: object
                required:
                  - missing-mount-names
                properties:
                  missing-mount-names:
                    type: array
                    description: >
                      'mountNames that are missing
                      from [/initiate-pm-data-update/missing-mount-names]'
                    items:
                      type: string
              example:
                missing-mount-names:
                  - '305251234'
                  - '305251235'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
              description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
            exec-time:
              schema:
                type: integer
                example: 1100
              description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
            backend-time:
              schema:
                type: integer
                example: 850
              description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                from [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-s-is-001/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        PromptForInitiatingPmDataUpdateInitiatesCcUpdateProcess:
          loadMetaData: #[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-c-is-mwdi-1-1-2-000/operation-client-interface-1-0:operation-client-interface-pac/operation-client-interface-configuration/operation-name]
            post:
              parameters:
                - $ref: '#/components/parameters/user'
                - $ref: '#/components/parameters/originator'
                - $ref: '#/components/parameters/x-correlator'
                - $ref: '#/components/parameters/trace-indicator'
                - $ref: '#/components/parameters/customer-journey'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        mount-name-list:
                          type: array
                          description: >
                            'List of names of devices for which the status metadata shall be provided
                            from [/initiate-pm-data-update/mount-names]'
                          items:
                            type: string
              responses:
                '200':
                  description: 'Device status metadata provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        required:
                          - device-status-metadata
                        properties:
                          device-status-metadata:
                            type: array
                            x-key: mount-name
                            items:
                              type: object
                              required:
                                - mount-name
                                - connection-status
                                - changed-to-disconnected-time
                                - added-to-device-list-time
                                - last-complete-control-construct-update-time-attempt
                                - last-successful-complete-control-construct-update-time
                                - last-control-construct-notification-update-time
                                - number-of-partial-updates-since-last-complete-update
                                - schema-cache-directory
                                - device-type
                                - vendor
                              properties:
                                mount-name:
                                  type: string
                                connection-status:
                                  type: string
                                changed-to-disconnected-time:
                                  type: string
                                added-to-device-list-time:
                                  type: string
                                last-complete-control-construct-update-time-attempt:
                                  type: string
                                last-successful-complete-control-construct-update-time:
                                  type: string
                                last-control-construct-notification-update-time:
                                  type: string
                                number-of-partial-updates-since-last-complete-update:
                                  type: integer
                                schema-cache-directory:
                                  type: string
                                device-type:
                                  type: string
                                vendor:
                                  type: string
                  headers:
                    x-correlator:
                      schema:
                        type: string
                        example: '550e8400-e29b-11d4-a716-446655440000'
                      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
                    exec-time:
                      schema:
                        type: integer
                        example: 1100
                      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
                    backend-time:
                      schema:
                        type: integer
                        example: 850
                      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
                    life-cycle-state:
                      schema:
                        type: string
                        enum:
                          - 'EXPERIMENTAL'
                          - 'OPERATIONAL'
                          - 'DEPRECATED'
                          - 'OBSOLETE'
                          - 'UNKNOWN'
                          - 'NOT_YET_DEFINED'
                        example: 'EXPERIMENTAL'
                      description: >
                        'Life cycle state of the consumed service'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
          listMissingMountNames:
            summary: 'Lists mount names that are in input mountNames, but not in metaData'
            x-javascript-interface:
              input:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - mount-names
                        - meta-data
                      properties:
                        mount-names:
                          type: array
                          description: >
                            'mountNames for which PM data shall be updated
                            from [/initiate-pm-data-update/mount-names]'
                        meta-data:
                          type: array
                          description: >
                            'meta data related to the PM data update process for the specific mountNames
                            from [/initiate-pm-data-update/meta-data]'
              output:
                success:
                  description: 'Missing mountNames provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          missing-mount-names:
                            type: array
                            items:
                              type: string
                            description: >
                              'mountNames that are missing
                              initiated as [] filled from { {$input#/mount-names} that are not included in {$input#/meta-data=*/mount-name} }
              error:
                description: 'ResultCc could not be provided'
                content:
                  application/json:
                    schema:
                      type: string
                      enum:
                        - 'mountNames not provided'
                        - 'mountNames invalid'
                        - 'metaData not provided'
                        - 'metaData invalid'
                        - 'missingMountNames could not be provided'
                        - 'general processing error'
          listUnconnectedMountNames:
            summary: 'Lists mount names that are in input mountNames, but not in connected state in metaData'
            x-javascript-interface:
              input:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - mount-names
                        - meta-data
                      properties:
                        mount-names:
                          type: array
                          description: >
                            'mountNames for which PM data shall be updated
                            from [/initiate-pm-data-update/mount-names]'
                        meta-data:
                          type: array
                          description: >
                            'meta data related to the PM data update process for the specific mountNames
                            from [/initiate-pm-data-update/meta-data]'
              output:
                success:
                  description: 'Unconnected mountNames provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          unconnected-mount-names:
                            type: array
                            items:
                              type: string
                            description: >
                              'mountNames that are currently not in connected state at the controller
                              initiated as [] filled from { {$input#/mount-names[*]} with {$input#/meta-data={$input#/mount-names[*]}/connection-status}!={connected} }'
              error:
                description: 'ResultCc could not be provided'
                content:
                  application/json:
                    schema:
                      type: string
                      enum:
                        - 'mountNames not provided'
                        - 'mountNames invalid'
                        - 'metaData not provided'
                        - 'metaData invalid'
                        - 'unconnectedMountNames could not be provided'
                        - 'general processing error'
          listUpToDateMountNames:
            summary: 'Lists mount names that are in input mountNames, but already up-to-date in metaData'
            x-javascript-interface:
              input:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - mount-names
                        - meta-data
                      properties:
                        mount-names:
                          type: array
                          description: >
                            'mountNames for which PM data shall be updated
                            from [/initiate-pm-data-update/mount-names]'
                        meta-data:
                          type: array
                          description: >
                            'meta data related to the PM data update process for the specific mountNames
                            from [/initiate-pm-data-update/meta-data]'
              output:
                success:
                  description: 'Up-to-date mountNames provided'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          already-up-to-date-mount-names:
                            type: array
                            items:
                              type: string
                            description: >
                              'mountNames that are already up-to-date in metaData
                              initiated as [] filled from { {$input#/mount-names[*]} with ( {current time} - {$input#/meta-data={$input#/mount-names[*]}/last-successful-complete-control-construct-update-time} < {15minutes} ) }'
                          outdated-mount-names:
                            type: array
                            items:
                              type: string
                            description: >
                              'mountNames that need an update for completing the PM data
                              initiated as [] filled from { {$input#/mount-names[*]} with ( {current time} - {$input#/meta-data={$input#/mount-names[*]}/last-successful-complete-control-construct-update-time} >= {15minutes} ) }'
              error:
                description: 'ResultCc could not be provided'
                content:
                  application/json:
                    schema:
                      type: string
                      enum:
                        - 'mountNames not provided'
                        - 'mountNames invalid'
                        - 'metaData not provided'
                        - 'metaData invalid'
                        - 'alreadyUpToDateMountNames could not be provided'
                        - 'outdatedMountNames could not be provided'
                        - 'general processing error'
          requestLiveCc: #[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-tcp-c-mwdi-1-1-2-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-1-0-op-c-is-mwdi-1-1-2-001/operation-client-interface-1-0:operation-client-interface-pac/operation-client-interface-configuration/operation-name]
            get:
              parameters:
                - $ref: '#/components/parameters/user'
                - $ref: '#/components/parameters/originator'
                - $ref: '#/components/parameters/x-correlator'
                - $ref: '#/components/parameters/trace-indicator'
                - $ref: '#/components/parameters/customer-journey'
                - name: mountName
                  in: path
                  required: true
                  schema:
                    type: string
                    example: '222250001'
                  description: >
                    'The mount-name of the device that is addressed by this callback
                    from [/initiate-pm-data-update/mount-names[*]]'
                - name: fields
                  in: query
                  required: true
                  schema:
                    type: string
                    enum:
                      - ''
              responses:
                '200':
                  description: 'ControlConstruct provided from live network'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          core-model-1-4:control-construct:
                            type: array
                            items:
                              type: object
                  headers:
                    x-correlator:
                      schema:
                        type: string
                        example: '550e8400-e29b-11d4-a716-446655440000'
                      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
                    exec-time:
                      schema:
                        type: integer
                        example: 1100
                      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
                    backend-time:
                      schema:
                        type: integer
                        example: 850
                      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
                    life-cycle-state:
                      schema:
                        type: string
                        enum:
                          - 'EXPERIMENTAL'
                          - 'OPERATIONAL'
                          - 'DEPRECATED'
                          - 'OBSOLETE'
                          - 'UNKNOWN'
                          - 'NOT_YET_DEFINED'
                        example: 'EXPERIMENTAL'
                      description: 'Life cycle state of the consumed service'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '502':
                  $ref: '#/components/responses/502'
                '530':
                  $ref: '#/components/responses/530'
                '531':
                  $ref: '#/components/responses/531'
                '532':
                  $ref: '#/components/responses/532'
                '533':
                  $ref: '#/components/responses/533'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
          p1LoadParameters:
            x-javascript-interface:
              input:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - function-name
                      properties:
                        function-name:
                          type: string
                          description: >
                            'Name of the Function whose parameters are to be loaded from the configFile
                            from [/initiate-pm-data-update/function-name]'
              output:
                success:
                  description: 'Parameters successfully loaded'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          parameters:
                            type: object
                          config-file:
                            type: object
                error:
                  description: 'Parameters could not be loaded'
                  content:
                    application/json:
                      schema:
                        type: string


########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    '429':
      description: 'Response in case too many requests need to be executed in parallel or too many requests have been received within a time period. The maximum number of parallel requests is defined in an IntegerProfile with the service name as a prefix and MaxNumberOfParallelRequests as a suffix. Some time period to elapse for throttling incomming requests is defined in an IntegerProfile with the service name as a prefix and ThrottlingPeriod as a suffix'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 429
                maximum: 429
                format: int32
              message:
                type: string
                enum:
                  - 'Too many requests'
    '460':
      description: 'Response in case the mountName provided in the request is not found in the list of connected devices'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 460
                maximum: 460
                format: int32
              message:
                type: string
                enum:
                  - 'Not connected. Requested device is currently not in connected state at the controller'
    '461':
      description: 'Response in case the (parent) topology object provided in the request (body or path) is not found in the cache.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 461
                maximum: 461
                format: int32
              message:
                type: string
                enum:
                  - 'Not available. The topology (parent) object is currently not found in the cache.'
    '470':
      description: 'Response in case the resource specified in the request does not exist within the connected device'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 470
                maximum: 470
                format: int32
              message:
                type: string
                enum:
                  - 'Resource not existing. Device informs about addressed resource unknown'
    '471':
      description: 'Response in case the (child) topology object specified in the request (body or path) does not exist within the cache.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 471
                maximum: 471
                format: int32
              message:
                type: string
                enum:
                  - '(Child) topology object not existing. Cache informs about addressed resource unknown.'
    '502':
      description: 'Response in case the server is acting as a gateway or proxy and received an invalid response from the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 502
                maximum: 502
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway'
    '530':
      description: 'Response in case the referenced resource exists (e.g. device connected and resource exists in internal datatree), but response data is either not available, lost during transmission, incomplete or corrupted'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 530
                maximum: 530
                format: int32
              message:
                type: string
                enum:
                  - 'Data invalid. Response data not available, incomplete or corrupted'
    '531':
      description: 'Response in case the server is acting as a gateway or proxy and was unable to authenticate at the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 531
                maximum: 531
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway. Authentication at upstream server failed.'
    '532':
      description: 'Response in case the server is acting as a gateway or proxy and was unable to connect to the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 532
                maximum: 532
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway. Upstream server not responding.'
    '533':
      description: 'Response in case the referenced resource for an connected device does not exist at the controller.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 533
                maximum: 533
                format: int32
              message:
                type: string
                enum:
                  - 'Resource unknown. The resource for the connected device does not exist at the Controller'
    '550':
      description: 'Response in case that the application wants to call a service specified by the requestor (e.g., to return data after a long taking  data retrieval) during a service call to the application and the service information cannot be found.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 550
                maximum: 550
                format: int32
              message:
                type: string
                enum:
                  - 'Requestor information for callback execution not found.'
