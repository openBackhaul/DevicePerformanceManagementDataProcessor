# mögliches schema
data-store:
  type: object
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - offsets
          - status-data
          - result-data
          # - deviceType # wird für qm benötigt 
        properties:
          mount-name:
            type: string
            description: >
              'mountName
              instance to be created during storing, if not existing
              from [ {$storeInterfaceMetadataList.url#device} or {$storeResultCc.url#device} ]'
          offsets:
            type: array
          result-data:
            type: array
          status-data:
            type: array
            x-key: function-name
            items:
              type: object
              required:
                - function-name
                - status
              properties:
                function-name:
                  type: string
                  description: >
                    'functionName
                    instance to be created during storing, if not existing
                    from ???'
                status:
                  type: object
                  description: >
                    'status
                    from ???'
                  # hier kann man qm-status einhängen
                  




    # qm-status analog zu BH Berechnung für den Tag aggregieren, sobald 24h record für das Interface gesehen wird => p1CalculateQmStatistics
    qm-status:
      type: object
      description: >
        'status at the interface based on already processed batches
        from {$input#/interface-status}'
      required:
        - uuid
      properties:
        # muss pro interface instance gesammelt werden, damit man weiß, wieviel records man insgesamt erwartet (für den jeweiligen Tag, pro Gerät: 96*#interfaces mit Daten für diesen Tag)
        uuid:
          type: string
          description: >
            'UUID of the interface'
        interface-type:
          type: string
          enum:
            - 'airInterface'
            - 'ethernetContainer'
          # gebraucht, um per interfaceType aggregieren zu können
          description: >
            'TODO'
        qm-values-by-day:
          # nur 2 Tage behalten
          type: array
          x-key: day
          minItems: 1
          maxItems: 2
          description: >
            'instance to be initialized, if not already existing for [/categorize-qm-statistics/day]
            eldest entry to be deleted first'
          items:
            type: object
            required:
              - day
              - qm-values
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 31
                description: >
                  'day of month
                  if to be initialized, to be parsed from [/categorize-qm-statistics/historical-performance-data/period-end-time]'
              qm-values:
                type: object
                properties:
                  num-of-records:
                    type: integer
                    # Anzahl der records für den Tag einfach hochzählen, init mit null
                  # Anzahl expected ist immer 96, da 15min
                

    day:
      type: integer
      minimum: 1
      maximum: 31
      description: >
        'day of month to be categorized from periodEndTime of the currently processed 15-min period
        parsing the day from [/historical-performance-data/period-end-time]'

    