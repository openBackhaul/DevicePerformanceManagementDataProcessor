openapi: 3.0.0
info:
  title: p1IterateAiPmSlices
  version: 1.0.0

x-javascript-interface:
  p1IterateAiPmSlices:
    summary: 'Iterates through all AirInterface historical performance data slices and calls the processing Functions'
    input:
      required: true
      content:
        application/json:
          schema:
            required:
              - parameters
              - historical-performance-data-list
              - transmission-mode-list
            properties:
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              historical-performance-data-list:
                type: array
                description: >
                  'historicalPerformanceDataList'
              transmission-mode-list:
                type: array
                description: >
                  'transmissionModeList'
    output:
      success:
        description: 'historicalPerformanceDataList processed'
        content:
          application/json:
            schema:
              type: object
              required:
                - historical-performance-data-list
              properties:
                historical-performance-data-list:
                  type: array
                  description: >
                    'historicalPerformanceDataList
                    from [/iterate-ai-pm-slices/historical-performance-data-list]'
                most-recent-period-end-time:
                  type: string
                  description: >
                    'mostRecentPeriodEndTime
                    from [/iterate-ai-pm-slices/most-recent-period-end-time]'
                most-recent-period-end-time-24:
                  type: string
                  description: >
                    'mostRecentPeriodEndTime24
                    from [/iterate-ai-pm-slices/most-recent-period-end-time-24]'
      error:
        description: 'historicalPerformanceDataList could not be processed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList invalid'
                - 'transmissionModeList not provided'
                - 'transmissionModeList invalid'
                - 'interval capacity could not be calculated'
                - 'out of range levels could not be removed'
                - 'default values could not be removed'
                - 'historicalPerformanceDataList could not be provided'
                - 'general processing error'
    processing:
      p1CalculateIntervalCapacity:
        summary: 'Calculates the AirInterface capacity weighted by duration of operation of the respective transmission mode in kbps'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - time-xstates-list
                  - transmission-mode-list
                properties:
                  time-xstates-list:
                    type: array
                    description: >
                      'timeXStatesList
                      from [/iterate-ai-pm-slices/historical-performance-data-list=*/performance-data/time-xstates-list]'
                  transmission-mode-list:
                    type: array
                    description: >
                      'transmissionModeList
                      from [/iterate-ai-pm-slices/transmission-mode-list]'
        output:
          success:
            description: 'Interval capacity provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - interval-capacity
                  properties:
                    interval-capacity:
                      type: integer
                      description: >
                        'intervalCapacity'
          error:
            description: 'Interval capacity could not be provided'
            content:
              application/json:
                schema:
                  type: string
      p1RemoveOutOfRangeLevels:
        summary: 'Removes out-of-range level attributes from a performance data slice'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - performance-data
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/iterate-ai-pm-slices/parameters/sub-function=p1RemoveOutOfRangeLevels]'
                  performance-data:
                    type: object
                    description: >
                      'performanceData set of a single time period
                      from [/iterate-ai-pm-slices/historical-performance-data-list=*/performance-data]'
        output:
          success:
            description: 'Performance data slice cleaned from out-of-range level attributes'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - performance-data
                  properties:
                    performance-data:
                      type: object
                      description: >
                        'performanceData set of a single time period'
          error:
            description: 'Performance data slice could not be cleaned from out-of-range level attributes'
            content:
              application/json:
                schema:
                  type: string
      p1RemoveDefaultValues:
        summary: 'Deletes attributes with default values from the transferred object'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - input-object
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/iterate-ai-pm-slices/parameters/sub-function=p1RemoveDefaultValues]'
                  input-object:
                    type: object
                    description: >
                      'performanceData set of a single time period
                      from [/iterate-ai-pm-slices/historical-performance-data-list=*/performance-data]'
        output:
          success:
            description: 'Input object cleaned from attributes with default values'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - cleaned-object
                  properties:
                    cleaned-object:
                      type: object
                      description: >
                        'Data object from which attributes with default values have been removed'
          error:
            description: 'Input object could not be cleaned from attributes with default values'
            content:
              application/json:
                schema:
                  type: string
      updateMostRecentPeriodEndTime:
        summary: 'Overwrites mostRecentPeriodEndTime or mostRecentPeriodEndTime24 with latest value (means, most recent date) of periodEndTime'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - most-recent-period-end-time
                  - most-recent-period-end-time-24
                  - granularity-period
                  - period-end-time
                properties:
                  most-recent-period-end-time:
                    type: string
                    description: >
                      'mostRecentPeriodEndTime
                      from [/iterate-ai-pm-slices/most-recent-period-end-time]'
                  most-recent-period-end-time-24:
                    type: string
                    description: >
                      'mostRecentPeriodEndTime24
                      from [/iterate-ai-pm-slices/most-recent-period-end-time-24]'
                  granularity-period:
                    type: string
                    description: >
                      'granularityPeriod
                      from [/iterate-ai-pm-slices/historical-performance-data-list=*/granularity-period]'
                  period-end-time:
                    type: string
                    description: >
                      'periodEndTime
                      from [/iterate-ai-pm-slices/historical-performance-data-list=*/period-end-time]'
        output:
          success:
            description: 'mostRecentPeriodEndTime provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - most-recent-period-end-time
                    - most-recent-period-end-time-24
                  properties:
                    most-recent-period-end-time:
                      type: string
                      description: >
                        'mostRecentPeriodEndTime
                        from [{$input#period-end-time} if {$input#granularity-period}==air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN]'
                    most-recent-period-end-time-24:
                      type: string
                      description: >
                        'mostRecentPeriodEndTime24
                        from [{$input#period-end-time} if {$input#granularity-period}==air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS]'
          error:
            description: 'mostRecentPeriodEndTime could not be provided'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'mostRecentPeriodEndTime not provided'
                    - 'mostRecentPeriodEndTime invalid'
                    - 'mostRecentPeriodEndTime24 not provided'
                    - 'mostRecentPeriodEndTime24 invalid'
                    - 'granularityPeriod not provided'
                    - 'granularityPeriod invalid'
                    - 'periodEndTime not provided'
                    - 'periodEndTime invalid'
                    - 'mostRecentPeriodEndTime could not be provided'
                    - 'general processing error'

paths:
  /:
    description: 'no rest path provided by this module'
