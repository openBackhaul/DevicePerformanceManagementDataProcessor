  /p1/set-out-of-range-level-values-to-default:
    post:
      operationId: p1SetOutOfLevelValuesToDefault
      summary: >
        'Replaces out-of-range level attribute values. Either
        - input is read directly from memory (requestBody with dataHandle), and written back directly to memory
        - or requestBody contains the relevant input and response returns the changed output'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - description: 'dataHandle for direct memory read/write'
                  required:
                    - data-handle
                  properties:
                    data-handle:
                      type: string
                      description: >
                        'This dataHandle points directly to the [/data-structure-for-processing/output] from where the required data from output.air-interface-list is read.'
                - description: 'required data for external usage (no direct read/write)'
                  properties:
                    output:
                      description: >
                        'If the function shall not run on the data in the memory directly, the required data has to be provided as input.
                        Note that input data follows the schema of [/data-structure-for-processing/output], but only relevant attributes are listed.' 
                      type: object
                      properties:
                        air-interface-list:
                          type: array
                          items:
                            properties:
                              air-interface-performance-measurements-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    transmit-level-minimum:
                                      type: integer
                                    transmit-level-maximum:
                                      type: integer
                                    transmit-level-average:
                                      type: integer
                                    receive-level-minimum:
                                      type: integer
                                    receive-level-maximum:
                                      type: integer
                                    receive-level-average:
                                      type: integer
      responses:
        '200':
          description: 'Dataset with updated values provided'
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      air-interface-list:
                        description: >
                          'Only relevant attributes from [/data-for-processing/output]-schema listed
                          from {$SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData.returnDataNonHandle.response.body#air-interface-list}'
                        type: array
                        items:
                          properties:
                            air-interface-performance-measurements-list:
                              type: array
                              items:
                                type: object
                                properties:
                                  transmit-level-minimum:
                                    type: integer
                                  transmit-level-maximum:
                                    type: integer
                                  transmit-level-average:
                                    type: integer
                                  receive-level-minimum:
                                    type: integer
                                  receive-level-maximum:
                                    type: integer
                                  receive-level-average:
                                    type: integer
        '204':
          description: 'Out-of-range level values set to defaults in [/data-structure-for-processing/output] (dataHandle option)'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput:
          getData: #[dpmdpIpAddress][dpmdpPort][dataHandle.[/data-structure-for-processing/output]]
            description: 'Directly read the data from DPMDP memory for the output object identified by id
              from {$request.body#data-handle}'
            get:
              responses:
                '200':
                  description: 'DataStructureForProcessing/Output read'
                  content:
                    application/json:
                      schema:
                        description: 'Only relevant attributes listed'
                        type: object
                        properties:
                          output:
                            type: object
                            properties:
                              air-interface-list:
                                type: array
                                items:
                                  properties:
                                    air-interface-performance-measurements-list:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          transmit-level-minimum:
                                            type: integer
                                          transmit-level-maximum:
                                            type: integer
                                          transmit-level-average:
                                            type: integer
                                          receive-level-minimum:
                                            type: integer
                                          receive-level-maximum:
                                            type: integer
                                          receive-level-average:
                                            type: integer
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
        SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData:
          returnDataNonHandle: #[dpmdpIpAddress][dpmdpPort]
            description: >
              'For the non-dataHandle option the changed data is returned rather than being written to the memory'
            post:
              responses:
                '200':
                  description: 'Updated data returned (non-dataHandle option)'
                  content:
                    application/json:
                      schema:
                        description: 'Only relevant attributes from [/data-for-processing/output]-schema listed'
                        type: object
                        properties:
                          output:
                            type: object
                            properties:
                              air-interface-list:
                                type: array
                                items:
                                  properties:
                                    air-interface-performance-measurements-list:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          transmit-level-minimum:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-minimum},
                                              IF NOT (transmit-level-minimum within range [-30, 40]) THEN replace with default = -1'
                                          transmit-level-maximum:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-maximum},
                                              IF NOT (transmit-level-maximum within range [-30, 40]) THEN replace with default = -1'
                                          transmit-level-average:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-average},
                                              IF NOT (transmit-level-average within range [-30, 40]) THEN replace with default = -1'
                                          receive-level-minimum:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-minimum},
                                              IF NOT (receive-level-minimum within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                                          receive-level-maximum:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-maximum},
                                              IF NOT (receive-level-maximum within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                                          receive-level-average:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-average},
                                              IF NOT (receive-level-average within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
          updateDataInMemory: #[dpmdpIpAddress][dpmdpPort][dataHandle.[/data-structure-for-processing/output]]
            description: >
              'This is carried out for the dataHandle option. Changes are written directly to the attributes.
              The attribute values are to be changed as described in {$SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData.response.body}.
              The changes are to be written directly into the [/data-structure-for-processing/output] object in memory identified by {$request.body#data-handle}'
            patch:
              responses:
                '204':
                  description: 'Updated level values written directly to [/data-structure-for-processing/output]'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
