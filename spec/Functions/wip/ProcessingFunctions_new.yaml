                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/errored-frames-output}'
                                  dropped-frames-input:
                                    type: integer
                                    nullable: true
                                    description: > 
                                      'Total number of Ethernet frames dropped at the receiver. The number of input Ethernet frames, for which no problems were encountered to prevent their continued processing, but were discarded (e.g., for lack of buffer space)
                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/dropped-frames-input}'
                                  dropped-frames-output:
                                    type: integer
                                    nullable: true
                                    description: > 
                                      'The number of output Ethernet frames, for which no problem was encountered to prevent their transmission to their destination, but were discarded (e.g., for lack of buffer space)
                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/dropped-frames-output}'
                                  oversized-frames-ingress:
                                    type: string
                                    description: > 
                                      'The total number of frames received that were longer than 1518 octets (excluding framing bits, but including FCS octets) and were otherwise well formed
                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/oversized-frames-ingress}'
                                  undersized-frames-ingress:
                                    type: string
                                    description: > 
                                      'The total number of frames received that were less than 64 octets long (excluding framing bits, but including FCS octets) and were otherwise well formed
                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/undersized-frames-ingress}'
                                  jabber-frames-ingress:
                                    type: string
                                    description: > 
                                      'Number of jabber frames received on the interface. Jabber frames are typically defined as oversize frames which also have a bad CRC. Implementations may use slightly different definitions of what constitutes a jabber frame. Often indicative of a NIC hardware problem
                                      from {$CreatingDsfpOutputCausesFilteringAndClusteringInputData.PrepInputData.response.body#list-of-filtered-ethernet-containers/filtered-historical-performance-data/jabber-frames-ingress}'
                                  unknown-protocol-frames-input:
