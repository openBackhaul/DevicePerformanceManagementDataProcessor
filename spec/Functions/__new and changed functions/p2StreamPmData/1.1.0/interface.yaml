openapi: 3.0.0
info:
  title: p2StreamPmData
  version: 1.1.0

x-javascript-interface:
  p2StreamPmData:
    summary: 'Streams PM data'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
                    description: >
                      'Name of the Function whose parameters are to be loaded from the configFile
                      from [/stream-pm-data/function-name]'
        output:
          success:
            description: 'Parameters successfully loaded'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    parameters:
                      type: object
                    config-file:
                      type: object
          error:
            description: 'Parameters could not be loaded'
            content:
              application/json:
                schema:
                  type: string
      p2ResolveEsAddress:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                  - es-name
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p2ResolveEsAddress]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
                  es-name:
                    type: string
                    description: >
                      'ElasticSearch name
                      from [/stream-pm-data/es-address=*/name]'
        output:
          success:
            description: 'ES address successfully resolved'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    es-address:
                      type: object
          error:
            description: 'ES address could not be resolved'
            content:
              application/json:
                schema:
                  type: string
      p1InitKafka:
        summary: 'Resolves Kafka address and initializes the Kafka producer session'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p1InitKafka]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
        output:
          success:
            description: 'Kafka session successfully established'
          error:
            description: 'Kafka session could not be established'
            content:
              application/json:
                schema:
                  type: string
      p1MaintainDs:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - data-store-es-client
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p1MaintainDs]'
                  data-store-es-client:
                    type: object
                    description: >
                      'DataStore ElasticSearch address
                      from [/stream-pm-data/es-address=dataStoreEsClient/address]'
        output:
          success:
            description: 'DataStore maintenance processed'
          error:
            description: 'DataStore maintenance could not be processed'
            content:
              application/json:
                schema:
                  type: string
      p1ListUpdatedCcs:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - mwdi-es-client
                  - last-examination-time
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p1ListUpdatedCcs]'
                  mwdi-es-client:
                    type: object
                    description: >
                      'MWDI ElasticSearch address
                      from [/stream-pm-data/es-address=mwdiEsClient/address]'
                  last-examination-time:
                    type: string
                    description: >
                      'Timestamp of the last examination
                      from [/stream-pm-data/last-examination-time]'
        output:
          success:
            description: 'Updated ControlConstructs listed'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    updated-mount-names:
                      type: array
                      items:
                        type: string
                    examination-time:
                      type: string
          error:
            description: 'Updated ControlConstructs could not be listed'
            content:
              application/json:
                schema:
                  type: string
      p3ProcessDevice:
        description: 'Number of parallel processes to be automatically managed for avoiding massive peak loads'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                  - mount-name
                  - mwdi-es-client
                  - data-store-es-client
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p2ProcessDevice]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
                  mount-name:
                    type: string
                    description: >
                      'MountName
                      from [/stream-pm-data/to-be-processed-mount-names[n]]'
                  mwdi-es-client:
                    type: object
                    description: >
                      'MWDI ElasticSearch address
                      from [/stream-pm-data/es-address=mwdiEsClient/address]'
                  data-store-es-client:
                    type: object
                    description: >
                      'DataStore ElasticSearch address
                      from [/stream-pm-data/es-address=dataStoreEsClient/address]'
        output:
          success:
            description: 'PM data processed, sent and stored'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - device-pm-data-quality
                  properties:
                    device-pm-data-quality:
                      type: object
                      description: >
                        'Information about the quality of the provided PM data of all AirInterfaces and EthernetContainers at the device'
          error:
            description: 'Processing of PM data failed'
            content:
              application/json:
                schema:
                  type: string
      p1TransmittingKafka:
        description: 'Transmits payloads to kafka'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                  - output-format
                properties:
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1TransmittingKafka
                      from [/stream-pm-data/parameters/sub-function=p1TransmittingKafka]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
                  output-format:
                    type: array
                    x-key: format-name
                    description: >
                      'Array of output formats potentially to be transmitted
                      from [/stream-pm-data/output-format]'
        output:
          success:
            description: 'Objects sent via Kafka'
          error:
            description: 'Objects could not be sent via Kafka'
            content:
              application/json:
                schema:
                  type: string

paths:
  /:
    description: 'no rest path provided by this module'
