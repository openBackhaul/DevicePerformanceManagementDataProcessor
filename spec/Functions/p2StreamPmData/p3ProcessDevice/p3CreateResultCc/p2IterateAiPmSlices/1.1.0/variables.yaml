iterate-ai-pm-slices:
  type: object
  required:
    - parameters
    - historical-performance-data-list
    - transmission-mode-list
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    historical-performance-data-list:
      type: array
      x-key: granularity-period, period-end-time
      description: >
        'historicalPerformanceDataList
        from {$input#/historical-performance-data-list}
        ! simplified representation !'
      items:
        type: object
        properties:
          granularity-period:
            type: string
          period-end-time:
            type: string
          performance-data:
            type: object
            description: >
              'historicalPerformanceData
              overwritten by {$p1RemoveOutOfRangeLevels.output#/performance-data} IF no error in p1RemoveOutOfRangeLevels
              overwritten by {$p1RemoveDefaultValues.output#/cleaned-object} IF no error in p1RemoveDefaultValues'
            properties:
              interval-capacity:
                type: integer
                description: >
                  'intervalCapacity
                  from {$p1CalculateIntervalCapacity.output#/interval-capacity} IF no error in p1CalculateIntervalCapacity'
            errors:
              type: array
              description: >
                'Entry to be added every time a subfunction returns an error'
              items:
                type: object
                properties:
                  function-name:
                    type: string
                    description: >
                      'Name of the subfunction that returned an error, e.g.
                        p1CalculateIntervalCapacity
                        p1RemoveOutOfRangeLevelValues,
                        p1RemoveDefaultValues'
                  error-message:
                    type: string
                    description: >
                      'Error message returned by the failed subfunction, e.g.
                        Interval capacity could not be provided,
                        Performance data slice could not be cleaned from out-of-range level attributes,
                        Input object could not be cleaned from attributes with default values'
    transmission-mode-list:
      type: array
      description: >
        'transmissionModeList
        from {$input#/transmission-mode-list}'
