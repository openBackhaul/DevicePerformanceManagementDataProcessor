load-raw-cc:
  type: object
  required:
    - parameters
    - mwdi-replica-es-client
    - mount-name
    - offsets
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    mwdi-replica-es-client:
      type: object
      description: >
        'MWDI Replica ElasticSearch address
        from {$input#/mwdi-replica-es-client}'
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    offsets:
      type: array
      x-key: function-name
      description: >
        'Array of offsets of all functions
        from {$input#/offsets}'
      items:
        oneOf:
          - description: 'offset for p2LoadRawCc'
            type: object
            required:
              - function-name
              - offset
            properties:
              function-name:
                type: string
                enum:
                  - 'p2LoadRawCc'
              offset:
                type: object
                properties:
                  interface-offsets:
                    type: array
                    x-key: uuid
                    description: >
                      'Array of offsets of all interfaces at the device,
                      if not existing initialized with an empty array'
                    items:
                      type: object
                      required:
                        - uuid
                        - most-recent-period-end-time
                        - most-recent-period-end-time-24
                      properties:
                        uuid:
                          type: string
                          description: >
                            'uuid of the interface'
                        most-recent-period-end-time:
                          type: string
                          description: >
                            'mostRecentPeriodEndTime
                            for uuid = uuid of the interface being processed during the current loop iteration
                            overwritten from [/load-raw-cc/new-most-recent-period-end-time]'
                        most-recent-period-end-time-24:
                          type: string
                          description: >
                            'mostRecentPeriodEndTime24
                            for uuid = uuid of the interface being processed during the current loop iteration
                            overwritten from [/load-raw-cc/new-most-recent-period-end-time-24]'

    mwdi-replica-url:
      type: string
      description: >
        'ElasticSearch URL of MWDI Replica ES
        from [/load-raw-cc/mwdi-replica-es-client/url]'
    raw-cc:
      type: object
      description: >
        'rawCc read from Replica ES, but stripped to the content of the object inside the array
        from {$readControlConstructFromReplica.output#/core-model-1-4:control-construct={[/load-raw-cc/mount-name]}}
        overwritten by {$p1FieldsFilter.output#/filtered-data-structure}
        ! simplified representation !'
      properties:
        logical-termination-point:
          type: array
          description: >
            'instance to be deleted,
              if [./layer-protocol=*/layer-protocol-name] != [air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER OR ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER]'
          x-key: uuid
          items:
            type: object
            properties:
              uuid:
                type: string
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p2DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
                    - description: 'ethernet-container'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p2DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
        batch-timestamp:
          type: string
          description: >
            'Timestamp when the CC was read from the device (actually youngest air interface current performance data)
            from {$addBatchTimestamp.output#/batch-timestamp}'
    fields-filter:
      type: array
      items:
        type: object
        required:
          - format-name
          - fields-filter-string
        properties:
          format-name:
            type: string
            enum:
              - 'raw-cc'
            description: >
              'Name of the output format to which the fields filter should be applied
              for all parameters with { [/load-raw-cc/parameters/parameter=*/purpose] == fieldsFilter }
              from [/load-raw-cc/parameters/parameter=*/parameter-name]'
          fields-filter-string:
            type: string
            description: >
              'Fields filter to be applied to reduce the raw ControlConstruct data
              from [/load-raw-cc/parameters/parameter=raw-cc/value]'
    device-pm-data-quality:
      type: object
      description: >
        'Information about the quality of the provided PM data of all AirInterfaces and EthernetContainers at the device
        to be initialized with empty array of interfaces'
      required:
        - mount-name
        - interface
      properties:
        mount-name:
          type: string
          description: >
            'MountName
            from [/load-raw-cc/mount-name]'
        interface:
          type: array
          x-key: uuid
          items:
            type: object
            description: >
              'Information about the quality of the provided PM data for an individual interface
              defined by {$p1CalculateInterfacePmDataQuality.interface.processing.composeInterfacePmDataQuality.output#/interface-pm-data-quality}
              from {$p1CalculateInterfacePmDataQuality.output#/interface-pm-data-quality}'
    uuid:
      type: string
      description: >
        'uuid of the interface being processed during the current loop iteration'
    former-most-recent-period-end-time:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'mostRecentPeriodEndTime during former processing of the currently processed interface
        from { [/load-raw-cc/offsets=p2LoadRawCc/offset/interface-offsets={/load-raw-cc/uuid}/most-recent-period-end-time] or if not existing to be initialized from {2010-11-20T14:00:00+01:00} }'
    former-most-recent-period-end-time-24:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'mostRecentPeriodEndTime24 during former processing of the currently processed interface
        from { [/load-raw-cc/offsets=p2LoadRawCc/offset/interface-offsets={/load-raw-cc/uuid}/most-recent-period-end-time-24] or if not existing to be initialized from {2010-11-20T14:00:00+01:00} }'
    new-most-recent-period-end-time:
      type: string
      description: >
        'mostRecentPeriodEndTime in the currently processed batch of the currently processed interface
        from {$p2DiscardIrrelevantPmRecords.output#/new-most-recent-period-end-time}'
    new-most-recent-period-end-time-24:
      type: string
      description: >
        'mostRecentPeriodEndTime24 in the currently processed batch of the currently processed interface
        from {$p2DiscardIrrelevantPmRecords.output#/new-most-recent-period-end-time-24}'
    amount-received:
      type: object
      description: >
        'Number of 15min PM records received at AirInterfaces and EthernetContainers categorized by date
        from {$p2DiscardIrrelevantPmRecords.output#/amount-received}'
