openapi: 3.0.0
info:
  title: p1CreateResultCc
  version: 1.0.0

x-javascript-interface:
  p1CreateResultCc:
    summary: 'Creates the PM data (resultCc) from the raw data (rawCc)'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - raw-cc
            properties:
              parameters:
                type: object
                description: >
                  'parameters object for p1CreateResultCc'
              raw-cc:
                type: object
                description: >
                  'rawCc'
    output:
      success:
        description: 'Result CC data created'
        content:
          application/json:
            schema:
              type: object
              required:
                - result-cc
              properties:
                  result-cc:
                    type: object
                    description: >
                      'The result control construct data created from the raw control construct data, following ONF structure.
                      from [/create-result-cc/result-cc]'
      error:
        description: 'Result CC data could not be created'
        content:
          application/json:
            schema:
              type: string
              enum:
                # todo: reasonable error messages to be added
                - 'Input data structure incomplete or invalid'
                - 'General processing error'
    processing:
      createResultCcFromRawCc:
        description: >
          'Creates the resultCc object as a variable of the p1CreateResultCc function and fills it from rawCc data'
        input:
          content:
            application/json:
              schema:
                properties:
                  raw-cc:
                    type: object
                    description: >
                      'RawCc
                      from [/create-result-cc/_raw-cc]'
        output:
          success:
            description: 'Result ControlConstruct object provided'
            content:
              application/json:
                schema:
                  properties:
                    schema:
                      type: object
                      properties:
                        result-cc:
                          type: object
                          description: >
                            'ResultCc'
        error:
          description: 'Result ControlConstruct object could not be created.'
          content:
            application/json:
              schema:
                type: string
                enum:
                  # todo: reasonable error messages to be added
                  - 'RawCc could not be copied to ResultCc'
                  - 'General processing error'
      
