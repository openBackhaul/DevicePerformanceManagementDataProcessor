raw-cc:
  type: object
  description: >
    'The raw control construct data read from ES, following ONF structure.
    Only relevant classes and attributes listed.'
  required:
    - equipment-augment-1-0:control-construct-pac
    - logical-termination-point
  properties:
    equipment-augment-1-0:control-construct-pac:
      type: object
      required:
        - external-label
        - device-model-name
      properties:
        external-label:
          type: string
          description: >
            'mountName
            from {$input#/mount-name}'
        device-model-name:
          type: string
          description: >
            'deviceType
            from {$applyFilteringForRelevantPmData.output#equipment-augment-1-0:control-construct-pac/device-model-name}'
    logical-termination-point:
      type: array
      description: >
        'The filtered LTP data
        from {$applyFilteringForRelevantPmData.output#logical-termination-point}
      x-key: uuid
      items:
        type: object
        required:
          - uuid
          - ltp-augment-1-0:ltp-augment-pac
          - layer-protocol
        properties:
          uuid:
            type: string
          client-ltp:
            type: array
            items:
              type: string
          server-ltp:
            type: array
            items:
              type: string
          ltp-augment-1-0:ltp-augment-pac:
            type: object
            properties:
              external-label:
                type: string
                description: 'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
              original-ltp-name:
                type: string
                description: 'portName'
          layer-protocol:
            type: array
            x-key: local-id
            items:
              oneOf:
                - description: 'air-interface'
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - air-interface-2-0:air-interface-pac
                  properties:
                    local-id:
                      type: string
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                    air-interface-2-0:air-interface-pac:
                      type: object
                      properties:
                        air-interface-configuration:
                          type: object
                          properties:
                            transmission-mode-min:
                              type: string
                            transmission-mode-max:
                              type: string
                            tx-power:
                              type: integer
                            atpc-is-on:
                              type: boolean
                            atpc-thresh-upper:
                              type: integer
                            atpc-thresh-lower:
                              type: integer
                        air-interface-capability:
                          type: object
                          properties:
                            transmission-mode-list:
                              type: array
                              x-key: transmission-mode-name
                              items:
                                type: object
                                properties:
                                  transmission-mode-name:
                                    type: string
                                  channel-bandwidth:
                                    type: integer
                                  modulation-scheme:
                                    type: integer
                                  modulation-scheme-name-at-lct:
                                    type: string
                                  code-rate:
                                    type: integer
                                  symbol-rate-reduction-factor:
                                    type: integer
                        air-interface-historical-performances:
                          type: object
                          properties:
                            historical-performance-data-list:
                              type: array
                              x-key: period-end-time
                              items:
                                type: object
                                required:
                                  - granularity-period
                                  - period-end-time
                                  - performance-data
                                properties:
                                  granularity-period:
                                    type: string
                                    enum:
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  period-end-time:
                                    type: string
                                  performance-data:
                                    type: object
                                    properties:
                                      es:
                                        type: integer
                                      ses:
                                        type: integer
                                      cses:
                                        type: integer
                                      unavailability:
                                        type: integer
                                      tx-level-min:
                                        type: integer
                                      tx-level-max:
                                        type: integer
                                      tx-level-avg:
                                        type: integer
                                      rx-level-min:
                                        type: integer
                                      rx-level-max:
                                        type: integer
                                      rx-level-avg:
                                        type: integer
                                      time-xstates-list:
                                        type: array
                                        x-key: transmission-mode
                                        items:
                                          type: object
                                          required:
                                            - transmission-mode
                                          properties:
                                            transmission-mode:
                                              type: string
                                            time:
                                              type: integer
                                      snir-min:
                                        type: integer
                                      snir-max:
                                        type: integer
                                      snir-avg:
                                        type: integer
                                      xpd-min:
                                        type: integer
                                      xpd-max:
                                        type: integer
                                      xpd-avg:
                                        type: integer
                                      defect-blocks-sum:
                                        type: integer
                                      time-period:
                                        type: integer
                - description: 'ethernet-container'
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - ethernet-container-2-0:ethernet-container-pac
                  properties:
                    local-id:
                      type: string
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                    ethernet-container-2-0:ethernet-container-pac:
                      type: object
                      properties:
                        ethernet-container-historical-performances:
                          type: object
                          properties:
                            historical-performance-data-list:
                              type: array
                              x-key: period-end-time
                              items:
                                type: object
                                required:
                                  - granularity-period
                                  - period-end-time
                                  - performance-data
                                properties:
                                  granularity-period:
                                    type: string
                                    enum:
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  period-end-time:
                                    type: string
                                  performance-data:
                                    type: object
                                    properties:
                                      max-bytes-per-second-output:
                                        type: integer
                                      total-bytes-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      total-bytes-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      time-period:
                                        type: integer
                                      total-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      total-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      forwarded-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      forwarded-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unicast-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unicast-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      multicast-frames-input:
                                        type: integer
                                      multicast-frames-output:
                                        type: integer
                                      broadcast-frames-input:
                                        type: integer
                                      broadcast-frames-output:
                                        type: integer
                                      fragmented-frames-input:
                                        type: integer
                                      errored-frames-input:
                                        type: integer
                                      errored-frames-output:
                                        type: integer
                                      dropped-frames-input:
                                        type: integer
                                      dropped-frames-output:
                                        type: integer
                                      oversized-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      undersized-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      jabber-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unknown-protocol-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
