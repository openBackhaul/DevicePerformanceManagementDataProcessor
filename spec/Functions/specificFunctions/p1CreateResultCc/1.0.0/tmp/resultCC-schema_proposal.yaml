result-cc:
  type: object
  description: >
    'The processed data. Following ONF structure (only relevant classes and attributes listed), but extended by additional attributes,
    from {$createResultFromRawCc.output#result-cc}'
  required:
    - equipment-augment-1-0:control-construct-pac
    - logical-termination-point
  properties:
    equipment-augment-1-0:control-construct-pac:
      type: object
      required:
        - external-label
        - device-model-name
      properties:
        external-label:
          type: string
          description: 'mountName'
        device-model-name:
          type: string
          description: 'deviceType'
    logical-termination-point:
      type: array
      x-key: uuid
      items:
        type: object
        required:
          - uuid
          - ltp-augment-1-0:ltp-augment-pac
          - layer-protocol
        properties:
          uuid:
            type: string
          # TODO: client-ltp, server-ltö, ltpAugment only needed for linkID/portName, LAG -> when computed from rawCC, not needed here -> for later usage required?
          client-ltp:
            type: array
            items:
              type: string
          server-ltp:
            type: array
            items:
              type: string
          ltp-augment-1-0:ltp-augment-pac:
            type: object
            properties:
              external-label:
                type: string
                description: 'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
              original-ltp-name:
                type: string
                description: 'portName'
          layer-protocol:
            type: array
            x-key: local-id
            items:
              oneOf:
                - description: 'air-interface'
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - air-interface-2-0:air-interface-pac
                  properties:
                    local-id:
                      type: string
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                      # NEW: hier schon berechnen, statt erst beim OutputFormatting
                      link-id:
                        type: string
                        description: >
                          'linkId - Identifier of the microwave link as used in the Telefonica planing tools
                          from {TODO: ltpAugment.externalLabel, no separate function required}'
                      link-endpoint-id:
                        type: string
                        description: >
                          'linkEndpointId - filled
                          from {TODO: ltpAugment.externalLabel.substring(0,9), , no separate function required}'
                      link-aggregation-identifiers:
                        type: array
                        description: >
                          'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames
                          from {TODO: function call}'
                        items:
                          oneOf:
                            - description: 'AirInterfaces'
                              type: object
                              required:
                                - link-id
                              properties:
                                link-id:
                                  type: string
                                  description: >
                                    'Identifier of the microwave link as used in the Telefonica planing tools
                                    from {TODO: function call}'
                            - description: 'WireInterface'
                              type: object
                              required:
                                - interface-name
                              properties:
                                interface-name:
                                  type: string
                                  description: >
                                    'Interface name as it is represented at the own management interface of the vendor
                                    from {TODO: function call}'
                    air-interface-2-0:air-interface-pac:
                      type: object
                      properties:
                        air-interface-configuration:
                          type: object
                          properties:
                            transmission-mode-min:
                              type: string
                            transmission-mode-max:
                              type: string
                            tx-power:
                              type: integer
                            atpc-is-on:
                              type: boolean
                            atpc-thresh-upper:
                              type: integer
                            atpc-thresh-lower:
                              type: integer
                        air-interface-capability:
                          type: object
                          properties:
                            transmission-mode-list:
                              type: array
                              x-key: transmission-mode-name
                              description: >
                                'Discard the complete array item, if (code-rate==-1)'
                              items:
                                type: object
                                properties:
                                  transmission-mode-name:
                                    type: string
                                  channel-bandwidth:
                                    type: integer
                                  modulation-scheme:
                                    type: integer
                                  modulation-scheme-name-at-lct:
                                    type: string
                                  code-rate:
                                    type: integer
                                    description: 'If this attribute value is -1, the complete array item is to be discarded.'
                                  symbol-rate-reduction-factor:
                                    type: integer
                                  capacity:
                                    type: number
                                    format: float
                                    description: >
                                      'AirInterface capacity calculated with ONF formula,
                                      value not yet available in pre-release, filled with default -1'
                        air-interface-historical-performances:
                          type: object
                          properties:
                            most-recent-period-end-time:
                              type: string
                              description: 'The most recent date in the period-end-time attribute of all instances in the historical-performance-data-list'
                            historical-performance-data-list:
                              type: array
                              x-key: period-end-time
                              items:
                                type: object
                                required:
                                  - granularity-period
                                  - period-end-time
                                  - performance-data
                                properties:
                                  granularity-period:
                                    type: string
                                    enum:
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                      - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  period-end-time:
                                    type: string
                                  performance-data:
                                    type: object
                                    properties:
                                      es:
                                        type: integer
                                      ses:
                                        type: integer
                                      cses:
                                        type: integer
                                      unavailability:
                                        type: integer
                                      tx-level-min:
                                        type: integer
                                      tx-level-max:
                                        type: integer
                                      tx-level-avg:
                                        type: integer
                                      rx-level-min:
                                        type: integer
                                      rx-level-max:
                                        type: integer
                                      rx-level-avg:
                                        type: integer
                                      time-xstates-list:
                                        type: array
                                        x-key: transmission-mode
                                        description: >
                                          'Discard the complete array item, if time <= 0'
                                        items:
                                          type: object
                                          required:
                                            - transmission-mode
                                          properties:
                                            transmission-mode:
                                              type: string
                                            time:
                                              type: integer
                                              description: 'If this attribute value is <= 0 discard the complete array item'
                                      interval-capacity:
                                        type: number
                                        format: float
                                        description: > 
                                          'Averaged capacity, calculated by weighting the operated transmission modes with the duration of their operation during the measurement period.
                                          not already available in this step, filled with default -1'
                                      snir-min:
                                        type: integer
                                      snir-max:
                                        type: integer
                                      snir-avg:
                                        type: integer
                                      xpd-min:
                                        type: integer
                                      xpd-max:
                                        type: integer
                                      xpd-avg:
                                        type: integer
                                      defect-blocks-sum:
                                        type: integer
                                      time-period:
                                        type: integer
                - description: 'ethernet-container'
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - ethernet-container-2-0:ethernet-container-pac
                  properties:
                    local-id:
                      type: string
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                    # NEW
                    interface-name:
                      type: string
                      description: >
                        'Interface name of the EthernetContainer as it is represented at the vendors own management interface, e.g. LAN 1/6/6
                        from {TODO}, from ltpAugment.original-ltp-name'
                    ethernet-container-2-0:ethernet-container-pac:
                      type: object
                      properties:
                        ethernet-container-historical-performances:
                          type: object
                          properties:
                            most-recent-period-end-time:
                              type: string
                              description: 'The most recent date in the period-end-time attribute of all instances in the historical-performance-data-list'
                            historical-performance-data-list:
                              type: array
                              x-key: period-end-time
                              items:
                                type: object
                                required:
                                  - granularity-period
                                  - period-end-time
                                  - performance-data
                                properties:
                                  granularity-period:
                                    type: string
                                    enum:
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                      - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  period-end-time:
                                    type: string
                                  performance-data:
                                    type: object
                                    properties:
                                      max-bytes-per-second-output:
                                        type: integer
                                      total-bytes-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      total-bytes-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      time-period:
                                        type: integer
                                      transmit-traffic:
                                        type: number
                                        format: float
                                        description: >
                                          'TX Traffic [Mbps] KPI)
                                          not already available in this step, filled with default -1'
                                      receive-traffic:
                                        type: number
                                        format: float
                                        description: >
                                          'RX Traffic [Mbps] (KPI)
                                          not already available in this step, filled with default -1'
                                      total-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      total-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      forwarded-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      forwarded-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unicast-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unicast-frames-output:
                                        type: string
                                        description: 'String representation of int64 value'
                                      multicast-frames-input:
                                        type: integer
                                      multicast-frames-output:
                                        type: integer
                                      broadcast-frames-input:
                                        type: integer
                                      broadcast-frames-output:
                                        type: integer
                                      fragmented-frames-input:
                                        type: integer
                                      errored-frames-input:
                                        type: integer
                                      errored-frames-output:
                                        type: integer
                                      dropped-frames-input:
                                        type: integer
                                      dropped-frames-output:
                                        type: integer
                                      frame-loss-input:
                                        type: integer
                                        description: >
                                          'Sum of errored and dropped frames on the ingress (KPI)
                                          not already available in this step, filled with default -1'
                                      frame-loss-output:
                                        type: integer
                                        description: >
                                          'Sum of errored and dropped frames on the egress (KPI)
                                          not already available in this step, filled with default -1'
                                      oversized-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      undersized-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      jabber-frames-ingress:
                                        type: string
                                        description: 'String representation of int64 value'
                                      unknown-protocol-frames-input:
                                        type: string
                                        description: 'String representation of int64 value'
