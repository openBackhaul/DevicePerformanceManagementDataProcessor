openapi: 3.0.0
info:
  title: p1StreamPmData
  version: 1.0.0

x-javascript-interface:
  p1StreamPmData:
    summary: 'Replicates the MWDI ElasticSearch index'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
                    enum:
                      - 'p1StreamPmData'
                    description: 'Name of the Function whose parameters are to be loaded from the configFile'
        output:
          success:
            description: 'Parameters successfully loaded'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - parameters
                  properties:
                    parameters:
                      type: object
                      description: 'Hierarchical object holding the parameter settings'
                    config-file:
                      type: object
                      description: 'configFile content'
          error:
            description: 'Parameters could not be loaded'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'configFile not found or not accessible'
                    - 'configFile is not valid JSON'
                    - 'configFile does not conform to the expected schema'
                    - 'functionName not found in configFile'
                    - 'unknown error occurred'
      # Derive concrete address data from configFile based on parameters
      cronjob:
        input:
          schema:
            type: object
            properties:

        output:
          success:
            description: 'The MWDI ES Replica has been brought in sync with the MWDI ES index
              for the current replication window. All ControlConstructs whose
              last-complete-control-construct-update-time-attempt (field
              `lastUpdated`) is within the replication window have been copied from
              MWDI ES to the MWDI ES Replica using the ElasticSearch `_reindex`
              API. ControlConstructs that have been deleted in the MWDI ES index
              during the same window have been removed from the MWDI ES Replica
              using a bulk delete operation. The function also records the
              replication window, statistics (number of replicated and deleted CCs)
              and a status message in the ReplicateMwdiEsLog, and updates the
              lastReplicationTimestamp in the DataStore.'
            schema:
              type: object
              properties:
                cronjobName:
                  type: string
                lastReplicationTimestamp:
                  type: integer
                  format: int64
                  description: "Timestamp marking the end of the completed replication window."
                updatedMountNames:
                  type: array
                  description: "List of mountNames whose ControlConstructs changed in this replication cycle."
                  items:
                    type: string
                statusMessage:
                  type: string
          error:
            description: 'Replication of the MWDI ES index has failed. The function writes an
              error entry to the ReplicateMwdiEsLog including the replication
              window and an error description. The lastReplicationTimestamp is not
              advanced so that the next successful run can repeat the same
              replication window (with a small overlap) to avoid data loss'
            schema:
              type: object
              properties:
                cronjobName:
                  type: string
                statusMessage:
                  type: string
                error:
                  type: string
                window:
                  type: object
                  properties:
                    fromTs:
                      type: integer
                      format: int64
                    toTs:
                      type: integer
                      format: int64
      logging:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - cronjob-name
                  - last-replication-timestamp
                  - status-message
                properties:
                  cronjob-name:
                    type: string
                    enum:
                      - 'p1StreamPmData'
                    description: 'Name of the cronjob'
                  last-replication-timestamp:
                    type: string
                    pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
                    description: 'Date and time of the last successful replication of the MWDI ES index'
                  status-message:
                    type: string
                    # todo: add enum values, if reasonable
                    enum:
                      - ''
                    # todo: add some information about the thing upon which the status is documented here
                    description: >
                      '
                      '
      p1ProcessingPmData:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - parameters
                  - config-file
                properties:
                  mount-name:
                    type: string
                    description: >
                      'MountName from objectPath in AVC notification sent by MWDI indicating change in timeOfLatestChange
                      from {$cronjob.output#/updatedMountNames[n]}'
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from {$p1LoadParameters.output#/parameters}'
                  config-file:
                    type: object
                    description: 'configFile content'
        output:
          success:
            description: 'PM data processed, sent and stored'
            # todo: Does the Function return any output data on success? If yes, please define them here.
          error:
            description: 'MWDI ElasticSearch index could not be replicated'
            content:
              application/json:
                schema:
                  type: string
                  # todo: add enum values for the errorMessages to be thrown, if reasonable
                  enum:
                    - ''

paths:
  /:
    description: 'no rest path provided by this module'
