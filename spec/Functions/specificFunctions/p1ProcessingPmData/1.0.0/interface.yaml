openapi: 3.0.0
info:
  title: p1ProcessingPmData
  version: 1.0.0

x-javascript-interface:
  p1ProcessingPmData:
    summary: 'Orchestrates the device-wise processing, formatting, sending and storing of PM data.'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - mount-name
              - parameters
            properties:
              mount-name:
                type: string
                description: >
                  'MountName
                  to {/data-structure-for-processing/mount-name}'
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings
                  to {/data-structure-for-processing/parameters}'
    output:
      success:
        description: 'PM data processed, sent and stored'
      error:
        description: 'Processing of PM data failed'
    processing:
      p1LoadRawCc:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - parameters
                properties:
                  mount-name:
                    type: string
                    description: >
                      'MountName
                      from {/data-structure-for-processing/mount-name}'
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1LoadRawCc
                      from {/data-structure-for-processing/parameters/sub-function=p1LoadRawCc}'
        output:
          success:
            description: 'Raw CC data loaded'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - raw-cc
                  properties:
                    raw-cc:
                      type: object
                      description: >
                        'rawCc
                        to {/data-structure-for-processing/raw-cc}'
          error:
            description: 'Raw CC could not be loaded'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Data structure is missing or invalid'
                    - 'General processing error'
      p1CreateResultCc:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - _raw-cc
                  - parameters
                properties:
                  _raw-cc:
                    type: reference
                    description: >
                      'reference to rawCc in DataStructureForProcessing
                      /data-structure-for-processing/raw-cc'
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1CreateResultCc
                      from {/data-structure-for-processing/parameters/sub-function=p1CreateResultCc}'
        output:
          success:
            description: 'Result CC data created'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - result-cc
                  properties:
                    result-cc:
                      type: object
                      description: >
                        'resultCc
                        to {/data-structure-for-processing/result-cc}'
          error:
            description: 'Result CC data could not be created'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - ''
                    # todo: error messages to be added after specifying p1CreateResultCc
      p1FormattingOutputApt:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - _result-cc
                  - parameters
                properties:
                  _result-cc:
                    type: reference
                    description: >
                      'reference to resultCc in DataStructureForProcessing
                      /data-structure-for-processing/result-cc'
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1FormattingOutputApt
                      from {/data-structure-for-processing/parameters/sub-function=p1FormattingOutputApt}'
        output:
          success:
            description: 'aptOutputFormat created from resultCC'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - apt-output-format
                  properties:
                    apt-output-format:
                      type: object
                      description: >
                        'aptOutputFormat
                        to {/data-structure-for-processing/output-format=apt/content}'
          error:
            description: 'aptOutputFormat could not be created from resultCC'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Input data missing or invalid'
                    - 'General processing error'
      p1TransmittingKafka:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - _outputFormat
                  - parameters
                properties:
                  _outputFormat:
                    type: reference
                    description: >
                      'Reference to the content of an OutputFormat in DataStructureForProcessing
                      /data-structure-for-processing/output-format=[parameter]/content'
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1TransmittingKafka
                      from {/data-structure-for-processing/parameters/sub-function=p1TransmittingKafka}'
        output:
          success:
            description: 'OutputFormats sent via Kafka'
          error:
            description: 'OutputFormats could not be sent via Kafka'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - ''
                    # todo: error messages to be added after specifying p1TransmittingKafka
      p1Storing:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - _result-cc
                  - parameters
                properties:
                  result-cc:
                    type: reference
                    description: >
                      'reference to resultCc in DataStructureForProcessing
                      /data-structure-for-processing/result-cc'
                  parameters:
                    type: object
                    description: >
                      'Subtree of the parameters object for p1Storing
                      from {/data-structure-for-processing/parameters/sub-function=p1Storing}'
        output:
          success:
            description: 'resultCC stored'
          error:
            description: 'resultCC could not be stored'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - ''
                    # todo: error messages to be added after specifying p1Storing

paths:
  /:
    description: 'no rest path provided by this module'
