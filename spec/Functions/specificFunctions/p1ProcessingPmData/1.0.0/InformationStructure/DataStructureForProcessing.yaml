data-structure-for-processing:
  type: object
  required:
    - mount-name
    - parameters
  properties:
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    raw-cc:
      type: object
      description: >
        'The raw control construct data read from ES, following ONF structure.
        Only relevant classes and attributes listed.
        from {$p1LoadRawCc.output#/raw-cc}'
    result-cc:
      type: object
      description: >
        'The result control construct data created from the raw control construct data, following ONF structure.
        from {$p1CreateResultCc.output#/result-cc}'
    output-format:
      type: array
      x-key: format-name
      items:
        type: object
        required:
          - format-name
          - content
        properties:
          format-name:
            type: string
            description: 'Name of the output format'
            enum:
              - 'apt'
          content:
            oneOf:
              - description: >
                  'APT formatted PM data
                  from {$p1FormattingOutputApt.output#/apt-output-format}'
                type: object
