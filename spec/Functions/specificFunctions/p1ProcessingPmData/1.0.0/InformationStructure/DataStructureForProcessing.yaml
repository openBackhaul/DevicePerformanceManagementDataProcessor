data-structure-for-processing:
  type: object
  required:
    - mount-name
    - function




    - raw-control-construct
    - control-construct
    - processing
    - output
  properties:
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    function:
      $ref: '#/components/schemas/function-schema'
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/function}'





    raw-control-construct:
      type: object
      description: >
        'The raw control construct data read from ES, following ONF structure. Only relevant classes and attributes listed.
        Functions processing this data are not passed the data itself, but a reference to it instead.'
      required:
        - equipment-augment-1-0:control-construct-pac
        - logical-termination-point
      properties:
        equipment-augment-1-0:control-construct-pac:
          type: object
          required:
            - external-label
            - device-model-name
          properties:
            external-label:
              type: string
              description: >
                'mountName
                from {$p1ProcessingPmData.request.body#/mount-name}'
            device-model-name:
              type: string
              description: >
                'deviceType
                from {$p1LoadRawCc}'
        logical-termination-point:
          type: array
          x-key: uuid
          items:
            type: object
            required:
              - uuid
              - ltp-augment-1-0:ltp-augment-pac
              - layer-protocol
            properties:
              uuid:
                type: string
              client-ltp:
                type: array
                items:
                  type: string
              server-ltp:
                type: array
                items:
                  type: string
              ltp-augment-1-0:ltp-augment-pac:
                type: object
                properties:
                  external-label:
                    type: string
                    description: >
                      'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools
                      from {$p1LoadRawCc}'
                  original-ltp-name:
                    type: string
                    description: >
                      'portName
                      from {$p1LoadRawCc}'
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - air-interface-2-0:air-interface-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-configuration:
                              type: object
                              properties:
                                transmission-mode-min:
                                  type: string
                                transmission-mode-max:
                                  type: string
                                tx-power:
                                  type: integer
                                atpc-is-on:
                                  type: boolean
                                atpc-thresh-upper:
                                  type: integer
                                atpc-thresh-lower:
                                  type: integer
                            air-interface-capability:
                              type: object
                              properties:
                                transmission-mode-list:
                                  type: array
                                  x-key: transmission-mode-name
                                  items:
                                    type: object
                                    properties:
                                      transmission-mode-name:
                                        type: string
                                      channel-bandwidth:
                                        type: integer
                                      modulation-scheme:
                                        type: integer
                                      modulation-scheme-name-at-lct:
                                        type: string
                                      code-rate:
                                        type: integer
                                      symbol-rate-reduction-factor:
                                        type: integer
                            air-interface-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          es:
                                            type: integer
                                          ses:
                                            type: integer
                                          cses:
                                            type: integer
                                          unavailability:
                                            type: integer
                                          tx-level-min:
                                            type: integer
                                          tx-level-max:
                                            type: integer
                                          tx-level-avg:
                                            type: integer
                                          rx-level-min:
                                            type: integer
                                          rx-level-max:
                                            type: integer
                                          rx-level-avg:
                                            type: integer
                                          time-xstates-list:
                                            type: array
                                            x-key: transmission-mode
                                            items:
                                              type: object
                                              required:
                                                - transmission-mode
                                              properties:
                                                transmission-mode:
                                                  type: string
                                                time:
                                                  type: integer
                                          snir-min:
                                            type: integer
                                          snir-max:
                                            type: integer
                                          snir-avg:
                                            type: integer
                                          xpd-min:
                                            type: integer
                                          xpd-max:
                                            type: integer
                                          xpd-avg:
                                            type: integer
                                          defect-blocks-sum:
                                            type: integer
                                          time-period:
                                            type: integer
                    - description: 'ethernet-container'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - ethernet-container-2-0:ethernet-container-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          max-bytes-per-second-output:
                                            type: integer
                                          total-bytes-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-bytes-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          time-period:
                                            type: integer
                                          total-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          multicast-frames-input:
                                            type: integer
                                          multicast-frames-output:
                                            type: integer
                                          broadcast-frames-input:
                                            type: integer
                                          broadcast-frames-output:
                                            type: integer
                                          fragmented-frames-input:
                                            type: integer
                                          errored-frames-input:
                                            type: integer
                                          errored-frames-output:
                                            type: integer
                                          dropped-frames-input:
                                            type: integer
                                          dropped-frames-output:
                                            type: integer
                                          oversized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          undersized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          jabber-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unknown-protocol-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
    control-construct:
      type: object
      description: >
        'The processed data. Following ONF structure (only relevant classes and attributes listed), but extended by additional attributes.'
      required:
        - equipment-augment-1-0:control-construct-pac
        - logical-termination-point
      properties:
        equipment-augment-1-0:control-construct-pac:
          type: object
          required:
            - external-label
            - device-model-name
          properties:
            external-label:
              type: string
              description: >
                'mountName
                from {$p1ProcessingPmData.request.body#/mount-name}'
            device-model-name:
              type: string
              description: >
                'deviceType
                from { ??? }'
        logical-termination-point:
          type: array
          x-key: uuid
          items:
            type: object
            required:
              - uuid
              - ltp-augment-1-0:ltp-augment-pac
              - layer-protocol
            properties:
              uuid:
                type: string
              client-ltp:
                type: array
                items:
                  type: string
              server-ltp:
                type: array
                items:
                  type: string
              ltp-augment-1-0:ltp-augment-pac:
                type: object
                properties:
                  external-label:
                    type: string
                    description: >
                      'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools
                      from { ??? }'
                  link-id:
                    type: string
                    description: >
                      'linkId - Identifier of the microwave link as used in the Telefonica planing tools
                      from { ??? }'
                  original-ltp-name:
                    type: string
                    description: >
                      'portName
                      from { ??? }'
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - air-interface-2-0:air-interface-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-configuration:
                              type: object
                              properties:
                                transmission-mode-min:
                                  type: string
                                transmission-mode-max:
                                  type: string
                                tx-power:
                                  type: integer
                                atpc-is-on:
                                  type: boolean
                                atpc-thresh-upper:
                                  type: integer
                                atpc-thresh-lower:
                                  type: integer
                            air-interface-capability:
                              type: object
                              properties:
                                transmission-mode-list:
                                  type: array
                                  x-key: transmission-mode-name
                                  items:
                                    type: object
                                    properties:
                                      transmission-mode-name:
                                        type: string
                                      channel-bandwidth:
                                        type: integer
                                      modulation-scheme:
                                        type: integer
                                      modulation-scheme-name-at-lct:
                                        type: string
                                      code-rate:
                                        type: integer
                                      symbol-rate-reduction-factor:
                                        type: integer
                                      capacity:
                                        type: number
                                        format: float
                                        description: >
                                          'AirInterface capacity calculated with ONF formula
                                          from { ??? }'
                            air-interface-historical-performances:
                              type: object
                              properties:
                                most-recent-period-end-time:
                                  type: string
                                  description: >
                                    'The most recent date in the period-end-time attribute of all instances in the historical-performance-data-list
                                    from { ??? }'
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          es:
                                            type: integer
                                          ses:
                                            type: integer
                                          cses:
                                            type: integer
                                          unavailability:
                                            type: integer
                                          tx-level-min:
                                            type: integer
                                          tx-level-max:
                                            type: integer
                                          tx-level-avg:
                                            type: integer
                                          rx-level-min:
                                            type: integer
                                          rx-level-max:
                                            type: integer
                                          rx-level-avg:
                                            type: integer
                                          time-xstates-list:
                                            type: array
                                            x-key: transmission-mode
                                            items:
                                              type: object
                                              required:
                                                - transmission-mode
                                              properties:
                                                transmission-mode:
                                                  type: string
                                                time:
                                                  type: integer
                                          interval-capacity:
                                            type: number
                                            format: float
                                            description: > 
                                              'Averaged capacity, calculated by weighting the operated transmission modes with the duration of their operation during the measurement period.
                                              from { ??? }'
                                          snir-min:
                                            type: integer
                                          snir-max:
                                            type: integer
                                          snir-avg:
                                            type: integer
                                          xpd-min:
                                            type: integer
                                          xpd-max:
                                            type: integer
                                          xpd-avg:
                                            type: integer
                                          defect-blocks-sum:
                                            type: integer
                                          time-period:
                                            type: integer
                    - description: 'ethernet-container'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - ethernet-container-2-0:ethernet-container-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                most-recent-period-end-time:
                                  type: string
                                  description: >
                                    'The most recent date in the period-end-time attribute of all instances in the historical-performance-data-list
                                    from { ??? }'
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          max-bytes-per-second-output:
                                            type: integer
                                          total-bytes-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-bytes-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          time-period:
                                            type: integer
                                          transmit-traffic:
                                            type: number
                                            format: float
                                            description: >
                                              'TX Traffic [Mbps] KPI)
                                              from { ??? }'
                                          receive-traffic:
                                            type: number
                                            format: float
                                            description: >
                                              'RX Traffic [Mbps] (KPI)
                                              from { ??? }'
                                          total-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          multicast-frames-input:
                                            type: integer
                                          multicast-frames-output:
                                            type: integer
                                          broadcast-frames-input:
                                            type: integer
                                          broadcast-frames-output:
                                            type: integer
                                          fragmented-frames-input:
                                            type: integer
                                          errored-frames-input:
                                            type: integer
                                          errored-frames-output:
                                            type: integer
                                          dropped-frames-input:
                                            type: integer
                                          dropped-frames-output:
                                            type: integer
                                          frame-loss-input:
                                            type: integer
                                            description: >
                                              'Sum of errored and dropped frames on the ingress (KPI)
                                              from { ??? }'
                                          frame-loss-output:
                                            type: integer
                                            description: >
                                              'Sum of errored and dropped frames on the egress (KPI)
                                              from { ??? }'
                                          oversized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          undersized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          jabber-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unknown-protocol-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
    processing:
      type: object
      required:
        - processing-start-time
        - workflow
      properties:
        processing-start-time:
          type: string
          description: >
            'Processing has been initiated by an AVC notification sent by the cronjob for updating the DPMDP ES
            from {$p1ProcessingPmData.request.body#/processing-start-time}'
        workflow:
          type: array
          items:
            type: object
            required:
              - function-name
              - response-code
            properties:
              function-name:
                type: string
                description: 'functionName of the ProcessingFunction'
              response-code:
                # attribute name potentially to be changed, as we don't send REST requests, but call JavaScript Functions
                type: integer
                description: 'responseCode that resulted from executing the ProcessingFunction'
    output:
      anyOf:
        - description: 'APT legacy output format - see OutputApt.yaml'
          type: object

components:
  schemas:
    function-schema:
      type: object
      required:
        - function-name
        - description
        - is-active
        - parameter
        - sub-function
      properties:
        function-name:
          type: string
          description: >
            'operationId (from the OAS) as a unique and invariant identifier of the module
            from [configFile://core-model-1-4:control-construct/profile-collection/profile=uuid/function-profile-1-0:function-profile-pac/function-profile-capability/function-name]'
        description:
          type: string
          description: >
            'Human readable description of the Function
            from [configFile://core-model-1-4:control-construct/profile-collection/profile=uuid/function-profile-1-0:function-profile-pac/function-profile-capability/function-description]'
        is-active:
          type: boolean
          description: >
            'true = the Function shall be executed
            from [configFile://core-model-1-4:control-construct/profile-collection/profile=uuid/function-profile-1-0:function-profile-pac/function-profile-configuration/is-active]'
        parameter:
          type: array
          x-key: parameter-name
          description: 'List of Parameters of the Function'
          items:
            type: object
            required:
              - parameter-name
              - purpose
              - owner
              - value
            properties:
              parameter-name:
                type: string
                description: >
                  'Locally unique and invariant name of the parameter
                  for _StringProfile==[configFile://core-model-1-4:control-construct/profile-collection/profile=p1LoadParametersuuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/parameter]
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=_StringProfile/string-profile-1-0:string-profile-pac/string-profile-capability/string-name]'
              purpose:
                type: string
                description: >
                  'Invariant description of the parameter
                  for _StringProfile==[configFile://core-model-1-4:control-construct/profile-collection/profile=p1LoadParametersuuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/parameter]
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=_StringProfile/string-profile-1-0:string-profile-pac/string-profile-capability/purpose]'
              owner:
                type: string
                description: >
                  'Owner of the parameter
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=uuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/owner]'
                enum:
                  - platform
                  - engineering
                  - user
              value:
                type: string
                description: >
                  'Configurable value of the parameter
                  for _StringProfile==[configFile://core-model-1-4:control-construct/profile-collection/profile=p1LoadParametersuuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/parameter]
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=_StringProfile/string-profile-1-0:string-profile-pac/string-profile-configuration/string-value]'
              enumeration:
                type: array
                description: >
                  'Optional: List of valid values for the parameter
                  for _StringProfile==[configFile://core-model-1-4:control-construct/profile-collection/profile=p1LoadParametersuuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/parameter]
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=_StringProfile/string-profile-1-0:string-profile-pac/string-profile-capability/enumeration]'
                items:
                  type: string
              pattern:
                type: string
                description: >
                  'Optional: Regular expression defining valid values of the parameter
                  for _StringProfile==[configFile://core-model-1-4:control-construct/profile-collection/profile=p1LoadParametersuuid/function-profile-1-0:function-profile-pac/function-profile-capability/parameter-list=*/parameter]
                  from [configFile://core-model-1-4:control-construct/profile-collection/profile=_StringProfile/string-profile-1-0:string-profile-pac/string-profile-capability/pattern]'
        sub-function:
          type: array
          x-key: function-name
          description: >
            'List of sub-Functions incl. their parameter settings
            from [configFile://core-model-1-4:control-construct/profile-collection/profile=uuid/function-profile-1-0:function-profile-pac/function-profile-capability/sub-function-list]'
          items:
            $ref: '#/components/schemas/function-schema'
