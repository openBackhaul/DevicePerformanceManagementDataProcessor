x-javascript-interface:
  p1CreateEs:
    summary: 'Creates an ElasticSearch instance/index, if it does not already exist.'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - es-client
            properties:
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings'
              es-client:
                type: object
                description: >
                  'MWDI ElasticSearch address'
    output:
      success:
        description: 'ES created'
      error:
        description: 'ES could not be created'
        content:
          application/json:
            schema:
              type: string
              # todo: enum statement with expected error messages to be added here
    processing:
      checkEsForExistence:
        description: 'Check if ES already exists'
        input:
          schema:
            type: object
            required:
              - index
            properties:
              index:
                type: string
                description: >
                  'ElasticSearch index of MWDI ES
                  from [/create-es/es-client/index-alias]'
              # todo: add more attributes that are needed for checking existence
        output:
          success:
            description: 'ES exists'
          error:
            description: 'ES does not exist'
            # todo: add more attributes or error messages indicating the root cause of failure
      createEs:
        description: 'Create ES if it does not exist'
        input:
          schema:
            type: object
            required:
              - index
            properties:
              index:
                type: string
                description: >
                  'ElasticSearch index of MWDI ES
                  from [/create-es/es-client/index-alias]'
              # todo: add more attributes that are needed for creating ES instance/index
        output:
          success:
            description: 'ES exists'
          error:
            description: 'ES does not exist'
            # todo: add more attributes or error messages indicating the root cause of failure

