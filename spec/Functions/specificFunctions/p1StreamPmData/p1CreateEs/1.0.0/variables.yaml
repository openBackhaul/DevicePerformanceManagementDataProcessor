create-es:
  type: object
  required:
    - parameters
    - es-client
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    es-client:
      type: object
      description: >
        'MWDI ElasticSearch address
        from {$input#/es-client}'
    es-url:
      type: string
      description: >
        'ElasticSearch URL
        from [/create-es/es-client/url]'
    es-index:
      type: string
      description: >
        'ElasticSearch index
        from [/create-es/es-client/index-alias]'
    es-api-key:
      type: string
      description: >
        'ElasticSearch API key
        from [/create-es/es-client/api-key]'
