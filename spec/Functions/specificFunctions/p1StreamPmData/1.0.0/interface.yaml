openapi: 3.0.0
info:
  title: p1StreamPmData
  version: 1.0.0

x-javascript-interface:
  p1StreamPmData:
    summary: 'Streams PM data'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
                    description: >
                      'Name of the Function whose parameters are to be loaded from the configFile
                      from [/stream-pm-data/function-name]'
        output:
          success:
            description: 'Parameters successfully loaded'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    parameters:
                      type: object
                    config-file:
                      type: object
          error:
            description: 'Parameters could not be loaded'
            content:
              application/json:
                schema:
                  type: string
      p1ResolveEsAddress:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - es-name
                  - parameters
                  - config-file
                properties:
                  es-name:
                    type: string
                    description: >
                      'ElasticSearch name
                      from [/stream-pm-data/es-address/name]'
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
        output:
          success:
            description: 'ES address successfully resolved'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    es-address:
                      type: object
          error:
            description: 'ES address could not be resolved'
            content:
              application/json:
                schema:
                  type: string
      # p1MaintainDs:
      p1UpdateMwdiReplica:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - last-replica-time
                  - mwdi-es-client
                  - mwdi-replica-es-client
                  - logging-es-client
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters/sub-function=p1UpdateMwdiReplica]'
                  last-replica-time:
                    type: string
                    description: >
                      'Timestamp of the last successful replication
                      from [/stream-pm-data/last-replica-time]'
                  mwdi-es-client:
                    type: object
                    description: >
                      'MWDI ElasticSearch address
                      from [/stream-pm-data/es-address=mwdiEsClient/address]'
                  mwdi-replica-es-client:
                    type: object
                    description: >
                      'MWDI Replica ElasticSearch address
                      from [/stream-pm-data/es-address=mwdiReplicaEsClient/address]'
                  logging-es-client:
                    type: object
                    description: >
                      'MWDI Replica ElasticSearch address
                      from [/stream-pm-data/es-address=loggingEsClient/address]'
        output:
          success:
            description: 'Updated CCs successfully replicated'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    updated-mount-names:
                      type: array
                      description: >
                        'List of MountNames of updated ControlConstructs'
                      items:
                        type: string
                    timestamp:
                      type: string
                      description: >
                        'Timestamp marking the end of the replication period'
          error:
            description: 'Updated CCs could not be replicated'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'connection to MWDI ES failed'
                    - 'connection to MWDI Replica ES failed'
                    - 'connection to Logging ES failed'
                    - 'data replication failed'
                    - 'unknown error occurred'
      p1ProcessDevice:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - parameters
                  - config-file
                properties:
                  mount-name:
                    type: string
                    description: >
                      'MountName
                      from [/stream-pm-data/to-be-processed-mount-names[n]]'
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/stream-pm-data/parameters]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/stream-pm-data/config-file]'
        output:
          success:
            description: 'PM data processed, sent and stored'
          error:
            description: 'Processing of PM data failed'

paths:
  /:
    description: 'no rest path provided by this module'
