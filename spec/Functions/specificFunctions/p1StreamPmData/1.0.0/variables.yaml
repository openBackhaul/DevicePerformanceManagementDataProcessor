stream-pm-data:
  type: object
  required:
    - function-name
    - last-replica-time
  properties:
    function-name:
      type: string
      enum:
        - p1StreamPmData
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$p1LoadParameters.output#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$p1LoadParameters.output#/config-file}'
    es-address:
      type: array
      x-key: name
      items:
        type: object
        required:
          - name
          - address
        properties:
          name:
            type: string
            description: 'ElasticSearch name'
            enum:
               - 'mwdiEsClient'
               - 'mwdiReplicaEsClient'
               - 'loggingEsClient'
               - 'dataStoreEsClient'
          address:
            type: object
            description: >
              'ElasticSearch address
              from {$p1ResolveEsAddress.output#/es-address}'
    to-be-processed-mount-names:
      type: array
      items:
        type: string
      description: >
        'Array of mount names to be processed
        from {$p1UpdateMwdiReplica.output#/updated-mount-names}'
    last-replica-time:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'Timestamp of the last successful replication
        initial value: {2010-11-20T14:00:00+01:00}
        later from {$p1UpdateMwdiReplica.output#/timestamp}'
