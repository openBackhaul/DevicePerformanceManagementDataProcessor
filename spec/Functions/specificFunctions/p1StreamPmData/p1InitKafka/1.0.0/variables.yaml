init-kafka:
  type: object
  required:
    - parameters
    - config-file
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'

    client:
      type: array
      x-key: kafka-client-name
      description: >
        'List of KafkaClient identifiers'
      items:
        type: object
        properties:
          kafka-client-name:
            type: string
            description: >
              'Name of a Kafka client for either transmitting or receiving
              from [/init-kafka/parameters/parameter=*/parameter-name] for [/parameters/parameter=*/purpose] == kafkaClient'
            example:
              - 'aptProvider'
          kafka-client-uuid:
            type: string
            description: >
              'Kafka client UUID
              from [/init-kafka/parameters/parameter={kafkaClientName}/value]'
          kafka-client-pac:
            type: object
            description: >
              'Kafka client LTP object
              from [/init-kafka/config-file/core-model-1-4:control-construct/logical-termination-point={kafka-client-uuid}/layer-protocol=0/kafka-client-interface-1-0:kafka-client-interface-pac]'
          http-client-uuid:
            type: string
            description: >
              'HTTP client UUID
              from [/init-kafka/client={kafkaClientName}/logical-termination-point={kafka-client-uuid}/server-ltp[0]]'
          http-client:
            type: object
            description: >
              'HTTP client LTP object
              from [/init-kafka/config-file/core-model-1-4:control-construct/logical-termination-point={http-client-uuid}]'
          tcp-client-uuid:
            type: string
            description: >
              'TCP client UUID
              from [/init-kafka/client={kafkaClientName}/logical-termination-point={http-client-uuid}/server-ltp[0]]'
          tcp-client-pac:
            type: object
            description: >
              'TCP client LTP object
              from [/init-kafka/config-file/core-model-1-4:control-construct/logical-termination-point={tcp-client-uuid}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac]'
          url:
            type: string
            description: > 
              'Kafka URL
              from [/init-kafka/client={kafkaClientName}/tcp-client-pac/tcp-client-interface-configuration/remote-protocol]://[/init-kafka/client={kafkaClientName}/tcp-client-pac/tcp-client-interface-configuration/remote-address/domain-name or /init-kafka/client={kafkaClientName}/tcp-client-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/init-kafka/client={kafkaClientName}/tcp-client-pac/tcp-client-interface-configuration/remote-port]'
          client-type:
            type: string
            description: >
              'kafkaClientType
              from [/init-kafka/client={kafkaClientName}/kafka-client-pac/kafka-client-interface-configuration/client-type]'
            enum:
              - 'producer'
              - 'consumer'
          group-id:
            type: string
            description: >
              'Identifier of group to be sent to kafka broker
              from [/init-kafka/client={kafkaClientName}/kafka-client-pac/kafka-client-interface-configuration/group-id]'
          client-id:
            type: string
            description: >
              'Identifier of client to be sent to kafka broker
              from [/init-kafka/client={kafkaClientName}/kafka-client-pac/kafka-client-interface-configuration/client-id]'
          brokers:
            type: array
            items:
              type: string
              description: >
                'URL composed from IP address or domain name and port
                from [/init-kafka/client={kafkaClientName}/url]'
