data-store:
  type: object
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - interface
          - lot
        properties:
          mount-name:
            type: string
            description: >
              'mountName indicated in the objectPath of the original notification and read
              from [/data-structure-for-processing/mount-name].'
          interface:
            type: array
            x-key: uuid
            items:
              type: object
              required:
                - uuid
                - layer-protocol-name
                - most-recent-period-end-time
                - most-recent-period-end-time-24
              properties:
                uuid:
                  type: string
                layer-protocol-name:
                  type: string
                  enum:
                    - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                    - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                most-recent-period-end-time:
                  type: string
                  description: 'The newest seen periodEndTime for this interface in 15min data'
                most-recent-period-end-time-24:
                  type: string
                  description: 'The newest seen periodEndTime for this interface in 24h data'
          lot:
            type: array
            items:
              type: object
              required:
                - timestamp
                - result-cc
              properties:
                timestamp:
                  type: string
                  description: 'Timestamp when the result-cc was stored.'
                  pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
                result-cc:
                  type: object
                  description: >
                    'The result control construct data created from the raw control construct data, following ONF structure.
                    from {$input#/result-cc}'
