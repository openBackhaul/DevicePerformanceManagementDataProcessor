openapi: 3.0.0
info:
  title: p1DiscardIrrelevantPmRecords
  version: 1.0.0

x-javascript-interface:
  p1DiscardIrrelevantPmRecords: 
    summary: 'This function provides the EthContainer names looked up from LtpAugment information'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - historical-performance-data-list
            properties:
              historical-performance-data-list:
                type: array
                description: 'The list of historical PM records, that shall be filtered'
              relevant-granularities:
                type: string
                enum:
                  - ':GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN$'
                  - ':GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS$'
                  - ':GRANULARITY_PERIOD_TYPE_PERIOD-(?:15-MIN|24-HOURS)$'
                description: >
                  'An (optional) regex pattern indicating which data granularities are to be kept.
                  If not provided as input, the following default pattern shall be applied (keep 15min and 24h data):
                  :GRANULARITY_PERIOD_TYPE_PERIOD-(?:15-MIN|24-HOURS)$'
              most-recent-period-end-time:
                type: string
                description: '15min PM records not newer than this timestamp are to be discarded. If not provided, any 15min record passes.'
              most-recent-period-end-time-24:
                type: string
                description: '24h PM records not newer than this timestamp are to be discarded. If not provided, any 24h record passes.'
    output:
      success:
        description: 'Filtered historicalPerformanceDataList provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - filtered-historical-performance-data-list
              properties:
                filtered-historical-performance-data-list:
                  type: array
                  description: >
                    'Filtered list of historical PM records
                    from [/discard-irrelevant-pm-records/filtered-historical-performance-data-list]'
      error:
        description: 'Filtered historicalPerformanceDataList could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList invalid'
                - 'General processing error'
    processing:
      description: 'No requests or calls to other Functions'


paths:
  /:
    description: 'no rest path provided by this module'