      applyFilteringForRelevantPmData:

      # Thorsten: mir ist nicht klar was diese Funktion genau macht, und ob sie das alles "darf"; 
      # bitte prüfe noch einmal, ob applyFilteringForRelevantPmData nicht einfach eine Schleife ist
      # Falls applyFilteringForRelevantPmData nur eine Schleife sein sollte, dann würde der Eintrag hier 
      # entfallen, und p1DiscardIrrelevantPmRecords nur auf /../../historical-performance-data-list wirken
      # Entgegen meiner Überzeugung habe ich die Änderung in Zeile 210-522 wieder rückgängig gemacht,
      # und das raw-cc hier belassen, damit die Änderungen nachvollziehbar bleiben.

        description: >
          'Filters each relevant layerProtocol (AirInterface or EthernetContainer) of the rawCC for new PM records with desired granularities.
          If no PM records remain for the respective layerProtocol, it is discarded from the rawCC entirely;
          if records remain, only the filtered PM records are kept in the historicalPerformanceDataList of the respective layerProtocol.
          Filtering is done by executing {p1DiscardIrrelevantPmRecords} for each relevant layerProtocol separately.'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - raw-cc
                properties:
                  raw-cc:
                    type: object
                    description: >
                      'The data structure to be filtered for relevant PM data
                      from [/load-raw-cc/raw-cc]'
        output:
          success:
            description: 'Raw ControlConstruct object provided'
            content:
              application/json:
                schema:
                  properties:
                    raw-cc:
                      description: >
                        'RawCC after filtering for relevant PM data'
                      type: object
                      required:
                        - equipment-augment-1-0:control-construct-pac
                        - logical-termination-point
                      properties:
                        equipment-augment-1-0:control-construct-pac:
                          description: >
                            'Relevant parts of equipment augment
                            from {$applyFieldsFilter.output#filtered-data-structure/equipment-augment-1-0:control-construct-pac}'
                          type: object
                          required:
                            - external-label
                            - device-model-name
                          properties:
                            external-label:
                              type: string
                              description: >
                                'mountName
                                from {$p1ProcessDevice.request.body#/mount-name}'
                            device-model-name:
                              type: string
                        logical-termination-point:
                          description: >
                            'Relevant parts of logicalTerminationPoint
                            from {$applyFieldsFilter.output#filtered-data-structure/logical-termination-point}'
                          type: array
                          x-key: uuid
                          items:
                            type: object
                            required:
                              - uuid
                              - ltp-augment-1-0:ltp-augment-pac
                              - layer-protocol
                            properties:
                              uuid:
                                type: string
                              client-ltp:
                                type: array
                                items:
                                  type: string
                              server-ltp:
                                type: array
                                items:
                                  type: string
                              ltp-augment-1-0:ltp-augment-pac:
                                type: object
                                properties:
                                  external-label:
                                    type: string
                                    description: 'Contains the linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                  original-ltp-name:
                                    type: string
                                    description: 'Contains the portName'
                              layer-protocol:
                                type: array
                                x-key: local-id
                                items:
                                  description: >
                                    'The layerProtocol instances
                                    from {$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/layer-protocol}
                                    where {$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/layer-protocol/layer-protocol-name} indicates AIR_LAYER or ETHERNET_CONTAINER.
                                    For each layer protocol instance further filtering is applied, by executing p1DiscardIrrelevantPmRecords.
                                    Only those layer protocols are added as an array item, for which length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) > 0.'
                                  oneOf:
                                    - description: 'air-interface'
                                      type: object
                                      required:
                                        - local-id
                                        - layer-protocol-name
                                        - air-interface-2-0:air-interface-pac
                                      properties:
                                        local-id:
                                          type: string
                                        layer-protocol-name:
                                          type: string
                                          enum:
                                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                        air-interface-2-0:air-interface-pac:
                                          type: object
                                          properties:
                                            air-interface-configuration:
                                              type: object
                                              properties:
                                                transmission-mode-min:
                                                  type: string
                                                transmission-mode-max:
                                                  type: string
                                                tx-power:
                                                  type: integer
                                                atpc-is-on:
                                                  type: boolean
                                                atpc-thresh-upper:
                                                  type: integer
                                                atpc-thresh-lower:
                                                  type: integer
                                            air-interface-capability:
                                              type: object
                                              properties:
                                                transmission-mode-list:
                                                  type: array
                                                  x-key: transmission-mode-name
                                                  items:
                                                    type: object
                                                    properties:
                                                      transmission-mode-name:
                                                        type: string
                                                      channel-bandwidth:
                                                        type: integer
                                                      modulation-scheme:
                                                        type: integer
                                                      modulation-scheme-name-at-lct:
                                                        type: string
                                                      code-rate:
                                                        type: integer
                                                      symbol-rate-reduction-factor:
                                                        type: integer
                                            air-interface-historical-performances:
                                              type: object
                                              properties:
                                                historical-performance-data-list:
                                                  type: array
                                                  description: >
                                                    'The filtered contents of historicalPerformanceDataList, which remain after executing processing step {discardIrrelevantPmRecords},
                                                    from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}.
                                                    Inputs for {discardIrrelevantPmRecords} are:
                                                    - {$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list} for the currently processed interface instance
                                                    - derive the relevant interface data from retrieveMostRecentPeriodEndTimesFromDs output as follows:
                                                      where {$retrieveMostRecentPeriodEndTimesFromDs.output=={$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/uuid}}
                                                      for this instance use mostRecentPeriodEndTime and mostRecentPeriodEndTime24

                                                    IF length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) == 0, THEN this interface instance (i.e. layerProtocol) is not added at all to {$output#raw-cc/logical-termination-point/layer-protocol}.'
                                                  x-key: period-end-time
                                                  items:
                                                    type: object
                                                    required:
                                                      - granularity-period
                                                      - period-end-time
                                                      - performance-data
                                                    properties:
                                                      granularity-period:
                                                        type: string
                                                        enum:
                                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        description: >
                                                          'The granularityPeriod
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/granularity-period} for this interface instance'
                                                      period-end-time:
                                                        type: string
                                                        description: >
                                                          'The periodEndTime
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/period-end-time} for this interface instance'
                                                      performance-data:
                                                        type: object
                                                        description: >
                                                          'The performanceData
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/performance} for this interface instance'
                                                        properties:
                                                          es:
                                                            type: integer
                                                          ses:
                                                            type: integer
                                                          cses:
                                                            type: integer
                                                          unavailability:
                                                            type: integer
                                                          tx-level-min:
                                                            type: integer
                                                          tx-level-max:
                                                            type: integer
                                                          tx-level-avg:
                                                            type: integer
                                                          rx-level-min:
                                                            type: integer
                                                          rx-level-max:
                                                            type: integer
                                                          rx-level-avg:
                                                            type: integer
                                                          time-xstates-list:
                                                            type: array
                                                            x-key: transmission-mode
                                                            items:
                                                              type: object
                                                              required:
                                                                - transmission-mode
                                                              properties:
                                                                transmission-mode:
                                                                  type: string
                                                                time:
                                                                  type: integer
                                                          snir-min:
                                                            type: integer
                                                          snir-max:
                                                            type: integer
                                                          snir-avg:
                                                            type: integer
                                                          xpd-min:
                                                            type: integer
                                                          xpd-max:
                                                            type: integer
                                                          xpd-avg:
                                                            type: integer
                                                          defect-blocks-sum:
                                                            type: integer
                                                          time-period:
                                                            type: integer
                                    - description: 'ethernet-container'
                                      type: object
                                      required:
                                        - local-id
                                        - layer-protocol-name
                                        - ethernet-container-2-0:ethernet-container-pac
                                      properties:
                                        local-id:
                                          type: string
                                        layer-protocol-name:
                                          type: string
                                          enum:
                                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                        ethernet-container-2-0:ethernet-container-pac:
                                          type: object
                                          properties:
                                            ethernet-container-historical-performances:
                                              type: object
                                              properties:
                                                historical-performance-data-list:
                                                  type: array
                                                  description: >
                                                    'The filtered contents of historicalPerformanceDataList, which remain after executing p1DiscardIrrelevantPmRecords,
                                                    from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}.
                                                    Inputs for p1DiscardIrrelevantPmRecords are:
                                                    - {$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list} for the currently processed interface instance
                                                    - derive the relevant interface data from retrieveMostRecentPeriodEndTimesFromDs output as follows:
                                                      where {$retrieveMostRecentPeriodEndTimesFromDs.output=={$applyFieldsFilter.output#filtered-data-structure/logical-termination-point/uuid}}
                                                      for this instance use mostRecentPeriodEndTime and mostRecentPeriodEndTim24

                                                    IF length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) == 0, THEN this interface instance (i.e. layerProtocol) is not added at all to {$output#raw-cc/logical-termination-point/layer-protocol}.'
                                                  x-key: period-end-time
                                                  items:
                                                    type: object
                                                    required:
                                                      - granularity-period
                                                      - period-end-time
                                                      - performance-data
                                                    properties:
                                                      granularity-period:
                                                        type: string
                                                        enum:
                                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        description: >
                                                          'The granularityPeriod
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/granularity-period} for this interface instance'
                                                      period-end-time:
                                                        type: string
                                                        description: >
                                                          'The periodEndTime
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/period-end-time} for this interface instance'
                                                      performance-data:
                                                        type: object
                                                        description: >
                                                          'The performanceData
                                                          from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/performance} for this interface instance'
                                                        properties:
                                                          max-bytes-per-second-output:
                                                            type: integer
                                                          total-bytes-input:
                                                            type: string
                                                          total-bytes-output:
                                                            type: string
                                                          time-period:
                                                            type: integer
                                                          total-frames-input:
                                                            type: string
                                                          total-frames-output:
                                                            type: string
                                                          forwarded-frames-input:
                                                            type: string
                                                          forwarded-frames-output:
                                                            type: string
                                                          unicast-frames-input:
                                                            type: string
                                                          unicast-frames-output:
                                                            type: string
                                                          multicast-frames-input:
                                                            type: integer
                                                          multicast-frames-output:
                                                            type: integer
                                                          broadcast-frames-input:
                                                            type: integer
                                                          broadcast-frames-output:
                                                            type: integer
                                                          fragmented-frames-input:
                                                            type: integer
                                                          errored-frames-input:
                                                            type: integer
                                                          errored-frames-output:
                                                            type: integer
                                                          dropped-frames-input:
                                                            type: integer
                                                          dropped-frames-output:
                                                            type: integer
                                                          oversized-frames-ingress:
                                                            type: string
                                                          undersized-frames-ingress:
                                                            type: string
                                                          jabber-frames-ingress:
                                                            type: string
                                                          unknown-protocol-frames-input:
                                                            type: string
          error:
            description: 'Raw ControlConstruct object could not be created.'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Input data structure incomplete or invalid'
                    - 'Error during filtering of raw data'
                    - 'General processing error'
        processing:
