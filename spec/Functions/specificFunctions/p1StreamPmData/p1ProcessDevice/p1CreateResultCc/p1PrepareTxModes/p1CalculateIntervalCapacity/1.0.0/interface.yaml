openapi: 3.0.0
info:
  title: p1CalculateIntervalCapacity
  version: 1.0.0

x-javascript-interface:
  p1CalculateIntervalCapacity:
    summary: 'Calculates the AirInterface capacity weighted by duration of operation of the respective transmission mode in kbps'
    input:
      content:
        application/json:
          schema:
            type: object
            required:
              - time-xstates-list
              - transmission-mode-list
            properties:
              time-xstates-list:
                type: array
                description: >
                  'timeXStatesList'
              transmission-mode-list:
                type: array
                description: >
                  'transmissionModeList'
    output:
      success:
        description: 'Interval capacity provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - interval-capacity
              properties:
                interval-capacity:
                  type: integer
                  description: >
                    'intervalCapacity
                    from '
      error:
        description: 'Interval capacity could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'performance data incomplete or missing'
                - 'transmissionModeList incomplete or missing'
                - 'General processing error'

paths:
  /:
    description: 'no rest path provided by this module'
