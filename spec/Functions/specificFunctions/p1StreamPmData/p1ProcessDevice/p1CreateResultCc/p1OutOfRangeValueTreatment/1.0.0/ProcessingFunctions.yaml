openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.0.0

paths:
########################################################################################################################
#   Service Layer - Individual Part
########################################################################################################################
  /p1/set-out-of-range-level-values-to-default:
    post:
      operationId: p1SetOutOfLevelValuesToDefault
      summary: >
        'Replaces out-of-range level attribute values. Either
        - input is read directly from memory (requestBody with dataHandle), and written back directly to memory
        - or requestBody contains the relevant input and response returns the changed output'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - description: 'dataHandle for direct memory read/write'
                  required:
                    - data-handle
                  properties:
                    data-handle:
                      type: string
                      description: >
                        'This dataHandle points directly to the [/process-device/output] from where the required data from output.air-interface-list is read.'
                - description: 'required data for external usage (no direct read/write)'
                  properties:
                    output:
                      description: >
                        'If the function shall not run on the data in the memory directly, the required data has to be provided as input.
                        Note that input data follows the schema of [/process-device/output], but only relevant attributes are listed.' 
                      type: object
                      properties:
                        air-interface-list:
                          type: array
                          items:
                            properties:
                              air-interface-performance-measurements-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    transmit-level-minimum:
                                      type: integer
                                    transmit-level-maximum:
                                      type: integer
                                    transmit-level-average:
                                      type: integer
                                    receive-level-minimum:
                                      type: integer
                                    receive-level-maximum:
                                      type: integer
                                    receive-level-average:
                                      type: integer
      responses:
        '200':
          description: 'Dataset with updated values provided'
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: object
                    properties:
                      air-interface-list:
                        description: >
                          'Only relevant attributes from [/data-for-processing/output]-schema listed
                          from {$SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData.returnDataNonHandle.response.body#air-interface-list}'
                        type: array
                        items:
                          properties:
                            air-interface-performance-measurements-list:
                              type: array
                              items:
                                type: object
                                properties:
                                  transmit-level-minimum:
                                    type: integer
                                  transmit-level-maximum:
                                    type: integer
                                  transmit-level-average:
                                    type: integer
                                  receive-level-minimum:
                                    type: integer
                                  receive-level-maximum:
                                    type: integer
                                  receive-level-average:
                                    type: integer
        '204':
          description: 'Out-of-range level values set to defaults in [/process-device/output] (dataHandle option)'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput:
          getData: #[dpmdpIpAddress][dpmdpPort][dataHandle.[/process-device/output]]
            description: >
              'Directly read the data from DPMDP memory for the output object identified by id
              from {$request.body#data-handle}'
            get:
              responses:
                '200':
                  description: 'DataStructureForProcessing/Output read'
                  content:
                    application/json:
                      schema:
                        description: 'Only relevant attributes listed'
                        type: object
                        properties:
                          output:
                            type: object
                            properties:
                              air-interface-list:
                                type: array
                                items:
                                  properties:
                                    air-interface-identifiers:
                                      type: object
                                      properties:
                                        mount-name:
                                          type: string
                                        logical-termination-point-id:
                                          type: string
                                    air-interface-performance-measurements-list:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          period-end-time:
                                            type: string
                                          transmit-level-minimum:
                                            type: integer
                                          transmit-level-maximum:
                                            type: integer
                                          transmit-level-average:
                                            type: integer
                                          receive-level-minimum:
                                            type: integer
                                          receive-level-maximum:
                                            type: integer
                                          receive-level-average:
                                            type: integer
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
        SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData:
          returnDataNonHandle: #[dpmdpIpAddress][dpmdpPort]
            description: >
              'For the non-dataHandle option the changed data is returned rather than being written to the memory'
            post:
              responses:
                '200':
                  description: 'Updated data returned (non-dataHandle option)'
                  content:
                    application/json:
                      schema:
                        description: 'Only relevant attributes from [/data-for-processing/output]-schema listed'
                        type: object
                        properties:
                          output:
                            type: object
                            properties:
                              air-interface-list:
                                type: array
                                items:
                                  properties:
                                    air-interface-identifiers:
                                      type: object
                                      properties:
                                        mount-name:
                                          type: string
                                        logical-termination-point-id:
                                          type: string
                                    air-interface-performance-measurements-list:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          period-end-time:
                                            type: string
                                          transmit-level-minimum:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-minimum},
                                              IF NOT (transmit-level-minimum within range [-30, 40]) THEN replace with default = -1'
                                          transmit-level-maximum:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-maximum},
                                              IF NOT (transmit-level-maximum within range [-30, 40]) THEN replace with default = -1'
                                          transmit-level-average:
                                            type: integer
                                            description: >
                                              'Originally delivered TX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/transmit-level-average},
                                              IF NOT (transmit-level-average within range [-30, 40]) THEN replace with default = -1'
                                          receive-level-minimum:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-minimum},
                                              IF NOT (receive-level-minimum within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                                          receive-level-maximum:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-maximum},
                                              IF NOT (receive-level-maximum within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                                          receive-level-average:
                                            type: integer
                                            description: >
                                              'Originally delivered RX value
                                              from {$SettingOutOfRangeLevelValuesToDefaultCausesReadingFromDsfpOutput.getData.response.body#output/air-interface-list/air-interface-performance-measurements-list/receive-level-average},
                                              IF NOT (receive-level-average within range (-129, -99.9) AND (-99.9, -10)) THEN replace with default = -1'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
          updateDataInMemory: #[dpmdpIpAddress][dpmdpPort][dataHandle.[/process-device/output]]
            description: >
              'This is carried out for the dataHandle option. Changes are written directly to the attributes.
              The attribute values are to be changed as described in {$SettingOutOfRangeLevelValuesToDefaultCausesWritingToDsfpOutputOrReturningChangedData.response.body}.
              The changes are to be written directly into the [/process-device/output] object in memory identified by {$request.body#data-handle}'
            patch:
              responses:
                '204':
                  description: 'Updated level values written directly to [/process-device/output]'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'


########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator

      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOutOfDomainServiceRequests:
      description: 'Response in case of errored service requests from out of MW SDN domain'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    '429':
      description: 'Response in case too many requests need to be executed in parallel or too many requests have been received within a time period. The maximum number of parallel requests is defined in an IntegerProfile with the service name as a prefix and MaxNumberOfParallelRequests as a suffix. Some time period to elapse for throttling incomming requests is defined in an IntegerProfile with the service name as a prefix and ThrottlingPeriod as a suffix'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 429
                maximum: 429
                format: int32
              message:
                type: string
                enum:
                  - 'Too many requests'
    '460':
      description: 'Response in case the mountName provided in the request is not found in the list of connected devices'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 460
                maximum: 460
                format: int32
              message:
                type: string
                enum:
                  - 'Not connected. Requested device is currently not in connected state at the controller'
    '470':
      description: 'Response in case the resource specified in the request does not exist within the connected device'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 470
                maximum: 470
                format: int32
              message:
                type: string
                enum:
                  - 'Resource not existing. Device informs about addressed resource unknown'
    '502':
      description: 'Response in case the application that is expected to provide a consumed service is not responding'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 502
                maximum: 502
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway'
    '530':
      description: 'Response in case the referenced resource exists (e.g. device connected and resource exists in internal datatree), but response data is either not available, lost during transmission, invalid, incomplete or corrupted'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 530
                maximum: 530
                format: int32
              message:
                type: string
                enum:
                  - 'Data invalid. Response data not available, incomplete or corrupted'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    genericRepresentation:
      type: object
      required:
        - response-value-list
        - consequent-action-list
      properties:
        response-value-list:
          type: array
          items:
            type: object
            required:
              - field-name
              - value
              - datatype
            properties:
              field-name:
                type: string
                description: >
                  'Field name
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/field-name]'
              value:
                type: string
                description: >
                  'Field value
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-configuration/value]'
              datatype:
                type: string
                description: >
                  'Field datatype
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/datatype]'
        consequent-action-list:
          type: array
          items:
            type: object
            required:
              - label
              - request
              - display-in-new-browser-window
            properties:
              label:
                type: string
                description: >
                  'Label that shall be presented on the button
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/label]'
              request:
                type: string
                description: >
                  'Request that shall be called, when button gets pressed
                  from
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-protocol}]
                  ://
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/ipv-4-address}
                  or
                  {/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/domain-name}]
                  :
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-port}]
                  [{/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-configuration/consequent-operation-reference}]'
              input-value-list:
                type: array
                items:
                  type: object
                  required:
                    - field-name
                  properties:
                    field-name:
                      type: string
                      description: >
                        'Name of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/name]'
                    unit:
                      type: string
                      description: >
                        'Unit of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/unit]'
              display-in-new-browser-window:
                type: boolean
                description: >
                  'True in case Request shall be represented in a new browser window
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/display-in-new-browser-window]'
    logicalTerminationPoint:
      type: object
      required:
        - uuid
        - ltp-direction
        - client-ltp
        - server-ltp
        - layer-protocol
      properties:
        uuid:
          type: string
        ltp-direction:
          type: string
        client-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        server-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        layer-protocol:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - description: 'operation server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-server-interface-1-0:operation-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-server-interface-1-0:operation-server-interface-pac:
                    type: object
                    required:
                      - operation-server-interface-capability
                      - operation-server-interface-configuration
                    properties:
                      operation-server-interface-capability:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-server-interface-configuration:
                        type: object
                        required:
                          - life-cycle-state
                        properties:
                          life-cycle-state:
                            type: string
              - description: 'http server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-server-interface-1-0:http-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-server-interface-1-0:http-server-interface-pac:
                    type: object
                    required:
                      - http-server-interface-capability
                    properties:
                      http-server-interface-capability:
                        type: object
                        required:
                          - application-name
                          - release-number
                          - data-update-period
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
                          data-update-period:
                            type: string
              - description: 'tcp server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-server-interface-1-0:tcp-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-server-interface-1-0:tcp-server-interface-pac:
                    type: object
                    required:
                      - tcp-server-interface-configuration
                    properties:
                      tcp-server-interface-configuration:
                        type: object
                        required:
                          - description
                          - local-protocol
                          - local-address
                          - local-port
                        properties:
                          description:
                            type: string
                          local-protocol:
                            type: string
                          local-address:
                            type: object
                            properties:
                              ipv-4-address:
                                type: string
                              domain-name:
                                type: string
                          local-port:
                            type: integer
              - description: 'operation client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-client-interface-1-0:operation-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-client-interface-1-0:operation-client-interface-pac:
                    type: object
                    required:
                      - operation-client-interface-configuration
                      - operation-client-interface-status
                    properties:
                      operation-client-interface-configuration:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'elasticsearch client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac:
                    type: object
                    required:
                      - elasticsearch-client-interface-configuration
                      - elasticsearch-client-interface-status
                    properties:
                      elasticsearch-client-interface-configuration:
                        type: object
                        required:
                          - index-alias
                        properties:
                          index-alias:
                            type: string
                      elasticsearch-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'http client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-client-interface-1-0:http-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-client-interface-1-0:http-client-interface-pac:
                    type: object
                    required:
                      - http-client-interface-configuration
                    properties:
                      http-client-interface-configuration:
                        type: object
                        required:
                          - application-name
                          - release-number
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
              - description: 'tcp client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-client-interface-1-0:tcp-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-client-interface-1-0:tcp-client-interface-pac:
                    type: object
                    required:
                      - tcp-client-interface-configuration
                    properties:
                      tcp-client-interface-configuration:
                        type: object
                        required:
