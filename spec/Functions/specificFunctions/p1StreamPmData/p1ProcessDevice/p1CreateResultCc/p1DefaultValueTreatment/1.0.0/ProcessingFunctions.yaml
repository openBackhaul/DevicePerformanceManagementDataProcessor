                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                    period-end-time:
                                      type: string
                                    max-bytes-per-second-output:
                                      type: string
                                    total-bytes-input:
                                      type: string
                                    total-bytes-output:
                                      type: string
                                    total-frames-input:
                                      type: string
                                    total-frames-output:
                                      type: string
                                    forwarded-frames-input:
