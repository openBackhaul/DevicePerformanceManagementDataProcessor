openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.0.0

paths:
########################################################################################################################
#   Service Layer - Individual Part
########################################################################################################################
  /p1/replace-onf-default-values:
    # The replacement values have to be agreed upon with customers, for now non-KPI -1 default values will be replaced by null/empty string
    post:
      operationId: p1ReplaceOnfDefaultValues
      summary: >
        'Replaces ONF default values in DataStructureForProcessing output. Either
        - input is read directly from memory (requestBody with dataHandle), and changes are written back directly to memory
        - or requestBody contains the relevant input and response contains the output with changed default values'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - description: 'dataHandle for direct memory read/write'
                  required:
                    - data-handle
                  properties:
                    data-handle:
                      type: string
                      description: >
                        'This dataHandle points directly to the [/process-device/output] from where the required data is read.'
                - description: 'required data for external usage (no direct read/write)'
                  properties:
                    output:
                      description: >
                        'If the function shall not run on the data in the memory directly, the required data has to be provided as input.'
                      type: object
                      properties:
                        air-interface-list:
                          type: array
                          items:
                            type: object
                            properties:
                              air-interface-identifiers:
                                type: object
                                properties:
                                  mount-name:
                                    type: string
                                  link-endpoint-id:
                                    type: string
                                  link-id:
                                    type: string
                                  logical-termination-point-id:
                                    type: string
                                  link-aggregation-identifiers:
                                    type: array
                                    items:
                                      oneOf:
                                        - description: 'AirInterfaces'
                                          type: object
                                          required:
                                            - link-id
                                          properties:
                                            link-id:
                                              type: string
                                        - description: 'WireInterface'
                                          type: object
                                          required:
                                            - interface-name
                                          properties:
                                            interface-name:
                                              type: string
                              air-interface-configuration:
                                type: object
                                properties:
                                  configured-atpc-is-on:
                                    type: boolean
                                  configured-atpc-threshold-upper:
                                    type: integer
                                    nullable: true
                                  configured-atpc-threshold-lower:
                                    type: integer
                                    nullable: true
                                  configured-tx-power:
                                    type: integer
                                    nullable: true
                                  configured-modulation-minimum:
                                    type: object
                                    properties:
                                      number-of-states:
                                        type: integer
                                        nullable: true
                                      name-at-lct:
                                        type: string
                                      configured-capacity-minimum:
                                        type: integer
                                        nullable: true
                                  configured-modulation-maximum:
                                    type: object
                                    properties:
                                      number-of-states:
                                        type: integer
                                        nullable: true
                                      name-at-lct:
                                        type: string
                                      configured-capacity-maximum:
                                        type: integer
                                        nullable: true
                              air-interface-performance-measurements-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
