                                      type: string
                                    transmit-level-minimum:
                                      type: integer
                                      nullable: true
                                    transmit-level-maximum:
                                      type: integer
                                      nullable: true
                                    transmit-level-average:
                                      type: integer
                                      nullable: true
                                    receive-level-minimum:
                                      type: integer
                                      nullable: true
                                    receive-level-maximum:
                                      type: integer
                                      nullable: true
                                    receive-level-average:
                                      type: integer
                                      nullable: true
                                    signal-to-noise-ratio-minimum:
                                      type: integer
                                      nullable: true
                                    signal-to-noise-ratio-maximum:
                                      type: integer
                                      nullable: true
                                    signal-to-noise-ratio-average:
                                      type: integer
                                      nullable: true
                                    cross-polarization-discrimination-minimum:
                                      type: integer
                                      nullable: true
                                    cross-polarization-discrimination-maximum:
                                      type: integer
                                      nullable: true
                                    cross-polarization-discrimination-average:
                                      type: integer
                                      nullable: true
                                    operated-transmission-modes-list: 
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          transmission-mode-name:
                                            type: string
                                          modulation-scheme-name-at-lct:
                                            type: string
                                          time:
                                            type: integer
                                            nullable: true
                                          capacity:
                                            type: integer
                                            nullable: true
                                    interval-capacity:
                                      type: integer
                                      nullable: true
                                    errorred-seconds:
                                      type: integer
                                      nullable: true
                                    severely-errorred-seconds:
                                      type: integer
                                      nullable: true
                                    consecutive-severely-errorred-seconds:
                                      type: integer
                                      nullable: true
                                    total-unavailability:
                                      type: integer
                                      nullable: true
                                    defect-blocks:
                                      type: integer
                                      nullable: true
                                    time-period:
                                      type: integer
                                      nullable: true
                              transmission-mode-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    transmission-mode-name:
                                      type: string
                                    number-of-states:
                                      type: integer
                                      nullable: true
                                    modulation-scheme-name-at-lct:
                                      type: string
                                    channel-bandwidth:
                                      type: integer
                                      nullable: true
                                    code-rate:
                                      type: integer
                                      nullable: true
                                    symbol-rate-reduction-factor:
                                      type: integer
                                      nullable: true
                        ethernet-container-list:
                          type: array
                          items:
                            type: object
                            properties:
                              ethernet-container-identifiers:
                                type: object
                                properties:
                                  mount-name:
                                    type: string
                                  interface-name:
                                    type: string
                                  logical-termination-point-id:
