openapi: 3.0.0
info:
  title: p1CalculateAiCapacity
  version: 1.0.0

x-javascript-interface:
  p1CalculateAiCapacity:
    summary: 'Calculates the AirInterface capacity according to ONF TR-532 v2.0'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - channel-bandwidth
              - symbol-rate-reduction-factor
              - number-of-states-in-modulation
              - code-rate
            properties:
              channel-bandwidth:
                type: integer
                description: >
                  'Channel bandwidth in kHz'
              symbol-rate-reduction-factor:
                type: integer
                description: >
                  'Symbol rate reduction factor'
              number-of-states-in-modulation:
                type: integer
                description: >
                  'Number of states in modulation'
              code-rate:
                type: integer
                description: >
                  'Code rate in percent'
    output:
      success:
        description: 'AirInterface capacity calculated'
        content:
          application/json:
            schema:
              type: object
              required:
                - air-interface-capacity
              properties:
                air-interface-capacity:
                  type: integer
                  description: >
                    'airInterfaceCapacity
                    from [/calculate-ai-capacity/air-interface-capacity]'
      error:
        description: 'AirInterface capacity could not be calculated'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Input parameters missing'
                - 'Input parameters invalid'
                - 'Calculation error'
                - 'General processing error'

paths:
  /:
    description: 'no rest path provided by this module'
