openapi: 3.0.0
info:
  title: p1TransmittingKafka
  version: 1.0.0

x-javascript-interface:
  p1TransmittingKafka:
    summary: 'Transmits payloads to kafka'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - output-format
              - parameters
              - config-file
            properties:
              output-format:
                type: reference
                description: >
                  'OutputFormat object to be sent via Kafka'
              parameters:
                type: object
                description: >
                  'Parameters object for p1TransmittingKafka'
              config-file:
                type: object
                description: >
                  'configFile content'
    output:
      success:
        description: 'OutputFormats sent via Kafka'
      error:
        description: 'OutputFormats could not be sent via Kafka'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Connection to kafka failed'
                - 'Unknown topic or partition'
    processing:
      initialize:
        description: >
          'Establish connection to kafka as producer once application is started. 
          Once session is created, all messages transmit using the same session.'
        input:
          required: true
          content:  
            application/json:
              schema:
                type: object
                required: 
                  - client-id
                  - broker-list
                properties:
                  client-id:
                    type: string
                    description: >
                      'Identifier of the producer application.
                      from [/transmit-kafka/input/config-file/] where string-name=kafkaProducerClientFor*'
                  broker-list:
                    type: array
                    description: >
                     'List of [address:port] endpoints where kafka is deployed.
                     from [/transmit-kafka/input/config-file/] where string-name=kafkaTcpClient'
        output:
          success:
            description: 'Kafka Connection successfully established'
          error:
            description: 'Connection could not be established'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Connection to kafka failed'
                    - 'Connection to kafka request timeout'
      payloadTransmit:
        description: 'Send each payload to kafka - request-based invokation'
        input:
          required: true  
          content:
            application/json:
              schema:
                type: object
                required: 
                  - topic-name
                  - message
                properties:
                  topic-name:
                    type: string
                    description: >
                      'Name of target kafka topic to which the payload shall be sent
                      from [/transmitting-kafka/output-format/format-name] matched against [/transmitting-kafka/input/config-file/kafka-client/topic-name] through string-name=kafkaProducerClientFor*'
                  message:
                    type: object
                    description: >
                      'Payload to be transmitted to kafka
                      from [/transmitting-kafka/output-format/content]'
        output:
          success:
            description: 'Payload transmition successfull'
          error:
            description: 'Payload transmission failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Unknown topic or partition'
                    - 'Connection to kafka failed'
paths:
  /:
    description: 'no rest path provided by this module'
