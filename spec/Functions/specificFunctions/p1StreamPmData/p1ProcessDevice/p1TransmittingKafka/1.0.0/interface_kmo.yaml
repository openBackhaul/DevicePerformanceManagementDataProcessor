openapi: 3.0.0
info:
  title: p1TransmittingKafka
  version: 1.0.0

x-javascript-interface:
  p1TransmittingKafka:
    summary: 'Transmits payloads to Kafka'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - _output-format
              - parameters
              #TODO: use function to get address info like with ElasticSearch instead?
              - config-file
            properties:
              _output-format:
                type: reference
                description: >
                  'Reference to the content of an OutputFormat in DataStructureForProcessing'
              parameters:
                type: object
                description: >
                  'Parameters object for p1TransmittingKafka'
              config-file:
                type: object
                description: >
                  'configFile content'
    output:
      success:
        description: 'OutputFormats sent via Kafka'
      error:
        description: 'OutputFormats could not be sent via Kafka'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Connection to Kafka failed'
                - 'Unknown topic or partition'
    processing:
      #TODO: function call to p1KafkaProducer missing
      #in diagram one call is to p1KafkaProducer to inialize, a second call is to transmit payload
      #p1KafkaProducer spec missing in AppPattern
      #maybe we would need two separate functions here?
      # - p1InitializeKafkaProducer, which checks if the connection is already there, and if not opens it
      # - p1SentPayloadToKafka, which is for the 2nd step
      # maybe put the first step to the front of high-level-seq diagram
      initialize:
        description: >
          'Establish connection to Kafka as producer once application is started. 
          Once session is created, all messages transmit using the same session.'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: 
                  - client-id
                  - broker-list
                properties:
                  client-id:
                    type: string
                    description: 'Identifier of the producer application'
                  broker-list:
                    type: array
                    description: 'List of [address:port] endpoints where Kafka is deployed'
        output:
          success:
            description: 'Kafka Connection successfully established'
          error:
            description: 'Connection could not be established'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Connection to Kafka failed'
                    - 'Connection to Kafka request timeout'
      payloadTransmit:
        description: 'Send each payload to Kafka - request-based invokation'
        input:
          required: true  
          content:
            application/json:
              schema:
                type: object
                required: 
                  - topic-name
                  - message
                properties:
                  topic-name:
                    type: string
                    description:  'Name of target Kafka topic to which the payload shall be settings'
                  message:
                    type: object
                    description: 'Payload to be transmitted to Kafka'
        output:
          success:
            description: 'Payload transmition successfull'
          error:
            description: 'Payload transmission failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Unknown topic or partition'
                    - 'Connection to Kafka failed'
paths:
  /:
    description: 'no rest path provided by this module'
