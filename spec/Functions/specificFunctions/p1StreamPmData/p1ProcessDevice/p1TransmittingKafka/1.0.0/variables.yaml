transmitting-kafka:
  type: object
  required:
    - parameters
    - config-file
    - kafka-client-name
    - message-object
  properties:
    parameters:
      type: object
      description: >
        'Parameters object for p1TransmittingKafka
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    message-object:
      type: reference
      description: >
        'Object to be sent via Kafka
        from {$input#/message-object}'

    kafka-client-uuid:
      type: string
      description: >
        'Kafka client UUID
        find [/transmitting-kafka/parameters/parameter=*/parameter-name]==[transmitting-kafka/kafka-client-name]
        from [/transmitting-kafka/parameters/parameter=*/value]'
    kafka-client:
      type: object
      description: >
        'Kafka client LTP object
        from [/transmitting-kafka/config-file/core-model-1-4:control-construct/logical-termination-point=kafka-client-uuid]'
    topic-name:
      type: string
      description: >
        'Name of the Kafka topic to which the OutputFormat will be transmitted
        from [/transmitting-kafka/kafka-client/logical-termination-point/layer-protocol=0/kafka-client-interface-1-0:kafka-client-interface-pac/kafka-client-interface-configuration/topic-name]'
