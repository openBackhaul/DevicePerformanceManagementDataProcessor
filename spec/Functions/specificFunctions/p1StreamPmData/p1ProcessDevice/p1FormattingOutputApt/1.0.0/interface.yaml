openapi: 3.0.0
info:
  title: p1FormattingOutputApt
  version: 1.0.0

x-javascript-interface:
  p1FormattingOutputApt: 
    summary: 'Transforms data of resultCc into aptOutputFormat'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - result-cc
            properties:
              result-cc:
                type: object
                description: >
                  'resultCc'
    output:
      success:
        description: 'aptOutputFormat created'
        content:
          application/json:
            schema:
              type: object
              required:
                - apt-output-format
              properties:
                apt-output-format:
                  type: object
                  description: >
                    'aptOutputFormat
                    from [/formatting-output-apt/apt-output-format]'
      error:
        description: 'aptOutputFormat could not be created'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'resultCc not provided'
                - 'resultCc incomplete'
                - 'resultCc invalid'
                - 'aptOutputFormat could not be provided'
                - 'General processing error'
      processing:
        createOutputFromResultCc:
          description: >
            'Creates the output object as a variable of the p1FormattingOutputApt function and fills it from resultCc data'
        input:
          content:
            application/json:
              schema:
                properties:
                  result-cc:
                    type: object
                    description: >
                      'resultCc
                      from {$p1FormattingOutputApt.input#/result-cc}'
        output:
          success:
            description: 'Output object provided'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    output:
                      type: object
                      description: >
                        'Output'
                      properties:
                        air-interface-list:
                          description: >
                            'List of microwave air interfaces found in the resultCc.
                            Traverse {$input#/result-cc/logical-termination-point/layer-protocol} and create an array element for each layer-protocol
                            where {$input#/result-cc/logical-termination-point/layer-protocol/layer-protocol-name} indicates AIR_LAYER'
                          type: array
                          items:
                            type: object
                            description: >
                              'The attributes for the current array element are to be filled from the LTP and its subclasses, which the currently traversed layer-protocol instance belongs to'
                            properties:
                              air-interface-identifiers:
                                type: object
                                properties:
                                  mount-name:
                                    type: string
                                    description: >
                                      'Identifier of the device at the controller and in the Telefónica planning tools
                                      from {$input#/result-cc/equipment-augment-1-0:control-construct-pac/external-label}'
                                  link-endpoint-id:
                                    type: string
                                    description: >
                                      'Identifier of the microwave link endpoint as used in the Telefonica planning tools
                                      from {$input#/result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label}
                                  link-id:
                                    type: string
                                    description: >
                                      'Identifier of the microwave link as used in the Telefonica planning tools. To be obtained by extracting the substring constituted by the 9 first characters
                                      from {$input#/result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/link-id}
                                  logical-termination-point-id:
                                    type: string
                                    description: >
                                      'Identifier of the microwave link endpoint within the MW SDN domain
                                      from {$input#/result-cc/logical-termination-point/uuid}'
                                  link-aggregation-identifiers:
                                    type: array
                                    description: >
                                      'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames'
                                    items:
                                      oneOf:
                                        - description: 'AirInterfaces'
                                          type: object
                                          required:
                                            - uuid
                                            - link-id
                                          properties:
                                            uuid:
                                              type: string
                                              description: >
                                                'Identifier of the air interface within the MW SDN domain
                                                from {$input#/result-cc/logical-termination-point/parallel-ltp}'
                                            link-id:
                                              type: string
                                              description: >
                                                'Identifier of the microwave link as used in the Telefonica planing tools
                                                from {$p1FormattingOutputApt.output}'
                                        - description: 'WireInterface'
                                          type: object
                                          required:
                                            - uuid
                                            - interface-name
                                          properties:
                                            uuid:
                                              type: string
                                              description: >
                                                'Identifier of the wire interface within the MW SDN domain
                                                from {$input#/result-cc/logical-termination-point/parallel-ltp}'
                                            interface-name:
                                              type: string
                                              description: >
                                                'Interface name as it is represented at the own management interface of the vendor
                                                from {$p1FormattingOutputApt.output}'
                              air-interface-configuration:
                                type: object
                                properties:
                                  configured-atpc-is-on:
                                    type: boolean
                                    description: >
                                      'This configuration value is true, if automatic transmit power control (ATPC) is configured to be switched on
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-is-on}'
                                  configured-atpc-threshold-upper:
                                    type: integer
                                    description: >
                                      'Configured upper automatic transmit power control (ATPC) threshold in dBm
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-thresh-upper}'
                                  configured-atpc-threshold-lower:
                                    type: integer
                                    description: >
                                      'Configured lower automatic transmit power control (ATPC) threshold in dBm
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-thresh-lower}'
                                  configured-tx-power:
                                    type: integer
                                    description: >
                                      'Configured transmit power that will be operated in maximum in dBm
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/tx-power}'
                                  configured-modulation-minimum:
                                    type: object
                                    description: >
                                      'Configured minimum modulation scheme
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}'
                                    properties:
                                      number-of-states:
                                        type: integer
                                        description: >
                                          'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                                          transmissionModeMin = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                      name-at-lct:
                                        type: string
                                        description: >
                                          'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                          transmissionModeMin = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                      configured-capacity-minimum:
                                        type: integer
                                        description: >
                                          'AirInterface capacity for the configured minimum modulation scheme calculated with ONF formula
                                          transmissionModeMin = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                  configured-modulation-maximum:
                                    type: object
                                    description: >
                                      'Configured maximum modulation scheme
                                      from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}'
                                    properties:
                                      number-of-states:
                                        type: integer
                                        description: >
                                          'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                                          transmissionModeMax = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                                      name-at-lct:
                                        type: string
                                        description: >
                                          'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                          transmissionModeMax = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                                      configured-capacity-maximum:
                                        type: integer
                                        description: >
                                          'AirInterface capacity for the configured maximum modulation scheme calculated with ONF formula
                                          transmissionModeMax = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                          from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                          where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                              air-interface-performance-measurements-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      description: >
                                        'Time period between reset of the underlying counter
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/granularity-period}'
                                    period-end-time:
                                      type: string
                                      description: >
                                        'Time when the counter values have been recorded and the counter reset
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/period-end-time}'
                                    transmit-level-minimum:
                                      type: integer
                                      description: >
                                        'Minimum transmit power in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-min}'
                                    transmit-level-maximum:
                                      type: integer
                                      description: >
                                        'Maximum transmit power in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-max}'
                                    transmit-level-average:
                                      type: integer
                                      description: >
                                        'Averaged transmit power in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-avg}'
                                    receive-level-minimum:
                                      type: integer
                                      description: >
                                        'Minimum receive level in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-min}'
                                    receive-level-maximum:
                                      type: integer
                                      description: >
                                        'Maximum receive level in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-max}'
                                    receive-level-average:
                                      type: integer
                                      description: >
                                        'Averaged receive level in dBm
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-avg}'
                                    signal-to-noise-ratio-minimum:
                                      type: integer
                                      description: >
                                        'Minimum signal to noise + interference ratio (SNIR)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-min}'
                                    signal-to-noise-ratio-maximum:
                                      type: integer
                                      description: >
                                        'Maximum signal to noise + interference ratio (SNIR)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-max}'
                                    signal-to-noise-ratio-average:
                                      type: integer
                                      description: >
                                        'Averaged signal to noise + interference ratio (SNIR)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-avg}'
                                    cross-polarization-discrimination-minimum:
                                      type: integer
                                      description: >
                                        'Minimum cross polarization discrimination (XPD)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-min}'
                                    cross-polarization-discrimination-maximum:
                                      type: integer
                                      description: >
                                        'Maximum cross polarization discrimination (XPD)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-max}'
                                    cross-polarization-discrimination-average:
                                      type: integer
                                      description: >
                                        'Averaged cross polarization discrimination (XPD)
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-avg}'
                                    operated-transmission-modes-list:
                                      type: array
                                      description: >
                                        'List of operated transmission modes with respective operation time periods. Only those entries where operation time is greater than 0 seconds shall be listed
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list}'
                                      items:
                                        type: object
                                        properties:
                                          transmission-mode-name:
                                            type: string
                                            description: >
                                              'Key attribute, name of the transmission mode
                                              from {$p1FormattingOutputApt.output}'
                                          modulation-scheme-name-at-lct:
                                            type: string
                                            description: >
                                              'modulationSchemeNameAtLct
                                              transmissionMode = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list/transmission-mode},
                                              from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}
                                              where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode} = transmissionMode'
                                          time:
                                            type: integer
                                            description: >
                                              'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                          capacity:
                                            type: integer
                                            description: >
                                              'Channel capacity in kbps of the modulation scheme (KPI).
                                              transmissionMode = {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list/transmission-mode},
                                              from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                              where {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode} == transmissionMode'
                                    interval-capacity:
                                      type: integer
                                      description: >
                                        'Averaged capacity, calculated by weighting the operated transmission modes with the duration of their operation during the measurement period.
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/interval-capacity}'
                                    errorred-seconds:
                                      type: integer
                                      x-life-cycle-status: 'deprecated'
                                      description: >
                                        'Number of errored seconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/es}'
                                    severely-errorred-seconds:
                                      type: integer
                                      x-life-cycle-status: 'deprecated'
                                      description: >
                                        'Number of severely errored seconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/ses}'
                                    consecutive-severely-errorred-seconds:
                                      type: integer
                                      x-life-cycle-status: 'deprecated'
                                      description: >
                                        'consecutiveSeverelyErroredSeconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/cses}'
                                    errored-seconds:
                                      type: integer
                                      description: >
                                        'erroredSeconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/es}'
                                    severely-errored-seconds:
                                      type: integer
                                      description: >
                                        'severelyErroredSeconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/ses}'
                                    consecutive-severely-errored-seconds:
                                      type: integer
                                      description: >
                                        'Number of consecutive severely errored seconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/cses}'
                                    total-unavailability:
                                      type: integer
                                      description: >
                                        'Total time of unavailability in seconds
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/unavailability}'
                                    defect-blocks:
                                      type: integer
                                      description: >
                                        'Total number of blocks that were defect after receiving and could not be corrected by the FEC
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/defect-blocks-sum}'
                                    time-period:
                                      type: integer
                                      description: >
                                        'Total (actual) length of the measurement period
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-period}'
                              transmission-mode-list:
                                description: >
                                  'List of supported Transmission Modes
                                  from {$input#/result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list}'
                                type: array
                                items:
                                  type: object
                                  properties:
                                    transmission-mode-name:
                                      type: string
                                      description: >
                                        'Key attribute, name of the transmission mode'
                                    number-of-states:
                                      type: integer
                                      description: >
                                        'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)'
                                    modulation-scheme-name-at-lct:
                                      type: string
                                      description: >
                                        'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                    channel-bandwidth:
                                      type: integer
                                      description: >
                                        'Bandwidth of the transmit channel in kHz'
                                    code-rate:
                                      type: integer
                                      description: >
                                        'Code rate of the coding scheme in %'
                                    symbol-rate-reduction-factor:
                                      type: integer
                                      description: >
                                        'Reduction factor for the symbol rate. Example: value would be 4 for 1/4BPSK
                                        from {$p1FormattingOutputApt.output}'
                        ethernet-container-list:
                          description: >
                            'List of EthernetContainers found in the resultCc.
                            Traverse {$input#/result-cc/logical-termination-point/layer-protocol} and create an array element for each layer-protocol
                            where {$input#/result-cc/logical-termination-point/layer-protocol/layer-protocol-name} indicates ETHERNET_CONTAINER'
                          type: array
                          items:
                            type: object
                            properties:
                              ethernet-container-identifiers:
                                type: object
                                properties:
                                  mount-name:
                                    type: string
                                    description: >
                                      'Identifier of the device at the controller and in the Telefónica planning tools
                                      from {$input#/result-cc/equipment-augment-1-0:control-construct-pac/external-label}'
                                  interface-name:
                                    type: string
                                    description: >
                                      'Interface name of the EthernetContainer as it is represented at the vendors own management interface, e.g. LAN 1/6/6
                                      from {$input#/result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name}
                                  logical-termination-point-id:
                                    type: string
                                    description: >
                                      'Identifier of the ethernet container within the MW SDN domain'
                                      from {$input#/result-cc/logical-termination-point/uuid}'
                              ethernet-container-performance-measurements-list:
                                type: array
                                description: >
                                  'Where not stated otherwise, to be filled from the attribute with the same name
                                  from {$input#/result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list}'
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      description: >
                                        'Time period between reset of the underlying counter
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/granularity-period}'
                                    period-end-time:
                                      type: string
                                      description: >
                                        'Time when the counter values have been recorded and the counter reset
                                        from {$input#/result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/period-end-time}'
                                    max-bytes-per-second-output:
                                      type: string
                                      description: >
