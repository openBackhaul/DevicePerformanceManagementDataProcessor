openapi: 3.0.0
info:
  title: p1FormattingOutputApt
  version: 1.0.0

# TODO: LAG info not yet available in schema of resultCC, therefore mapping needs to be updated

x-javascript-interface:
  p1FormattingOutputApt: 
    summary: 'Transforms data from resultCC into APT format described in OutputApt.yaml'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - _result-cc
              # - parameters
            properties:
              _result-cc:
                type: reference
                description: >
                  'reference to resultCc in DataStructureForProcessing
                  /data-structure-for-processing/result-cc'
              # parameters:
              #   type: object
              #   description: >
              #     'parameters object for p1FormattingOutputApt'
              # parameters currently not used
    output:
      success:
        description: 'Output data in APT format created'
        content:
          application/json:
            schema:
              type: object
              required:
                - result-cc
              properties:
                  result-cc:
                    type: object
                    description: >
                      'The outputApt data created from the result control construct data, as specified in (./InformationStructure/OutputApt.yaml)
                      from [/output]'
      error:
        description: 'Output data in APT format created could not be created'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Input data structure incomplete or invalid'
                - 'General processing error'
      processing:
        createOutputFromResultCc:
          description: >
            'Creates the output object as a variable of the p1FormattingOutputApt function and fills it from resultCc data'
        input:
          content:
            application/json:
              schema:
                properties:
                  result-cc:
                    type: object
                    description: >
                      'ResultCc
                      from {$p1FormattingOutputApt.input#/_result-cc}'
        output:
          success:
            description: 'Output object provided'
            content:
              application/json:
                schema:
                  properties:
                    schema:
                      type: object
                      properties:
                        output:
                          type: object
                          description: >
                            'Output
                            to [/output]'
                          properties:
                            air-interface-list:
                              description: >
                                'List of microwave air interfaces found in the resultCc.
                                Traverse {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol} and create an array element for each layer-protocol
                                where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/layer-protocol-name} indicates AIR_LAYER'
                              type: array
                              items:
                                type: object
                                description: >
                                  'The attributes for the current array element are to be filled from the LTP and its subclasses, which the currently traversed layer-protocol instance belongs to'
                                properties:
                                  air-interface-identifiers:
                                    type: object
                                    properties:
                                      mount-name:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/equipment-augment-1-0:control-construct-pac/external-label}'
                                      link-endpoint-id:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/external-label}
                                      link-id:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/link-id}
                                      logical-termination-point-id:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/uuid}'
                                      link-aggregation-identifiers:
                                        type: array
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/??}'
                                        # TODO: has to be added somewhere in resultCC schema first
                                        items:
                                          type: object
                                  air-interface-configuration:
                                    type: object
                                    properties:
                                      configured-atpc-is-on:
                                        type: boolean
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-is-on}'
                                      configured-atpc-threshold-upper:
                                        type: integer
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-thresh-upper}'
                                      configured-atpc-threshold-lower:
                                        type: integer
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/atpc-tresh-lower}'
                                      configured-tx-power:
                                        type: integer
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/tx-power}'
                                      configured-modulation-minimum:
                                        type: object
                                        description: >
                                          'Configured minimum modulation scheme
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}'
                                        properties:
                                          number-of-states:
                                            type: integer
                                            description: >
                                              'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                                              transmissionModeMin = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                          name-at-lct:
                                            type: string
                                            description: >
                                              'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                              transmissionModeMin = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                          configured-capacity-minimum:
                                            type: integer
                                            description: >
                                              'AirInterface capacity for the configured minimum modulation scheme calculated with ONF formula
                                              transmissionModeMin = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-min}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMin'
                                      configured-modulation-maximum:
                                        type: object
                                        description: >
                                          'Configured maximum modulation scheme
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}'
                                        properties:
                                          number-of-states:
                                            type: integer
                                            description: >
                                              'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                                              transmissionModeMax = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                                          name-at-lct:
                                            type: string
                                            description: >
                                              'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                                              transmissionModeMax = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                                          configured-capacity-maximum:
                                            type: integer
                                            description: >
                                              'AirInterface capacity for the configured minimum modulation scheme calculated with ONF formula
                                              transmissionModeMax = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration/transmission-mode-max}
                                              from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                              where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode-name} == transmissionModeMax'
                                  air-interface-performance-measurements-list:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        granularity-period:
                                          type: string
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/granularity-period}'
                                        period-end-time:
                                          type: string
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/period-end-time}'
                                        transmit-level-minimum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-min}'
                                        transmit-level-maximum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-max}'
                                        transmit-level-average:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/tx-level-avg}'
                                        receive-level-minimum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-min}'
                                        receive-level-maximum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-max}'
                                        receive-level-average:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/rx-level-avg}'
                                        signal-to-noise-ratio-minimum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-min}'
                                        signal-to-noise-ratio-maximum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-max}'
                                        signal-to-noise-ratio-average:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/snir-avg}'
                                        cross-polarization-discrimination-minimum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-min}'
                                        cross-polarization-discrimination-maximum:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-max}'
                                        cross-polarization-discrimination-average:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/xpd-avg}'
                                        operated-transmission-modes-list:
                                          type: array
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list}'
                                          items:
                                            type: object
                                            properties:
                                              transmission-mode-name:
                                                type: string
                                              modulation-scheme-name-at-lct:
                                                type: string
                                                description: >
                                                  'To be filled as follows:
                                                  transmissionMode = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list/transmission-mode},
                                                  from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/modulation-scheme-name-at-lct}
                                                  where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode} = transmissionMode'
                                              time:
                                                type: integer
                                              capacity:
                                                type: integer
                                                description: >
                                                  'Channel capacity in kbps of the modulation scheme, to be filled as follows:
                                                  transmissionMode = {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-xstates-list/transmission-mode},
                                                  from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/capacity}
                                                  where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list/transmission-mode} == transmissionMode'
                                        interval-capacity:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/interval-capacity}'
                                        errorred-seconds:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/es}'
                                        severely-errorred-seconds:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/ses}'
                                        consecutive-severely-errorred-seconds:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/cses}'
                                        total-unavailability:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/unavailability}'
                                        defect-blocks:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/defect-blocks-sum}'
                                        time-period:
                                          type: integer
                                          description: >
                                            'To be filled
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list/performance-data/time-period}'
                                  transmission-mode-list:
                                    description: >
                                      'List of supported Transmission Modes
                                      from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability/transmission-mode-list}'
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        transmission-mode-name:
                                          type: string
                                        number-of-states:
                                          type: integer
                                        modulation-scheme-name-at-lct:
                                          type: string
                                        channel-bandwidth:
                                          type: integer
                                        code-rate:
                                          type: integer
                                        symbol-rate-reduction-factor:
                                          type: integer
                            ethernet-container-list:
                              description: >
                                'List of EthernetContainers found in the resultCc.
                                Traverse {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol} and create an array element for each layer-protocol
                                where {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/layer-protocol-name} indicates ETHERNET_CONTAINER'
                              type: array
                              items:
                                type: object
                                properties:
                                  ethernet-container-identifiers:
                                    type: object
                                    properties:
                                      mount-name:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/equipment-augment-1-0:control-construct-pac/external-label}'
                                      interface-name:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/ltp-augment-1-0:ltp-augment-pac/original-ltp-name}
                                      logical-termination-point-id:
                                        type: string
                                        description: >
                                          'To be filled
                                          from {$createOutputFromResultCc.input#result-cc/logical-termination-point/uuid}'
                                  ethernet-container-performance-measurements-list:
                                    type: array
                                    description: >
                                      'Where not stated otherwise, to be filled from the attribute with the same name
                                      from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list}'
                                    items:
                                      type: object
                                      properties:
                                        granularity-period:
                                          type: string
                                          description: >
                                            'To be filled from
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/granularity-period}'
                                        period-end-time:
                                          type: string
                                          description: >
                                            'To be filled from
                                            from {$createOutputFromResultCc.input#result-cc/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/period-end-time}'
                                        max-bytes-per-second-output:
                                          type: string
                                        total-bytes-input:
                                          type: string
                                        total-bytes-output:
                                          type: string
                                        total-frames-input:
                                          type: string
                                        total-frames-output:
                                          type: string
                                        forwarded-frames-input:
                                          type: string
                                        forwarded-frames-output:
                                          type: string
                                        unicast-frames-input:
                                          type: string
                                        unicast-frames-output:
                                          type: string
                                        multicast-frames-input:
                                          type: integer
                                        multicast-frames-output:
                                          type: integer
                                        broadcast-frames-input:
                                          type: integer
                                        broadcast-frames-output:
                                          type: integer
                                        fragmented-frames-input:
                                          type: integer
                                        errored-frames-input:
                                          type: integer
                                        errored-frames-output:
                                          type: integer
                                        dropped-frames-input:
                                          type: integer
                                        dropped-frames-output:
                                          type: integer
                                        oversized-frames-ingress:
                                          type: string
                                        undersized-frames-ingress:
                                          type: string
                                        jabber-frames-ingress:
                                          type: string
                                        unknown-protocol-frames-input:
                                          type: string
                                        time-period:
                                          type: integer
                                        transmit-traffic:
                                          type: number
                                          format: float
                                        receive-traffic:
                                          type: number
                                          format: float
                                        frame-loss-input:
                                          type: integer
                                        frame-loss-output:
                                          type: integer
        error:
          description: 'Output object could not be created.'
          content:
            application/json:
              schema:
                type: string
                enum:
                  # todo: reasonable error messages to be added
                  - 'Output object could not be created from ResultCc'
                  - 'General processing error'



