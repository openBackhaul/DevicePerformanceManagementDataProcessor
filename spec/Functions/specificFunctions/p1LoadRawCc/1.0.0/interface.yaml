openapi: 3.0.0
info:
  title: p1LoadRawCc
  version: 1.0.0

x-javascript-interface:
  p1LoadRawCc:
    summary: 'Reads device ControlConstruct from MWDI ES replica, applies filtering and returns the remaining data to the caller'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - mount-name
              - parameters
            properties:
              mount-name:
                type: string
                description: 'The mount-name of the device for which ControlConstruct data shall be read'
                mount-name: '100250001'
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              config-file:
                type: object
                description: 'configFile content'
    output:
      success:
        description: 'Raw CC data loaded'
        content:
          application/json:
            schema:
              type: object
              required:
                - raw-cc
              properties:
                  raw-cc:
                    type: object
                    description: >
                      'The raw control construct data read from ES, following ONF structure.
                      Only relevant classes and attributes listed.'
                    required:
                      - equipment-augment-1-0:control-construct-pac
                      - logical-termination-point
                    properties:
                      equipment-augment-1-0:control-construct-pac:
                        type: object
                        required:
                          - external-label
                          - device-model-name
                        properties:
                          external-label:
                            type: string
                            description: >
                              'mountName
                              from {$input#/mount-name}'
                          device-model-name:
                            type: string
                            description: >
                              'deviceType
                              from {$applyFilteringForRelevantPmData.output#equipment-augment-1-0:control-construct-pac/device-model-name}'
                      logical-termination-point:
                        type: array
                        description: >
                          'The filtered LTP data
                          from {$applyFilteringForRelevantPmData.output#logical-termination-point}
                        x-key: uuid
                        items:
                          type: object
                          required:
                            - uuid
                            - ltp-augment-1-0:ltp-augment-pac
                            - layer-protocol
                          properties:
                            uuid:
                              type: string
                            client-ltp:
                              type: array
                              items:
                                type: string
                            server-ltp:
                              type: array
                              items:
                                type: string
                            ltp-augment-1-0:ltp-augment-pac:
                              type: object
                              properties:
                                external-label:
                                  type: string
                                  description: 'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                original-ltp-name:
                                  type: string
                                  description: 'portName'
                            layer-protocol:
                              type: array
                              x-key: local-id
                              items:
                                oneOf:
                                  - description: 'air-interface'
                                    type: object
                                    required:
                                      - local-id
                                      - layer-protocol-name
                                      - air-interface-2-0:air-interface-pac
                                    properties:
                                      local-id:
                                        type: string
                                      layer-protocol-name:
                                        type: string
                                        enum:
                                          - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                      air-interface-2-0:air-interface-pac:
                                        type: object
                                        properties:
                                          air-interface-configuration:
                                            type: object
                                            properties:
                                              transmission-mode-min:
                                                type: string
                                              transmission-mode-max:
                                                type: string
                                              tx-power:
                                                type: integer
                                              atpc-is-on:
                                                type: boolean
                                              atpc-thresh-upper:
                                                type: integer
                                              atpc-thresh-lower:
                                                type: integer
                                          air-interface-capability:
                                            type: object
                                            properties:
                                              transmission-mode-list:
                                                type: array
                                                x-key: transmission-mode-name
                                                items:
                                                  type: object
                                                  properties:
                                                    transmission-mode-name:
                                                      type: string
                                                    channel-bandwidth:
                                                      type: integer
                                                    modulation-scheme:
                                                      type: integer
                                                    modulation-scheme-name-at-lct:
                                                      type: string
                                                    code-rate:
                                                      type: integer
                                                    symbol-rate-reduction-factor:
                                                      type: integer
                                          air-interface-historical-performances:
                                            type: object
                                            properties:
                                              historical-performance-data-list:
                                                type: array
                                                x-key: period-end-time
                                                items:
                                                  type: object
                                                  required:
                                                    - granularity-period
                                                    - period-end-time
                                                    - performance-data
                                                  properties:
                                                    granularity-period:
                                                      type: string
                                                      enum:
                                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                                        - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                                    period-end-time:
                                                      type: string
                                                    performance-data:
                                                      type: object
                                                      properties:
                                                        es:
                                                          type: integer
                                                        ses:
                                                          type: integer
                                                        cses:
                                                          type: integer
                                                        unavailability:
                                                          type: integer
                                                        tx-level-min:
                                                          type: integer
                                                        tx-level-max:
                                                          type: integer
                                                        tx-level-avg:
                                                          type: integer
                                                        rx-level-min:
                                                          type: integer
                                                        rx-level-max:
                                                          type: integer
                                                        rx-level-avg:
                                                          type: integer
                                                        time-xstates-list:
                                                          type: array
                                                          x-key: transmission-mode
                                                          items:
                                                            type: object
                                                            required:
                                                              - transmission-mode
                                                            properties:
                                                              transmission-mode:
                                                                type: string
                                                              time:
                                                                type: integer
                                                        snir-min:
                                                          type: integer
                                                        snir-max:
                                                          type: integer
                                                        snir-avg:
                                                          type: integer
                                                        xpd-min:
                                                          type: integer
                                                        xpd-max:
                                                          type: integer
                                                        xpd-avg:
                                                          type: integer
                                                        defect-blocks-sum:
                                                          type: integer
                                                        time-period:
                                                          type: integer
                                  - description: 'ethernet-container'
                                    type: object
                                    required:
                                      - local-id
                                      - layer-protocol-name
                                      - ethernet-container-2-0:ethernet-container-pac
                                    properties:
                                      local-id:
                                        type: string
                                      layer-protocol-name:
                                        type: string
                                        enum:
                                          - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                      ethernet-container-2-0:ethernet-container-pac:
                                        type: object
                                        properties:
                                          ethernet-container-historical-performances:
                                            type: object
                                            properties:
                                              historical-performance-data-list:
                                                type: array
                                                x-key: period-end-time
                                                items:
                                                  type: object
                                                  required:
                                                    - granularity-period
                                                    - period-end-time
                                                    - performance-data
                                                  properties:
                                                    granularity-period:
                                                      type: string
                                                      enum:
                                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                                    period-end-time:
                                                      type: string
                                                    performance-data:
                                                      type: object
                                                      properties:
                                                        max-bytes-per-second-output:
                                                          type: integer
                                                        total-bytes-input:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        total-bytes-output:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        time-period:
                                                          type: integer
                                                        total-frames-input:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        total-frames-output:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        forwarded-frames-input:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        forwarded-frames-output:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        unicast-frames-input:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        unicast-frames-output:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        multicast-frames-input:
                                                          type: integer
                                                        multicast-frames-output:
                                                          type: integer
                                                        broadcast-frames-input:
                                                          type: integer
                                                        broadcast-frames-output:
                                                          type: integer
                                                        fragmented-frames-input:
                                                          type: integer
                                                        errored-frames-input:
                                                          type: integer
                                                        errored-frames-output:
                                                          type: integer
                                                        dropped-frames-input:
                                                          type: integer
                                                        dropped-frames-output:
                                                          type: integer
                                                        oversized-frames-ingress:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        undersized-frames-ingress:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        jabber-frames-ingress:
                                                          type: string
                                                          description: 'String representation of int64 value'
                                                        unknown-protocol-frames-input:
                                                          type: string
                                                          description: 'String representation of int64 value'
      error:
        description: 'Raw CC could not be loaded'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Data structure is missing or invalid'
                - 'General processing error'
    processing:
      readControlConstructFromEs:
        url: #[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=mwdiReplicaTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=mwdiReplicaTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address or /core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=mwdiReplicaTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name]:[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=mwdiReplicaTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/control-construct={mountName}]
          output:
            success:
              description: 'Raw ControlConstruct data read'
              content:
                application/json:
                  schema:
                    description: >
                      'The data format follows ONF schema (but in MWDI core-model-1-4:control-construct is an array).
                      As format follows MWDI, the schema is not explicitly stated here.'
                    required:
                      - core-model-1-4:control-construct
                    properties:
                      core-model-1-4:control-construct:
                        type: array
                        items:
                          type: object
            error:
              description: 'Data structure could not be read from ElasticSearch'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'Data structure is missing or invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error during reading'
      applyFieldsFilter:
        url: #[p1FieldsFilter]
          description: >
            'This function reduces the raw ControlConstruct data
            from {#readControlConstructFromEs.output/core-model-1-4:control-construct}
            according to the fields filter specified as a parameter of function p1LoadRawCc.'
          input:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data-structure:
                      type: object
                      description: >
                        'The data structure to be filtered according to the provided fields filter string. It is the raw ControlConstruct
                        from {$readControlConstruct.output#core-model-1-4:control-construct}'
                    fields-filter-string:
                      type: string
                      description: >
                        'Fields filter string following NETCONF FieldsFilter syntax and semantics to be applied to the data structure,
                        from {$input#parameters/sub-function=p1FieldsFilter/parameter=fieldsFilter/value}'
            output:
              success:
                description: 'Data structure successfully filtered according to the provided fields filter string'
                content:
                  application/json:
                    schema:
                      type: object
                    properties:
                      filtered-data-structure:
                        type: object
                        description: 'The data structure after filtering according to the provided fields filter string'
              error:
                description: 'Data structure could not be filtered according to the provided fields filter string'
                content:
                  application/json:
                    schema:
                      type: string
                      enum:
                        - 'Data structure is missing or invalid'
                        - 'Invalid fields filter string syntax'
                        - 'General processing error during filtering'
      retrieveMostRecentPeriodEndTimesFromDs:
        url: #[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=dataStoreTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=dataStoreTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address or /core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=dataStoreTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name]:[/core-model-1-4:control-construct/logical-termination-point={$parameters/parameter=dataStoreTcpClient/value}/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/data-store/device={$input#mount-name}/interface]
          description: 'Reads the timestamps of the most recent 15min and 24h PM data records of all interfaces.'
          output:
            success:
              description: 'List of most-recent-period-end-times provided'
              content:
                application/json:
                  schema:
                    type: array
                    x-key: uuid
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                        layer-protocol-name:
                          type: string
                        most-recent-period-end-time:
                          type: string
                          description: 'The newest seen periodEndTime for this interface in 15min data'
                        most-recent-period-end-time-24:
                          type: string
                          description: 'The newest seen periodEndTime for this interface in 24h data'
                    example:
                      - uuid: 'RF-819.1.1'
                        layer-protocol-name: 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        most-recent-period-end-time: '2025-11-19T18:33:43.813+01:00'
                        most-recent-period-end-time-24: '2025-11-19T02:33:43.813+01:00'
                      - uuid: 'ETH-785.1.5'
                        layer-protocol-name: 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        most-recent-period-end-time: '2025-11-18T00:00:01+01:00'
                        most-recent-period-end-time-24: '2025-11-18T23:33:43.813+01:00'
            error:
              description: 'MostRecentPeriodEndTimes could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'ElasticSearch read error'
                      - 'General processing error'
      applyFilteringForRelevantPmData:
          description: >
            'Applies additional filtering to the ControlConstruct data from {$applyFieldsFilter.output#filtered-data-structure/core-model-1-4:control-construct[0]}.
            Filters each relevant layer-protocol (AirInterface or EthernetContainer) for new PM records with desired granularities. If no PM records remain for the respective layer-protocol,
            it is discarded from the raw ControlConstruct entirely; if records remain, only the filtered PM records are kept in the historical-performance-data-list of the respective layer-protocol.
            Filtering is done by executing {discardIrrelevantPmRecords} for each relevant layer-protocol separately.'
          output:
            success:
              description: 'Raw ControlConstruct object provided'
              content:
                application/json:
                  schema:
                    properties:
                      raw-cc:
                        description: >
                          'ControlConstruct data
                          from {$applyFieldsFilter.output#filtered-data-structure/core-model-1-4:control-construct[0]}.
                          (The input object is an array, the rawCc is to be filled from the first entry in this array.)
                          Follows ONF schema, but includes only attributes and classes of relevance.'
                        type: object
                        required:
                          - equipment-augment-1-0:control-construct-pac
                          - logical-termination-point
                        properties:
                          equipment-augment-1-0:control-construct-pac:
                            description: >
                              'Relevant parts of equipment augment
                              from {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/equipment-augment-1-0:control-construct-pac}'
                            type: object
                            required:
                              - external-label
                              - device-model-name
                            properties:
                              external-label:
                                type: string
                                description: >
                                  'mountName
                                  from {$p1ProcessingPmData.request.body#/mount-name}'
                              device-model-name:
                                type: string
                                description: >
                                  'deviceType
                                  from { ??? }'
                          logical-termination-point:
                            description: >
                              'Relevant parts of logical-termination-point
                              from {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point}'
                            type: array
                            x-key: uuid
                            items:
                              type: object
                              required:
                                - uuid
                                - ltp-augment-1-0:ltp-augment-pac
                                - layer-protocol
                              properties:
                                uuid:
                                  type: string
                                client-ltp:
                                  type: array
                                  items:
                                    type: string
                                server-ltp:
                                  type: array
                                  items:
                                    type: string
                                ltp-augment-1-0:ltp-augment-pac:
                                  type: object
                                  properties:
                                    external-label:
                                      type: string
                                      description: 'Contains the linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                    original-ltp-name:
                                      type: string
                                      description: 'Contains the portName'
                                layer-protocol:
                                  type: array
                                  x-key: local-id
                                  items:
                                    description: >
                                      'The layer-protocol instances
                                      from {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol}
                                      where {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol/layer-protocol-name} indicates AIR_LAYER or ETHERNET_CONTAINER.
                                      For each layer protocol instance further filtering is applied, by executing p1DiscardIrrelevantPmRecords.
                                      Only those layer protocols are added as an array item, for which length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) > 0.'
                                    oneOf:
                                      - description: 'air-interface'
                                        type: object
                                        required:
                                          - local-id
                                          - layer-protocol-name
                                          - air-interface-2-0:air-interface-pac
                                        properties:
                                          local-id:
                                            type: string
                                          layer-protocol-name:
                                            type: string
                                            enum:
                                              - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                          air-interface-2-0:air-interface-pac:
                                            type: object
                                            properties:
                                              air-interface-configuration:
                                                type: object
                                                properties:
                                                  transmission-mode-min:
                                                    type: string
                                                  transmission-mode-max:
                                                    type: string
                                                  tx-power:
                                                    type: integer
                                                  atpc-is-on:
                                                    type: boolean
                                                  atpc-thresh-upper:
                                                    type: integer
                                                  atpc-thresh-lower:
                                                    type: integer
                                              air-interface-capability:
                                                type: object
                                                properties:
                                                  transmission-mode-list:
                                                    type: array
                                                    x-key: transmission-mode-name
                                                    items:
                                                      type: object
                                                      properties:
                                                        transmission-mode-name:
                                                          type: string
                                                        channel-bandwidth:
                                                          type: integer
                                                        modulation-scheme:
                                                          type: integer
                                                        modulation-scheme-name-at-lct:
                                                          type: string
                                                        code-rate:
                                                          type: integer
                                                        symbol-rate-reduction-factor:
                                                          type: integer
                                              air-interface-historical-performances:
                                                type: object
                                                properties:
                                                  historical-performance-data-list:
                                                    type: array
                                                    description: >
                                                      'The filtered contents of historical-performance-data-list, which remain after executing processing step {discardIrrelevantPmRecords},
                                                      from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}.
                                                      Inputs for {discardIrrelevantPmRecords} are:
                                                      - {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list} for the currently processed interface instance
                                                      - derive the relevant interface data from retrieveMostRecentPeriodEndTimesFromDs output as follows:
                                                        where {$retrieveMostRecentPeriodEndTimesFromDs.output=={$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/uuid}}
                                                        for this instance use most-recent-period-end-time and most-recent-period-end-time-24

                                                      IF length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) == 0, THEN this interface instance (i.e. layer-protocol) is not added at all to {$output#raw-cc/logical-termination-point/layer-protocol}.'
                                                    x-key: period-end-time
                                                    items:
                                                      type: object
                                                      required:
                                                        - granularity-period
                                                        - period-end-time
                                                        - performance-data
                                                      properties:
                                                        granularity-period:
                                                          type: string
                                                          enum:
                                                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                          description: >
                                                            'The granularity-period
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/granularity-period} for this interface instance'
                                                        period-end-time:
                                                          type: string
                                                          description: >
                                                            'The period-end-time
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/period-end-time} for this interface instance'
                                                        performance-data:
                                                          type: object
                                                          description: >
                                                            'The performance-data
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/performance} for this interface instance'
                                                          properties:
                                                            es:
                                                              type: integer
                                                            ses:
                                                              type: integer
                                                            cses:
                                                              type: integer
                                                            unavailability:
                                                              type: integer
                                                            tx-level-min:
                                                              type: integer
                                                            tx-level-max:
                                                              type: integer
                                                            tx-level-avg:
                                                              type: integer
                                                            rx-level-min:
                                                              type: integer
                                                            rx-level-max:
                                                              type: integer
                                                            rx-level-avg:
                                                              type: integer
                                                            time-xstates-list:
                                                              type: array
                                                              x-key: transmission-mode
                                                              items:
                                                                type: object
                                                                required:
                                                                  - transmission-mode
                                                                properties:
                                                                  transmission-mode:
                                                                    type: string
                                                                  time:
                                                                    type: integer
                                                            snir-min:
                                                              type: integer
                                                            snir-max:
                                                              type: integer
                                                            snir-avg:
                                                              type: integer
                                                            xpd-min:
                                                              type: integer
                                                            xpd-max:
                                                              type: integer
                                                            xpd-avg:
                                                              type: integer
                                                            defect-blocks-sum:
                                                              type: integer
                                                            time-period:
                                                              type: integer
                                      - description: 'ethernet-container'
                                        type: object
                                        required:
                                          - local-id
                                          - layer-protocol-name
                                          - ethernet-container-2-0:ethernet-container-pac
                                        properties:
                                          local-id:
                                            type: string
                                          layer-protocol-name:
                                            type: string
                                            enum:
                                              - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                          ethernet-container-2-0:ethernet-container-pac:
                                            type: object
                                            properties:
                                              ethernet-container-historical-performances:
                                                type: object
                                                properties:
                                                  historical-performance-data-list:
                                                    type: array
                                                    description: >
                                                      'The filtered contents of historical-performance-data-list, which remain after executing p1DiscardIrrelevantPmRecords,
                                                      from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}.
                                                      Inputs for p1DiscardIrrelevantPmRecords are:
                                                      - {$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list} for the currently processed interface instance
                                                      - derive the relevant interface data from retrieveMostRecentPeriodEndTimesFromDs output as follows:
                                                        where {$retrieveMostRecentPeriodEndTimesFromDs.output=={$applyFieldsFilter.output#core-model-1-4:control-construct[0]/logical-termination-point/uuid}}
                                                        for this instance use most-recent-period-end-time and most-recent-period-end-time-24

                                                      IF length({$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list}) == 0, THEN this interface instance (i.e. layer-protocol) is not added at all to {$output#raw-cc/logical-termination-point/layer-protocol}.'
                                                    x-key: period-end-time
                                                    items:
                                                      type: object
                                                      required:
                                                        - granularity-period
                                                        - period-end-time
                                                        - performance-data
                                                      properties:
                                                        granularity-period:
                                                          type: string
                                                          enum:
                                                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                          description: >
                                                            'The granularity-period
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/granularity-period} for this interface instance'
                                                        period-end-time:
                                                          type: string
                                                          description: >
                                                            'The period-end-time
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/period-end-time} for this interface instance'
                                                        performance-data:
                                                          type: object
                                                          description: >
                                                            'The performance-data
                                                            from {$p1DiscardIrrelevantPmRecords.output#historical-performance-data-list/performance} for this interface instance'
                                                          properties:
                                                            max-bytes-per-second-output:
                                                              type: integer
                                                            total-bytes-input:
                                                              type: string
                                                            total-bytes-output:
                                                              type: string
                                                            time-period:
                                                              type: integer
                                                            total-frames-input:
                                                              type: string
                                                            total-frames-output:
                                                              type: string
                                                            forwarded-frames-input:
                                                              type: string
                                                            forwarded-frames-output:
                                                              type: string
                                                            unicast-frames-input:
                                                              type: string
                                                            unicast-frames-output:
                                                              type: string
                                                            multicast-frames-input:
                                                              type: integer
                                                            multicast-frames-output:
                                                              type: integer
                                                            broadcast-frames-input:
                                                              type: integer
                                                            broadcast-frames-output:
                                                              type: integer
                                                            fragmented-frames-input:
                                                              type: integer
                                                            errored-frames-input:
                                                              type: integer
                                                            errored-frames-output:
                                                              type: integer
                                                            dropped-frames-input:
                                                              type: integer
                                                            dropped-frames-output:
                                                              type: integer
                                                            oversized-frames-ingress:
                                                              type: string
                                                            undersized-frames-ingress:
                                                              type: string
                                                            jabber-frames-ingress:
                                                              type: string
                                                            unknown-protocol-frames-input:
                                                              type: string
            error:
              description: 'Raw ControlConstruct object could not be created.'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'Input data structure incomplete or invalid'
                      - 'Error during filtering of raw data'
                      - 'General processing error'
      p1DiscardIrrelevantPmRecords:
        url: #[p1DiscardIrrelevantPmRecords]
        description: >
          'Called during execution of {applyFilteringForRelevantData} to filter the PM data records of a given interface instance'
        input:
          content:
            application/json:
              schema:
                type: object
                properties:
                  historical-performance-data-list:
                    type: array
                    items:
                      type: object
                      properties:
                        granularity-period:
                          type: string
                          description: 'Indicates the granularity of the PM record'
                        period-end-time:
                          type: string
                          description: 'The timestamp of this PM data record'
                        performance-data:
                          type: object
                          description: 'The object containing actual PM data'
                    description: 'The list of historical PM records, that shall be filtered'
                  most-recent-period-end-time:
                    type: string
                    description: 'The (optional) timestamp for filtering 15min PM records. If not provided any 15min records are treated as newer'
                  most-recent-period-end-time-24:
                    type: string
                    description: 'The (optional) timestamp for filtering 24h PM records. If not provided a 24h record is treated as newer'
                  parameters:
                    type: object
                    description: 'Parameters to configure this function.'
                    properties:
                      relevant-granularities:
                        type: string
                        description: >
                          'This parameter is a regex pattern, that indicates which granularity periods are relevant
                          from {$input#parameters/sub-function=p1DiscardIrrelevantPmRecords/parameter=relevantGranularities/value}'
        output:
          success:
            description: 'Filtered historicalPerformanceDataList provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - historical-performance-data-list
                  properties:
                    historical-performance-data-list:
                      type: array
                      description: >
                        'The filtered historical-performance-data-list, which only contains new records for relevant granularities.
                        If no data remains for this interface instance after filtering, an empty array is returned.'
                      items:
                        type: object
                        properties:
                          granularity-period:
                            type: string
                          period-end-time:
                            type: string
                          performance-data:
                            type: object
          error:
            description: 'Filtered historicalPerformanceDataList could not be provided'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Input object incomplete or invalid'
                    - 'Input parameters missing or invalid'
                    - 'General processing error during filtering'

paths:
  /:
    description: 'no rest path provided by this module'
