                                                            cses:
                                                              type: integer
                                                            unavailability:
                                                              type: integer
                                                            tx-level-min:
                                                              type: integer
                                                            tx-level-max:
                                                              type: integer
                                                            tx-level-avg:
                                                              type: integer
                                                            rx-level-min:
                                                              type: integer
                                                            rx-level-max:
                                                              type: integer
                                                            rx-level-avg:
                                                              type: integer
                                                            time-xstates-list:
                                                              type: array
                                                              x-key: transmission-mode
