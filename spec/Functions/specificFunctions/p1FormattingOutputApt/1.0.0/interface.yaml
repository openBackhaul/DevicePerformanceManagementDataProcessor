                                      type: integer
                                      description: >
                                        'The total number of frames received that were less than 64 octets in length (excluding framing bits but including FCS octets) and had either a bad Frame Check Sequence (FCS) with an integral number of octets (FCS Error) or a bad FCS with a non-integral number of octets (Alignment Error)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/fragmented-frames-input}'
                                    errored-frames-input:
                                      type: integer
                                      description: >
                                        'Total number of errored frames received at this interface
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/errored-frames-input}'
                                    errored-frames-output:
                                      type: integer
                                      description: >
                                        'Number of Ethernet frames, which were locally generated and discarded due to errors, including no route found to the destination
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/errored-frames-output}'
                                    dropped-frames-input:
                                      type: integer
                                      description: >
                                        'Total number of Ethernet frames dropped at the receiver. The number of input Ethernet frames, for which no problems were encountered to prevent their continued processing, but were discarded (e.g., for lack of buffer space)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/dropped-frames-input}'
                                    dropped-frames-output:
                                      type: integer
                                      description: >
                                        'The number of output Ethernet frames, for which no problem was encountered to prevent their transmission to their destination, but were discarded (e.g., for lack of buffer space)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/dropped-frames-output}'
                                    oversized-frames-ingress:
                                      type: string
                                      description: >
                                        'The total number of frames received that were longer than 1518 octets (excluding framing bits, but including FCS octets) and were otherwise well formed
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/oversized-frames-ingress}'
                                    undersized-frames-ingress:
                                      type: string
                                      description: >
                                        'The total number of frames received that were less than 64 octets long (excluding framing bits, but including FCS octets) and were otherwise well formed
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/undersized-frames-ingress}'
                                    jabber-frames-ingress:
                                      type: string
                                      description: >
                                        'Number of jabber frames received on the interface. Jabber frames are typically defined as oversize frames which also have a bad CRC. Implementations may use slightly different definitions of what constitutes a jabber frame. Often indicative of a NIC hardware problem
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/jabber-frames-ingress}'
                                    unknown-protocol-frames-input:
                                      type: string
                                      description: >
                                        'Total number of received frames that were transporting an unknown protocol
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/unknown-protocol-frames-input}'
                                    time-period:
                                      type: integer
                                      description: >
                                        'Total (actual) length of the measurement period
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/time-period}'
                                    transmit-traffic:
                                      type: number
                                      format: float
                                      description: >
                                        'TX Traffic [Mbps] KPI)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/transmit-traffic},
                                        if attribute (non-ONF attribute) not existing, fill with default -1'
                                    receive-traffic:
                                      type: number
                                      format: float
                                      description: >
                                        'RX Traffic [Mbps] (KPI)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/receive-traffic},
                                        if attribute (non-ONF attribute) not existing, fill with default -1'
                                    frame-loss-input:
                                      type: integer
                                      description: >
                                        'Sum of errored and dropped frames on the ingress (KPI)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/frame-loss-input},
                                        if attribute (non-ONF attribute) not existing, fill with default -1'
                                    frame-loss-output:
                                      type: integer
                                      description: >
                                        'Sum of errored and dropped frames on the egress (KPI)
                                        from {$input#_control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/performance-data/frame-loss-output},
                                        if attribute (non-ONF attribute) not existing, fill with default -1'


## continue here -> get IDs for AirIfs  + EthContainers + LAG info, add to output
          GetAirIfIdentifiers:
            url: 
              description: >
                'This processing step reads the uuids
                from {$input#control-construct/}'
              input:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        _result-control-construct:
                          type: object
                          description: >
                            'The reference to the target [/data-structure-for-processing/control-construct]
                            from {input#_result-control-construct}'



          # das wird ersetzt keine vorstruktierung mehr sondern direkt hier angeben
          clusterInputData:
            url: #[dpmdpIpAddress]:[dpmdpPort]
              description: >
                'This processing step reads the data the _result-control-construct reference is pointing to [/data-structure-for-processing/control-construct].
                It then clusters the data available in ONF format as preparation for transforming it into the desired APT output format.'
              input:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        _result-control-construct:
                          type: object
                          description: >
                            'The reference to the target [/data-structure-for-processing/control-construct]
                            from {input#_result-control-construct}'
              output:
                success:
                  description: 'Clustering of input data finished'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          ltp-structure-and-augment:
                            description: >
                              'The control-construct data the reference
                              from {input#_result-control-construct} is pointing to (below listed as [/data-structure-for-processing/control-construct])
                              is to be traversed, the encountered ltp-structure and augment information are to be written into this array, there is no additional filtering.'
                            type: array
                            items:
                              type: object
                              properties:
                                logical-termination-point:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      uuid:
                                        type: string
                                        description: >
                                          'The uuid of the currently traversed LTP
                                          from [data-structure-for-processing/control-construct/logical-termination-point/uuid]'
                                      client-ltp:
                                        type: array
                                        description: >
                                          'The client-ltp array of the currently traversed LTP
                                          from [data-structure-for-processing/control-construct/logical-termination-point/client-ltp]'
                                        items:
                                          type: string
                                      server-ltp:
                                        type: array
                                        description: >
                                          'The server-ltp of the currently traversed LTP
                                          from [data-structure-for-processing/control-construct/logical-termination-point/server-ltp]'
                                        items:
                                          type: string
                                      layer-protocol:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            local-id:
                                              type: string
                                              description: >
                                                'The local-id of the currently traversed LTP/layer-protocol
                                                from [data-structure-for-processing/control-construct/logical-termination-point/layer-protcol/local-id]'
                                            layer-protocol-name:
                                              type: string
                                              description: >
                                                'The layer-protocol-name of the currently traversed LTP/layer-protocol
                                                from [data-structure-for-processing/control-construct/logical-termination-point/layer-protcol/layer-protocol-name]'
                                      ltp-augment-1-0:ltp-augment-pac:
                                        type: object
                                        description: >
                                          'The ltp-augment of the currently traversed LTP
                                          from [data-structure-for-processing/control-construct/logical-termination-point/ltp-augment]'
                                        properties:
                                          external-label:
                                            type: string
                                          original-ltp-name:
                                            type: string
                          list-of-filtered-ethernet-containers:
                            type: array
                            description: >
                              'Only add data of layer-protocols
                              from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol] instances
                              where [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/layer-protocol-name] indicates EthernetContainer'
                            items:
                              type: object
                              properties:
                                uuid:
                                  type: string
                                  description: >
                                    'The uuid of the currently traversed LTP
                                    from [data-structure-for-processing/control-construct/logical-termination-point/uuid]
                                    where [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/layer-protocol-name] indicates EthernetContainer'
                                local-id:
                                  type: string
                                  description: >
                                    'The local-id of the currently traversed LTP/layer-protocol
                                    from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/local-id]
                                    where [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/layer-protocol-name] indicates EthernetContainer'
                                most-recent-period-end-time:
                                  type: string
                                  description: >
                                    'The newest period-end-time from the historical-performance-data-list for this interface instance
                                    from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list/period-end-time]'
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  description: >
                                    'The historical-performance-data-list of the currently traversed LTP/layer-protocol'
                                  items:
                                    type: object
                                    properties:
                                      granularity-period:
                                        type: string
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties: 
                                          max-bytes-per-second-output:
                                            type: integer
                                          total-bytes-input:
                                            type: string
                                          total-bytes-output:
                                            type: string
                                          total-frames-input:
                                            type: string
                                          total-frames-output:
                                            type: string
                                          forwarded-frames-input:
                                            type: string
                                          forwarded-frames-output:
                                            type: string
                                          unicast-frames-input:
                                            type: string
                                          unicast-frames-output:
                                            type: string
                                          multicast-frames-input:
                                            type: integer
                                          multicast-frames-output:
                                            type: integer
                                          broadcast-frames-input:
                                            type: integer
                                          broadcast-frames-output:
                                            type: integer
                                          fragmented-frames-input:
                                            type: integer
                                          errored-frames-input:
                                            type: integer
                                          errored-frames-output:
                                            type: integer
                                          dropped-frames-input:
                                            type: integer
                                          dropped-frames-output:
                                            type: integer
                                          oversized-frames-ingress:
                                            type: string
                                          undersized-frames-ingress:
                                            type: string
                                          jabber-frames-ingress:
                                            type: string
                                          unknown-protocol-frames-input:
                                            type: string
                                          time-period:
                                            type: string
                          list-of-filtered-air-interfaces:
                            type: array
                            items:
                              type: object
                              properties:
                                uuid:
                                  type: string
                                  description: >
                                    'The uuid of the currently traversed LTP
                                    from [data-structure-for-processing/control-construct/logical-termination-point/uuid]
                                    where [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/layer-protocol-name] indicates AirInterface'
                                local-id:
                                  type: string
                                  description: >
                                    'The local-id of the currently traversed LTP/layer-protocol
                                    from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/local-id]
                                    where [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/layer-protocol-name] indicates AirInterface'
                                historical-performance-data-list:
                                  type: array
                                  description: >
                                    'The historical-performance-data-list of the currently traversed LTP/layer-protocol'
                                  items:
                                    type: object
                                    properties:
                                      granularity-period:
                                        type: string
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                        tx-level-min:
                                          type: integer
                                        tx-level-max:
                                          type: integer
                                        tx-level-avg:
                                          type: integer
                                        rx-level-min:
                                          type: integer
                                        rx-level-max:
                                          type: integer
                                        rx-level-avg:
                                          type: integer
                                        snir-min:
                                          type: integer
                                        snir-max:
                                          type: integer
                                        snir-avg:
                                          type: integer
                                        xpd-min:
                                          type: integer
                                        xpd-max:
                                          type: integer
                                        xpd-avg:
                                          type: integer
                                        time-xstates-list:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              transmission-mode:
                                                type: string
                                              time:
                                                type: integer
                                        es:
                                          type: integer
                                        ses:
                                          type: integer
                                        cses:
                                          type: integer
                                        unavailability:
                                          type: integer
                                        defect-blocks-sum:
                                          type: integer
                                        time-period:
                                          type: integer
                                  air-interface-configuration:
                                    type: object
                                    description: >
                                      'Relevant air interface configuration attributes
                                      from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-configuration]'
                                    properties:
                                      transmission-mode-min:
                                        type: string
                                      transmission-mode-max:
                                        type: string
                                      tx-power:
                                        type: integer
                                      atpc-is-on:
                                        type: boolean
                                      atpc-thresh-upper:
                                        type: integer
                                      atpc-thresh-lower:
                                        type: integer
                                  air-interface-capability:
                                    type: object
                                    description: >
                                      'Relevant air interface configuration attributes
                                      from [data-structure-for-processing/control-construct/logical-termination-point/layer-protocol/air-interface-2-0:air-interface-pac/air-interface-capability]'
                                    properties:
                                      transmission-mode-list:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            transmission-mode-name:
                                              type: string
                                            channel-bandwidth:
                                              type: integer
                                            modulation-scheme:
                                              type: integer
                                            modulation-scheme-name-at-lct:
                                              type: string
                                            code-rate:
                                              type: integer
                                            symbol-rate-reduction-factor:
                                              type: integer


                error:
                  description: 'just for preventing an error in VSCode'
                  # todo: description potentially to be deleted; behavior in case of errors to be described
          #compute AirIf + EthContainer names from LTP structure + augment: subfunction
          #comput LAG: subfunction

