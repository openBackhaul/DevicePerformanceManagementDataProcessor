output:
  type: object
  properties:
    air-interface-list:
      description: >
        'List of microwave air interfaces found in the given devices
        from {$p1FormattingOutputApt.output}'
      type: array
      items:
        type: object
        properties:
          air-interface-identifiers:
            type: object
            properties:
              mount-name:
                type: string
                description: >
                  'Identifier of the device at the controller and in the Telefónica planning tools
                  from {$p1FormattingOutputApt.output}'
              link-endpoint-id:
                type: string
                description: >
                  'Identifier of the microwave link endpoint as used in the Telefonica planning tools
                  from {$p1FormattingOutputApt.output}'
              link-id:
                type: string
                description: >
                  'Identifier of the microwave link as used in the Telefonica planning tools. To be obtained by extracting the substring constituted by the 9 first characters
                  from {$p1FormattingOutputApt.output}'
              logical-termination-point-id:
                type: string
                description: >
                  'Identifier of the microwave link endpoint within the MW SDN domain
                  from {$p1FormattingOutputApt.output}'
              link-aggregation-identifiers:
                type: array
                description: >
                  'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames
                  from {$p1FormattingOutputApt.output}'
                items:
                  oneOf:
                    - description: 'AirInterfaces'
                      type: object
                      required:
                        - link-id
                      properties:
                        link-id:
                          type: string
                          description: >
                            'Identifier of the microwave link as used in the Telefonica planing tools
                            from {$p1FormattingOutputApt.output}'
                    - description: 'WireInterface'
                      type: object
                      required:
                        - interface-name
                      properties:
                        interface-name:
                          type: string
                          description: >
                            'Interface name as it is represented at the own management interface of the vendor
                            from {$p1FormattingOutputApt.output}'
          air-interface-configuration:
            type: object
            properties:
              configured-atpc-is-on:
                type: boolean
                description: >
                  'This configuration value is true, if automatic transmit power control (ATPC) is configured to be switched on
                  from {$p1FormattingOutputApt.output}'
              configured-atpc-threshold-upper:
                type: integer
                description: >
                  'Configured upper automatic transmit power control (ATPC) threshold in dBm
                  from {$p1FormattingOutputApt.output}'
              configured-atpc-threshold-lower:
                type: integer
                description: >
                  'Configured lower automatic transmit power control (ATPC) threshold in dBm
                  from {$p1FormattingOutputApt.output}'
              configured-tx-power:
                type: integer
                description: >
                  'Configured transmit power that will be operated in maximum in dBm
                  from {$p1FormattingOutputApt.output}'
              configured-modulation-minimum:
                type: object
                description: >
                  'Configured minimum modulation scheme
                  from {$p1FormattingOutputApt.output}'
                properties:
                  number-of-states:
                    type: integer
                    description: >
                      'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                      from {$p1FormattingOutputApt.output}'
                  name-at-lct:
                    type: string
                    description: >
                      'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                      from {$p1FormattingOutputApt.output}'
                  configured-capacity-minimum:
                    type: integer
                    description: >
                      'AirInterface capacity for the configured minimum modulation scheme calculated with ONF formula
                      from {$p1FormattingOutputApt.output}'
              configured-modulation-maximum:
                type: object
                description: >
                  'Configured maximum modulation scheme
                  from {$p1FormattingOutputApt.output}'
                properties:
                  number-of-states:
                    type: integer
                    description: >
                      'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                      from {$p1FormattingOutputApt.output}'
                  name-at-lct:
                    type: string
                    description: >
                      'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                      from {$p1FormattingOutputApt.output}'
                  configured-capacity-maximum:
                    type: integer
                    description: >
                      'AirInterface capacity for the configured maximum modulation scheme calculated with ONF formula
                      from {$p1FormattingOutputApt.output}'
          air-interface-performance-measurements-list:
            type: array
            items:
              type: object
              properties:
                granularity-period:
                  type: string
                  enum:
                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                  description: >
                    'Time period between reset of the underlying counter
                    from {$p1FormattingOutputApt.output}'
                period-end-time:
                  type: string
                  description: >
                    'Time when the counter values have been recorded and the counter reset
                    from {$p1FormattingOutputApt.output}'
                transmit-level-minimum:
                  type: integer
                  description: >
                    'Minimum transmit power in dBm
                    from {$p1FormattingOutputApt.output}'
                transmit-level-maximum:
                  type: integer
                  description: >
                    'Maximum transmit power in dBm
                    from {$p1FormattingOutputApt.output}'
                transmit-level-average:
                  type: integer
                  description: >
                    'Averaged transmit power in dBm
                    from {$p1FormattingOutputApt.output}'
                receive-level-minimum:
                  type: integer
                  description: >
                    'Minimum receive level in dBm
                    from {$p1FormattingOutputApt.output}'
                receive-level-maximum:
                  type: integer
                  description: >
                    'Maximum receive level in dBm
                    from {$p1FormattingOutputApt.output}'
                receive-level-average:
                  type: integer
                  description: >
                    'Averaged receive level in dBm
                    from {$p1FormattingOutputApt.output}'
                signal-to-noise-ratio-minimum:
                  type: integer
                  description: >
                    'Minimum signal to noise + interference ratio (SNIR)
                    from {$p1FormattingOutputApt.output}'
                signal-to-noise-ratio-maximum:
                  type: integer
                  description: >
                    'Maximum signal to noise + interference ratio (SNIR)
                    from {$p1FormattingOutputApt.output}'
                signal-to-noise-ratio-average:
                  type: integer
                  description: >
                    'Averaged signal to noise + interference ratio (SNIR)
                    from {$p1FormattingOutputApt.output}'
                cross-polarization-discrimination-minimum:
                  type: integer
                  description: >
                    'Minimum cross polarization discrimination (XPD)
                    from {$p1FormattingOutputApt.output}'
                cross-polarization-discrimination-maximum:
                  type: integer
                  description: >
                    'Maximum cross polarization discrimination (XPD)
                    from {$p1FormattingOutputApt.output}'
                cross-polarization-discrimination-average:
                  type: integer
                  description: >
                    'Averaged cross polarization discrimination (XPD)
                    from {$p1FormattingOutputApt.output}'
                operated-transmission-modes-list: 
                  description: >
                    'List of operated transmission modes with respective operation time periods. Only those entries where operation time is greater than 0 seconds shall be listed
                    from {$p1FormattingOutputApt.output}'
                  type: array
                  items:
                    type: object
                    properties:
                      transmission-mode-name:
                        type: string
                        description: >
                          'Key attribute, name of the transmission mode
                          from {$p1FormattingOutputApt.output}'
                      modulation-scheme-name-at-lct:
                        type: string
                        description: >
                          'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                          from {$p1FormattingOutputApt.output}'
                      time:
                        type: integer
                        description: >
                          'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                          from {$p1FormattingOutputApt.output}'
                      capacity:
                        type: integer
                        description: >
                          'Channel capacity in kbps of the modulation scheme (KPI).
                          from {$p1FormattingOutputApt.output}'
                interval-capacity:
                  type: integer
                  description: >
                    'Averaged capacity, calculated by weighting the operated transmission modes with the duration of their operation during the measurement period.
                    from {$p1FormattingOutputApt.output}'
                errorred-seconds:
                  type: integer
                  description: >
                    'Number of errored seconds
                    from {$p1FormattingOutputApt.output}'
                severely-errorred-seconds:
                  type: integer
                  description: >
                    'Number of severily errored seconds
                    from {$p1FormattingOutputApt.output}'
                consecutive-severely-errorred-seconds:
                  type: integer
                  description: >
                    'Number of consecutive severily errored seconds
                    from {$p1FormattingOutputApt.output}'
                total-unavailability:
                  type: integer
                  description: >
                    'Total time of unavailability in seconds
                    from {$p1FormattingOutputApt.output}'
                defect-blocks:
                  type: integer
                  description: >
                    'Total number of blocks that were defect after receiving and could not be corrected by the FEC
                    from {$p1FormattingOutputApt.output}'
                time-period:
                  type: integer
                  description: >
                    'Total (actual) length of the measurement period'
          transmission-mode-list:
            description: >
                  'List of supported Transmission Modes
                  from {$p1FormattingOutputApt.output}'
            type: array
            items:
              type: object
              properties:
                transmission-mode-name:
                  type: string
                  description: >
                    'Key attribute, name of the transmission mode
                    from {$p1FormattingOutputApt.output}'
                number-of-states:
                  type: integer
                  description: >
                    'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)
                    from {$p1FormattingOutputApt.output}'
                modulation-scheme-name-at-lct:
                  type: string
                  description: >
                    'Name identifying this transmission mode on the graphical user interface of the local craft terminal
                    from {$p1FormattingOutputApt.output}'
                channel-bandwidth:
                  type: integer
                  description: >
                    'Bandwidth of the transmit channel in kHz
                    from {$p1FormattingOutputApt.output}'
                code-rate:
                  type: integer
                  description: >
                    'Code rate of the coding scheme in %
                    from {$p1FormattingOutputApt.output}'
                symbol-rate-reduction-factor:
                  type: integer
                  description: >
                    'Reduction factor for the symbol rate. Example: value would be 4 for 1/4BPSK
                    from {$p1FormattingOutputApt.output}'
    ethernet-container-list:
      description: >
        'List of ethernet containers found in the given devices
        from {$p1FormattingOutputApt.output}'
      type: array
      items:
        type: object
        properties:
          ethernet-container-identifiers:
            type: object
            properties:
              mount-name:
                type: string
                description: >
                  'Identifier of the device at the controller and in the Telefónica planning tools
                  from {$p1FormattingOutputApt.output}'
              interface-name:
                type: string
                description: >
                  'Interface name of the EthernetContainer as it is represented at the vendors own management interface, e.g. LAN 1/6/6
                  from {$p1FormattingOutputApt.output}'
              logical-termination-point-id:
                type: string
                description: >
                  'Identifier of the ethernet container within the MW SDN domain'
          ethernet-container-performance-measurements-list:
            type: array
            items:
              type: object
              properties:
                granularity-period:
                  type: string
                  enum:
                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                  description: >
                    'Time period between reset of the underlying counter
                    from {$p1FormattingOutputApt.output}'
                period-end-time:
                  type: string
                  description: >
                    'Time when the counter values have been recorded and the counter reset
                    from {$p1FormattingOutputApt.output}'
                max-bytes-per-second-output:
                  type: string
                  description: >
                    'Counts the number of Bytes of Ethernet traffic (before header compression) transmitted within a second and keeps the highest value within the measurement period
                    from {$p1FormattingOutputApt.output}'
                total-bytes-input:
                  type: string
                  description: >
                    'Total number of Bytes of Ethernet traffic (before header compression) received during the measurement period
                    from {$p1FormattingOutputApt.output}'
                total-bytes-output:
                  type: string
                  description: >
                    'Total number of Bytes of Ethernet traffic (before header compression) transmitted (in direction out of the device) during the measurement period
                    from {$p1FormattingOutputApt.output}'
                total-frames-input:
                  type: string
                  description: >
                    'The total number of Ethernet frames received at this interface (including those received in error)
                    from {$p1FormattingOutputApt.output}'
                total-frames-output:
                  type: string
                  description: >
                    'The total number of Ethernet frames sent at this interface
                    from {$p1FormattingOutputApt.output}'
                forwarded-frames-input:
                  type: string
                  description: >
                    'Number of input frames at this interface, for which the device was not their final destination and for which the device attempted to find a route to forward them to that final destination
                    from {$p1FormattingOutputApt.output}'
                forwarded-frames-output:
                  type: string
                  description: >
                    'Number of frames at this interface, for which the device was not their final destination and for which it was successful in finding a path to their final destination
                    from {$p1FormattingOutputApt.output}'
                unicast-frames-input:
                  type: string
                  description: >
                    'Total number of unicast frames received at this interface
                    from {$p1FormattingOutputApt.output}'
                unicast-frames-output:
                  type: string
                  description: >
                    'Total number of unicast frames sent at this interface
                    from {$p1FormattingOutputApt.output}'
                multicast-frames-input:
                  type: integer
                  description: >
                    'Total number of multicast frames received at this interface
                    from {$p1FormattingOutputApt.output}'
                multicast-frames-output:
                  type: integer
                  description: >
                    'Total number of multicast frames sent at this interface
                    from {$p1FormattingOutputApt.output}'
                broadcast-frames-input:
                  type: integer
                  description: >
                    'Total number of broadcast frames received at this interface
                    from {$p1FormattingOutputApt.output}'
                broadcast-frames-output:
                  type: integer
                  description: >
                    'Total number of broadcast frames sent at this interface
                    from {$p1FormattingOutputApt.output}'
                fragmented-frames-input:
                  type: integer
                  description: >
                    'The total number of frames received that were less than 64 octets in length (excluding framing bits but including FCS octets) and had either a bad Frame Check Sequence (FCS) with an integral number of octets (FCS Error) or a bad FCS with a non-integral number of octets (Alignment Error)
                    from {$p1FormattingOutputApt.output}'
                errored-frames-input:
                  type: integer
                  description: >
                    'Total number of errored frames received at this interface
                    from {$p1FormattingOutputApt.output}'
                errored-frames-output:
                  type: integer
                  description: >
                    'Number of Ethernet frames, which were locally generated and discarded due to errors, including no route found to the destination
                    from {$p1FormattingOutputApt.output}'
                dropped-frames-input:
                  type: integer
                  description: >
                    'Total number of Ethernet frames dropped at the receiver. The number of input Ethernet frames, for which no problems were encountered to prevent their continued processing, but were discarded (e.g., for lack of buffer space)
                    from {$p1FormattingOutputApt.output}'
                dropped-frames-output:
                  type: integer
                  description: >
                    'The number of output Ethernet frames, for which no problem was encountered to prevent their transmission to their destination, but were discarded (e.g., for lack of buffer space)
                    from {$p1FormattingOutputApt.output}'
                oversized-frames-ingress:
                  type: string
                  description: >
                    'The total number of frames received that were longer than 1518 octets (excluding framing bits, but including FCS octets) and were otherwise well formed
                    from {$p1FormattingOutputApt.output}'
                undersized-frames-ingress:
                  type: string
                  description: >
                    'The total number of frames received that were less than 64 octets long (excluding framing bits, but including FCS octets) and were otherwise well formed
                    from {$p1FormattingOutputApt.output}'
                jabber-frames-ingress:
                  type: string
                  description: >
                    'Number of jabber frames received on the interface. Jabber frames are typically defined as oversize frames which also have a bad CRC. Implementations may use slightly different definitions of what constitutes a jabber frame. Often indicative of a NIC hardware problem
                    from {$p1FormattingOutputApt.output}'
                unknown-protocol-frames-input:
                  type: string
                  description: >
                    'Total number of received frames that were transporting an unknown protocol
                    from {$p1FormattingOutputApt.output}'
                time-period:
                  type: integer
                  description: >
                    'Total (actual) length of the measurement period
                    from {$p1FormattingOutputApt.output}'
                transmit-traffic:
                  type: number
                  format: float
                  description: >
                    'TX Traffic [Mbps] KPI)
                    from {$p1FormattingOutputApt.output}'
                receive-traffic:
                  type: number
                  format: float
                  description: >
                    'RX Traffic [Mbps] (KPI)
                    from {$p1FormattingOutputApt.output}'
                frame-loss-input:
                  type: integer
                  description: >
                    'Sum of errored and dropped frames on the ingress (KPI)
                    from {$p1FormattingOutputApt.output}'
                frame-loss-output:
                  type: integer
                  description: >
                    'Sum of errored and dropped frames on the egress (KPI)
                    from {$p1FormattingOutputApt.output}'
  example:
    output:
      air-interface-list:
        - air-interface-identifiers:
            mount-name: '123273221'
            link-endpoint-id: '325557888A'
            link-id: '325557888'
            logical-termination-point-id: 'RF-2146697744'
            link-aggregation-identifiers:
              - link-id: '325557888'
              - interface-name: '325557889'
          air-interface-configuration:
            configured-atpc-is-on: true
            configured-atpc-threshold-upper: 99
            configured-atpc-threshold-lower: -45
            configured-tx-power: -10
            configured-modulation-minimum:
              number-of-states: 4
              name-at-lct: '4 QAM'
              configured-capacity-minimum: 2
            configured-modulation-maximum:
              number-of-states: 1024
              name-at-lct: '1024 QAM'
              configured-capacity-maximum: 10
          air-interface-performance-measurements-list:
            - granularity-period: 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
              period-end-time: '2024-03-06T13:00:00+01:00'
              transmit-level-minimum: 18
              transmit-level-maximum: 22
              transmit-level-average: 21
              receive-level-minimum: -45
              receive-level-maximum: -44
              receive-level-average: -44
              signal-to-noise-ratio-minimum: 0
              signal-to-noise-ratio-maximum: 0
              signal-to-noise-ratio-average: 0
              cross-polarization-discrimination-minimum: 30
              cross-polarization-discrimination-maximum: 31
              cross-polarization-discrimination-average: 99
              operated-transmission-modes-list:
                  - transmission-mode-name: '56000-1024-v2'
                    modulation-scheme-name-at-lct:
                    time: 897
                    capacity: 100
                  - transmission-mode-name: '56000-128-v4'
                    modulation-scheme-name-at-lct:
                    time: 3
                    capacity: 120
              interval-capacity: 110
              errorred-seconds: 10
              severely-errorred-seconds: 2
              consecutive-severely-errorred-seconds: 0
              total-unavailability: 0
              defect-blocks: 2
              time-period: 890
          transmission-mode-list:
            - transmission-mode-name: '56000-1024-v2'
              number-of-states: 1024
              modulation-scheme-name-at-lct: '1024 QAM'
              channel-bandwidth: 56000
              code-rate: 94
              symbol-rate-reduction-factor: 1
            - transmission-mode-name: '7000-16-v2'
              number-of-states: 16
              modulation-scheme-name-at-lct: '16 QAM'
              channel-bandwidth: 7000
              code-rate: 86
              symbol-rate-reduction-factor: 1
      ethernet-container-list:
        - ethernet-container-identifiers:
            mount-name: '123273221'
            interface-name: 'WAN 1/1/1'
            logical-termination-point-id: 'ETH-2134646913'
          ethernet-container-performance-measurements-list:
            - granularity-period: 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
              period-end-time: '2024-03-07T00:15:00.0+00:00'
              max-bytes-per-second-output: '100'
              total-bytes-input: '9324688281'
              total-bytes-output: '9800000000'
              total-frames-input: '9047677'
              total-frames-output: '9901000'
              forwarded-frames-input: '500000'
              forwarded-frames-output: '510000'
              unicast-frames-input: '100000'
              unicast-frames-output: '110000'
              multicast-frames-input: 51945
              multicast-frames-output: 10000
              broadcast-frames-input: 15
              broadcast-frames-output: 10
              fragmented-frames-input: 1300
              errored-frames-input: 4000
              errored-frames-output: 4001
              dropped-frames-input: 5000
              dropped-frames-output: 1200
              oversized-frames-ingress: '100000'
              undersized-frames-ingress: '123000'
              jabber-frames-ingress: '123123'
              unknown-protocol-frames-input: '124785'
              time-period: 899
              transmit-traffic: 320
              receive-traffic: 250
              frame-loss: 12000
