openapi: 3.0.0
info:
  title: p1LoadRawDeviceData
  version: 1.0.0


# todo: in readControlConstructFromEs: unclear whether x-key must already be provided in the related output schema

x-javascript-interface:
  p1LoadRawDeviceData:
    summary: 'Reads device ControlConstruct from MWDI ES replica, applies filtering and returns the remaining data to the caller'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - mount-name
            properties:
              mount-name:
                type: string
                description: 'The mount-name of the device for which ControlConstruct data shall be read'
            example:
              mount-name: '100250001'
    output:
      success:
        description: 'Reference to (filtered) raw ControlConstruct data provided.'
        content:
          application/json:
            schema:
              type: object
              required:
                - _raw-control-construct
              properties:
                  _raw-control-construct:
                    type: object
                    description: >
                      'The reference to the raw-control-construct object in the DPMDP memory
                      from {$applyFilteringForLtpStructureAugmentAirIfAndEthContainer#output}'
                  error:
                    description: 'just for preventing an error in VSCode'
                    # todo: description potentially to be deleted; behavior in case of errors to be described
    processing:
      readControlConstructFromEs:
        url: #[dpmdpIpAddress]:[dpmdpPort][MWDI_ES_replica]
          # comment Thorsten (to be deleted after reading): Wouldn't it be reasonable to state the exact location of IP address and port of the MWDI-ES-Replica in the configFile and the exact path here?
          description: >
            'The raw ControlConstruct data for the target mount-name is read directly from ElasticSearch'
          input:
            content:
              required:
                - mount-name
              # comment Thorsten (to be deleted after reading): The description looks a lot like a Function call, but it is just a request to the ES, or?
              # comment Thorsten (to be deleted after reading): Wouldn't the mountName just be an in-line parameter of the path in the url statement?
              properties:
                mount-name:
                  type: string
                  description: >
                    'The target mount-name
                    from {$input#mount-name}'
          output:
            success:
              description: 'Raw ControlConstruct data read'
              content:
                application/json:
                  schema:
                    description: >
                      'The data format follows ONF schema (but in MWDI core-model-1-4:control-construct is an array).
                      Only relevant attributes and classes are listed here, classes may be listed without all sub-classes or attributes'
                    required:
                      - core-model-1-4:control-construct
                    properties:
                      core-model-1-4:control-construct:
                        type: array
                        items:
                          type: object
                          # comment Thorsten (to be deleted after reading): After stating that the data is as provided by the device/MWDI, it probably doesn't require to describe it in details?
                          # comment Thorsten (to be deleted after reading): The details following here are important on the output of p1LoadRawDeviceData, but maybe not necessary here, or?
                          required:
                            - equipment-augment-1-0:control-construct-pac
                            - logical-termination-point
                          properties:
                            equipment-augment-1-0:control-construct-pac:
                              type: object
                              required:
                                - external-label
                                - device-model-name
                              properties:
                                external-label:
                                  type: string
                                  description: >
                                    'This value should match the input mount-name
                                    from {$input#mount-name}'
                                device-model-name:
                                  type: string
                                  description: >
                                    'deviceType as available on the device'
                            logical-termination-point:
                              type: array
                              x-key: uuid
                              items:
                                type: object
                                required:
                                  - uuid
                                  - ltp-augment-1-0:ltp-augment-pac
                                  - layer-protocol
                                properties:
                                  uuid:
                                    type: string
                                  client-ltp:
                                    type: array
                                    items:
                                      type: string
                                  server-ltp:
                                    type: array
                                    items:
                                      type: string
                                  ltp-augment-1-0:ltp-augment-pac:
                                    type: object
                                    properties:
                                      external-label:
                                        type: string
                                        description: 'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                      original-ltp-name:
                                        type: string
                                        description: 'portName'
                                  layer-protocol:
                                    type: array
                                    #x-key: local-id
                                    items:
                                      oneOf:
                                        - description: 'air-interface'
                                          type: object
                                          required:
                                            - local-id
                                            - layer-protocol-name
                                            - air-interface-2-0:air-interface-pac
                                          properties:
                                            local-id:
                                              type: string
                                            layer-protocol-name:
                                              type: string
                                              enum:
                                                - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                            air-interface-2-0:air-interface-pac:
                                              type: object
                                              properties:
                                                air-interface-configuration:
                                                  type: object
                                                air-interface-capability:
                                                  type: object
                                                  properties:
                                                    transmission-mode-list:
                                                      type: array
                                                      #x-key: transmission-mode-name
                                                      items:
                                                        type: object
                                                air-interface-historical-performances:
                                                  type: object
                                                  properties:
                                                    historical-performance-data-list:
                                                      type: array
                                                      #x-key: period-end-time
                                                      items:
                                                        type: object
                                                        required:
                                                          - granularity-period
                                                          - period-end-time
                                                          - performance-data
                                                        properties:
                                                          granularity-period:
                                                            type: string
                                                            enum:
                                                              - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                              - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                              - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                                              - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                                          period-end-time:
                                                            type: string
                                                          performance-data:
                                                            type: object
                                        - description: 'ethernet-container'
                                          type: object
                                          required:
                                            - local-id
                                            - layer-protocol-name
                                            - ethernet-container-2-0:ethernet-container-pac
                                          properties:
                                            local-id:
                                              type: string
                                            layer-protocol-name:
                                              type: string
                                              enum:
                                                - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                            ethernet-container-2-0:ethernet-container-pac:
                                              type: object
                                              properties:
                                                ethernet-container-historical-performances:
                                                  type: object
                                                  properties:
                                                    historical-performance-data-list:
                                                      type: array
                                                      #x-key: period-end-time
                                                      items:
                                                        type: object
                                                        required:
                                                          - granularity-period
                                                          - period-end-time
                                                          - performance-data
                                                        properties:
                                                          granularity-period:
                                                            type: string
                                                            enum:
                                                              - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                              - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                              - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                                              - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                                          period-end-time:
                                                            type: string
                                                          performance-data:
                                                            type: object
                          error:
                            # comment Thorsten (to be deleted after reading): Indentation of the error statement may require correction
                            description: 'todo'
                            # todo: description potentially to be deleted; behavior in case of errors to be described
      retrieveMostRecentPeriodEndTimesFromDs:
        url: #[dpmdpIpAddress]:[dpmdpPort]
          # comment Thorsten (to be deleted after reading): It is unclear, whether this is a data request to the ElasticSearch or a Function call
          # comment Thorsten (to be deleted after reading): If it would be a data request: Wouldn't it be reasonable to state the exact location of IP address and port of the DPMDP-ES in the configFile and the exact path here?
          description: >
            'This processing step reads the data-store item (from the DPMDP ES) where
            [/data-store/device/mount-name](x-key) == {$input#mount-name},
            it returns the [/data-store/device/ltp/most-recent-period-end-time] for all previously seen interfaces'
          input:
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - mount-name
                    # comment Thorsten (to be deleted after reading): If it would be a data request, wouldn't the mountName just be an in-line parameter of the path in the url statement?
                  properties:
                    mount-name:
                      type: string
                      description: >
                        'The target mount-name
                        from {$input#mount-name}'
          output:
            success:
              description: 'List of most-recent-period-end-times provided'
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      ltp:
                        type: array
                        items:
                          properties:
                            uuid:
                              type: string
                              description: 'The uuid of the LTP'
                            lp:
                              type: array
                              items:
                                type: object
                                properties:
                                  local-id:
                                    type: string
                                    description: 'The layerProtocol local-id, identifying the actual interface instance'
                                  most-recent-period-end-time:
                                    type: string
                    example:
                      ltp:
                        - uuid: 'RF-819.1.1'
                          lp:
                            - local-id: '819.1.1'
                              most-recent-period-end-time: '2025-11-19T18:33:43.813+01:00'
                        - uuid: 'ETH-785.1.5'
                          lp:
                            - local-id: '765.1.5'
                              most-recent-period-end-time: '2025-11-18T00:00:01+01:00'
            error:
              description: 'just for preventing an error in VSCode'
              # todo: description potentially to be deleted; behavior in case of errors to be described
      applyFilteringForLtpStructureAugmentAirIfAndEthContainer:
        url: #[dpmdpIpAddress]:[dpmdpPort]
          description: >
            'Filters the ControlConstruct data from readControlConstructFromEs for relevant data. A reference to the object containing the remaining data is returned in the output of the function.
             The following filters are applied:
             - kept data classes (limited to the relevant attributes and subclasses):
               - equipment augment
               - ltp structure and augment information
               - layer protocols: AirInterface and EthernetContainer only
             - historical PM data records for AirInterface and EthernetContainer are filtered for records where
               - granularity is 15min or 24h
               - the respective period-end-time is newer than the newest one seen during previous data retrievals for this mountName + interfaceInstance (most-recent-period-end-time)
                 (if no most-recent-period-end-time information is found in datastore for the mountName and/or interface instance, the data from CC is to be treated as newer data)
               - there may be interface instances without any remaining historical PM records. These are kept for possible future usage, but they will not be included in the data send out in APT format.'
               - if no historical PM records remain, the interface instance is to be discarded and not kept in the raw-control-construct
          output:
            success:
              description: 'Filtered raw ControlConstruct data provided'
              content:
                application/json:
                  schema:
                    properties:
                      raw-control-construct:
                        description: >
                          'ControlConstruct data
                          from {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]}.
                          (The input object is an array, the raw-control-construct is to be filled from the first entry in this array.)
                          Follows ONF schema, but includes only attribtes and classes of relevance.'
                        type: object
                        required:
                          - equipment-augment-1-0:control-construct-pac
                          - logical-termination-point
                        properties:
                          equipment-augment-1-0:control-construct-pac:
                            description: >
                              'Relevant parts of equipment augment
                              from {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/equipment-augment-1-0:control-construct-pac}'
                            type: object
                            required:
                              - external-label
                              - device-model-name
                            properties:
                              external-label:
                                type: string
                                description: >
                                  'mountName
                                  from {$p1ProcessingOrchestratorForHistoricalPmData.request.body#/mount-name}'
                              device-model-name:
                                type: string
                                description: >
                                  'deviceType
                                  from { ??? }'
                          logical-termination-point:
                            description: >
                              'Relevant parts of logical-termination-point
                              from {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point}'
                            type: array
                            x-key: uuid
                            items:
                              type: object
                              required:
                                - uuid
                                - ltp-augment-1-0:ltp-augment-pac
                                - layer-protocol
                              properties:
                                uuid:
                                  type: string
                                client-ltp:
                                  type: array
                                  items:
                                    type: string
                                server-ltp:
                                  type: array
                                  items:
                                    type: string
                                ltp-augment-1-0:ltp-augment-pac:
                                  type: object
                                  properties:
                                    external-label:
                                      type: string
                                      description: 'Contains the linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                    original-ltp-name:
                                      type: string
                                      description: 'Contains the portName'
                                layer-protocol:
                                  type: array
                                  x-key: local-id
                                  items:
                                    description: >
                                      'The layer-protocol instances
                                      from {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol}
                                      where {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol/layer-protocol-name} indicates AIR_LAYER or ETHERNET_CONTAINER.
                                      Only layer-protocols are to be kept where the size(historical-performance-data-list)>0 after filtering of PM data records has been applied.'
                                    oneOf:
                                      - description: 'air-interface'
                                        type: object
                                        required:
                                          - local-id
                                          - layer-protocol-name
                                          - air-interface-2-0:air-interface-pac
                                        properties:
                                          local-id:
                                            type: string
                                          layer-protocol-name:
                                            type: string
                                            enum:
                                              - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                          air-interface-2-0:air-interface-pac:
                                            type: object
                                            properties:
                                              air-interface-configuration:
                                                type: object
                                                properties:
                                                  transmission-mode-min:
                                                    type: string
                                                  transmission-mode-max:
                                                    type: string
                                                  tx-power:
                                                    type: integer
                                                  atpc-is-on:
                                                    type: boolean
                                                  atpc-thresh-upper:
                                                    type: integer
                                                  atpc-thresh-lower:
                                                    type: integer
                                              air-interface-capability:
                                                type: object
                                                properties:
                                                  transmission-mode-list:
                                                    type: array
                                                    x-key: transmission-mode-name
                                                    items:
                                                      type: object
                                                      properties:
                                                        transmission-mode-name:
                                                          type: string
                                                        channel-bandwidth:
                                                          type: integer
                                                        modulation-scheme:
                                                          type: integer
                                                        modulation-scheme-name-at-lct:
                                                          type: string
                                                        code-rate:
                                                          type: integer
                                                        symbol-rate-reduction-factor:
                                                          type: integer
                                              air-interface-historical-performances:
                                                type: object
                                                properties:
                                                  historical-performance-data-list:
                                                    type: array
                                                    description: >
                                                      'Only keep array items with 15min or 24h granularity, for which the period-end-time is newer that the most-recent-period-end-time from retrieveMostRecentPeriodEndTimesFromDs
                                                      (if no most-recent-period-end-time is found for the respective interface instance the found PM data records are to be treated as newer).

                                                      Thereby interface instances from readControlConstructFromEs and retrieveMostRecentPeriodEndTimesFromDs are matched as follows:
                                                      IF ({$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/uuid} == {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/uuid}
                                                          AND {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol/local-id} == {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/lp/local-id})
                                                      THEN it is the same interface instance.

                                                      WITH inputSource == {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list},
                                                      keep only array items
                                                      from {$inputSource}
                                                      WHERE {$inputSource/granularity-period} indicates 15-MIN or 24-HOURS
                                                            AND {$inputSource/period-end-time} is NEWER THAN {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/lp/most-recent-period-end-time} for the current interface instance.
                                                    x-key: period-end-time
                                                    items:
                                                      type: object
                                                      required:
                                                        - granularity-period
                                                        - period-end-time
                                                        - performance-data
                                                      properties:
                                                        granularity-period:
                                                          type: string
                                                          enum:
                                                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                            - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        period-end-time:
                                                          type: string
                                                        performance-data:
                                                          type: object
                                                          properties:
                                                            es:
                                                              type: integer
                                                            ses:
                                                              type: integer
                                                            cses:
                                                              type: integer
                                                            unavailability:
                                                              type: integer
                                                            tx-level-min:
                                                              type: integer
                                                            tx-level-max:
                                                              type: integer
                                                            tx-level-avg:
                                                              type: integer
                                                            rx-level-min:
                                                              type: integer
                                                            rx-level-max:
                                                              type: integer
                                                            rx-level-avg:
                                                              type: integer
                                                            time-xstates-list:
                                                              type: array
                                                              x-key: transmission-mode
                                                              items:
                                                                type: object
                                                                required:
                                                                  - transmission-mode
                                                                properties:
                                                                  transmission-mode:
                                                                    type: string
                                                                  time:
                                                                    type: integer
                                                            snir-min:
                                                              type: integer
                                                            snir-max:
                                                              type: integer
                                                            snir-avg:
                                                              type: integer
                                                            xpd-min:
                                                              type: integer
                                                            xpd-max:
                                                              type: integer
                                                            xpd-avg:
                                                              type: integer
                                                            defect-blocks-sum:
                                                              type: integer
                                                            time-period:
                                                              type: integer
                                      - description: 'ethernet-container'
                                        type: object
                                        required:
                                          - local-id
                                          - layer-protocol-name
                                          - ethernet-container-2-0:ethernet-container-pac
                                        properties:
                                          local-id:
                                            type: string
                                          layer-protocol-name:
                                            type: string
                                            enum:
                                              - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                          ethernet-container-2-0:ethernet-container-pac:
                                            type: object
                                            properties:
                                              ethernet-container-historical-performances:
                                                type: object
                                                properties:
                                                  historical-performance-data-list:
                                                    type: array
                                                    description: >
                                                      'Only keep array items with 15min or 24h granularity, for which the period-end-time is newer that the most-recent-period-end-time from retrieveMostRecentPeriodEndTimesFromDs
                                                      (if no most-recent-period-end-time is found for the respective interface instance the found PM data records are to be treated as newer).

                                                      Thereby interface instances from readControlConstructFromEs and retrieveMostRecentPeriodEndTimesFromDs are matched as follows:
                                                      IF ({$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/uuid} == {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/uuid}
                                                          AND {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/layer-protocol/local-id} == {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/lp/local-id})
                                                      THEN it is the same interface instance.

                                                      WITH inputSource == {$readControlConstructFromEs.output#core-model-1-4:control-construct[0]/logical-termination-point/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list},
                                                      keep only array items
                                                      from {$inputSource}
                                                      WHERE {$inputSource/granularity-period} indicates 15-MIN or 24-HOURS
                                                            AND {$inputSource/period-end-time} is NEWER THAN {$retrieveMostRecentPeriodEndTimesFromDs.output#ltp/lp/most-recent-period-end-time} for the current interface instance.
                                                    x-key: period-end-time
                                                    items:
                                                      type: object
                                                      required:
                                                        - granularity-period
                                                        - period-end-time
                                                        - performance-data
                                                      properties:
                                                        granularity-period:
                                                          type: string
                                                          enum:
                                                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                                            - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                                        period-end-time:
                                                          type: string
                                                        performance-data:
                                                          type: object
                                                          properties:
                                                            max-bytes-per-second-output:
                                                              type: integer
                                                            total-bytes-input:
                                                              type: string
                                                            total-bytes-output:
                                                              type: string
                                                            time-period:
                                                              type: integer
                                                            total-frames-input:
                                                              type: string
                                                            total-frames-output:
                                                              type: string
                                                            forwarded-frames-input:
                                                              type: string
                                                            forwarded-frames-output:
                                                              type: string
                                                            unicast-frames-input:
                                                              type: string
                                                            unicast-frames-output:
                                                              type: string
                                                            multicast-frames-input:
                                                              type: integer
                                                            multicast-frames-output:
                                                              type: integer
                                                            broadcast-frames-input:
                                                              type: integer
                                                            broadcast-frames-output:
                                                              type: integer
                                                            fragmented-frames-input:
                                                              type: integer
                                                            errored-frames-input:
                                                              type: integer
                                                            errored-frames-output:
                                                              type: integer
                                                            dropped-frames-input:
                                                              type: integer
                                                            dropped-frames-output:
                                                              type: integer
                                                            oversized-frames-ingress:
                                                              type: string
                                                            undersized-frames-ingress:
                                                              type: string
                                                            jabber-frames-ingress:
                                                              type: string
                                                            unknown-protocol-frames-input:
                                                              type: string
            error:
              description: 'just for preventing an error in VSCode'
              # todo: description potentially to be deleted; behavior in case of errors to be described

paths:
  /:
    description: 'no rest path provided by this module'
