data-store:
  type: object
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - ltp
          - data-structure-for-processing
        properties:
          mount-name:
            type: string
            description: >
              'mountName indicated in the objectPath of the original notification and read
              from [/data-structure-for-processing/mount-name].'
          ltp:
            type: array
            x-key: uuid
            items:
              type: object
              required:
                - uuid
                - lp
              properties:
                uuid:
                  type: string
                lp:
                  type: array
                  x-key: local-id
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - most-recent-period-end-time
                    properties:
                      local-id:
                        type: string
                      layer-protocol-name:
                        type: string
                      # the most-recent-period-end-time is now stored inside the DSFP cc data, shall it also be stored here???
                      # originally it was to be stored here -> this makes processing faster and easier, therefore decided to keep it
                      # there must be a processing step, where this is added here, when a new dsfp item is added to the dsfp-list
                      # newly seen interfaces are simply added, entries for existing interfaces are overwritten
                      most-recent-period-end-time:
                        type: string
          data-structure-for-processing-list:
            type: array
            x-key: processing-start-time
            items:
              type: object
              description: 'see T1_DataStructureForProcessing.yaml'
