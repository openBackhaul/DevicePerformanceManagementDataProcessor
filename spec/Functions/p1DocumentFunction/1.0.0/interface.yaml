openapi: 3.0.0
info:
  title: p1DocumentFunction
  version: 1.0.0

x-javascript-interface:
  p1DocumentFunction:
    summary: 'Creates a plain text documentation from the passed configFile; activated functions only'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters-of-to-be-documented-function
            properties:
              parameters-of-to-be-documented-function:
                type: object
                description: >
                  'Parameters of the function for which the documentation shall be generated'
    output:
      success:
        description: 'Documentation successfully created'
        content:
          text/plain:
            schema:
              type: string
              description: >
                'Plain text documentation of the active functions
                from [/document-function/documentation]'
      error:
        description: 'Documentation could not be created'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'documentation could not be created'
                - 'general processing error'
    processing:
      formatDocumentation:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  parameters:
                    description: >
                      'Parameters of the function for which the documentation shall be generated
                      from [/document-function/parameters-of-to-be-documented-function]'
        output:
          success:
            description: 'Documentation successfully formatted'
            content:
              application/json:
                schema:
                  type: string
                  description: >
                    'Formatted documentation of active functions created from parameters
                    according to rules and output format documented in README.md'
          error:
            description: 'Documentation could not be created'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'parameters not provided'
                    - 'parameters invalid'
                    - 'documentation could not be created'
                    - 'general processing error'

paths:
  /:
    description: 'no rest path provided by this module'
