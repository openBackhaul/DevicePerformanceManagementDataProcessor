openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.0.0

paths:
########################################################################################################################
#   Service Layer - Individual Part
########################################################################################################################


  # this function uses different internal functions in its callbacks to prepare the output data for datastructure-for-processing
  # prerequisite:
  # - DPDM must keep a maintenance table where it writes down for each mount-name
  #   - each air-interface of the mount-name: newest timestamp DPMDP has seen during the last retrieval for that air interface
  #   - each ethernet-container of the mount-name: also the newest seen timestamp from last retrieval
  #   (called last-timestamp below)
  #
  # steps:
  # - 1. get ltpInfo
  # - 2. FOR EACH air-interface from (1)
  #      - get the DPMDP.last-timestamp from DPDM maintenance table
  #      - get 15min historical PM data, filtered for data newer than last-timestamp
  #        Are new records found?
  #        - no: skip this interface
  #        - yes: the interface is added to the output data, it's pm data is inserted to the entry
  #          - get AIR IF config + capabilities, add them to output as well
  # - 3. FOR EACH ethernet-container from (1)
  #      - get the DPMDP.last-timestamp
  #      - get 15min data, filter for timestamp
  #        New records found:
  #        - no: skip this interface
  #        - yes: add it to the output
  # - 4. If no new data was found in neither 2 or 3, the output object is discarded
  #
  # maybe there could instead also be a timestamp for only the device, rather than the individual interface...
  
  /p1/prepare-dsfp-output-object-from-cache:
    description: 'This function collects interface data for the complete device from cache. It will only contain 15min PM data records. If there are no new PM records for an interface instance, this interface instance will not be included in the output. If there is no new PM data at all, the output object will be discarded.'
    post:
      operationId: p1PrepareDsfpOutputObjectFromCache
      summary: 'Prepares the DataStructureForProcessing output from cache data'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
                  description: 'The mount-name of the device that is addressed by this function'
      responses:
        '200':
          description: 'DataStructureForProcessing Output object created'
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    air-interface-list:
                      description: 'List of microwave air interfaces found in the given devices'
                      type: array
                      items:
                        type: object
                        properties:
                          air-interface-identifiers:
                            type: object
                            properties:
                              mount-name:
                                type: string
                                description: 'Identifier of the device at the controller and in the Telefónica planning tools'
                              link-endpoint-id:
                                type: string
                                description: 'Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                              link-id:
                                type: string
                                description: 'Identifier of the microwave link as used in the Telefonica planning tools. To be obtained by extracting the substring constituted by the 9 first characters'
                              logical-termination-point-id:
                                type: string
                                description: 'Identifier of the microwave link endpoint within the MW SDN domain'
                              link-aggregation-identifiers:
                                type: array
                                description: 'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames'
                                items:
                                  oneOf:
                                    - description: 'AirInterfaces'
                                      type: object
                                      required:
                                        - link-id
                                      properties:
                                        link-id:
                                          type: string
                                          description: 'Identifier of the microwave link as used in the Telefonica planing tools'
                                    - description: 'WireInterface'
                                      type: object
                                      required:
                                        - interface-name
                                      properties:
                                        interface-name:
                                          type: string
                                          description: 'Interface name as it is represented at the own management interface of the vendor'
                          air-interface-configuration:
                            type: object
                            properties:
                              configured-atpc-is-on:
                                type: boolean
                                description: 'This configuration value is true, if automatic transmit power control (ATPC) is configured to be switched on'
                              configured-atpc-threshold-upper:
                                type: integer
                                description: 'Configured upper automatic transmit power control (ATPC) threshold in dBm'
                              configured-atpc-threshold-lower:
                                type: integer
                                description: 'Configured lower automatic transmit power control (ATPC) threshold in dBm'
                              configured-tx-power:
                                type: integer
                                description: 'Configured transmit power that will be operated in maximum in dBm'
                              configured-modulation-minimum:
                                type: object
                                description: 'Configured minimum modulation scheme'
                                properties:
                                  number-of-states:
                                    type: integer
                                    description: 'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)'
                                  name-at-lct:
                                    type: string
                                    description: 'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                  configured-capacity-minimum:
                                    type: integer
                                    description: 'Channel capacity in kbps of the configured minimum modulation scheme (KPI)'
                              configured-modulation-maximum:
                                type: object
                                description: 'Configured maximum modulation scheme'
                                properties:
                                  number-of-states:
                                    type: integer
                                    description: 'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)'
                                  name-at-lct:
                                    type: string
                                    description: 'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                  configured-capacity-maximum:
                                    type: integer
                                    description: 'Channel capacity in kbps of the configured maximum modulation scheme. To be filled with default value -1'
                          air-interface-performance-measurements-list:
                            type: array
                            items:
                              type: object
                              properties:
                                granularity-period:
                                  type: string
                                  enum:
                                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                    - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  description: 'Time period between reset of the underlying counter'
                                period-end-time:
                                  type: string
                                  description: 'Time when the counter values have been recorded and the counter reset'
                                transmit-level-minimum:
                                  type: integer
                                  description: 'Minimum transmit power in dBm'
                                transmit-level-maximum:
                                  type: integer
                                  description: 'Maximum transmit power in dBm'
                                transmit-level-average:
                                  type: integer
                                  description: 'Averaged transmit power in dBm'
                                receive-level-minimum:
                                  type: integer
                                  description: 'Minimum receive level in dBm'
                                receive-level-maximum:
                                  type: integer
                                  description: 'Maximum receive level in dBm'
                                receive-level-average:
                                  type: integer
                                  description: 'Averaged receive level in dBm'
                                signal-to-noise-ratio-minimum:
                                  type: integer
                                  description: 'Minimum signal to noise + interference ratio (SNIR)'
                                signal-to-noise-ratio-maximum:
                                  type: integer
                                  description: 'Maximum signal to noise + interference ratio (SNIR)'
                                signal-to-noise-ratio-average:
                                  type: integer
                                  description: 'Averaged signal to noise + interference ratio (SNIR)'
                                cross-polarization-discrimination-minimum:
                                  type: integer
                                  description: 'Minimum cross polarization discrimination (XPD)'
                                cross-polarization-discrimination-maximum:
                                  type: integer
                                  description: 'Maximum cross polarization discrimination (XPD)'
                                cross-polarization-discrimination-average:
                                  type: integer
                                  description: 'Averaged cross polarization discrimination (XPD)'
                                operated-transmission-modes-list: 
                                  description: 'List of operated transmission modes with respective operation time periods. Only those entries where operation time is greater than 0 seconds shall be listed'
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      transmission-mode-name:
                                        type: string
                                        description: 'Key attribute, name of the transmission mode'
                                      modulation-scheme-name-at-lct:
                                        type: string
                                        description: 'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                      time:
                                        type: integer
                                        description: 'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                      capacity:
                                        type: integer
                                        description: 'Channel capacity in kbps of the modulation scheme (KPI).'
                                interval-capacity:
                                  type: integer
                                  description: 'Channel capacity over the entire performance measurement interval in kbps. Calculated from the capacities of the operated transmission modes, by weighting the duration of each operated mode over the entire measurement period.To be filled with default value -1'
                                errorred-seconds:
                                  type: integer
                                  description: 'Number of errored seconds'
                                severely-errorred-seconds:
                                  type: integer
                                  description: 'Number of severily errored seconds'
                                consecutive-severely-errorred-seconds:
                                  type: integer
                                  description: 'Number of consecutive severily errored seconds'
                                total-unavailability:
                                  type: integer
                                  description: 'Total time of unavailability in seconds'
                                defect-blocks:
                                  type: integer
                                  description: 'Total number of blocks that were defect after receiving and could not be corrected by the FEC'
                                time-period:
                                  type: integer
                                  description: 'Total (actual) length of the measurement period'
                          transmission-mode-list:
                            description: 'List of supported Transmission Modes'
                            type: array
                            items:
                              type: object
                              properties:
                                transmission-mode-name:
                                  type: string
                                  description: 'Key attribute, name of the transmission mode'
                                number-of-states:
                                  type: integer
                                  description: 'Number of states in the phase diagram (e.g. BPSK->2 or 256QAM->256)'
                                modulation-scheme-name-at-lct:
                                  type: string
                                  description: 'Name identifying this transmission mode on the graphical user interface of the local craft terminal'
                                channel-bandwidth:
                                  type: integer
                                  description: 'Bandwidth of the transmit channel in kHz'
                                code-rate:
                                  type: integer
                                  description: 'Code rate of the coding scheme in %'
                                symbol-rate-reduction-factor:
                                  type: integer
                                  description: 'Reduction factor for the symbol rate. Example: value would be 4 for 1/4BPSK'
                    ethernet-container-list:
                      description: 'List of ethernet containers found in the given devices'
                      type: array
                      items:
                        type: object
                        properties:
                          ethernet-container-identifiers:
                            type: object
                            properties:
                              mount-name:
                                type: string
                                description: 'Identifier of the device at the controller and in the Telefónica planning tools'
                              interface-name:
                                type: string
                                description: 'Interface name of the EthernetContainer as it is represented at the vendors own management interface, e.g. LAN 1/6/6'
                              logical-termination-point-id:
                                type: string
                                description: 'Identifier of the ethernet container within the MW SDN domain'
                          ethernet-container-performance-measurements-list:
                            type: array
                            items:
                              type: object
                              properties:
                                granularity-period:
                                  type: string
                                  enum:
                                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                    - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                  description: 'Time period between reset of the underlying counter'
                                period-end-time:
                                  type: string
                                  description: 'Time when the counter values have been recorded and the counter reset'
                                max-bytes-per-second-output:
                                  type: string
                                  description: 'Counts the number of Bytes of Ethernet traffic (before header compression) transmitted within a second and keeps the highest value within the measurement period'
                                total-bytes-input:
                                  type: string
                                  description: 'Total number of Bytes of Ethernet traffic (before header compression) received during the measurement period'
                                total-bytes-output:
                                  type: string
                                  description: 'Total number of Bytes of Ethernet traffic (before header compression) transmitted (in direction out of the device) during the measurement period'
                                total-frames-input:
                                  type: string
                                  description: 'The total number of Ethernet frames received at this interface (including those received in error)'
                                total-frames-output:
                                  type: string
                                  description: 'The total number of Ethernet frames sent at this interface'
                                forwarded-frames-input:
                                  type: string
                                  description: 'Number of input frames at this interface, for which the device was not their final destination and for which the device attempted to find a route to forward them to that final destination'
                                forwarded-frames-output:
                                  type: string
                                  description: 'Number of frames at this interface, for which the device was not their final destination and for which it was successful in finding a path to their final destination'
                                unicast-frames-input:
                                  type: string
                                  description: 'Total number of unicast frames received at this interface'
                                unicast-frames-output:
                                  type: string
                                  description: 'Total number of unicast frames sent at this interface'
                                multicast-frames-input:
                                  type: integer
                                  description: 'Total number of multicast frames received at this interface'
                                multicast-frames-output:
                                  type: integer
                                  description: 'Total number of multicast frames sent at this interface'
                                broadcast-frames-input:
                                  type: integer
                                  description: 'Total number of broadcast frames received at this interface'
                                broadcast-frames-output:
                                  type: integer
                                  description: 'Total number of broadcast frames sent at this interface'
                                fragmented-frames-input:
                                  type: integer
                                  description: 'The total number of frames received that were less than 64 octets in length (excluding framing bits but including FCS octets) and had either a bad Frame Check Sequence (FCS) with an integral number of octets (FCS Error) or a bad FCS with a non-integral number of octets (Alignment Error)'
                                errored-frames-input:
                                  type: integer
                                  description: 'Total number of errored frames received at this interface'
                                errored-frames-output:
                                  type: integer
                                  description: 'Number of Ethernet frames, which were locally generated and discarded due to errors, including no route found to the destination'
                                dropped-frames-input:
                                  type: integer
                                  description: 'Total number of Ethernet frames dropped at the receiver. The number of input Ethernet frames, for which no problems were encountered to prevent their continued processing, but were discarded (e.g., for lack of buffer space)'
                                dropped-frames-output:
                                  type: integer
                                  description: 'The number of output Ethernet frames, for which no problem was encountered to prevent their transmission to their destination, but were discarded (e.g., for lack of buffer space)'
                                oversized-frames-ingress:
                                  type: string
                                  description: 'The total number of frames received that were longer than 1518 octets (excluding framing bits, but including FCS octets) and were otherwise well formed'
                                undersized-frames-ingress:
                                  type: string
                                  description: 'The total number of frames received that were less than 64 octets long (excluding framing bits, but including FCS octets) and were otherwise well formed'
                                jabber-frames-ingress:
                                  type: string
                                  description: 'Number of jabber frames received on the interface. Jabber frames are typically defined as oversize frames which also have a bad CRC. Implementations may use slightly different definitions of what constitutes a jabber frame. Often indicative of a NIC hardware problem'
                                unknown-protocol-frames-input:
                                  type: string
                                  description: 'Total number of received frames that were transporting an unknown protocol'
                                time-period:
                                  type: integer
                                  description: 'Total (actual) length of the measurement period'
                                transmit-traffic:
                                  type: number
                                  format: float
                                  description: 'TX Traffic [Mbps] KPI)'
                                receive-traffic:
                                  type: number
                                  format: float
                                  description: 'RX Traffic [Mbps] (KPI)'
                                frame-loss:
                                  type: integer
                                  description: 'The number of lost frames (KPI)'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        PreparingDsfpOutputCausesReadingLtpInfo:
          GetLtpInfo: # add url for /p1/provide-ltp-list-and-info-from-cache
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                        - mount-name
                      properties:
                        mount-name:
                          type: string
                          description: > 
                            'The mount-name of the device for which LTP structure and augment information is to be obtained
                            from {$request.body#mount-name}'
              responses:
                '200':
                  description: 'Augmented LTP structure provided from cache'
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          core-model-1-4:control-construct:
                            type: array
                            items:
                              type: object
                              properties:
                                logical-termination-point:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      uuid:
                                        type: string
                                        description: 'Identifier of the LTP'
                                      client-ltp:
                                        type: array
                                        items:
                                          type: string
                                        description: 'List of client LTPs of the LTP instance'
                                      server-ltp:
                                        type: array
                                        items:
                                          type: string
                                        description: 'List of server LTPs of the LTP instance'
                                      layer-protocol:
                                        type: array
                                        items:
                                          oneOf:
                                            - description: 'AirInterface'
                                              type: object
                                              properties:
                                                local-id:
                                                  type: string
                                                  description: 'Local-id of the layer protocol instance'
                                                layer-protocol-name:
                                                  type: string
                                                  enum:
                                                    - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                                  description: 'Name of the layer protocol instance'
                                                link-endpoint-id:
                                                  type: string
                                                  description: 'Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                                                link-id:
                                                  type: string
                                                  description: 'Identifier of the microwave link as used in the Telefonica planning tools.To be obtained by extracting the substring constituted by the 9 first characters'
                                                link-aggregation-identifiers:
                                                  type: array
                                                  description: 'Name of the physically aggregated resources, of type AirInterface or WireInterface, that are transporting fragments of the same Ethernet frames'
                                                  items:
                                                    oneOf:
                                                      - description: 'AirInterfaces'
                                                        type: object
                                                        required:
                                                          - link-id
                                                        properties:
                                                          link-id:
                                                            type: string
                                                            description: 'Identifier of the microwave link as used in the Telefonica planing tools'
                                                      - description: 'WireInterface'
                                                        type: object
                                                        required:
                                                          - interface-name
                                                        properties:
                                                          interface-name:
                                                            type: string
                                                            description: 'Interface name as it is represented at the vendors own management interface'
                                            - description: 'EthernetContainer'
                                              type: object
                                              properties:
                                                local-id:
                                                  type: string
                                                  description: 'Local-id of the layer protocol instance'
                                                layer-protocol-name:
                                                  type: string
                                                  description: 'Name of the layer protocol instance'
                                                interface-name:
                                                  type: string
                                                  description: 'Interface name of the EthernetContainer instance as it is represented at the vendors own management interface, e.g. LAN 1/6/6'
                                            - description: 'default'
                                              type: object
                                              properties:
                                                local-id:
                                                  type: string
                                                  description: 'Local-id of the layer protocol instance'
                                                layer-protocol-name:
                                                  type: string
                                                  description: 'Name of the layer protocol instance'
                              example:
                                core-model-1-4:control-construct:
                                  - logical-termination-point:
                                      - uuid: 'RF-819.1.2'
                                        client-ltp:
                                          - '513250010-PureEthStruc-45743677'
                                        server-ltp:
                                        layer-protocol:
                                          - local-id: '34534563'
                                            layer-protocol-name: 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                                            link-endpoint-id: '325551001A'
                                            link-id: '325551001'
                                            link-aggregation-identifiers:
                                              - link-id: '325551001'
                                              - link-id: '325551002'
                                      - uuid: 'ETH-765.1.3'
                                        client-ltp:
                                          - 'SYNC-765.1.3'
                                          - 'PTP-123.12.4'
                                        server-ltp:
                                          - 'PES-819.2.2'
                                        layer-protocol:
                                          - local-id: '765.1.3'
                                            layer-protocol-name: 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                                            interface-name: 'WAN 1/1/1'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
        PreparingDsfpOutputCausesReadingRecentAirInterfaceInfo:
          description: 'Repeat this for every air-interface from LTP structure retrieved in PreparingDsfpOutputCausesReadingLtpInfo'
          GetPmInfo: # add url for /p1/read-recent-air-interface-historical-pm-data-from-cache
            post:

########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOutOfDomainServiceRequests:
      description: 'Response in case of errored service requests from out of MW SDN domain'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    '429':
      description: 'Response in case too many requests need to be executed in parallel or too many requests have been received within a time period. The maximum number of parallel requests is defined in an IntegerProfile with the service name as a prefix and MaxNumberOfParallelRequests as a suffix. Some time period to elapse for throttling incomming requests is defined in an IntegerProfile with the service name as a prefix and ThrottlingPeriod as a suffix'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 429
                maximum: 429
                format: int32
              message:
                type: string
                enum:
                  - 'Too many requests'
    '460':
      description: 'Response in case the mountName provided in the request is not found in the list of connected devices'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 460
                maximum: 460
                format: int32
              message:
                type: string
                enum:
                  - 'Not connected. Requested device is currently not in connected state at the controller'
    '470':
      description: 'Response in case the resource specified in the request does not exist within the connected device'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 470
                maximum: 470
