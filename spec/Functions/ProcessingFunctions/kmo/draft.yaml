openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.0.0

paths:
########################################################################################################################
#   Service Layer - Individual Part
########################################################################################################################

  /p1/read-recent-ethernet-container-historical-pm-data-from-cache:
    post:
      operationId: p1ReadRecentEthernetContainerHistoricalPmDataFromCache
      summary: 'Reads recent EthernetContainer Historical Performance Data from Cache'
      tags:
        - PrivateServices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
                  description: 'The mount-name of the device that is addressed by this function'
                uuid:
                  type: string
                  description: 'The uuid of the LogicalTerminationPoint addressed in this function'
                  example: 'LTP-MWPS-TTP-1-1'
                local-id:
                  type: string
                  description: 'The localId of the LogicalTerminationPoint addressed in this function'
                  example: 'LP-MWPS-TTP-1-1'
                timestamp:
                  type: string
                  description: 'Only PM records newer than the given timestamp shall be read from the Cache. If not provided, all records will be read'
                  example: '2025-10-13T14:00:00+02:00'
      responses:
        '200':
          description: 'Recent historical EthernetContainer PM data provided'
          content:
            application/json:
              schema:
                description: 'Only relevant attributes listed'
                type: object
                properties:
                  ethernet-container-2-0:ethernet-container-historical-performances:
                    type: object
                    description: >
                      'The EthernetContainer historical performances with 15min granularity, which are not newer than {$request.body#timestamp}
                      from {$FunctionForReadingRecentEthernetContainerHistoricalPmCausesReadingFromElasticSearch.Pm.response.body}.
                      If there are no newer records found, the historical-performance-data-list remains empty.'
                    properties:
                      historical-performance-data-list:
                        type: array
                        items:
                          type: object
                          properties:
                            granularity-period:
                              type: string
                              enum:
                                - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                              description: 'If the granularity period does not indicate 15-min data, the complete array item is to be ignored'
                            period-end-time:
                              type: string
                              description: 'If the period-end-time is not newer than the provided timestamp from the requestBody, the complete array item is to be ignored'
                            max-bytes-per-second-output:
                              type: integer
                            total-bytes-input:
                              type: string
                              description: 'String representation of int64 value'
                            total-bytes-output:
                              type: string
                              description: 'String representation of int64 value'
                            total-frames-input:
                              type: string
                              description: 'String representation of int64 value'
                            total-frames-output:
                              type: string
                              description: 'String representation of int64 value'
                            forwarded-frames-input:
                              type: string
                              description: 'String representation of int64 value'
                            forwarded-frames-output:
                              type: string
                              description: 'String representation of int64 value'
                            unicast-frames-input:
                              type: string
                              description: 'String representation of int64 value'
                            unicast-frames-output:
                              type: string
                              description: 'String representation of int64 value'
                            multicast-frames-input:
                              type: integer
                            multicast-frames-output:
                              type: integer
                            broadcast-frames-input:
                              type: integer
                            broadcast-frames-output:
                              type: integer
                            fragmented-frames-input:
                              type: integer
                            errored-frames-input:
                              type: integer
                            errored-frames-output:
                              type: integer
                            dropped-frames-input:
                              type: integer
                            dropped-frames-output:
                              type: integer
                            oversized-frames-ingress:
                              type: string
                              description: 'String representation of int64 value'
                            undersized-frames-ingress:
                              type: string
                              description: 'String representation of int64 value'
                            jabber-frames-ingress:
                              type: string
                              description: 'String representation of int64 value'
                            unknown-protocol-frames-input:
                              type: string
                              description: 'String representation of int64 value'
                example:
                  ethernet-container-2-0:ethernet-container-historical-performance:
                    historical-performance-data-list:
                      - granularity-period: "ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN"
                        period-end-time: "2024-03-07T00:15:00.0+00:00"
                        max-bytes-per-second-output: 0
                        total-bytes-input: "0"
                        total-bytes-output: "0"
                        total-frames-input: "-1"
                        total-frames-output: "-1"
                        forwarded-frames-input: "-1"
                        forwarded-frames-output: "-1"
                        unicast-frames-input: "0"
                        unicast-frames-output: "0"
                        multicast-frames-input: 0
                        multicast-frames-output: 0
                        broadcast-frames-input: 0
                        broadcast-frames-output: 0
                        fragmented-frames-input: -1
                        errored-frames-input: 0
                        errored-frames-output: 0
                        dropped-frames-input: 0
                        dropped-frames-output: 0
                        oversized-frames-ingress: "-1"
                        undersized-frames-ingress: "-1"
                        jabber-frames-ingress: "-1"
                        unknown-protocol-frames-input: "-1"

        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        FunctionForReadingRecentEthernetContainerHistoricalPmCausesReadingFromElasticSearch:
          Pm: #[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-c-es-1-0-0-224/layer-protocol=0/operation-client-interface-1-0:operation-client-interface-pac/operation-client-interface-configuration/operation-name]
            description: 'Found records from historical-performance-data-list where granularity period does not indicate 15min granularity are not to be read'
            get:
              parameters:
                - name: mount-name
                  in: path
                  required: true
                  schema:
                    type: string
                    example: '222250001'
                  description: >
                    'The mount-name of the device that is addressed by this callback
                    from {$request.body#mount-name}'
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
                    example: 'LTP-MWPS-TTP-1-1'
                  description: >
                    'The UUID of a LogicalTerminationPoint that is addressed by the request
                    from {$request.body#uuid}'
                - name: local-id
                  in: path
                  required: true
                  schema:
                    type: string
                    example: 'LP-MWPS-TTP-1-1'
                  description: >
                    'The localID of a LogicalTerminationPoint that is addressed by the request
                    from {$request.body#local-id}'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          description: >
                            'Entries from the historical-performance-data-list where the period-end-time is not newer than the input timestamp are to be discarded
                            from {$requst.body#timestamp}'
              responses:
                '200':
                  description: 'EthernetContainerHistoricalPerformances provided from cache'
                  content:
                    application/json:
                      schema:
                        description: 'Only relevant attributes listed'
                        type: object
                        properties:
                          ethernet-container-2-0:ethernet-container-historical-performances:
                            type: object
                            properties:
                              historical-performance-data-list:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    granularity-period:
                                      type: string
                                      enum:
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                        - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      description: 'If the granularity period does not indicate 15-min data, the complete array item is to be ignored'
                                    period-end-time:
                                      type: string
                                      description: 'If the period-end-time is older than the provided timestamp from the requestBody, the complete array item is to be ignored'
                                    max-bytes-per-second-output:
                                      type: integer
                                    total-bytes-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-bytes-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    total-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    forwarded-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    forwarded-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unicast-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unicast-frames-output:
                                      type: string
                                      description: 'String representation of int64 value'
                                    multicast-frames-input:
                                      type: integer
                                    multicast-frames-output:
                                      type: integer
                                    broadcast-frames-input:
                                      type: integer
                                    broadcast-frames-output:
                                      type: integer
                                    fragmented-frames-input:
                                      type: integer
                                    errored-frames-input:
                                      type: integer
                                    errored-frames-output:
                                      type: integer
                                    dropped-frames-input:
                                      type: integer
                                    dropped-frames-output:
                                      type: integer
                                    oversized-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    undersized-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    jabber-frames-ingress:
                                      type: string
                                      description: 'String representation of int64 value'
                                    unknown-protocol-frames-input:
                                      type: string
                                      description: 'String representation of int64 value'
                        example:
                          ethernet-container-2-0:ethernet-container-historical-performance:
                            historical-performance-data-list:
                              - granularity-period: "ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN"
                                period-end-time: "2024-03-07T00:15:00.0+00:00"
                                max-bytes-per-second-output: 0
                                total-bytes-input: "0"
                                total-bytes-output: "0"
                                total-frames-input: "-1"
                                total-frames-output: "-1"
                                forwarded-frames-input: "-1"
                                forwarded-frames-output: "-1"
                                unicast-frames-input: "0"
                                unicast-frames-output: "0"
                                multicast-frames-input: 0
                                multicast-frames-output: 0
                                broadcast-frames-input: 0
                                broadcast-frames-output: 0
                                fragmented-frames-input: -1
                                errored-frames-input: 0
                                errored-frames-output: 0
                                dropped-frames-input: 0
                                dropped-frames-output: 0
                                oversized-frames-ingress: "-1"
                                undersized-frames-ingress: "-1"
                                jabber-frames-ingress: "-1"
                                unknown-protocol-frames-input: "-1"
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'



########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOutOfDomainServiceRequests:
      description: 'Response in case of errored service requests from out of MW SDN domain'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    '429':
      description: 'Response in case too many requests need to be executed in parallel or too many requests have been received within a time period. The maximum number of parallel requests is defined in an IntegerProfile with the service name as a prefix and MaxNumberOfParallelRequests as a suffix. Some time period to elapse for throttling incomming requests is defined in an IntegerProfile with the service name as a prefix and ThrottlingPeriod as a suffix'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 429
                maximum: 429
                format: int32
              message:
                type: string
                enum:
                  - 'Too many requests'
    '460':
      description: 'Response in case the mountName provided in the request is not found in the list of connected devices'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 460
                maximum: 460
                format: int32
              message:
                type: string
                enum:
                  - 'Not connected. Requested device is currently not in connected state at the controller'
    '470':
      description: 'Response in case the resource specified in the request does not exist within the connected device'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 470
                maximum: 470
                format: int32
              message:
                type: string
                enum:
                  - 'Resource not existing. Device informs about addressed resource unknown'
    '502':
      description: 'Response in case the application that is expected to provide a consumed service is not responding'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 502
                maximum: 502
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway'
    '530':
      description: 'Response in case the referenced resource exists (e.g. device connected and resource exists in internal datatree), but response data is either not available, lost during transmission, invalid, incomplete or corrupted'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 530
                maximum: 530
                format: int32
              message:
                type: string
                enum:
                  - 'Data invalid. Response data not available, incomplete or corrupted'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    genericRepresentation:
      type: object
      required:
        - response-value-list
        - consequent-action-list
      properties:
        response-value-list:
          type: array
          items:
            type: object
            required:
              - field-name
              - value
              - datatype
            properties:
              field-name:
                type: string
                description: >
                  'Field name
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/field-name]'
              value:
                type: string
                description: >
                  'Field value
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-configuration/value]'
              datatype:
                type: string
                description: >
                  'Field datatype
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/datatype]'
        consequent-action-list:
          type: array
          items:
            type: object
            required:
              - label
              - request
              - display-in-new-browser-window
            properties:
              label:
                type: string
                description: >
                  'Label that shall be presented on the button
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/label]'
              request:
                type: string
                description: >
                  'Request that shall be called, when button gets pressed
                  from
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-protocol}]
                  ://
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/ipv-4-address}
                  or
                  {/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/domain-name}]
                  :
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-port}]
                  [{/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-configuration/consequent-operation-reference}]'
              input-value-list:
                type: array
                items:
                  type: object
                  required:
                    - field-name
                  properties:
                    field-name:
                      type: string
                      description: >
                        'Name of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/name]'
                    unit:
                      type: string
                      description: >
                        'Unit of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/unit]'
              display-in-new-browser-window:
                type: boolean
                description: >
                  'True in case Request shall be represented in a new browser window
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/display-in-new-browser-window]'
    logicalTerminationPoint:
      type: object
      required:
        - uuid
        - ltp-direction
        - client-ltp
        - server-ltp
        - layer-protocol
      properties:
        uuid:
          type: string
        ltp-direction:
          type: string
        client-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        server-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        layer-protocol:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - description: 'operation server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-server-interface-1-0:operation-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-server-interface-1-0:operation-server-interface-pac:
                    type: object
                    required:
                      - operation-server-interface-capability
                      - operation-server-interface-configuration
                    properties:
                      operation-server-interface-capability:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-server-interface-configuration:
                        type: object
                        required:
                          - life-cycle-state
                        properties:
                          life-cycle-state:
                            type: string
              - description: 'http server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-server-interface-1-0:http-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-server-interface-1-0:http-server-interface-pac:
                    type: object
                    required:
                      - http-server-interface-capability
                    properties:
                      http-server-interface-capability:
                        type: object
                        required:
                          - application-name
                          - release-number
                          - data-update-period
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
                          data-update-period:
                            type: string
              - description: 'tcp server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-server-interface-1-0:tcp-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-server-interface-1-0:tcp-server-interface-pac:
                    type: object
                    required:
                      - tcp-server-interface-configuration
                    properties:
                      tcp-server-interface-configuration:
                        type: object
                        required:
                          - description
                          - local-protocol
                          - local-address
                          - local-port
                        properties:
                          description:
                            type: string
                          local-protocol:
                            type: string
                          local-address:
