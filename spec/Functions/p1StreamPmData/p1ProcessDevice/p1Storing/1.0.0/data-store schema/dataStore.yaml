data-store:
  type: object
  description: >
    'The dataStore accessed via {$data-store-es-client/data-store}'
  required:
    - device
  properties:
    device:
      type: array
      x-key: mount-name
      items:
        type: object
        required:
          - mount-name
          - interface
          - lot
        properties:
          mount-name:
            type: string
            description: 'mountName of the device'
          interface:
            type: array
            x-key: uuid
            description: >
              'The interface list contains all (relevant) previously seen interfaces along with the mostRecentPeriodEndTime information'
            items:
              type: object
              required:
                - uuid
                - layer-protocol-name
                - most-recent-period-end-time
                - most-recent-period-end-time-24
              properties:
                uuid:
                  type: string
                layer-protocol-name:
                  type: string
                  enum:
                    - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                    - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                most-recent-period-end-time:
                  type: string
                  description: 'The newest seen periodEndTime for this interface in 15min data'
                most-recent-period-end-time-24:
                  type: string
                  description: 'The newest seen periodEndTime for this interface in 24h data'
          lot:
            type: array
            description: >
              'The lot contains all previously stored resultCcs for this mountName, which not yet have expired'
            items:
              type: object
              x-key: timestamp
              # timestamps are not unified, so they are unknown -> add function to get the list of sortedTimestamps for a device for maintaining the lots
              required:
                - timestamp
                - result-cc
              properties:
                timestamp:
                  type: string
                  description: 'Timestamp when the result-cc was stored.'
                  pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
                result-cc:
                  type: object
                  description: >
                    'The result control construct data following ONF structure.
                    from [/process-device/result-cc]'