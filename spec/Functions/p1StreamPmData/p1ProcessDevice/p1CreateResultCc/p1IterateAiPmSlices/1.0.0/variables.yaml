iterate-ai-pm-slices:
  type: object
  required:
    - parameters
    - historical-performance-data-list
    - transmission-mode-list
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    historical-performance-data-list:
      type: array
      x-key: period-end-time
      description: >
        'historicalPerformanceDataList
        from {$input#/historical-performance-data-list}
        ! simplified representation !'
      items:
        type: object
        properties:
          granularity-period:
            type: string
          period-end-time:
            type: string
          performance-data:
            type: object
            description: >
              'historicalPerformanceData
              overwritten by {$p1RemoveOutOfRangeLevels.output#/performance-data}
              overwritten by {$p1RemoveDefaultValues.output#/input-object}'
            properties:
              interval-capacity:
                type: integer
                description: >
                  'intervalCapacity
                  from {$p1CalculateIntervalCapacity.output#/interval-capacity}'
    transmission-mode-list:
      type: array
      description: >
        'transmissionModeList
        from {$input#/transmission-mode-list}'

    most-recent-period-end-time:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'mostRecentPeriodEndTime
        initial value: {2010-11-20T14:00:00+01:00}
        overwritten by {$updateMostRecentPeriodEndTime.output#/most-recent-period-end-time}'
    most-recent-period-end-time-24:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'mostRecentPeriodEndTime24
        initial value: {2010-11-20T14:00:00+01:00}
        overwritten by {$updateMostRecentPeriodEndTime.output#/most-recent-period-end-time-24}'
