iterate-ai-pm-slices:
  type: object
  required:
    - parameters
    - historical-performance-data-list
    - transmission-mode-list
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    historical-performance-data-list:
      type: array
      x-key: period-end-time
      description: >
        'historicalPerformanceDataList
        from {$input#/historical-performance-data-list}'
      items:
        type: object
        properties:
          performance-data:
            type: object
            description: >
              'historicalPerformanceData
              overwritten by {$p1RemoveOutOfRangeLevels.output#/performance-data}
              overwritten by {$p1RemoveDefaultValues.output#/input-object}
              simplified listing here'
            properties:
              interval-capacity:
                type: integer
                description: >
                  'intervalCapacity
                  from {$p1CalculateIntervalCapacity.output#/interval-capacity}'
    transmission-mode-list:
      type: array
      description: >
        'transmissionModeList
        from {$input#/transmission-mode-list}'
