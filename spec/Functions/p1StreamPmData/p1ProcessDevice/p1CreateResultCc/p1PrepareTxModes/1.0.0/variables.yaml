prepare-tx-modes:
  type: object
  required:
    - historical-performance-data-list
    - transmission-mode-list
  properties:
    historical-performance-data-list:
      type: array
      x-key: period-end-time
      description: >
        'historicalPerformanceDataList
        from {$input#/historical-performance-data-list}'
      items:
        type: object
        properties:
          performance-data:
            type: object
            properties:
              time-xstates-list:
                type: array
                x-key: transmission-mode
                items:
                  type: object
                  description: >
                    'timeXstateEntry
                    entry to be deleted, if time == 0'
                  required:
                    - transmission-mode
                  properties:
                    transmission-mode:
                      type: string
                    time:
                      type: integer
              interval-capacity:
                type: integer
                description: >
                  'AirInterface capacity (according to chapter 6.5 of TR-532 v2.0) weighted by duration of operation of the respective transmission mode in kbps
                  from {$p1CalculateIntervalCapacity.output#/interval-capacity}'
    transmission-mode-list:
      type: array
      x-key: transmission-mode-name
      description: >
        'transmissionModeList
        from {$input#/transmission-mode-list}'
      items:
        type: object
        description: >
          'transmissionModeEntry
          entry to be deleted, if transmissionModeName not in [/prepare-tx-modes/used-transmission-mode-list]'
        properties:
          transmission-mode-name:
            type: string
          channel-bandwidth:
            type: integer
          modulation-scheme:
            type: integer
          code-rate:
            type: integer
          symbol-rate-reduction-factor:
            type: integer
          capacity:
            type: integer
            description: >
              'AirInterface capacity (according to chapter 6.5 of TR-532 v2.0) in kbps
              from {$p1CalculateAiCapacity.output#/air-interface-capacity}'
    used-transmission-mode-list:
      type: array
      description: >
        'List of transmission modes used in historicalPerformanceDataList
        IF [/prepare-tx-modes/historical-performance-data-list=*/performance-data/time-xstates-list=**/time] > 0
        THEN add [/prepare-tx-modes/historical-performance-data-list=*/performance-data/time-xstates-list=**/transmission-mode]'
      items:
        type: string

    air-interface-uuid:
      type: array
      description: >
        'List of UUIDs of AirInterface LTPs to be processed
        from [/create-result-cc/result-cc/logical-termination-point={air-interface-uuid[n]}/uuid]
          with [/create-result-cc/result-cc/logical-termination-point={air-interface-uuid[n]}/layer-protocol=*/layer-protocol-name] == "air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER"]'
      items:
        type: string
    ethernet-container-uuid:
      type: array
      description: >
        'List of UUIDs of EthernetContainer LTPs to be processed
        from [/create-result-cc/result-cc/logical-termination-point={ethernet-container-uuid[n]}/uuid]
          with [/create-result-cc/result-cc/logical-termination-point={ethernet-container-uuid[n]}/layer-protocol=*/layer-protocol-name] == "ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER"]'
      items:
        type: string
    aggregation-group-list:
      type: array
      description: >
        'List of Layer1AggregationGroups at the device'
      items:
        type: object
        properties:
          uuid:
            type: string
            description: >
              'UUID of Layer1AggregationGroup
              from [/create-result-cc/raw-cc/profile-collection/profile=*/uuid]
                with [/create-result-cc/raw-cc/profile-collection/profile=*/profile-name] == "PROFILE_NAME_TYPE_LAYER_1_AGGREGATION_PROFILE"'
          client-ltp:
            type: string
            description: >
              'UUID of transported EthernetContainer LTP
              from [/create-result-cc/raw-cc/profile-collection/profile=*/layer-1-aggregation-profile-1-0:layer-1-aggregation-profile-pac/l1-aggregation-profile-configuration/client-ltp]'
          server-ltp-list:
            type: array
            description: >
              'List of UUIDs of transporting PureEthernetStructure or HybridMwStructure LTPs
              from [/create-result-cc/raw-cc/profile-collection/profile=*/layer-1-aggregation-profile-1-0:layer-1-aggregation-profile-pac/l1-aggregation-profile-configuration/server-ltp-list]'
            items:
              type: string
          physical-server-ltp-list:
            type: array
            description: >
              'List of UUIDs of transporting AirInterface and WireInterface LTPs
              for every structure-ltp in [./server-ltp-list]
              from [/create-result-cc/raw-cc/logical-termination-point={structure-ltp}/server-ltp]'
            items:
              type: string
    result-cc:
      type: object
      description: >
        'ResultCc represents PM data after processing; follows ONF structure, but extended by additional attributes
        from {$createResultCcFromRawCc.output#/result-cc}'
      required:
        - equipment-augment-1-0:control-construct-pac
        - equipment
        - logical-termination-point
      properties:
        equipment-augment-1-0:control-construct-pac:
          type: object
          required:
            - external-label
            - device-model-name
          properties:
            external-label:
              type: string
            device-model-name:
              type: string
        equipment:
          type: array
          x-key: uuid
          items:
            type: object
            required:
              - uuid
              - actual-equipment
            properties:
              uuid:
                type: string
              actual-equipment:
                type: object
                required:
                  - local-id
                  - physical-properties
                  - structure
                properties:
                  local-id:
                    type: string
                  physical-properties:
                    type: object
                    required:
                      - temperature
                    properties:
                      temperature:
                        type: string
                  structure:
                    type: object
                    required:
                      - category
                    properties:
                      category:
                        type: string
                        enum:
                          - 'core-model-1-4:EQUIPMENT_CATEGORY_SUBRACK'
                          - 'core-model-1-4:EQUIPMENT_CATEGORY_CENTRAL_PROCESSING_UNIT'
        logical-termination-point:
          type: array
          x-key: uuid
          items:
            type: object
            required:
              - uuid
              - ltp-augment-1-0:ltp-augment-pac
              - layer-protocol
            properties:
              uuid:
                type: string
              client-ltp:
                type: array
                items:
                  type: string
              server-ltp:
                type: array
                items:
                  type: string
              parallel-ltp:
                type: array
                items:
                  type: string
                description: >
                  'List of UUIDs of parallel LTPs (AirInterfaces or WireInterfaces in the same Layer1AggregationGroup)
                  from {$findParallelPhysic.output#/physical-server-ltp-list}'
              ltp-augment-1-0:ltp-augment-pac:
                type: object
                properties:
                  external-label:
                    type: string
                    description: 'linkEndpointId - linkId+[AB] - Identifier of the microwave link endpoint as used in the Telefonica planning tools'
                  link-id:
                    type: string
                    description: >
                      'linkId
                      from {$substringLinkId.output#/link-id}'
                  original-ltp-name:
                    type: string
                    description: 'portName'
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - air-interface-2-0:air-interface-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-configuration:
                              type: object
                              properties:
                                transmission-mode-min:
                                  type: string
                                transmission-mode-max:
                                  type: string
                                tx-power:
                                  type: integer
                                atpc-is-on:
                                  type: boolean
                                atpc-thresh-upper:
                                  type: integer
                                atpc-thresh-lower:
                                  type: integer
                            air-interface-capability:
                              type: object
                              properties:
                                transmission-mode-list:
                                  type: array
                                  x-key: transmission-mode-name
                                  items:
                                    type: object
                                    properties:
                                      transmission-mode-name:
                                        type: string
                                      channel-bandwidth:
                                        type: integer
                                      modulation-scheme:
                                        type: integer
                                      modulation-scheme-name-at-lct:
                                        type: string
                                      code-rate:
                                        type: integer
                                      symbol-rate-reduction-factor:
                                        type: integer
                                      capacity:
                                        type: integer
                                        description: >
                                          'AirInterface capacity (according to chapter 6.5 of TR-532 v2.0) in kbps
                                          from {$p1CalculateAiCapacity.output#/air-interface-capacity}'
                            air-interface-historical-performances:
                              type: object
                              properties:
                                most-recent-period-end-time:
                                  type: string
                                  description: >
                                    'Most recent periodEndTime of a 15minutes slice in historicalPerformanceDataList
                                    from {$findMostRecentPeriodEndTime.output#/most-recent-period-end-time}'
                                most-recent-period-end-time-24:
                                  type: string
                                  description: >
                                    'Most recent periodEndTime of a 24hours slice in historicalPerformanceDataList
                                    from {$findMostRecentPeriodEndTime24.output#/most-recent-period-end-time-24}'
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          es:
                                            type: integer
                                          ses:
                                            type: integer
                                          cses:
                                            type: integer
                                          unavailability:
                                            type: integer
                                          tx-level-min:
                                            type: integer
                                          tx-level-max:
                                            type: integer
                                          tx-level-avg:
                                            type: integer
                                          rx-level-min:
                                            type: integer
                                          rx-level-max:
                                            type: integer
                                          rx-level-avg:
                                            type: integer
                                          time-xstates-list:
                                            type: array
                                            x-key: transmission-mode
                                            items:
                                              type: object
                                              required:
                                                - transmission-mode
                                              properties:
                                                transmission-mode:
                                                  type: string
                                                time:
                                                  type: integer
                                          # todo: intervalCapacity not in rawCc; origin to be explained
                                          interval-capacity:
                                            type: number
                                            format: float
                                            description: > 
                                              'Averaged capacity, calculated by weighting the operated transmission modes with the duration of their operation during the measurement period.
                                              not already available in this step, filled with default -1'
                                          snir-min:
                                            type: integer
                                          snir-max:
                                            type: integer
                                          snir-avg:
                                            type: integer
                                          xpd-min:
                                            type: integer
                                          xpd-max:
                                            type: integer
                                          xpd-avg:
                                            type: integer
                                          defect-blocks-sum:
                                            type: integer
                                          time-period:
                                            type: integer
                    - description: 'ethernet-container'
                      type: object
                      required:
                        - local-id
                        - layer-protocol-name
                        - ethernet-container-2-0:ethernet-container-pac
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                most-recent-period-end-time:
                                  type: string
                                  description: >
                                    'Most recent periodEndTime of a 15minutes slice in historicalPerformanceDataList
                                    from {$findMostRecentPeriodEndTime.output#/most-recent-period-end-time}'
                                most-recent-period-end-time-24:
                                  type: string
                                  description: >
                                    'Most recent periodEndTime of a 24hours slice in historicalPerformanceDataList
                                    from {$findMostRecentPeriodEndTime24.output#/most-recent-period-end-time-24}'
                                historical-performance-data-list:
                                  type: array
                                  x-key: period-end-time
                                  items:
                                    type: object
                                    required:
                                      - granularity-period
                                      - period-end-time
                                      - performance-data
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                      period-end-time:
                                        type: string
                                      performance-data:
                                        type: object
                                        properties:
                                          max-bytes-per-second-output:
                                            type: integer
                                          total-bytes-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-bytes-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          time-period:
                                            type: integer
                                          # todo: transmitTraffic not in rawCc; origin to be explained
                                          transmit-traffic:
                                            type: number
                                            format: float
                                            description: >
                                              'TX Traffic [Mbps] KPI)
                                              not already available in this step, filled with default -1'
                                          # todo: receiveTraffic not in rawCc; origin to be explained
                                          receive-traffic:
                                            type: number
                                            format: float
                                            description: >
                                              'RX Traffic [Mbps] (KPI)
                                              not already available in this step, filled with default -1'
                                          total-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          total-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          forwarded-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unicast-frames-output:
                                            type: string
                                            description: 'String representation of int64 value'
                                          multicast-frames-input:
                                            type: integer
                                          multicast-frames-output:
                                            type: integer
                                          broadcast-frames-input:
                                            type: integer
                                          broadcast-frames-output:
                                            type: integer
                                          fragmented-frames-input:
                                            type: integer
                                          errored-frames-input:
                                            type: integer
                                          errored-frames-output:
                                            type: integer
                                          dropped-frames-input:
                                            type: integer
                                          dropped-frames-output:
                                            type: integer
                                          # todo: frameLossInput not in rawCc; origin to be explained
                                          frame-loss-input:
                                            type: integer
                                            description: >
                                              'Sum of errored and dropped frames on the ingress (KPI)
                                              not already available in this step, filled with default -1'
                                          # todo: frameLossOutput not in rawCc; origin to be explained
                                          frame-loss-output:
                                            type: integer
                                            description: >
                                              'Sum of errored and dropped frames on the egress (KPI)
                                              not already available in this step, filled with default -1'
                                          oversized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          undersized-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          jabber-frames-ingress:
                                            type: string
                                            description: 'String representation of int64 value'
                                          unknown-protocol-frames-input:
                                            type: string
                                            description: 'String representation of int64 value'
