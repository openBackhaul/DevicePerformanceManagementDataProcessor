openapi: 3.0.0
info:
  title: p1IterateEcPmSlices
  version: 1.0.0

x-javascript-interface:
  p1IterateEcPmSlices:
    summary: 'Iterates through all EthernetContainer historical performance data slices and calls the processing Functions'
    input:
      required: true
      content:
        application/json:
          schema:
            required:
              - parameters
              - historical-performance-data-list
            properties:
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              historical-performance-data-list:
                type: array
                description: >
                  'historicalPerformanceDataList'
    output:
      success:
        description: 'historicalPerformanceDataList processed'
        content:
          application/json:
            schema:
              type: object
              required:
                - historical-performance-data-list
              properties:
                historical-performance-data-list:
                  type: array
                  description: >
                    'historicalPerformanceDataList
                    from [/iterate-ec-pm-slices/historical-performance-data-list]'
      error:
        description: 'historicalPerformanceDataList could not be processed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters incomplete'
                - 'parameters invalid'
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList incomplete'
                - 'historicalPerformanceDataList invalid'
                - 'Ethernet KPIs could not be calculated'
                - 'default values could not be removed'
                - 'historicalPerformanceDataList could not be processed'
                - 'General processing error'
    processing:
      p2CalculateEthernetKpis:
        summary: 'Adds Ethernet KPIs to a historicalPerformanceData set'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - historical-performance-data
                properties:
                  historical-performance-data:
                    type: array
                    description: >
                      'historicalPerformanceData set
                      from [/iterate-ec-pm-slices/historical-performance-data-list=*/performance-data]'
        output:
          success:
            description: 'Ethernet KPIs added'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - historical-performance-data
                  properties:
                    historical-performance-data:
                      type: array
                      description: >
                        'historicalPerformanceData'
          error:
            description: 'Ethernet KPIs could not be added'
            content:
              application/json:
                schema:
                  type: string
      p1RemoveDefaultValues:
        summary: 'Deletes attributes with default values from the transferred object'
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - input-object
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/iterate-ec-pm-slices/parameters/sub-function=p1RemoveDefaultValues]'
                  input-object:
                    type: object
                    description: >
                      'performanceData set of a single time period
                      from [/iterate-ec-pm-slices/historical-performance-data-list=*/performance-data]'
        output:
          success:
            description: 'Input object cleaned from attributes with default values'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - input-object
                  properties:
                    input-object:
                      type: object
                      description: >
                        'Data object from which attributes with default values have been removed'
          error:
            description: 'Input object could not be cleaned from attributes with default values'
            content:
              application/json:
                schema:
                  type: string

paths:
  /:
    description: 'no rest path provided by this module'
