discard-irrelevant-pm-records:
  type: object
  required:
    - historical-performance-data-list
  properties:
    historical-performance-data-list:
      type: array
      description: >
        'The list of historical PM records, that shall be filtered
        from {$input#historical-performance-data-list}'
      items:
        type: object
        required:
          - granularity-period
          - period-end-time
          - performance-data
        properties:
          granularity-period:
            type: string
            description: 'Indicates the granularity of the PM record'
          period-end-time:
            type: string
            description: 'The timestamp of this PM data record'
          performance-data:
            type: object
            description: 'The object containing actual PM data'
    offset:
      type: object
      description: >
        'The offset for the currently processed interface instance
        initialized by p2LoadRawCc for newly seen interfaces,
        to be updated by p2DiscardIrrelevantPmRecords'
      required:
        - uuid
        - most-recent-period-end-time
        - most-recent-period-end-time-24
      properties:
        uuid:
          type: string
          description: >
            'The interface instance uuid
            from {$input#/offset/uuid}'
        most-recent-period-end-time:
          type: string
          description: >
            'The newest 15min periodEndTime seen during previous runs
            or the default value from inialization.
            15min PM records not newer than the initial timestamp value are to be discarded,
            from {$input#/offset/most-recent-period-end-time},
            updated from {$updateOffset#new-most-recent-period-end-time}'
        most-recent-period-end-time-24:
          type: string
          description: >
            'The newest 24h periodEndTime seen during previous runs
            or the default value from inialization,
            24h PM records not newer than the initial timestamp value are to be discarded.
            from {$input#/offset/most-recent-period-end-time},
            updated from {$updateOffset#new-most-recent-period-end-time-24}'

    filtered-historical-performance-data-list:
      type: array
      description: >
        'The filtered list of historical PM records, after discarding irrelevant records
        from [/discard-irrelevant-pm-records/historical-performance-data-list]'

    new-most-recent-period-end-time:
      type: string
      description: >
        'Initialized 
        from [/discard-irrelevant-pm-records/offset/most-recent-period-end-time],
        updated with the newest periodEndTime seen across all 15min PM slices in the historicalPerformanceDataList'
    new-most-recent-period-end-time-24:
      type: string
      description: >
        'Initialized 
        from [/discard-irrelevant-pm-records/offset/most-recent-period-end-time-24],
        updated with the newest periodEndTime seen across all 15min PM slices in the historicalPerformanceDataList'
