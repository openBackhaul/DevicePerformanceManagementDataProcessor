openapi: 3.0.0
info:
  title: p2DiscardIrrelevantPmRecords
  version: 1.0.0

x-javascript-interface:
  p2DiscardIrrelevantPmRecords:
    summary: 'This function discards irrelevant PM records and computes updated offset information'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - historical-performance-data-list
              - offset
            properties:
              historical-performance-data-list:
                type: array
                description: 'The list of historical PM records, that shall be filtered'
              offset:
                type: object
                description: 'The offset object for the processed interface instance'
    output:
      success:
        description: 'filteredHistoricalPerformanceDataList and updated offset provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - filtered-historical-performance-data-list
                - offset
              properties:
                filtered-historical-performance-data-list:
                  type: array
                  description: >
                    'Filtered list of historical PM records
                    from [/discard-irrelevant-pm-records/filtered-historical-performance-data-list]'
                offset:
                  type: object
                  description: >
                    'The updated offset object
                    from [/discard-irrelevant-pm-records/offset]'
      error:
        description: 'filteredHistoricalPerformanceDataList and updated offset could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList invalid'
                - 'offset not provided'
                - 'offset invalid'
                - 'historicalPerformanceDataList filtering error'
                - 'offset update error'
                - 'General processing error'
    processing:
      updateOffset:
        

    # bsp
      readControlConstructFromReplica:
        url: # [{/load-raw-cc/mwdi-replica-url}][/control-construct={[/load-raw-cc/mount-name]}]
          description: 'Reads the complete ControlConstruct for the [/load-raw-cc/mount-name] from MWDI ElasticSearch replica.'
          output:
            success:
              description: 'Raw ControlConstruct data read'
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - core-model-1-4:control-construct
                    properties:
                      core-model-1-4:control-construct:
                        type: array
                        x-key: uuid
                        items:
                          type: object
            error:
              description: 'Data structure could not be read from ElasticSearch'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'Data structure is missing or invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error during reading'




paths:
  /:
    description: 'no rest path provided by this module'
