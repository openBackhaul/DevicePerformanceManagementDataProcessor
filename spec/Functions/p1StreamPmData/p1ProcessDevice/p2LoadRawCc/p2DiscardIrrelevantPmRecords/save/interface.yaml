openapi: 3.0.0
info:
  title: p2DiscardIrrelevantPmRecords
  version: 1.0.0

x-javascript-interface:
  p2DiscardIrrelevantPmRecords:
    summary: 'This function discards irrelevant PM records and computes updated offset information'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - historical-performance-data-list
              - offset
            properties:
              historical-performance-data-list:
                type: array
                description: 'The list of historical PM records, that shall be filtered'
              offset:
                type: object
                description: 'The offset object for the processed interface instance'
    output:
      success:
        description: 'filteredHistoricalPerformanceDataList and updated offset provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - filtered-historical-performance-data-list
                - offset
              properties:
                filtered-historical-performance-data-list:
                  type: array
                  description: >
                    'Filtered list of historical PM records
                    from [/discard-irrelevant-pm-records/filtered-historical-performance-data-list]'
                offset:
                  type: object
                  description: >
                    'The updated offset object
                    from [/discard-irrelevant-pm-records/offset]'
      error:
        description: 'filteredHistoricalPerformanceDataList and updated offset could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList invalid'
                - 'offset not provided'
                - 'offset invalid'
                - 'historicalPerformanceDataList filtering error'
                - 'offset update error'
                - 'General processing error'
    processing:
      updateOffset:
        description: 'Updates the mostRecentPeriodEndTimes in the offset with the newest periodEndTimes seen in historicalPerformanceDataList'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - new-most-recent-period-end-time
                  - new-most-recent-period-end-time-24
                properties:
                  new-most-recent-period-end-time:
                    type: string
                    description: >
                      'Newest mostRecentPeriodEndTime in 15min PM records
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time]'
                  new-most-recent-period-end-time-24:
                    type: string
                    description: >
                      'Newest mostRecentPeriodEndTime in 24h PM records
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time24]'
        output:
          success:
            description: 'Offset updated'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - offset
                  properties:
                    offset:
                      type: object
                      description: >
                        'The offset updated with newMostRecentPeriodEndTime input values
                        written into [/discard-irrelevant-pm-records/offset]'
          error:
            description: 'Offset could not be updated'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'NewMostRecentPeriodEndTime not provided'
                    - 'NewMostRecentPeriodEndTime invalid'
                    - 'NewMostRecentPeriodEndTime24 not provided'
                    - 'NewMostRecentPeriodEndTime24 invalid'
                    - 'Offset update error'
                    - 'General processing error during reading'




paths:
  /:
    description: 'no rest path provided by this module'
