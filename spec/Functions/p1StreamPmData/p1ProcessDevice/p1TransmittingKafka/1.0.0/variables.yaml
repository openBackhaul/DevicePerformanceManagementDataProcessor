transmitting-kafka:
  type: object
  required:
    - parameters
    - config-file
    - output-format
  properties:
    parameters:
      type: object
      description: >
        'Subtree of the parameters object for p1TransmittingKafka
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    output-format:
      type: array
      x-key: format-name
      description: >
        'Array of output formats potentially to be transmitted
        from {$input#/output-format}
        ! simplified representation !'
      items:
        type: object
        required:
          - format-name
          - output-format
        properties:
          format-name:
            type: string
            description: >
              'Name of the output format'
          output-format:
            type: object
            description: >
              'outputFormat'

    format-name:
      type: string
      description: >
        'FormatName
        from [/transmitting-kafka/output-format=*/format-name]'
    kafka-client-uuid:
      type: string
      description: >
        'KafkaClientUuid
        if [/transmitting-kafka/parameters/parameter={format-name}/purpose]==kafkaClient
        from [/transmitting-kafka/parameters/parameter={format-name}/value]'
    kafka-client:
      type: object
      description: >
        'Kafka client LTP object
        from [/transmitting-kafka/config-file/core-model-1-4:control-construct/logical-termination-point={[/transmitting-kafka/kafka-client-uuid]}]'
    topic-name:
      type: string
      description: >
        'Name of the Kafka topic to which the OutputFormat will be transmitted
        from [/transmitting-kafka/kafka-client/logical-termination-point/layer-protocol=0/kafka-client-interface-1-0:kafka-client-interface-pac/kafka-client-interface-configuration/topic-name]'
    message-object:
      type: object
      description: >
        'Object to be sent via Kafka
        from [/transmitting-kafka/output-format={format-name}/output-format]'
