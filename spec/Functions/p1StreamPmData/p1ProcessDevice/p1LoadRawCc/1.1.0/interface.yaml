openapi: 3.0.0
info:
  title: p1LoadRawCc
  version: 1.0.0

x-javascript-interface:
  p1LoadRawCc:
    summary: 'Reads device ControlConstruct from MWDI ES replica, applies filtering and returns the remaining data to the caller'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - mwdi-replica-es-client
              - data-store-es-client
              - mount-name
            properties:
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              mwdi-replica-es-client:
                type: object
                description: 'MWDI Replica ElasticSearch address'
              data-store-es-client:
                type: object
                description: 'Data Store ElasticSearch address'
              mount-name:
                type: string
                description: 'mountName of the device for which ControlConstruct data shall be read'
                mount-name: '100250001'
    output:
      success:
        description: 'rawCc loaded'
        content:
          application/json:
            schema:
              type: object
              required:
                - raw-cc
              properties:
                raw-cc:
                  type: object
                  description: >
                    'rawCc read from Replica ES, but reduced by irrelevant data
                    from [/load-raw-cc/raw-cc]'
      error:
        description: 'rawCc could not be loaded'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'mwdiReplicaEsClient not provided'
                - 'mwdiReplicaEsClient invalid'
                - 'dataStoreEsClient not provided'
                - 'dataStoreEsClient invalid'
                - 'mountName not provided'
                - 'mountName invalid'
                - 'rawCc could not be provided'
                - 'General processing error'
    processing:
      readControlConstructFromReplica:
        url: # [{/load-raw-cc/mwdi-replica-url}][/control-construct={[/load-raw-cc/mount-name]}]
          description: 'Reads the complete ControlConstruct for the [/load-raw-cc/mount-name] from MWDI ElasticSearch replica.'
          output:
            success:
              description: 'Raw ControlConstruct data read'
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - core-model-1-4:control-construct
                    properties:
                      core-model-1-4:control-construct:
                        type: array
                        x-key: uuid
                        items:
                          type: object
            error:
              description: 'Data structure could not be read from ElasticSearch'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'Data structure is missing or invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error during reading'
      p1FieldsFilter:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - data-structure
                  - fields-filter-string
                properties:
                  data-structure:
                    type: object
                    description: >
                      'The data structure to be filtered according to the provided fields filter string.
                      It is the raw ControlConstruct content (the object found in the first array element of core-model-1-4:control-construct, without the core-model-1-4:control-construct keyword itself)
                      from [/load-raw-cc/raw-cc]'
                  fields-filter-string:
                    type: string
                    description: >
                      'Fields filter string following NETCONF FieldsFilter syntax and semantics to be applied to the data structure,
                      from [/load-raw-cc/fields-filter]'
        output:
          success:
            description: 'Data structure successfully filtered according to the provided fields filter string'
            content:
              application/json:
                schema:
                  type: object
                properties:
                  filtered-data-structure:
                    type: object
                    description: 'The data structure after filtering according to the provided fields filter string'
          error:
            description: 'Data structure could not be filtered according to the provided fields filter string'
            content:
              application/json:
                schema:
                  type: string
      retrieveMostRecentPeriodEndTimesFromDs:
        url: # [{/load-raw-cc/data-store-url}][/data-store/device={/load-raw-cc/mount-name}/interface-metadata-list]
          description: 'Reads the timestamps of the most recent 15min and 24h PM data records of all interfaces.'
          output:
            success:
              description: 'interfaceMetadataList provided'
              content:
                application/json:
                  schema:
                    type: array
                    x-key: uuid
                    description: >
                      'interfaceMetadataList'
            error:
              # TODO: when a device is processed for the first time, there is no interfaceMetadataList, as there's no dataStore record for this device
              # in that case this processing step would throw an error.
              # Here, missing mostRecentPeriodEndTimes are not critical. We will just keep all PM records that we see,
              # but in other cases an error can be a more serious problem
              # maybe we need to define different types of errors and how they are to be handled (e.g. abortion vs ignore)?
              description: 'interfaceMetadataList could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'interfaceMetadataList could not be provided'
                      - 'General processing error'
      p1DiscardIrrelevantPmRecords:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                - historical-performance-data-list
                properties:
                  historical-performance-data-list:
                    type: array
                    description: >
                      'The list of historical PM records, that shall be filtered
                      from [/load-raw-cc/raw-cc/logical-termination-point={uuid}/layer-protocol=*/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list or /load-raw-cc/raw-cc/logical-termination-point=*/layer-protocol=*/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list]'
                  relevant-granularities:
                    type: string
                    enum:
                      - ':GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN$'
                      - ':GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS$'
                      - ':GRANULARITY_PERIOD_TYPE_PERIOD-(?:15-MIN|24-HOURS)$'
                    description: >
                      'An (optional) regex pattern indicating which data granularities are to be kept.
                      If not provided as input, both 15min and 24h are kept.
                      from [/load-raw-cc/relevant-granularities]'
                  most-recent-period-end-time:
                    type: string
                    description: >
                      '15min PM records not newer than this timestamp are to be discarded.
                      If not provided, any 15min record passes.
                      from [/load-raw-cc/interface-metadata-list={uuid}/most-recent-period-end-time]'
                  most-recent-period-end-time-24:
                    type: string
                    description: >
                      '24h PM records not newer than this timestamp are to be discarded.
                      If not provided, any 24h record passes.
                      from [/load-raw-cc/interface-metadata-list={uuid}/most-recent-period-end-time-24]'
        output:
          success:
            description: 'filteredHistoricalPerformanceDataList provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - filtered-historical-performance-data-list
                  properties:
                    filtered-historical-performance-data-list:
                      type: array
                      description: >
                        'Filtered list of historical PM records'
          error:
            description: 'filteredHistoricalPerformanceDataList could not be provided'
            content:
              application/json:
                schema:
                  type: string
      addBatchTimestamp:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - current-performance-timestamp
                properties:
                  current-performance-timestamp:
                    type: string
                    description: >
                      'Timestamp of current performance data
                      from [/load-raw-cc/raw-cc/logical-termination-point=*/layer-protocol=*/air-interface-2-0:air-interface-pac/air-interface-current-performance/timestamp]'
                  batch-timestamp:
                    type: string
                    description: >
                      'Timestamp when the CC was read from the device
                      from [/load-raw-cc/raw-cc/batch-timestamp], if not already existing 2010-11-20T14:00:00+01:00 to be used'
        output:
          success:
            description: 'batchTimestamp provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - batch-timestamp
                  properties:
                    batch-timestamp:
                      type: string
                      description: >
                        'Timestamp when the CC was read from the device
                        if [$input#current-performance-timestamp] > [$input#batch-timestamp]
                        from [$input#batch-timestamp]'
            error:
              description: 'batchTimestamp could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'currentPerformanceTimestamp not provided'
                      - 'currentPerformanceTimestamp invalid'
                      - 'batchTimestamp not provided'
                      - 'batchTimestamp invalid'
                      - 'batchTimestamp could not be provided'
                      - 'General processing error'

paths:
  /:
    description: 'no rest path provided by this module'
