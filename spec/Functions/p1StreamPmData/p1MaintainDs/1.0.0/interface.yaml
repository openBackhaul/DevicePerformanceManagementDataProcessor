openapi: 3.0.0
info:
  title: p1MaintainDs
  version: 1.0.0

#REDO

x-javascript-interface:
  p1MaintainDs:
    summary: 'Maintains the dataStore by cleaning up expired data.'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - data-store-es-client
            properties:
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings'
              data-store-es-client:
                type: object
                description: >
                  'Data Store ElasticSearch address'
    output:
      # there is no success output as this is an ongoing process with an indefinite loop
      error:
        description: 'DataStore maintenance failed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Parameters missing or invalid'
                - 'DataStoreEsClient missing or invalid'
                - 'DataStore error'
                - 'General processing error'
    processing:
      description: >
        'The cleanup is executed cycically, according to the time interval
        from [/maintain-ds/cleanup-period]'
      readMountNamesInDs:
        url: # [{/maintain-ds/data-store-url}][/data-store/device]
        output:
          success:
            description: 'MountNames from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - mount-names
                  properties:
                    mount-names:
                      type: array
                      items:
                        type: string
                      description: >
                        'For each device in the data-store read the mountName and add it to the mountNames list.'
      p1MaintainDeviceInDs:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - data-store-es-client
                  - retention-period
                  - mount-name
                properties:
                  data-store-es-client:
                    type: object
                    description: >
                      'Data Store ElasticSearch address
                      from [/maintain-ds/data-store-es-client]'
                  retention-period:
                    type: string
                    description: >
                      'Retention period until data expires
                      from [/maintain-ds/retention-period]'
                  mount-name:
                    type: string
                    description: >
                      'MountName of currently processed device
                      from [/maintain-ds/mount-names=*]'
        output:
          success:
            description: 'Maintainance of device in dataStore completed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Device in dataStore maintained'
          error:
            description: 'Device maintenance in dataStore failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'DataStoreEsClient missing or invalid'
                    - 'RetentionPeriod missing or invalid'
                    - 'MountName missing or invalid'
                    - 'DataStore error'
                    - 'General processing error'
paths:
  /:
    description: 'no rest path provided by this module'