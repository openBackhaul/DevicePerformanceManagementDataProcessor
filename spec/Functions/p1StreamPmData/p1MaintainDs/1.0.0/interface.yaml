openapi: 3.0.0
info:
  title: p1MaintainDs
  version: 1.0.0

x-javascript-interface:
  p1MaintainDs:
    summary: 'Maintains the dataStore by cleaning up expired data.'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - data-store-es-client
            properties:
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings'
              data-store-es-client:
                type: object
                description: >
                  'Data Store ElasticSearch address'
    output:
      success:
        description: >
          'Success will not be indicated as this Function implements an endless process in an infinite loop'
      error:
        description: 'DataStore maintenance failed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'dataStoreEsClient not provided'
                - 'dataStoreEsClient invalid'
                - 'DataStore error'
                - 'General processing error'
    processing:
      description: >
        'The cleanup process is re-started with a delay of one [/maintain-ds/cleanup-period] after it has been started last time'
      retrieveListOfDevices:
        url: # [{/maintain-ds/data-store-url}]
          description: >
            'A request has to be addressed to ES for retrieving the list of mountNames from [/data-store/device=*/mount-name]'
          output:
            success:
              description: 'Device list read'
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      type: string
                    description: >
                      'List of mountNames of all devices in the DataStore'
            error:
              description: 'Device list could not be read'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error'
      lockDevice:
        url: # [{/maintain-ds/data-store-url}]
          description: >
            'Parallel writing of a performance data batch shall be prevented'
          input:
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - mount-name
                  properties:
                    mount-name:
                      type: string
                      description: >
                        'mountName of the device that shall be locked
                        from [/maintain-ds/device-list[*]]'
          output:
            success:
              description: 'Device locked'
            error:
              description: 'Device could not be locked'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'ElasticSearch lock error'
                      - 'General processing error'
      readDeviceDataFromDs:
        url: # [{/maintain-ds/data-store-url}][/data-store/device={/maintain-ds/device-list[*]}]
          description: 'Reads the complete data of one of the devices from the DataStore'
          output:
            success:
              description: 'Device data read'
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - device-data
                    properties:
                      device-data:
                        type: object
            error:
              description: 'Device data could not be read'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error'
      deleteExpiredBatches:
        description: 'Deletes batches with batchTimestamp older than retentionPeriod from batchList'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - batch-list
                  - retention-period
                properties:
                  batch-list:
                    type: array
                    description: >
                      'batchList
                      from [/maintain-ds/device-data/batch]'
                  retention-period:
                    type: 
                    description: >
                      'retentionPeriod
                      from [/maintain-ds/retention-period]'
        output:
          success:
            description: 'batchList cleaned'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    batch-list:
                      type: array
                      x-key: batch-timestamp
                      items:
                        type: object
                        description: >
                          'batch to be deleted from batchList,
                          if [./batch-timestamp] older than {$input#/retention-period}'
          error:
            description: 'batchList could not be cleaned'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'batchList not provided'
                    - 'batchList invalid'
                    - 'retentionPeriod not provided'
                    - 'retentionPeriod invalid'
                    - 'General processing error'
      writeDeviceDataToDs:
        url: # [{/maintain-ds/data-store-url}][/data-store/device={/maintain-ds/device-list[*]}]
          description: 'Writes the complete data of one of the devices to the DataStore'
          input:
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - device-data
                  properties:
                    device-data:
                      type: object
                      description: >
                        'deviceData
                        from [/maintain-ds/device-data]'
          output:
            success:
              description: 'deviceData written'
            error:
              description: 'deviceData could not be written'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'deviceData not provided'
                      - 'deviceData invalid'
                      - 'ElasticSearch write error'
                      - 'General processing error'
      unlockDevice:
        url: # [{/maintain-ds/data-store-url}]
          description: >
            'Writing of performance data batches shall be enabled again'
          input:
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - mount-name
                  properties:
                    mount-name:
                      type: string
                      description: >
                        'mountName of the device that shall be unlocked
                        from [/maintain-ds/device-list[*]]'

          output:
            success:
              description: 'Device unlocked'
            error:
              description: 'Device could not be unlocked'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'ElasticSearch unlock error'
                      - 'General processing error'

paths:
  /:
    description: 'no rest path provided by this module'