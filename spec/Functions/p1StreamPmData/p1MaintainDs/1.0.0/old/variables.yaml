maintain-ds:
  type: object
  required:
    - parameters
    - config-file
    - data-store-es-client
    - data-store
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/load-raw-cc/data-store-es-client/url]'


    # inputs/outputs
    data-store-device-list:
      type: array
      description: >
        'The list of mountNames of devices in the dataStore.
        from {$p1MaintainDs.readDeviceListFromDataStore.output/data-store-device-list}'
      items:
        type: string
        description: >
          'The mountName as found in [/data-store/device/mount-name]'

    current-mount-name:
      type: string
      description: >
        'The currently traversed mountName of [/maintain-ds/data-store-device-list]
        from {$p1MaintainDs.readListOfInterfaces.input/mount-name}'

    interface:
      type: array
      description: >
        'The currently read interface array
        from {$p1MaintainDs.readListOfInterfaces.output/interface}'
      x-key: uuid
      items:
        type: object
        required:
          - uuid
          - layer-protocol-name
          - most-recent-period-end-time
          - most-recent-period-end-time-24
        properties:
          uuid:
            type: string
          layer-protocol-name:
            type: string
            enum:
              - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
              - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
          most-recent-period-end-time:
            type: string
          most-recent-period-end-time-24:
            type: string

      list-of-interface-uuids:
        type: array
        description: >
          'The list of uuids for the currently traversed mountName [/maintain-ds/current-mount-name]
          from {$p1MaintainDs.readListOfInterfaceIds.output}'
        items:
          type: string



    # wo muss der DataStore angeben werden??
    data-store:
      type: object
      description: >
        'The dataStore from
        {$input/data-store-es-client/data-store}'
      required:
        - device
      properties:
        device:
          type: array
          x-key: mount-name
          items:
            type: object
            required:
              - mount-name
              - interface
              - lot
            properties:
              mount-name:
                type: string
                description: >
                  'mountName of the device
                  from [/process-device/mount-name]'
              interface:
                type: array
                x-key: uuid
                description: >
                  'The interface list contains all (relevant) previously seen interfaces along with the mostRecentPeriodEndTime information'
                items:
                  type: object
                  required:
                    - uuid
                    - layer-protocol-name
                    - most-recent-period-end-time
                    - most-recent-period-end-time-24
                  properties:
                    uuid:
                      type: string
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                    most-recent-period-end-time:
                      type: string
                      description: 'The newest seen periodEndTime for this interface in 15min data'
                    most-recent-period-end-time-24:
                      type: string
                      description: 'The newest seen periodEndTime for this interface in 24h data'
              lot:
                type: array
                description: >
                  'The lot contains all previously derived resultCcs for this mountName, which not yet have expired'
                items:
                  type: object
                  #proposal: add timestamp as x-key for easier access
                  #a complementary service could be created to return the timestamps of a lot...
                  required:
                    - timestamp
                    - result-cc
                  properties:
                    timestamp:
                      type: string
                      description: 'Timestamp when the result-cc was stored.'
                      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
                    result-cc:
                      type: object
                      description: >
                        'The result control construct data following ONF structure.
                        from [/process-device/result-cc]'