maintain-ds:
  type: object
  required:
    - parameters
    - data-store-es-client
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'

    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/read-lot-timestamps-from-ds/data-store-es-client/url]'
    cleanup-period:
      type: string
      description: >
        'Time period for cleaning up expired entries in the DataStore in hours
        from [/maintain-ds/parameters/parameter={dataStoreCleanupPeriod}/value]'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from [/maintain-ds/parameters/parameter={dataStoreRetentionPeriod}/value]'

    mount-names:
      type: array
      items:
        type: string
      description: >
        'The list contains the mountNames (x-key) of devices in the dataStore
        from {$readMountNamesInDs.output#mount-names}'



        
    interface:
      type: array
      x-key: uuid
      items:
        type: object
      description: >
        'The interfaces stored for a device in the dataStore
        from {$getDeviceInterfaces.output#interface}'
      interface-count:
        type: integer
        description: >
          'The number of interface instances in the interface object of a device
          from {$GetNumberOfDeviceInterfaces.output/interface-count}'
      sorted-lot-timestamps:
        type: array
        items:
          type: string
        description: >
          'The list of all timestamps in a devices lot in the dataStore, sorted from oldest to newest data
          from {$p1ReadLotTimestampsFromDs.output/sorted-lot-timestamps}'

    # for iterating over devices and interfaces
    mount-name:
      type: string
      description: >
        'MountName,
        from {$getDeviceInterfaces.input#/mount-name}'
    current-interface:
      type: object
      description: >
        'Currently processed interface instance of interface
        from {$deleteExpiredInterface.input/current-interface}'