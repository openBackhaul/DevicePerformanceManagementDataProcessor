maintain-ds:
  type: object
  required:
    - parameters
    - data-store-es-client
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'

    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/read-lot-timestamps-from-ds/data-store-es-client/url]'
    cleanup-period:
      type: string
      description: >
        'Time period for cleaning up expired entries in the DataStore in hours
        from [/maintain-ds/parameters/parameter={dataStoreCleanupPeriod}/value]'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from [/maintain-ds/parameters/parameter={dataStoreRetentionPeriod}/value]'

    mount-names:
      type: array
      items:
        type: string
      description: >
        'The list contains the mountNames (x-key) of devices in the dataStore
        from {$readMountNamesInDs.output#mount-names}'
    sorted-batch-timestamps:
      type: array
      items: string
      description: >
        'List of sorted batch timestamps (from oldest to newest) for the currently processed mountName
        from {$p1GetSortedBatchTimestampsFromDs.output#/sorted-batch-timestamps}'

    mount-name:
      type: string
      description: >
        'Currently processed mountName
         from [/maintain-ds/mount-names[n]]''
    timestamp:
      type: string
      description: >
        'Currently processed batch timestamp
         from [/maintain-ds/sorted-batch-timestamps[n]]''
    batch-count:
      type: integer
      description: >
        'The number of batches for the current mountName in the dataStore
        from {$getBatchesCountFromDs.output#/batch-count}'
