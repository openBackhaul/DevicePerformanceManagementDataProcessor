maintain-dev-interface-in-ds:
  type: object
  required:
    - parameters
    - config-file
    - data-store-es-client
    - mount-name
    - interface-instance
    - retention-period
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/read-lot-timestamps-from-ds/data-store-es-client/url]'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from {$input#/retention-period}''
    mount-name:
      type: string
      description: >
        'The mountName identifying the target device in the dataStore
        from {$input#/mount-name}'
    interface-instance:
      type: object
      description: >
        'The data of the interface instance to be maintained
        from {$input#/interface-instance}'
    uuid:
      type: object
      description: >
        'The xKey identifying the target interface instance in the dataStore
        from {$input#/interface-instance/uuid}'