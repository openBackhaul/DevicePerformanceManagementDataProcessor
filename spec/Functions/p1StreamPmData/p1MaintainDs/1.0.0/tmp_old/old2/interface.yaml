openapi: 3.0.0
info:
  title: p1MaintainDs
  version: 1.0.0

x-javascript-interface:
  p1MaintainDs:
    summary: 'Maintains the dataStore by cleaning up expired data.'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - config-file
              - data-store-es-client
            properties:
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings'
              config-file:
                type: object
                description: >
                  'configFile content'
              data-store-es-client:
                type: object
                description: >
                  'Data Store ElasticSearch address'
    output:
      # there is no success output as this is an ongoing process with an indefinite loop
      error:
        description: 'DataStore maintenance failed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Parameters missing or invalid'
                - 'Config file missing or invalid'
                - 'DataStoreEsClient missing or invalid'
                - 'DataStore error'
                - 'General processing error'
    processing:
      description: >
        'The cleanup is executed cycically, the time interval for that is read
        from [/maintain-ds/cleanup-period]'
      readMountNamesInDs:
        url: # [{/maintain-ds/data-store-url}][/data-store/device]
        output:
          success:
            description: 'List of mountNames from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - mount-name-list
                  properties:
                    mount-name-list:
                      type: array
                      items:
                        type: string
                      description: >
                        'For each device in the data-store only the mount-name must be read and added to the mount-name-list
                        from [{/maintain-ds/data-store-url}][/data-store/device/mount-name]'
      getDeviceInterfaces:
        url: #  [{/maintain-ds/data-store-url}][/data-store/device={/maintain-ds/mount-name}/interface]
        description: >
          'For each mountName
          from [/maintain-ds/mount-name-list] read the interface object
          from [/data-store/device=mount-name/interface],
          execute the remaining steps from the diagram before the interface for the next mountName is read'
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - mount-name
                properties:
                  mount-name:
                    type: string
                    description: >
                      'Currently processed mountName
                      from {$readMountNamesInDs.output/mount-name-list}, written
                      to [/maintain-ds/mount-name]'
        output:
          success:
            description: 'Interface of the device provided'
            content:
              application/json:
                schema:
                  required:
                    - interface
                  properties:
                    interface:
                      type: array
                      x-key: uuid'
                      items:
                        type: object
                        required:
                          - uuid
                          - layer-protocol-name
                          - most-recent-period-end-time
                          - most-recent-period-end-time-24
                        properties:
                          uuid:
                            type: string
                          layer-protocol-name:
                            type: string
                          most-recent-period-end-time:
                            type: string
                          most-recent-period-end-time-24:
                            type: string
          error:
            description: 'Reading interfaces from dataStore failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'MountName missing or invalid'
                    - 'Interface data in dataStore missing or invalid'
                    - 'General processing error'
      deleteExpiredInterface:
        url: #  [{/maintain-ds/data-store-url}][/data-store/device={/maintain-ds/mount-name}/interface={/maintain-ds/{input/current-interface.uuid}}]
        description: >
          'Iterate over [maintain-ds/interface]. The currently processed record is written
          to [/maintain-ds/current-interface].'
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - mount-name
                  - current-interface
                properties:
                  mount-name:
                    type: string
                    description: >
                      'Currently processed mountName
                      from [/maintain-ds/mount-name]'
                  current-interface:
                    type: object
                    description: >
                      'IF (current-interface.most-recent-period-end-time && current-interface.most-recent-period-end-time are older than allowed by [/maintain-ds/retention-period]
                      THEN delete this interface instance from the dataStore, i.e. delete
                      [/data-store/device=mountName/interface=current-interface.uuid]'
                    properties:
                      uuid:
                        type: string
                      layer-protocol-name:
                        type: string
                      most-recent-period-end-time:
                        type: string
                      most-recent-period-end-time-24:
                        type: string
        output:
          success:
            description: 'Interface expiration handling completed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'Expired interface deleted'
                    - 'Not-expired interface is kept'
          error:
            description: 'Deletion of expired interface from dataStore failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'MountName missing or invalid'
                    - 'Interface data missing or invalid'
                    - 'DataStore access error'
                    - 'General processing error'
      getNumberOfDeviceInterfaces:
        url: #  [{/maintain-ds/data-store-url}][/data-store/device={/maintain-ds/mount-name}/interface]
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - mount-name
                properties:
                  mount-name:
                    type: object
                    description: >
                      'Currently processed mountName
                      from [/maintain-ds/mount-name]'
        output:
          success:
            description: 'Number of interfaces provided'
            content:
              application/json:
                schema:
                  required:
                    - interface-count
                  properties:
                    interface-count:
                      type: integer
                      description: >
                        'The number of interfaces for the input mountName'
          error:
            description: 'Could not read interface count from dataStore'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'MountName missing or invalid'
                    - 'DataStore access error'
                    - 'General processing error'
      

    #bsp
      readTimestampsFromDs:
        url: # [{/read-lot-timestamps-from-ds/data-store-url}][/data-store/device={/read-lot-timestamps-from-ds/mount-name}/lot]
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - mount-name
                properties:
                  mount-name:
                    type: object
                    description: >
                      'MountName
                      from [/read-lot-timestamps-from-ds/mount-name]'
        output:
          success:
            description: 'Lot timestamp data from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - lot-timestamp-list
                  properties:
                    lot-timestamp-list:
                      type: array
                      items:
                        type: string
                      description: >
                        'From the lot for the device in the dataStore: [/data-store/device=mountName/lot],
                        iterate over each array item in the lot and extract the timestamp [/data-store/device=mountName/lot/timestamp],
                        add each found timestamp to the lot-timestamp-list.'
          error:
            description: 'Reading lot timestamps failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'MountName missing or invalid'
                    - 'Lot data misssing or invalid'
                    - 'General processing error'
      sortTimestamps:
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - lot-timestamp-list
                properties:
                  lot-timestamp-list:
                    type: array
                    items:
                      type: string
                    description: >
                      'List of unsorted lot timestamps
                      from [/read-lot-timestamps-from-ds/lot-timestamp-list]'
        output:
          success:
            description: 'Lot timestamp data from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - sorted-lot-timestamp-list
                  properties:
                    lot-timestamp-list:
                      type: array
                      items:
                        type: string
                      description: >
                        'List of lot timestamps
                        from {$input/lot-timestamp-list} sorted from oldest to newest timestamp value'
paths:
  /:
    description: 'no rest path provided by this module'