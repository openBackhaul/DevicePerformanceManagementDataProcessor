maintain-ds:
  type: object
  required:
    - parameters
    - config-file
    - data-store-es-client
    - mount-name
    - retention-period
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/read-lot-timestamps-from-ds/data-store-es-client/url]'
    mount-name:
      type: string
      description: >
        'MountName,
        from {$input#/mount-name}'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from {$input#/retention-period}'
