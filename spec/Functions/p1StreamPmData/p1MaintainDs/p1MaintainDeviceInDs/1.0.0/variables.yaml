maintain-device-in-ds:
  type: object
  required:
    - data-store-es-client
    - retention-period
    - mount-name
  properties:
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from {$input#/retention-period}'
    mount-name:
      type: string
      description: >
        'MountName,
        from {$input#/mount-name}'

    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/maintain-device-in-ds/data-store-es-client/url]'

    interface-metadata:
      type: array
      items:
        type: object
      description: >
        'The interface list of the device from dataStore
        from {$GetDeviceInterfaces.output#/interface-metadata}'

    interface:
      type: object
      description: >
        'The currently processed interface instance
        from [/maintain-device-in-ds/interface-metadata=*]'
      #from verschieben in interface
    interface-count:
      type: integer
      description: >
        'The size of the interface list in the dataStore
        from {$GetInterfaceCount.output#/interface-count}'
    sorted-batch-timestamps:
      type: array
      items:
        type: string
      description: >
        'The list of batch timestamps, sorted from oldest to newest timestamp
        from {$p1GetSortedBatchTimestampsFromDs.output#/sorted-batch-timestamps}'