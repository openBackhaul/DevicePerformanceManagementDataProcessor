maintain-device-in-ds:
  type: object
  required:
    - parameters
    - config-file
    - data-store-es-client
    - mount-name
    - retention-period
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/maintain-device-in-ds/data-store-es-client/url]'
    mount-name:
      type: string
      description: >
        'MountName,
        from {$input#/mount-name}'
    retention-period:
      type: string
      description: >
        'RetentionPeriod in hours until data expires
        from {$input#/retention-period}'
    interface:
      type: array
      items:
        type: object
      description: >
        'The interface list of the device from dataStore
        from {$GetDeviceInterfaces.output#/interface}'
    interface-instance:
      type: object
      description: >
        'The currently processed interface instance from interface'
    interface-count:
      type: integer
      description: >
        'The size of the interface list in the dataStore
        from {$GetInterfaceCount.output#/interface-count}'
    sorted-lot-timestamps:
      type: array
      items:
        type: string
      description: >
        'The list of lot timestamps, sorted from oldest to newest timestamp
        from {$p1ReadLotTimestampsFromDs.output#/sorted-lot-timestamps}'