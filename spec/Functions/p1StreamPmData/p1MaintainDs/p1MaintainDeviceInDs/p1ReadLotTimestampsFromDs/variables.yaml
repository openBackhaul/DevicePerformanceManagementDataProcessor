read-lot-timestamps-from-ds:
  type: object
  required:
    - parameters
    - config-file
    - data-store-es-client
    - mount-name
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$input#/config-file}'
    data-store-es-client:
      type: object
      description: >
        'Data Store ElasticSearch address
        from {$input#/data-store-es-client}'
    data-store-url:
      type: string
      description: >
        'ElasticSearch URL of Data Store ES
        from [/read-lot-timestamps-from-ds/data-store-es-client/url]'
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    lot-timestamp-list:
      type: array
      items:
        type: string
      description: >
        'Unsorted list of lot timestamps read from dataStore for input mountName
        from {$ReadTimestampsFromDs.output/lot-timestamp-list}'
    sorted-lot-timestamp-list:
      type: array
      items:
        type: string
      description: >
        'Sorted list of lot timestamps for input mountName
        from {$sortTimestamps.output/sorted-lot-timestamp-list}'
