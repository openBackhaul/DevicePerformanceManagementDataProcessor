openapi: 3.0.0
info:
  title: p1ReadLotTimestampsForDs
  version: 1.0.0

x-javascript-interface:
  p1ReadLotTimestampsForDs:
    summary: 'Reads the lot timestamps from the dataStore and returns them as a sorted list'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - config-file
              - mount-name
              - data-store-es-client
            properties:
              parameters:
                type: object
                description: >
                  'Hierarchical object holding the parameter settings'
              config-file:
                type: object
                description: >
                  'configFile content'
              mount-name:
                type: string
                description: >
                  'MountName'
              data-store-es-client:
                type: object
                description: >
                  'Data Store ElasticSearch address'
    output:
      success:
        description: 'Sorted list of lot timestamps provided'
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              description: >
                'The list of sorted lot timestamps (from old to new)
                from [/read-lot-timestamps-from-ds/sorted-lot-timestamp-list]'
      error:
        description: 'Reading lot timestamps failed'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'Input data missing or invalid'
                - 'Mount name not found'
                - 'Parameters missing or invalid'
                - 'Config file missing or invalid'
                - 'General processing error'
    processing:
      readTimestampsFromDs:
        url: # [{/read-lot-timestamps-from-ds/data-store-url}][/data-store/device={/read-lot-timestamps-from-ds/mount-name}/lot]
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - mount-name
                properties:
                  mount-name:
                    type: object
                    description: >
                      'MountName
                      from [/read-lot-timestamps-from-ds/mount-name]'
        output:
          success:
            description: 'Lot timestamp data from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - lot-timestamp-list
                  properties:
                    lot-timestamp-list:
                      type: array
                      items:
                        type: string
                      description: >
                        'From the lot for the device in the dataStore: [/data-store/device=mountName/lot],
                        iterate over each array item in the lot and extract the timestamp [/data-store/device=mountName/lot/timestamp],
                        add each found timestamp to the lot-timestamp-list.'
          error:
            description: 'Reading lot timestamps failed'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'MountName missing or invalid'
                    - 'Lot data misssing or invalid'
                    - 'General processing error'
      sortTimestamps:
        input:
          required: true
          content:
            application/json:
              schema:
                required:
                  - lot-timestamp-list
                properties:
                  lot-timestamp-list:
                    type: array
                    items:
                      type: string
                    description: >
                      'List of unsorted lot timestamps
                      from [/read-lot-timestamps-from-ds/lot-timestamp-list]'
        output:
          success:
            description: 'Lot timestamp data from dataStore provided'
            content:
              application/json:
                schema:
                  required:
                    - sorted-lot-timestamp-list
                  properties:
                    lot-timestamp-list:
                      type: array
                      items:
                        type: string
                      description: >
                        'List of lot timestamps
                        from {$input/lot-timestamp-list} sorted from oldest to newest timestamp value'
paths:
  /:
    description: 'no rest path provided by this module'