openapi: 3.0.0
info:
  title: p1InitKafka
  version: 1.0.0

x-javascript-interface:
  p1InitKafka:
    summary: 'Resolves Kafka address and initializes the Kafka producer session'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - config-file
            properties:
              parameters:
                type: object
                description: >
                  'Subtree of the parameters object for p1InitKafka'
              config-file:
                type: object
                description: >
                  'configFile content'
    output:
      success:
        description: 'Kafka session successfully established'
      error:
        description: 'Kafka session could not be established'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters missing'
                - 'parameters invalid'
                - 'config-file missing'
                - 'config-file invalid'
                - 'Kafka address could not be resolved'
                - 'Kafka session initialization failed'
                - 'Producer connection to kafka failed'
                - 'Consumer connection to kafka failed'
                - 'general processing error'
    processing:
      kafkaProducerService.connect:
        summary: 'This function connects to kafka broker'
        input:
          content:
            application/json:
              schema:
                required:
                  - clientId
                  - brokers
                properties:
                  clientId:
                    type: string
                    description: >
                      'Identifier of client to be sent to kafka broker
                      from [/init-kafka/client={kafkaClientName}/client-id]'
                  brokers:
                    type: array
                    items:
                      type: string
                      description: >
                        'host:port combination composed from IP address or domain name and port
                        from [/init-kafka/client={kafkaClientName}/url]'
        output:
          success:
            description: 'Producer successfully connected to kafka client'
            content:
              application/json:
                schema:
                  type: boolean
                  description: 'true'
          error:
            description: 'Producer connection to kafka failed'
            content:
              application/json:
                schema:
                  type: boolean
                  description: 'false'
      kafkaConsumerService.connect:
        summary: 'This function connects to kafka broker'
        input:
          content:
            application/json:
              schema:
                required:
                  - groupId
                  - clientId
                  - brokers
                properties:
                  groupId:
                    type: string
                    description: >
                      'Identifier of consumer group to be sent to kafka broker
                      from [/init-kafka/client={kafkaClientName}/group-id]'
                  clientId:
                    type: string
                    description: >
                      'Identifier of client to be sent to kafka broker
                      from [/init-kafka/client={kafkaClientName}/client-id]'
                  brokers:
                    type: array
                    description: >
                      'List of brokers for kafka to be connected
                      from [/init-kafka/client={kafkaClientName}/brokers]'
        output:
          success:
            description: 'Consumer successfully connected to kafka broker'
            content:
              application/json:
                schema:
                  type: boolean
                  description: 'true'
        error:
          description: 'Consumer connection to kafka failed'
          content:
            application/json:
              schema:
                type: boolean
                description: 'false'

paths:
  /:
    description: 'no rest path provided by this module'
