iterate-ec-pm-slices:
  type: object
  required:
    - parameters
    - historical-performance-data-list
    - aggregation-group
    - result-cc
    - interface-status
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    historical-performance-data-list:
      type: array
      x-key: granularity-period, period-end-time
      description: >
        'historicalPerformanceDataList
        from {$input#/historical-performance-data-list}
        ! simplified representation !'
      items:
        type: object
        properties:
          granularity-period:
            type: string
          period-end-time:
            type: string
          performance-data:
            type: object
            description: >
              'historicalPerformanceData
              overwritten by {$p1CalculateEthernetKpis.output#/historical-performance-data}
              overwritten by {$p1RemoveDefaultValues.output#/cleaned-object}'
            properties:
              transmit-traffic:
                type: integer
                description: >
                  'transmitTraffic in Mbps
                  requires {$p1CalculateEthernetKpis}'
              receive-traffic:
                type: integer
                description: >
                  'receiveTraffic in Mbps
                  requires {$p1CalculateEthernetKpis}'
              frame-loss-input:
                type: integer
                description: >
                  'Sum of errored and dropped frames on the ingress
                  requires {$p1CalculateEthernetKpis}'
              frame-loss-output:
                type: integer
                description: >
                  'Sum of errored and dropped frames on the egress
                  requires {$p1CalculateEthernetKpis}'
    aggregation-group:
      type: object
      description: >
        'aggregationGroup
        from {$input#/aggregation-group}'
    result-cc:
      type: object
      description: >
        'resultCc
        from {$input#/result-cc}'
    interface-status:
      type: object
      description: >
        'status at the interface based on already processed batches
        from {$input#/interface-status}
        overwritten by {$p1CategorizeDataVolume.output#/interface-status}'
      required:
        - uuid
      properties:
        uuid:
          type: string
          description: >
            'UUID of the interface (EthernetContainer)'
        15-minute-values-by-day:
          type: array
          x-key: day
          minItems: 1
          maxItems: 2
          description: >
            'to be initialized, if not already existing for the day indicated in the periodEndTime of the currently processed 15-min period
            eldest entry to be deleted first'
          items:
            type: object
            required:
              - day
              - 15-minute-values-by-hour
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 31
                description: >
                  'day of month
                  if to be initialized, to be parsed from [/iterate-ec-pm-slices/historical-performance-data-list=*/period-end-time]'
              15-minute-values-by-hour:
                type: array
                x-key: hour
                minItems: 24
                maxItems: 24
                description: >
                  'to be initialized, if not already existing'
                items:
                  type: object
                  required:
                    - hour
                    - 15-minute-values
                  properties:
                    hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: >
                        'hour of day
                        if to be initialized, from { [0,23] }'
                    15-minute-values:
                      type: array
                      minItems: 0
                      maxItems: 4
                      description: >
                        'PM data
                        array content addressed based on index instead of key attribute
                        if to be initialized, from { null }'
                      items:
                        type: object
                        required:
                          - period-end-time
                        properties:
                          period-end-time:
                            type: string
                          total-bytes-output:
                            type: integer
                          total-air-interface-interval-capacity:
                            type: integer
                          errored-frames-input:
                            type: integer
                          dropped-frames-input:
                            type: integer
