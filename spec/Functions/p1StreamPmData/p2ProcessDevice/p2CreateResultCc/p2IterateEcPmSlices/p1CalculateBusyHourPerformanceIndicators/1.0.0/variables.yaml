calculate-busy-hour-performance-indicators:
  type: object
  required:
    - historical-performance-data
    - interface-status
  properties:
    historical-performance-data:
      type: object
      description: >
        'historicalPerformanceData set
        from {$input#/historical-performance-data}
        ! simplified representation, just changes documented !'
      properties:
        granularity-period:
          type: string
        period-end-time:
          type: string
        performance-data:
          type: object
          properties:
            busy-hour:
              type: object
              description: >
                'busy hour KPIs
                from {$calculateBusyHourKpis.output#/busy-hour-values}'
    interface-status:
      type: object
      description: >
        'interface status derived from iterating the 15-min periods
        from {$input#/interface-status}'
      required:
        - uuid
      properties:
        uuid:
          type: string
          description: >
            'UUID of the interface (EthernetContainer)'
        15-minute-values-by-day:
          type: array
          x-key: day
          minItems: 1
          maxItems: 2
          description: >
            'instance to be initialized, if not already existing for [/categorize-data-volume/day] 
            eldest entry to be deleted first'
          items:
            type: object
            required:
              - day
              - 15-minute-values-by-hour
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 31
                description: >
                  'day of month
                  if to be initialized, to be parsed from [/iterate-ec-pm-slices/historical-performance-data-list=*/period-end-time]'
              15-minute-values-by-hour:
                type: array
                x-key: hour
                minItems: 24
                maxItems: 24
                description: >
                  'to be initialized, if not already existing'
                items:
                  type: object
                  required:
                    - hour
                    - 15-minute-values
                  properties:
                    hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                      description: >
                        'hour of day
                        if to be initialized, from { [0,23] }'
                    15-minute-values:
                      type: array
                      minItems: 0
                      maxItems: 4
                      description: >
                        'PM data
                        array content addressed based on index instead of key attribute
                        if to be initialized, from { null }
                        overwritten by {$categorizePmData.output#/15-minute-values}'
                      items:
                        type: object
                        required:
                          - period-end-time
                        properties:
                          period-end-time:
                            type: string
                          total-bytes-output:
                            type: integer
                          total-air-interface-interval-capacity:
                            type: integer
                          errored-frames-input:
                            type: integer
                          dropped-frames-input:
                            type: integer

    day:
      type: integer
      description: >
        'day of month to be parsed from periodEndTime of the currently processed 24-hours period
        parsing the day from [/historical-performance-data/period-end-time]'
    aggregated-total-bytes-output-by-hour:
      type: array
      x-key: hour
      description: >
        'Aggregated total bytes output grouped by hour of the day
        from {$aggregateTotalBytesOutput.output#/aggregated-total-bytes-output-by-hour}'
    busy-hour-identifier:
      type: object
      required:
        - hour
        - aggregated-total-bytes-output
      properties:
        hour:
          type: integer
          description: >
            'hour of day with the highest aggregated total bytes output
            from {$identifyBusyHour.output#/hour}'
        aggregated-total-bytes-output:
          type: integer
          description: >
            'total bytes output during the busy hour
            from {$identifyBusyHour.output#/aggregated-total-bytes-output}'
