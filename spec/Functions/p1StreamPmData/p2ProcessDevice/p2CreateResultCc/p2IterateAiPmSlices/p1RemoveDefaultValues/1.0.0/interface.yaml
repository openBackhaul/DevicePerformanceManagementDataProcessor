openapi: 3.0.0
info:
  title: p1RemoveDefaultValues
  version: 1.0.0

x-javascript-interface:
  p1RemoveDefaultValues:
    summary: 'Deletes attributes with default values from the transferred object'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - input-object
            properties:
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              input-object:
                type: object
                description: >
                  'Data object from which attributes with default values are to be removed'
    output:
      success:
        description: 'Input object cleaned from attributes with default values'
        content:
          application/json:
            schema:
              type: object
              required:
                - cleaned-object
              properties:
                cleaned-object:
                  type: object
                  description: >
                    'Data object from which attributes with default values have been removed
                    from [/remove-default-values/input-object]'
      error:
        description: 'Input object could not be cleaned from attributes with default values'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'inputObject not provided'
                - 'inputObject invalid'
                - 'cleanedObject could not be provided'
                - 'general processing error'

paths:
  /:
    description: 'no rest path provided by this module'
