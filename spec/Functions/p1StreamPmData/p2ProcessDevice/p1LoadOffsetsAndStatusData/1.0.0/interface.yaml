openapi: 3.0.0
info:
  title: p1LoadOffsetsAndStatusData
  version: 1.0.0

x-javascript-interface:
  p1LoadOffsetsAndStatusData:
    summary: 'Loads offsets and statusData for a device from the dataStore'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - data-store-es-client
              - mount-name
            properties:
              data-store-es-client:
                type: object
                description: 'Data Store ElasticSearch address'
              mount-name:
                type: string
                description: 'mountName of the device for which ControlConstruct data shall be read'
                mount-name: '100250001'
    output:
      success:
        description: 'Offsets and statusData from dataStore provided'
        content:
          application/json:
            schema:
              type: object
              properties:
                offsets:
                  type: array
                  description: >
                    'Offsets
                    from [/load-offsets-and-status-data/offsets]'
                statusData:
                  type: array
                  description: >
                    'StatusData
                    from [/load-offsets-and-status-data/statusData]'
      error:
        description: 'Offsets and statusData could not be read from dataStore'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'dataStoreUrl not provided'
                - 'dataStoreUrl invalid'
                - 'mountName not provided'
                - 'mountName invalid'
                - 'ElasticSearch read error'
                - 'general processing error'
    processing:
      retrieveOffsetsFromDs:
        url: # [{/p1-load-offsets-and-status-data/data-store-url}][/data-store/device={/p1-load-offsets-and-status-data/mount-name}/offsets]
          description: 'Load offsets from dataStore'
          output:
            success:
              description: 'Offsets from dataStore provided'
              content:
                application/json:
                  schema:
                    type: array
                    description: >
                      'Offsets for the device
                      from [/data-store/device={/p1-load-offsets-and-status-data/mount-name}/offsets]'
            error:
              description: 'Offsets from dataStore could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'ElasticSearch read error for offsets'
                      - 'general processing error'
      retrieveStatusDataFromDs:
        url: # [{/p1-load-offsets-and-status-data/data-store-url}][/data-store/device={/p1-load-offsets-and-status-data/mount-name}/status-data]
          description: 'Load statusData from dataStore'
          output:
            success:
              description: 'StatusData from dataStore provided'
              content:
                application/json:
                  schema:
                    type: array
                    description: >
                      'StatusData for the device
                      from [/data-store/device={/p1-load-offsets-and-status-data/mount-name}/status-data]'
            error:
              description: 'StatusData from dataStore could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'dataStoreUrl not provided'
                      - 'dataStoreUrl invalid'
                      - 'mountName not provided'
                      - 'mountName invalid'
                      - 'ElasticSearch read error for status-data'
                      - 'general processing error'
  
paths:
  /:
    description: 'no rest path provided by this module'
