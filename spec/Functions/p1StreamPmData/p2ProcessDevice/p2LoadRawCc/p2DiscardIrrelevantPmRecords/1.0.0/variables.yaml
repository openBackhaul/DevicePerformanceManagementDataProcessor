discard-irrelevant-pm-records:
  type: object
  required:
    - historical-performance-data-list
    - offset
  properties:
    historical-performance-data-list:
      type: array
      description: >
        'The list of historical PM records, that shall be filtered
        from {$input#historical-performance-data-list}'
      items:
        type: object
        required:
          - granularity-period
          - period-end-time
          - performance-data
        properties:
          granularity-period:
            type: string
            description: 'Indicates the granularity of the PM record'
          period-end-time:
            type: string
            description: 'The timestamp of this PM data record'
          performance-data:
            type: object
            description: 'The object containing actual PM data'
    offset:
      type: object
      description: >
        'The offset for the currently processed interface instance'
      required:
        - uuid
        - most-recent-period-end-time
        - most-recent-period-end-time-24
      properties:
        uuid:
          type: string
          description: >
            'The interface instance uuid
            from {$input#/offset/uuid}
        most-recent-period-end-time:
          type: string
          description: >
            'The newest 15min periodEndTime seen during previous runs (or the default value)
            15min PM records not newer than the initial timestamp value are to be discarded,
            from {$input#/offset/most-recent-period-end-time}
            overwritten by {$updateOffset.output#/most-recent-period-end-time}'
        most-recent-period-end-time-24:
          type: string
          description: >
            'The newest 24h periodEndTime seen during previous runs (or default value).
            24h PM records not newer than the initial timestamp value are to be discarded,
            from {$input#/offset/most-recent-period-end-time-24}
            overwritten by {$updateOffset.output#/most-recent-period-end-time-24}'

    filtered-historical-performance-data-list:
      type: array
      description: >
        'The filtered list of historical PM records, after discarding irrelevant records
        from [/discard-irrelevant-pm-records/historical-performance-data-list]'

    new-most-recent-period-end-time:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'newMostRecentPeriodEndTime
        initial value: {2010-11-20T14:00:00+01:00}
        overwritten by {$updateMostRecentPeriodEndTime.output#/most-recent-period-end-time}'
    new-most-recent-period-end-time-24:
      type: string
      pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
      description: >
        'newMostRecentPeriodEndTime24
        initial value: {2010-11-20T14:00:00+01:00}
        overwritten by {$updateMostRecentPeriodEndTime.output#/most-recent-period-end-time-24}'