openapi: 3.0.0
info:
  title: p2DiscardIrrelevantPmRecords
  version: 1.0.0

x-javascript-interface:
  p2DiscardIrrelevantPmRecords:
    summary: 'This function discards irrelevant PM records and computes updated offset information'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - historical-performance-data-list
              - offset
            properties:
              historical-performance-data-list:
                type: array
                description: 'The list of historical PM records, that shall be filtered'
              offset:
                type: object
                description: 'The offset object for the processed interface instance'
    output:
      success:
        description: 'filteredHistoricalPerformanceDataList and updated offset provided'
        content:
          application/json:
            schema:
              type: object
              required:
                - filtered-historical-performance-data-list
                - offset
              properties:
                filtered-historical-performance-data-list:
                  type: array
                  description: >
                    'Filtered list of historical PM records
                    from [/discard-irrelevant-pm-records/filtered-historical-performance-data-list]'
                offset:
                  type: object
                  description: >
                    'The updated offset object
                    from [/discard-irrelevant-pm-records/offset]'
      error:
        description: 'filteredHistoricalPerformanceDataList and updated offset could not be provided'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'historicalPerformanceDataList not provided'
                - 'historicalPerformanceDataList invalid'
                - 'offset not provided'
                - 'offset invalid'
                - 'historicalPerformanceDataList filtering error'
                - 'updateNewMostRecentPeriodEndTime update error'
                - 'offset update error'
                - 'general processing error'
    processing:
      updateNewMostRecentPeriodEndTime:
        summary: 'Overwrites newMostRecentPeriodEndTime or newMostRecentPeriodEndTime24 with latest value (means, most recent date) of periodEndTime (includes periodEndTimes from discarded records).'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - new-most-recent-period-end-time
                  - new-most-recent-period-end-time-24
                  - granularity-period
                  - period-end-time
                properties:
                  new-most-recent-period-end-time:
                    type: string
                    description: >
                      'newMostRecentPeriodEndTime
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time]'
                  new-most-recent-period-end-time-24:
                    type: string
                    description: >
                      'newMostRecentPeriodEndTime24
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time-24]'
                  granularity-period:
                    type: string
                    description: >
                      'granularityPeriod
                      from [/discard-irrelevant-pm-records/historical-performance-data-list=*/granularity-period]'
                  period-end-time:
                    type: string
                    description: >
                      'periodEndTime
                      from [/discard-irrelevant-pm-records/historical-performance-data-list=*/period-end-time]'
        output:
          success:
            description: 'newMostRecentPeriodEndTime provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - new-most-recent-period-end-time
                    - new-most-recent-period-end-time-24
                  properties:
                    new-most-recent-period-end-time:
                      type: string
                      description: >
                        'newMostRecentPeriodEndTime
                        from {$input#period-end-time} if ( ({$input#granularity-period} indicates 15-MIN) AND ({$input#period-end-time} > {$input#new-most-recent-period-end-time}) )'
                    new-most-recent-period-end-time-24:
                      type: string
                      description: >
                        'newMostRecentPeriodEndTime24
                        from {$input#period-end-time} if ( ({$input#granularity-period} indicates 24-HOURS) AND ({$input#period-end-time} > {$input#new-most-recent-period-end-time-24}) )'
          error:
            description: 'newMostRecentPeriodEndTime could not be provided'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'newMostRecentPeriodEndTime not provided'
                    - 'newMostRecentPeriodEndTime invalid'
                    - 'newMostRecentPeriodEndTime24 not provided'
                    - 'newMostRecentPeriodEndTime24 invalid'
                    - 'granularityPeriod not provided'
                    - 'granularityPeriod invalid'
                    - 'periodEndTime not provided'
                    - 'periodEndTime invalid'
                    - 'newMostRecentPeriodEndTime could not be provided'
                    - 'general processing error'

      updateOffset:
        description: 'Updates the mostRecentPeriodEndTimes in the offset with newMostRecentPeriodEndTimes'
        input:
          content:
            application/json:
              schema:
                type: object
                required:
                  - new-most-recent-period-end-time
                  - new-most-recent-period-end-time-24
                  - offset
                properties:
                  new-most-recent-period-end-time:
                    type: string
                    description: >
                      'newMostRecentPeriodEndTime for 15min
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time]'
                  new-most-recent-period-end-time-24:
                    type: string
                    description: >
                      'newMostRecentPeriodEndTime24 for 24h
                      from [/discard-irrelevant-pm-records/new-most-recent-period-end-time24]'
                  offset:
                    type: object
        output:
          success:
            description: 'Offset updated'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - offset
                  properties:
                    offset:
                      type: object
                      description: >
                        'The updated offset object
                        ! simplified representation, just changes documented !'
                      properties:
                        most-recent-period-end-time:
                          type: string
                          description: >
                            'potentially updated most-recent-period-end-time
                            from maximum of ( {$updateOffset.input#/new-most-recent-period-end-time}, {$updateOffset.input#/offset/most-recent-period-end-time} )'
                        most-recent-period-end-time-24:
                          type: string
                          description: >
                            'potentially updated most-recent-period-end-time-24
                            from maximum of ( {$updateOffset.input#/new-most-recent-period-end-time-24}, {$updateOffset.input#/offset/most-recent-period-end-time-24} )'
          error:
            description: 'Offset could not be updated'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'newMostRecentPeriodEndTime not provided'
                    - 'newMostRecentPeriodEndTime invalid'
                    - 'newMostRecentPeriodEndTime24 not provided'
                    - 'newMostRecentPeriodEndTime24 invalid'
                    - 'offset not provided'
                    - 'offset invalid'
                    - 'offset update error'
                    - 'General processing error during reading'

paths:
  /:
    description: 'no rest path provided by this module'
