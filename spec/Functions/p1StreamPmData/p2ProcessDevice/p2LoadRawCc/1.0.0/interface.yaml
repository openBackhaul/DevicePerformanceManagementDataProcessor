openapi: 3.0.0
info:
  title: p2LoadRawCc
  version: 1.0.0

x-javascript-interface:
  p2LoadRawCc:
    summary: 'Reads device ControlConstruct from MWDI ES replica, applies filtering and returns the remaining data to the caller'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - parameters
              - mwdi-replica-es-client
              - mount-name
              - offset
            properties:
              parameters:
                type: object
                description: 'Hierarchical object holding the parameter settings'
              mwdi-replica-es-client:
                type: object
                description: 'MWDI Replica ElasticSearch address'
              mount-name:
                type: string
                description: 'mountName of the device for which ControlConstruct data shall be read'
                mount-name: '100250001'
              offsets:
                type: array
                x-key: function-name
                items:
                  type: object
                  required:
                    - function-name
                    - offset
                  properties:
                    function-name:
                      type: string
                    offset:
                      # currently only 1 offset type, but additional ones possible in the future
                      oneOf:
                        type: object
                        description: 'Offset for functionName=p2DiscardIrrelevantPmRecords'
                        interface-offsets:
                          type: array

    output:
      success:
        description: 'rawCc loaded'
        content:
          application/json:
            schema:
              type: object
              required:
                - raw-cc
              properties:
                raw-cc:
                  type: object
                  description: >
                    'rawCc read from Replica ES, but reduced by irrelevant data
                    from [/load-raw-cc/raw-cc]'
                offset:
                  type: object
                  description: >
                    'Offset object for this function
                    from [/load-raw-cc/offset]'
      error:
        description: 'rawCc could not be loaded'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'parameters not provided'
                - 'parameters invalid'
                - 'mwdiReplicaEsClient not provided'
                - 'mwdiReplicaEsClient invalid'
                - 'mountName not provided'
                - 'mountName invalid'
                - 'rawCc could not be provided'
                - 'General processing error'
    processing:
      readControlConstructFromReplica:
        url: # [{/load-raw-cc/mwdi-replica-url}][/control-construct={[/load-raw-cc/mount-name]}]
          description: 'Reads the complete ControlConstruct for the [/load-raw-cc/mount-name] from MWDI ElasticSearch replica.'
          output:
            success:
              description: 'Raw ControlConstruct data read'
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - core-model-1-4:control-construct
                    properties:
                      core-model-1-4:control-construct:
                        type: array
                        x-key: uuid
                        items:
                          type: object
            error:
              description: 'Data structure could not be read from ElasticSearch'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'Data structure is missing or invalid'
                      - 'ElasticSearch read error'
                      - 'General processing error during reading'
      p1FieldsFilter:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - data-structure
                  - fields-filter-string
                properties:
                  data-structure:
                    type: object
                    description: >
                      'The data structure to be filtered according to the provided fields filter string.
                      It is the raw ControlConstruct content (the object found in the first array element of core-model-1-4:control-construct, without the core-model-1-4:control-construct keyword itself)
                      from [/load-raw-cc/raw-cc]'
                  fields-filter-string:
                    type: string
                    description: >
                      'Fields filter string following NETCONF FieldsFilter syntax and semantics to be applied to the data structure,
                      from [/load-raw-cc/fields-filter]'
        output:
          success:
            description: 'Data structure successfully filtered according to the provided fields filter string'
            content:
              application/json:
                schema:
                  type: object
                properties:
                  filtered-data-structure:
                    type: object
                    description: 'The data structure after filtering according to the provided fields filter string'
          error:
            description: 'Data structure could not be filtered according to the provided fields filter string'
            content:
              application/json:
                schema:
                  type: string
      p2DiscardIrrelevantPmRecords:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - historical-performance-data-list
                  - offset
                properties:
                  historical-performance-data-list:
                    type: array
                    description: >
                      'The list of historical PM records, that shall be filtered
                      from [/load-raw-cc/raw-cc/logical-termination-point={uuid}/layer-protocol=*/air-interface-2-0:air-interface-pac/air-interface-historical-performances/historical-performance-data-list or /load-raw-cc/raw-cc/logical-termination-point=*/layer-protocol=*/ethernet-container-2-0:ethernet-container-pac/ethernet-container-historical-performances/historical-performance-data-list]'
                  offset:
                    type: object
                    description: >
                      'Offset for the currently processed ltp
                      from [/load-raw-cc/offset]'
        output:
          success:
            description: 'filteredHistoricalPerformanceDataList provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - filtered-historical-performance-data-list
                  properties:
                    filtered-historical-performance-data-list:
                      type: array
                      description: >
                        'Filtered list of historical PM records'
                    offset:
                      type: object
                      description: >
                        'Updated offset'
          error:
            description: 'filteredHistoricalPerformanceDataList could not be provided'
            content:
              application/json:
                schema:
                  type: string
      addBatchTimestamp:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - current-performance-timestamp
                properties:
                  current-performance-timestamp:
                    type: string
                    description: >
                      'Timestamp of current performance data
                      from [/load-raw-cc/raw-cc/logical-termination-point=*/layer-protocol=*/air-interface-2-0:air-interface-pac/air-interface-current-performance/current-performance-data-list=air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN/timestamp]'
                  batch-timestamp:
                    type: string
                    description: >
                      'Timestamp when the CC was read from the device
                      from [/load-raw-cc/raw-cc/batch-timestamp], if not already existing 2010-11-20T14:00:00+01:00 to be used'
        output:
          success:
            description: 'batchTimestamp provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - batch-timestamp
                  properties:
                    batch-timestamp:
                      type: string
                      description: >
                        'Timestamp when the CC was read from the device
                        if [$input#current-performance-timestamp] > [$input#batch-timestamp]
                        from [$input#batch-timestamp]'
            error:
              description: 'batchTimestamp could not be provided'
              content:
                application/json:
                  schema:
                    type: string
                    enum:
                      - 'currentPerformanceTimestamp not provided'
                      - 'currentPerformanceTimestamp invalid'
                      - 'batchTimestamp not provided'
                      - 'batchTimestamp invalid'
                      - 'batchTimestamp could not be provided'
                      - 'General processing error'
      updateInterfaceOffset:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - interface-offsets
                  - offset
                properties:
                  interface-offsets:
                    type: array
                    description: > 
                      'interfaceOffsets
                      from [/load-raw-cc/interface-offsets]'
                  offset:
                    type: object
                    description: >
                      'Offset for the currently processed ltp
                      from [/load-raw-cc/offset]'
        output:
          success:
            description: 'updated interfaceOffset provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - interfaceOffset
                  properties:
                    interface-offsets:
                      type: array
                      description: > 
                        'interfaceOffsets
                        updated by adding items for new uuids and overwriting for existing entries. Offset object
                        from {{$updateInterfaceOffset.input/offset}
                        (over)writes item for [/load-raw-cc/interface-offsets={$updateInterfaceOffset.input#/offset/uuid}].'
          error:
            description: 'filteredHistoricalPerformanceDataList could not be provided'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'interfaceOffsets not provided'
                    - 'interfaceOffsets invalid'
                    - 'offset not provided'
                    - 'offset invalid'
                    - 'General processing error'
      updateOffsets:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - offsets
                  - interface-offsets
                properties:
                  offsets:
                    type: array
                    description: >
                      'Offsets
                      from [/load-raw-cc/offsets]'
                  interface-offsets:
                    type: array
                    description: > 
                      'interfaceOffsets
                      from [/load-raw-cc/interface-offsets]'
        output:
          success:
            description: 'updated offsets provided'
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - offsets
                  properties:
                    offsets:
                      type: array
                      description: > 
                        'The offsets item is updated, by
                        (over)writing {$updateOffsets.input#/interface-offsets}
                        into {$updateOffsets.input#/offsets=p2DiscardIrrelevantPmRecords}.
                        '
          error:
            description: 'filteredHistoricalPerformanceDataList could not be provided'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'offsets not provided'
                    - 'offsets invalid'
                    - 'interfaceOffsets not provided'
                    - 'interfaceOffsets invalid'
                    - 'General processing error'

paths:
  /:
    description: 'no rest path provided by this module'
