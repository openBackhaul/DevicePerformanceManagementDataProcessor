load-raw-cc:
  type: object
  required:
    - parameters
    - mwdi-replica-es-client
    - data-store-es-client
    - mount-name
    - offsets
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    mwdi-replica-es-client:
      type: object
      description: >
        'MWDI Replica ElasticSearch address
        from {$input#/mwdi-replica-es-client}'
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    offsets:
      type: array
      x-key: function-name
      description: >
        'Array of offsets of all functions
        from {$input#/offsets}'
      items:
        oneOf:
          - description: 'offset for p2DiscardIrrelevantPmRecords'
            type: object
            required:
              - function-name
              - offset
            properties:
              function-name:
                type: string
                enum:
                  - 'p2DiscardIrrelevantPmRecords'
              interface-offsets:
                type: array
                x-key: uuid
                description: >
                  'Array of offsets of all interfaces at the device
                  overwritten by {$   }'

    interface-offsets:
      type: array
      x-key: uuid
      description: >
        'Array of offsets of all interfaces at the device
        if existing from [/load-raw-cc/offsets=p2DiscardIrrelevantRecords/interface-offsets]
        if not existing and empty array is initialized for this functionName
        overwritten by {$updateInterfaceOffset.output#/interface-offsets}'
      items:
        type: object
        required:
          - uuid
          - offset
        properties:
          uuid:
            type: string
          interface-offset:
            type: object
            description: >
              'Offset at a specific interface'

    interface-offset:
      type: object
      description: >
        'The offset at the currently processed interface (ltp)
        from [/load-raw-cc/interface-offsets={/load-raw-cc/raw-cc/logical-termination-point[*]/uuid}]
        or to be initialized, if not already existing
        overwritten by {$p2DiscardIrrelevantPmRecords.output/offset}.'
      required:
        - uuid
        - most-recent-period-end-time
        - most-recent-period-end-time-24
      properties:
        uuid:
          type: string
          description: >
            'uuid
            if to be initialized, from [/load-raw-cc/raw-cc/logical-termination-point[*]/uuid] of the currently processed ltp'
        most-recent-period-end-time:
          type: string
          pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
          description: >
            'mostRecentPeriodEndTime
            if to be initialized, from {2010-11-20T14:00:00+01:00}'
        most-recent-period-end-time-24:
          type: string
          pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
          description: >
            'mostRecentPeriodEndTime24
            if to be initialized, from {2010-11-20T14:00:00+01:00}'

    mwdi-replica-url:
      type: string
      description: >
        'ElasticSearch URL of MWDI Replica ES
        from [/load-raw-cc/mwdi-replica-es-client/url]'

    fields-filter:
      type: string
      description: >
        'Fields filter to be applied to reduce the raw ControlConstruct data
        from [/load-raw-cc/parameters/sub-function=p1FieldsFilter/parameter=fieldsFilter/value]'
    relevant-granularities:
      type: string
      enum:
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN$'
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS$'
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-(?:15-MIN|24-HOURS)$'
      description: >
        'An regex pattern indicating which data granularities are to be kept
        from [/load-raw-cc/parameters/sub-function=p1DiscardIrrelevantPmRecords/parameter=relevantGranularities/value]'

    raw-cc:
      type: object
      description: >
        'rawCc read from Replica ES, but stripped to the content of the object inside the array
        from {$readControlConstructFromReplica.output#/core-model-1-4:control-construct={[/load-raw-cc/mount-name]}}
        overwritten by {$p1FieldsFilter.output#/filtered-data-structure}'
      properties:
        equipment-augment-1-0:control-construct-pac:
          type: object
          properties:
            external-label:
              type: string
              description: >
                'mountName
                The externalLabel attribute is for the operator to persistently store an identifier from his documentation inside the device'
            device-model-name:
              type: string
              description: >
                'Name of the device model according to its official documentation'
        equipment:
          type: array
          x-key: uuid
          items:
            type: object
            properties:
              uuid:
                type: string
              actual-equipment:
                type: object
                properties:
                  local-id:
                    type: string
                  physical-properties:
                    type: object
                    properties:
                      temperature:
                        type: string
                  structure:
                    type: object
                    properties:
                      category:
                        type: string
        profile-collection:
          type: object
          properties:
            profile:
              type: array
              x-key: uuid
              items:
                type: object
                properties:
                  uuid:
                    type: string
                  profile-name:
                    type: string
                  layer-1-aggregation-profile-1-0:layer-1-aggregation-profile-pac:
                    type: object
                    properties:
                      layer-1-aggregation-profile-configuration:
                        type: object
                        properties:
                          client-ltp:
                            type: string
                            description: >
                              'UUID of the LTP with LayerProtocol::layerProtocolName==LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER that is configured to be transported by a group of LTPs with LayerProtocol::layerProtocolName==LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER or LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER'
                          server-ltp-list:
                            type: array
                            description: >
                              'List of UUIDs of a group of LTPs with LayerProtocol::layerProtocolName==LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER or LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER that are configured to transport an LTP with LayerProtocol::layerProtocolName==LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                            items:
                              type: string
        logical-termination-point:
          type: array
          description: >
            'instance to be deleted,
              if [./layer-protocol=*/layer-protocol-name] != [air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER OR ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER]'
          x-key: uuid
          items:
            type: object
            properties:
              uuid:
                type: string
              client-ltp:
                type: array
                items:
                  type: string
              server-ltp:
                type: array
                items:
                  type: string
              ltp-augment-1-0:ltp-augment-pac:
                type: object
                properties:
                  external-label:
                    type: string
                    description: >
                      'The externalLabel attribute is for the operator to persistently store an identifier from his documentation inside the device'
                  original-ltp-name:
                    type: string
                    description: >
                      'Shall automatically be filled with a string that contains the logical- or physical interface name as it is represented at the vendor's own management interface e.g. LAN 1/2/1'
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-configuration:
                              type: object
                              properties:
                                transmission-mode-min:
                                  type: string
                                  description: >
                                    'Minimum transmission mode to be configured (in case adaptive modulation is not used, this value represents also the fixed transmission mode)'
                                transmission-mode-max:
                                  type: string
                                  description: >
                                    'Maximum transmission mode to be configured'
                                tx-power:
                                  type: integer
                                  description: >
                                    'Transmit power to be configured on the microwave link. Signed Byte is required. The actually operated transmit power might be lower depending on adaptive modulation and ATPC'
                                atpc-is-on:
                                  type: boolean
                                  description: >
                                    'ATPC. Activation of Automated Transmit Power Control shall be expressed as a true'
                                atpc-thresh-upper:
                                  type: integer
                                  description: >
                                    'If the receive level at the local/remote site is higher than the upper threshold value, the transmitter at the remote/local site is notified to decrease transmit power. In case the device does not know upper and lower threshold values, but only a single reference value, the atpcThreshUpper shall not be available for configuration and constantly represent the default value'
                                atpc-thresh-lower:
                                  type: integer
                                  description: >
                                    'If the receive level at the local/remote site is lower than the lower threshold value, the transmitter at the remote/local site is notified to increase transmit power. In case the device does not know upper and lower threshold values, but only a single reference value, the atpcThreshLower shall represent this reference value'
                            air-interface-capability:
                              type: object
                              properties:
                                transmission-mode-list:
                                  type: array
                                  x-key: transmission-mode-name
                                  items:
                                    type: object
                                    properties:
                                      transmission-mode-name:
                                        type: string
                                        description: >
                                          'Name of the transmission mode. BBBB-m*-i*/t*-r*. B=four digits of channel bandwidth in MHz. m*=required number of digits for modulation name. (i*/t*=code rate.) i*=required number of digits for number of information bits. t*=required number of digits for total bits. r*=required number of digits for rate reduction factor. Example: 0028-4QAM-188/204-1'
                                      channel-bandwidth:
                                        type: integer
                                        description: >
                                          'Bandwidth of the transmit channel. The value shall be expressed explicitly (means in kHz) not as a reference to an international agreement. The values shall be chosen from the following _list: 3.500, 7.000, 14.000, 27.500, 28.000, 29.000, 29.650, 30.000, 40.000, 50.000, 55.000, 56.000, 59.300, 60.000, 80.000, 100.000, 112.000, 120.000, 150.000, 200.000, 250.000, 500.000, 750.000, 1.000.000, 1.250.000, 1.500.000, 1.750.000, 2.000.000'
                                      modulation-scheme:
                                        type: integer
                                        description: >
                                          'Modulation scheme, which is base to the other characteristics described in the same transmissionModeType data type. The modulation scheme shall be described by the number of states in the phase diagram (e.g. BPSK->'2' or 256QAM->'256')'
                                      modulation-scheme-name-at-lct:
                                        type: string
                                        description: >
                                          'Modulation scheme name, which is together with the applied channel bandwidth identifying this transmission mode at the graphical user interface of the local craft terminal'
                                      code-rate:
                                        type: integer
                                        description: >
                                          'Code rate of the coding scheme in % (Net bit rate is either smaller or equal to (Gross bit rate mulitplied with code rate) )'
                                      symbol-rate-reduction-factor:
                                        type: integer
                                        description: >
                                          'Reduction factor for the symbol rate. Example: value would be 4 for 1/4BPSK'
                            air-interface-current-performance:
                              type: object
                              properties:
                                current-performance-data-list:
                                  type: array
                                  x-key: granularity-period
                                  items:
                                    type: object
                                    properties:
                                      granularity-period:
                                        type: string
                                        enum:
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-UNKNOWN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS'
                                          - 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-NOT_YET_DEFINED'
                                        description: >
                                          'Time period between reset of the underlying counter'
                                      timestamp:
                                        type: string
                                        description: >
                                          'The timestamp associated with when the current data was collected'
                            air-interface-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p1DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
                                  items:
                                    type: object
                                    properties:
                                      granularity-period:
                                        type: string
                                        description: >
                                          'Period of the performance data collection'
                                      period-end-time:
                                        type: string
                                        description: >
                                          'Time when the counter values have been recorded and the counter reset'
                                      performance-data:
                                        type: object
                                        properties:
                                          es:
                                            type: integer
                                            description: >
                                              'Number of errored seconds'
                                          ses:
                                            type: integer
                                            description: >
                                              'Number of severely errored seconds'
                                          cses:
                                            type: integer
                                            description: >
                                              'Number of consecutive severely errored seconds'
                                          unavailability:
                                            type: integer
                                            description: >
                                              'otal time of unavailability in seconds'
                                          tx-level-min:
                                            type: integer
                                            description: >
                                              'Minimum transmit power. Signed integers are required'
                                          tx-level-max:
                                            type: integer
                                            description: >
                                              'Maximum transmit power. Signed integers are required'
                                          tx-level-avg:
                                            type: integer
                                            description: >
                                              'Averaged transmit power. Signed integers are required'
                                          rx-level-min:
                                            type: integer
                                            description: >
                                              'Minimum receive level. Signed integers are required'
                                          rx-level-max:
                                            type: integer
                                            description: >
                                              'Maximum receive level. Signed integers are required'
                                          rx-level-avg:
                                            type: integer
                                            description: >
                                              'Averaged receive level. Signed integers are required'
                                          time-xstates-list:
                                            type: array
                                            x-key: transmission-mode
                                            items:
                                              type: object
                                              properties:
                                                transmission-mode:
                                                  type: string
                                                  description: >
                                                    'Operated transmission mode'
                                                time:
                                                  type: integer
                                                  description: >
                                                    'Sum of all seconds the transmitter operated the transmission mode'
                                          snir-min:
                                            type: integer
                                            description: >
                                              'Minimum signal to (noise+interference) ratio'
                                          snir-max:
                                            type: integer
                                            description: >
                                              'Maximum signal to (noise+interference) ratio'
                                          snir-avg:
                                            type: integer
                                            description: >
                                              'Averaged signal to (noise+interference) ratio'
                                          xpd-min:
                                            type: integer
                                            description: >
                                              'Minimum cross polarization discrimination'
                                          xpd-max:
                                            type: integer
                                            description: >
                                              'Maximum cross polarization discrimination'
                                          xpd-avg:
                                            type: integer
                                            description: >
                                              'Averaged cross polarization discrimination'
                                          defect-blocks-sum:
                                            type: integer
                                            description: >
                                              'Total number of blocks that were defect after receiving and could not be corrected by the FEC'
                                          time-period:
                                            type: integer
                                            description: >
                                              'Total length of the measurement period'
                    - description: 'ethernet-container'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p1DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
                                  items:
                                    type: object
                                    properties:
                                      granularity-period:
                                        type: string
                                        description: >
                                          'Time period between reset of the underlying counter'
                                      period-end-time:
                                        type: string
                                        description: >
                                          'Time when the counter values have been recorded and the counter reset'
                                      performance-data:
                                        type: object
                                        properties:
                                          max-bytes-per-second-output:
                                            type: integer
                                            description: >
                                              'Counts the number of Bytes of Ethernet traffic (before header compression) transmitted within a second and keeps the highest value within the measurement period'
                                          total-bytes-input:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Total number of Bytes of Ethernet traffic (before header compression) received during the measurement period'
                                          total-bytes-output:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Total number of Bytes of Ethernet traffic (before header compression) transmitted (in direction out of the device) during the measurement period'
                                          time-period:
                                            type: integer
                                            description: >
                                              'Total length of the measurement period in seconds'
                                          total-frames-input:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              The total number of Ethernet frames received at this interface (including those received in error'
                                          total-frames-output:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              The total number of Ethernet frames sent at this interface'
                                          forwarded-frames-input:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Number of input frames at this interface, for which the device was not their final destination and for which the device attempted to find a route to forward them to that final destination'
                                          forwarded-frames-output:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Number of frames at this interface, for which the device was not their final destination and for which it was successful in finding a path to their final destination'
                                          unicast-frames-input:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Total number of unicast frames received at this interface'
                                          unicast-frames-output:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Total number of unicast frames sent at this interface'
                                          multicast-frames-input:
                                            type: integer
                                            description: >
                                              'Total number of multicast frames received at this interface'
                                          multicast-frames-output:
                                            type: integer
                                            description: >
                                              'Total number of multicast frames sent at this interface'
                                          broadcast-frames-input:
                                            type: integer
                                            description: >
                                              'Total number of broadcast frames received at this interface'
                                          broadcast-frames-output:
                                            type: integer
                                            description: >
                                              'Total number of broadcast frames sent at this interface'
                                          fragmented-frames-input:
                                            type: integer
                                            description: >
                                              'The total number of frames received that were less than 64 octets in length (excluding framing bits but including FCS octets) and had either a bad Frame Check Sequence (FCS) with an integral number of octets (FCS Error) or a bad FCS with a non-integral number of octets (Alignment Error)'
                                          errored-frames-input:
                                            type: integer
                                            description: >
                                              'Total number of errored frames received at this interface'
                                          errored-frames-output:
                                            type: integer
                                            description: >
                                              'Number of Ethernet frames, which were locally generated and discarded due to errors, including no route found to the destination'
                                          dropped-frames-input:
                                            type: integer
                                            description: >
                                              'Total number of Ethernet frames dropped at the receiver. The number of input Ethernet frames, for which no problems were encountered to prevent their continued processing, but were discarded (e.g., for lack of buffer space)'
                                          dropped-frames-output:
                                            type: integer
                                            description: >
                                              'The number of output Ethernet frames, for which no problem was encountered to prevent their transmission to their destination, but were discarded (e.g., for lack of buffer space)'
                                          oversized-frames-ingress:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              The total number of frames received that were longer than 1518 octets (excluding framing bits, but including FCS octets) and were otherwise well formed'
                                          undersized-frames-ingress:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              The total number of frames received that were less than 64 octets long (excluding framing bits, but including FCS octets) and were otherwise well formed'
                                          jabber-frames-ingress:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Number of jabber frames received on the interface. Jabber frames are typically defined as oversize frames which also have a bad CRC. Implementations may use slightly different definitions of what constitutes a jabber frame. Often indicative of a NIC hardware problem'
                                          unknown-protocol-frames-input:
                                            type: string
                                            description: >
                                              'String representation of int64 value.
                                              Total number of received frames that were transporting an unknown protocol'
        batch-timestamp:
          type: string
          description: >
            'Timestamp when the CC was read from the device (actually youngest air interface current performance data)
            from {$addBatchTimestamp.output#/batch-timestamp}'
