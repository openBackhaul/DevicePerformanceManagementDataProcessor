load-raw-cc:
  type: object
  required:
    - parameters
    - mwdi-replica-es-client
    - mount-name
    - offsets
  properties:
    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$input#/parameters}'
    mwdi-replica-es-client:
      type: object
      description: >
        'MWDI Replica ElasticSearch address
        from {$input#/mwdi-replica-es-client}'
    mount-name:
      type: string
      description: >
        'MountName
        from {$input#/mount-name}'
    offsets:
      type: array
      x-key: function-name
      description: >
        'Array of offsets of all functions
        from {$input#/offsets}'
      items:
        oneOf:
          - description: 'offset for p2DiscardIrrelevantPmRecords'
            type: object
            required:
              - function-name
              - offset
            properties:
              function-name:
                type: string
                enum:
                  - 'p2DiscardIrrelevantPmRecords'
              offset:
                type: object
                properties:
                  interface-offsets:
                    type: array
                    x-key: uuid
                    description: >
                      'Array of offsets of all interfaces at the device,
                      if not existing initialized with an empty array,
                      overwritten by {$updateInterfaceOffset.output#/interface-offsets}'
                    items:
                      type: object
                      required:
                        - uuid
                        - interface-offset
                      properties:
                        uuid:
                          type: string
                        interface-offset:
                          type: object
                          description: >
                            'Offset at a specific interface'

    interface-offset:
      type: object
      description: >
        'The offset at the currently processed interface (ltp)
        from [/load-raw-cc/offsets=p2DiscardIrrelevantPmRecords/offset/interface-offsets={/load-raw-cc/raw-cc/logical-termination-point[*]/uuid}]
        or to be initialized, if not already existing
        overwritten by {$p2DiscardIrrelevantPmRecords.output/offset}'
      required:
        - uuid
        - most-recent-period-end-time
        - most-recent-period-end-time-24
      properties:
        uuid:
          type: string
          description: >
            'uuid
            if to be initialized, from [/load-raw-cc/raw-cc/logical-termination-point[*]/uuid] of the currently processed ltp'
        most-recent-period-end-time:
          type: string
          pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
          description: >
            'mostRecentPeriodEndTime
            if to be initialized, from {2010-11-20T14:00:00+01:00}'
        most-recent-period-end-time-24:
          type: string
          pattern: '^([0-9]{4})-([0-9]{2})-([0-9]{2})T([0-9]{2}):([0-9]{2}):([0-9]{2})((\.[0-9]{1,}){0,1})(Z|[\+\-][0-9]{2}:[0-9]{2})$'
          description: >
            'mostRecentPeriodEndTime24
            if to be initialized, from {2010-11-20T14:00:00+01:00}'

    mwdi-replica-url:
      type: string
      description: >
        'ElasticSearch URL of MWDI Replica ES
        from [/load-raw-cc/mwdi-replica-es-client/url]'

    fields-filter:
      type: string
      description: >
        'Fields filter to be applied to reduce the raw ControlConstruct data
        from [/load-raw-cc/parameters/sub-function=p1FieldsFilter/parameter=fieldsFilter/value]'
    relevant-granularities:
      type: string
      enum:
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN$'
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-24-HOURS$'
        - ':GRANULARITY_PERIOD_TYPE_PERIOD-(?:15-MIN|24-HOURS)$'
      description: >
        'An regex pattern indicating which data granularities are to be kept
        from [/load-raw-cc/parameters/sub-function=p1DiscardIrrelevantPmRecords/parameter=relevantGranularities/value]'

    raw-cc:
      type: object
      description: >
        'rawCc read from Replica ES, but stripped to the content of the object inside the array
        from {$readControlConstructFromReplica.output#/core-model-1-4:control-construct={[/load-raw-cc/mount-name]}}
        overwritten by {$p1FieldsFilter.output#/filtered-data-structure}
        ! simplified representation !'
      properties:
        logical-termination-point:
          type: array
          description: >
            'instance to be deleted,
              if [./layer-protocol=*/layer-protocol-name] != [air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER OR ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER]'
          x-key: uuid
          items:
            type: object
            properties:
              uuid:
                type: string
              layer-protocol:
                type: array
                x-key: local-id
                items:
                  oneOf:
                    - description: 'air-interface'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                        air-interface-2-0:air-interface-pac:
                          type: object
                          properties:
                            air-interface-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p2DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
                    - description: 'ethernet-container'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                        ethernet-container-2-0:ethernet-container-pac:
                          type: object
                          properties:
                            ethernet-container-historical-performances:
                              type: object
                              properties:
                                historical-performance-data-list:
                                  type: array
                                  x-key: granularity-period, period-end-time
                                  description: >
                                    'HistoricalPerformancesDataList
                                    overwritten by {$p2DiscardIrrelevantPmRecords.output/filtered-historical-performance-data-list}'
        batch-timestamp:
          type: string
          description: >
            'Timestamp when the CC was read from the device (actually youngest air interface current performance data)
            from {$addBatchTimestamp.output#/batch-timestamp}'
