calculate-interface-pm-data-quality:
  type: object
  required:
    - uuid
    - former-most-recent-period-end-time
    - new-most-recent-period-end-time
    - received
  properties:
    uuid:
      type: string
      description: >
        'uuid of the currently processed interface
        from '
    former-most-recent-period-end-time:
      type: string
      description: >
        'mostRecentPeriodEndTime during past processing of the currently processed interface
        from '
    new-most-recent-period-end-time:
      type: string
      description: >
        'mostRecentPeriodEndTime in the currently processed batch of the currently processed interface
        from '
    received:
      type: object
      description: >
        'Number of received 15min PM records categorized date
        from '

    interface-pm-data-quality:
      type: object
      required:
        - uuid
        - quality
      properties:
        uuid:
          type: string
          description: >
            'uuid of the interface
            from '
        quality:
          type: array
          items:
            type: object
            required:
              - date
              - received
              - expected
            properties:
              date:
                type: string
                description: >
                  'day for which the quality has been measured
                  from '
              received:
                type: integer
                description: >
                  'number of 15min PM records that have been received during the measurement period
                  from '
              expected:
                type: integer
                description: >
                  'number of 15min PM records that have been expected to arrive during the measurement period
                  from '
