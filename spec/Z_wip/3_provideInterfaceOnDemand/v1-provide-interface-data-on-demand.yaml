# - provide interface data on demand
# - returns data directly as REST response
# - calls MWDI live path for either airInterface or EthernetContainer
# - output structure is same as for regular data
# - returns ALL 15min data, no filtering for mostRecentTimestamp!
#   - but: other data prep functions must be applied
# - triggers regular upload of CC from MWDI (there filtering for mostRecentTimestamp)
# 

  /v1/provide-interface-data-on-demand:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: provideInterfaceDataOnDemand
      summary: 'Provides AirInterface or EthernetContainer data from live on demand'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - description: 'AirInterface'
                  required:
                    - mount-name
                    - link-id
                  properties:
                    mount-name:
                      type: string
                      description: 'The mountName of the device for which data shall be returned.'
                    link-id:
                      type: string
                      description: 'The linkId for which data shall be returned.'
                - description: 'EthernetContainer'
                  required:
                    - mount-name
                    - port-id
                  properties:
                    mount-name:
                      type: string
                      description: 'The mountName of the device for which data shall be returned.'
                    port-id:
                      type: string
                      description: 'The portId for which data shall be returned.'
        responses:
          '200':
            description: 'Interface data from live provided.'
            content:
              application/json:
                schema:
                  type: object
                  #TODO: Dsfp output object ODER nur das Interface???
            headers:
              x-correlator:
                schema:
                  type: string
                  example: '550e8400-e29b-11d4-a716-446655440000'
              exec-time:
                schema:
                  type: integer
                  example: 1100
              backend-time:
                schema:
                  type: integer
                  example: 850
              life-cycle-state:
                schema:
                  type: string
                  enum:
                    - 'EXPERIMENTAL'
                    - 'OPERATIONAL'
                    - 'DEPRECATED'
                    - 'OBSOLETE'
                    - 'UNKNOWN'
                    - 'NOT_YET_DEFINED'
                  example: 'EXPERIMENTAL'
                description: >
                  'Life cycle state of the consumed service
                  find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-015/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
          '400':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '401':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '403':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '404':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          '470':
            $ref: '#/components/responses/470'
          '500':
            $ref: '#/components/responses/responseForErroredServiceRequests'
          default:
            $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        

        #getLtpsstructure
        #getdevicetype (braucht man eigentlich nur, wenn man devicetype spezifische functions hat)
        #falls airIf get (ggf. braucht man nur teile davon - prüfen); 1 callback mit mehreren substeps
        # - airIf capa
        # - airIf conf
        # - airIf status
        # - airIf-historicalPm
        #falls Eth:
        # - get historical-pm
        # - get status nur falls nötig
        #dann gleiche functions wie bei regulären ablauf anwenden
        # out of range pegel
        # airIf kpis -> falls airIf
        # eth kpis -> falls ethIf
        # replace Onf defaults
        
        # wie genau die Funktionen aussehen hängt davon ab, ob  createDsfpOutput jetzt geändert wird oder nicht
        # wenn die APTP output struktur erst am ende erzeugt wird, werden die function schemas ggf. geändert!!
