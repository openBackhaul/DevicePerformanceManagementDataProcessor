  /v1/provide-data-store-item-for-interface:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: provideDataStoreItemForInterface
      summary: 'Provides the dataStore item for an input device interface'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
                - interface-ltp
              properties:
                mount-name:
                  type: string
                  description: 'The mount-name of the device for which the interface data shall be returned.'
                interface-ltp:
                  type: string
                  description: 'The LTP-ID of the interface for which data shall be returned.'
                timestamp:
                  type: string
                  description: 'Optional filter; if provided, the device.lot items containing the interface data shall be filtered for those where x-key (new-value) is newer than the timestamp'
              example:
                mount-name: '123273221'
                interface-ltp: 'RF-2146697744'
                timestamp: '2024-03-06T00:00:00+01:00'
      responses:
        '200':
          description: 'DataStore item for device interface provided'
          content:
            application/json:
              schema:
                oneOf:
                - description: 'air-interface'
                  type: object
                  properties:
                    air-interface:
                      type: object
                      description: 'air-interface as item of air-interface-list in [T1out_Output.yaml] schema'
                - description: 'ethernet-container'
                  properties:
                    ethernet-container:
                      type: object
                      description: 'ethernet-container as item of ethernet-container-list in [T1out_Output.yaml] schema'
              examples:
                air-interface-example:
                  value:
                    air-interface:
                      air-interface-identifiers:
                        mount-name: '123273221'
                        link-endpoint-id: '325557888A'
                        link-id: '325557888'
                        logical-termination-point-id: 'RF-2146697744'
                        link-aggregation-identifiers:
                          - link-id: '325557888'
                          - interface-name: '325557889'
                      air-interface-configuration:
                        configured-atpc-is-on: true
                        configured-atpc-threshold-upper: 99
                        configured-atpc-threshold-lower: -45
                        configured-tx-power: -10
                        configured-modulation-minimum:
                          number-of-states: 4
                          name-at-lct: '4 QAM'
                          configured-capacity-minimum: 2
                        configured-modulation-maximum:
                          number-of-states: 1024
                          name-at-lct: '1024 QAM'
                          configured-capacity-maximum: 10
                      air-interface-performance-measurements-list:
                        - granularity-period: 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                          period-end-time: '2024-03-06T13:00:00+01:00'
                          transmit-level-minimum: 18
                          transmit-level-maximum: 22
                          transmit-level-average: 21
                          receive-level-minimum: -45
                          receive-level-maximum: -44
                          receive-level-average: -44
                          signal-to-noise-ratio-minimum: 0
                          signal-to-noise-ratio-maximum: 0
                          signal-to-noise-ratio-average: 0
                          cross-polarization-discrimination-minimum: 30
                          cross-polarization-discrimination-maximum: 31
                          cross-polarization-discrimination-average: 99
                          operated-transmission-modes-list:
                              - transmission-mode-name: '56000-1024-v2'
                                modulation-scheme-name-at-lct:
                                time: 897
                                capacity: 100
                              - transmission-mode-name: '56000-128-v4'
                                modulation-scheme-name-at-lct:
                                time: 3
                                capacity: 120
                          interval-capacity: 110
                          errorred-seconds: 10
                          severely-errorred-seconds: 2
                          consecutive-severely-errorred-seconds: 0
                          total-unavailability: 0
                          defect-blocks: 2
                          time-period: 890
                      transmission-mode-list:
                        - transmission-mode-name: '56000-1024-v2'
                          number-of-states: 1024
                          modulation-scheme-name-at-lct: '1024 QAM'
                          channel-bandwidth: 56000
                          code-rate: 94
                          symbol-rate-reduction-factor: 1
                        - transmission-mode-name: '7000-16-v2'
                          number-of-states: 16
                          modulation-scheme-name-at-lct: '16 QAM'
                          channel-bandwidth: 7000
                          code-rate: 86
                          symbol-rate-reduction-factor: 1
                ethernet-container-example:
                  value:
                    ethernet-container:
                      ethernet-container-identifiers:
                        mount-name: '123273221'
                        interface-name: 'WAN 1/1/1'
                        logical-termination-point-id: 'ETH-2134646913'
                      ethernet-container-performance-measurements-list:
                        - granularity-period: 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                          period-end-time: '2024-03-07T00:15:00.0+00:00'
                          max-bytes-per-second-output: '100'
                          total-bytes-input: '9324688281'
                          total-bytes-output: '9800000000'
                          total-frames-input: '9047677'
                          total-frames-output: '9901000'
                          forwarded-frames-input: '500000'
                          forwarded-frames-output: '510000'
                          unicast-frames-input: '100000'
                          unicast-frames-output: '110000'
                          multicast-frames-input: 51945
                          multicast-frames-output: 10000
                          broadcast-frames-input: 15
                          broadcast-frames-output: 10
                          fragmented-frames-input: 1300
                          errored-frames-input: 4000
                          errored-frames-output: 4001
                          dropped-frames-input: 5000
                          dropped-frames-output: 1200
                          oversized-frames-ingress: '100000'
                          undersized-frames-ingress: '123000'
                          jabber-frames-ingress: '123123'
                          unknown-protocol-frames-input: '124785'
                          time-period: 899
                          transmit-traffic: 320
                          receive-traffic: 250
                          frame-loss: 12000
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-021/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '204':
          description: 'No relevant interface data found'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-021/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'

        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '470':
          $ref: '#/components/responses/470'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
