  /v1/provide-air-interface-transmission-mode-lists-of-devices:
    post:
      operationId: provideAirInterfaceTransmissionModeListsInformationOfDevices
      summary: 'Responses with air interface transmission mode lists information for all (target) devices in the NetExplorerProxy cache.'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mount-name-list:
                  type: array
                  items:
                    type: string
                    description: 'Optional list of device names the reponse data shall be filtered for'
                data-age:
                  type: integer
                  description: > 
                    'Optional: if provided, found data is filtered for data that is not older than data-age hours.
                    If not provided, all found data (for target devices) is returned.'
              example:
                mount-name-list: 
                  - '305251234'
                  - '100250001'
                data-age: 48
      responses:
        '200':
          description: 'Air interface transmission mode list information for all (target) devices in the NetExplorerProxy cache in csv format.'
          content:
            text/csv:
              schema:
                type: string
                description: >
                  'The first line shall contain the following headers:
                    mount-name;uuid;local-id;transmission-mode-name;symbol-rate-reduction-factor;modulation-scheme-at-lct;modulation-scheme;code-rate;channel-bandwidth;xpic-is-avail;capa-factor
                  There shall be a single line containing all relevant data per device, air interface and transmission mode (missing information is to be left blank)
                  from the cache/ElasticSearch (airInterfaceTransmissionModeLists)
                  Columns are:
                    - mount-name: the device basekey
                    - uuid: the ltp uuid
                    - local-id: the layer protocol (i.a. air-interface) id, to be used together with uuid as mapping key
                    - transmission-mode-name: name of the supported transmission mode
                    - symbol-rate-reduction-factor
                    - modulation-scheme-at-lct: name of the modulation scheme as shown in LCT
                    - modulation-scheme: indicates the modulation scheme withouth information about light, strong, etc., is the numberOfStates
                    - code-rate
                    - channel-bandwidth
                    - xpic-is-avail: indicates if the modulation scheme supports xpic
                    - capa-factor: capacity factor in mbps derived from above properties with formula
                        (channel-bandwidth/symbol-rate-reduction-factor) * log2(modulation-scheme) * code-rate * 1/1,15 * 1/1000'
                example:
                  'mount-name;uuid;local-id;transmission-mode-name;symbol-rate-reduction-factor;modulation-scheme-at-lct;modulation-scheme;code-rate;channel-bandwidth;xpic-is-avail;capa-factor
                  100250001;RF-123456789;123456789;56000-64-v0;1;64 QAM;64;97;56000;true;28340,9
                  100250001;RF-123456789;123456789;56000-256-v0;1;256 QAM;256;95;56000;true;37008,7
                  100250001;RF-123456789;123456789;56000-16-v0;1;16 QAM;16;97;56000;true;18893,9'
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=nep-1-1-0-op-s-is-031/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '502':
          $ref: '#/components/responses/502'
        '531':
          $ref: '#/components/responses/531'
        '532':
          $ref: '#/components/responses/532'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'


  /v1/provide-air-interface-non-qam-pm-data-of-devices:
    post:
      operationId: provideAirInterfaceNonQamPmDataOfDevices
      summary: 'Responses with air interface non-QAM PM data for all (target) devices in the NetExplorerProxy cache.'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mount-name-list:
                  type: array
                  items:
                    type: string
                    description: 'Optional list of device names the reponse data shall be filtered for'
                data-age:
                  type: integer
                  description: > 
                    'Optional: if provided, found data is filtered for data that is not older than data-age hours.
                    If not provided, all found data (for target devices) is returned.'
              example:
                mount-name-list: 
                  - '305251234'
                  - '100250001'
                data-age: 48
      responses:
        '200':
          description: 'Air interface non-QAM PM data for all (target) devices in the NetExplorerProxy cache in csv format.'
          content:
            text/csv:
              schema:
                type: string
                description: >
                  'The first line shall contain the following headers:
                    mount-name;uuid;local-id;period-end-time;es;ses;ut;rx-level-min;rx-level-max;rx-level-avg;tx-level-min;tx-level-max;tx-level-avg;xpd-min;xpd-max;xpd-avg;snir-min;snir-max;snir-avg
                  There shall be a single line containing all relevant data per device, air interface and time interval (missing information is to be left blank)
                  from the cache/ElasticSearch (airInterfaceNonQamPm).
                  Columns are:
                    - mount-name: the device basekey
                    - uuid: the ltp uuid
                    - local-id: the layer-protocol (i.e. interface) local-id; required for mapping of response data from other air-interface services 
                    - period-end-time: timestamp of the 15 minute interval
                    - es: errored seconds (sec)
                    - ses: severely errored seconds (sec)
                    - ut: unavailable time (sec)
                    - rx-level-min: minimum receive level (dBm)
                    - rx-level-max: maximum receive level (dBm)
                    - rx-level-avg: average receive level (dBm)
                    - tx-level-min: minimum transmit level (dBm)
                    - tx-level-max: maximum transmit level (dBm)
                    - tx-level-avg: average transmit level (dBm)
                    - xpd-min: minimum xpd (= cross-polarization descrimination)
                    - xpd-max: maximum xpd
                    - xpd-avg: average xpd
                    - snir-min: minimum snir (= signal-to-noise-and-interference ration)
                    - snir-max: maximum snir
                    - snir-avg: avgerage snir'
                example:
                  'mount-name;uuid;local-id;period-end-time;es;ses;ut;rx-level-min;rx-level-max;rx-level-avg;tx-level-min;tx-level-max;tx-level-avg;xpd-min;xpd-max;xpd-avg;snir-min;snir-max;snir-avg
