openapi: 3.0.0
info:
  title: DevicePerformanceManagementDataProcessor
  version: 1.1.0
  description: Retrieves PM data from an MWDI database replica, processes it, formats it, transmits it via Kafka, and stores it in its own database.
  contact:
    name: Katharina Mohr
    url: https://github.com/openBackhaul/DevicePerformanceManagementDataProcessor
    email: katharina.mohr.external@telefonica.com
  x-api-id: u-1792-sdn-microwave-dpmdp

paths:
########################################################################################################################
#   OAM Layer - Individual Part
########################################################################################################################
  /list-functions:
    post:
      operationId: listFunctions
      summary: 'Provides list of identifiers of internal Functions'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of identifiers of internal Functions provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - list-of-functions
                properties:
                  list-of-functions:
                    type: array
                    items:
                      type: string
                      description: >
                        'operationId of internal Function
                        from [/processor-controller/function=*/function-name]'
                      # todo: DataStructure to be revised
                example:
                  list-of-functions:
                    - 'p1CreateDsfpOutputObjectFromCache'
                    - 'p1SetOutOfRangeLevelValuesToDefault'
                    - 'p1Inquire15minAirInterfaceKpisFromCaca'
                    - 'p1Inquire15minEthernetContainerKpisFromCaca'
                    - 'p1ReplaceOnfDefaultValues'
                    - 'p1SetMostRecentTimestampAndDatavInDeviceTable'
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'
  /provide-config-of-function:
    post:
      operationId: provideConfigOfFunction
      summary: 'Provides parameter set of the specified internal Function'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - function-name
              properties:
                function-name:
                  type: string
                  description: 'operationId of internal Function'
              example:
                function-name: 'p1SetOutOfRangeLevelValuesToDefault'
      responses:
        '200':
          description: 'Parameter set of the specified internal Function provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                  - function-description
                  - parameter
                properties:
                  function-name:
                    type: string
                    description: >
                      'operationId of internal Function
                      from [/domain-controller/function=functionName/function-name]'
                    # todo: DataStructure to be revised
                  function-description:
                    type: string
                    description: >
                      'Description of the Function
                      from [/domain-controller/function=functionName/function-description]'
                  parameter:
                    type: array
                    x-key: parameter-name
                    description: 'List of Parameters of the Function'
                    items:
                      type: object
                      required:
                        - parameter-name
                        - parameter-value
                        - parameter-definition
                      properties:
                        parameter-name:
                          type: string
                          description: >
                            'Invariant name of the parameter
                            from [/domain-controller/function=functionName/parameter=parameterName/parameter-name]'
                        parameter-value:
                          type: string
                          description: >
                            'Configurable value of the parameter
                            from [/domain-controller/function=functionName/parameter=parameterName/parameter-value]'
                        parameter-definition:
                          type: string
                          description: >
                            'Invariant description of the parameter
                            from [/domain-controller/function=functionName/parameter=parameterName/parameter-definition]'
                example:
                  function-name: 'p1SetOutOfRangeLevelValuesToDefault'
                  function-description: 'Overwrites values outside a predefined range by a default value.'
                  parameter:
                    - parameter-name: 'minimum-rx'
                      parameter-value: '-60dBm'
                      parameter-definition: 'Minimum acceptable value of the receive level.'
                    - parameter-name: 'maximum-rx'
                      parameter-value: '-20dBm'
                      parameter-definition: 'Maximum acceptable value of the receive level.'
                    - parameter-name: 'default-rx'
                      parameter-value: '-1dBm'
                      parameter-definition: 'Default value in case of invalid receive level.'
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'
  /update-function:
    post:
      operationId: updateFunction
      summary: 'Updates parameter set of specified internal Function'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - function-name
              properties:
                function-name:
                  type: string
                  description: >
                    'operationId of internal Function
                    find in [/domain-controller/function=*/function-name]'
                  # todo: DataStructure to be revised
                function-description:
                  type: string
                  description: >
                    'Description of the Function
                    if provided, update [/domain-controller/function=functionName/function-description]'
                parameter:
                  type: array
                  x-key: parameter-name
                  description: 'List of Parameters of the Function'
                  items:
                    type: object
                    required:
                      - parameter-name
                    properties:
                      parameter-name:
                        type: string
                        description: >
                          'Invariant name of the parameter
                          find in [/domain-controller/function=functionName/parameter=*/parameter-name]'
                      parameter-value:
                        type: string
                        description: >
                          'Configurable value of the parameter
                          if provided, update [/domain-controller/function=functionName/parameter=parameterName/parameter-value]'
                      parameter-definition:
                        type: string
                        description: >
                          'Invariant description of the parameter
                          if provided, update [/domain-controller/function=functionName/parameter=parameterName/parameter-definition]'
              example:
                function-name: 'p1SetOutOfRangeLevelValuesToDefault'
                function-description: 'Overwrites values outside a predefined range by a default value.'
                parameter:
                  - parameter-name: 'default-rx'
                    parameter-value: '0dBm'
                    parameter-definition: 'Default value in case of invalid receive level.'
      responses:
        '204':
          description: 'Parameter set updated'
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'

  /list-processing-sequences:
    post:
      operationId: listProcessingSequences
      summary: 'Provides list of operationIds of ProcessingFunctions'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of operationIds of ProcessingFunctions provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - list-of-processing-sequences
                properties:
                  list-of-processing-sequences:
                    type: array
                    x-key: processing-sequence-name
                    description: 'List of predefined processing sequences'
                    items:
                      type: object
                      required:
                        - processing-sequence-name
                        - processing-sequence-purpose
                      properties:
                        processing-sequence-name:
                          type: string
                          description: >
                            'operationId of a predefined sequence of processing steps
                            from [/processor-controller/validation-sequence=*/_trigger-function]'
                          # todo: DataStructure to be revised
                        processing-sequence-purpose:
                          type: string
                          description: >
                            'Description of the purpose of the sequence of processing steps
                            from [/processor-controller/validation-sequence=*/_trigger-function]'
                example:
                  # todo: document at least one reasonable processing sequence
                  # todo: processing-sequence-purpose to be added
                  list-of-processing-sequences:
                    - processing-sequence-name: 'p1PrepareAirInterfacePerformanceData'
                      processing-sequence-purpose:
                    - processing-sequence-name: 'p1PrepareEthernetContainerPerformanceData'
                      processing-sequence-purpose:
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'
  /provide-processing-sequence:
    post:
      operationId: provideProcessingSequence
      summary: 'Provides configuration of a processing sequence'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - processing-sequence-name
              properties:
                processing-sequence-name:
                  type: string
                  description: 'operationId of a predefined sequence of processing steps'
              example:
                function-name: 'p1PrepareAirInterfacePerformanceData'
      responses:
        '200':
          description: 'Sequence of processing steps provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - processing-sequence-name
                  - sequence
                properties:
                  processing-sequence-name:
                    type: string
                    description: >
                      'operationId of a predefined sequence of processing steps
                      from [/domain-controller/function=functionName/function-name]'
                    # todo: DataStructure to be revised
                  sequence:
                    type: array
                    x-key: step-number
                    description: 'List of Functions to be executed during the processing'
                    items:
                      type: object
                      required:
                        - step-number
                        - function-name
                        - is-activated
                      properties:
                        step-number:
                          type: integer
                          description: >
                            '
                            from [/domain-controller/validation-sequence=triggerFunction/sequence=*/step-number]'
                          # todo: Description and DataStructure to be revised
                        function-name:
                          type: string
                          description: >
                            'Invariant name of the parameter
                            from [/domain-controller/function=functionName/parameter=parameterName/parameter-name]'
                          # todo: Description and DataStructure to be revised
                        is-activated:
                          type: boolean
                          description: >
                            'If true, Function shall be called during executing the process
                            from [/domain-controller/function=functionName/parameter=parameterName/parameter-value]'
                          # todo: Description and DataStructure to be revised
                example:
                  processing-sequence-name: 'p1PrepareAirInterfacePerformanceData'
                  sequence:
                    - step-number: 0
                      function-name: 'p1CreateDsfpOutputObjectFromCache'
                      is-activated: true
                    - step-number: 1
                      function-name: 'p1SetOutOfRangeLevelValuesToDefault'
                      is-activated: true
                    - step-number: 2
                      function-name: 'p1Inquire15minAirInterfaceKpisFromCaca'
                      is-activated: true
                    - step-number: 3
                      function-name: 'p1ReplaceOnfDefaultValues'
                      is-activated: true
                    - step-number: 4
                      function-name: 'p1SetMostRecentTimestampAndDatavInDeviceTable'
                      is-activated: false
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'
  /update-processing-sequence:
    post:
      operationId: updateProcessingSequence
      summary: 'Allows activating and de-activating of individual processing steps'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - processing-sequence-name
                - sequence
              properties:
                processing-sequence-name:
                  type: string
                  description: 'operationId of a predefined sequence of processing steps'
                sequence:
                  type: array
                  x-key: function-name
                  description: 'List of Functions that shall be activated or de-activated'
                  items:
                    type: object
                    required:
                      - function-name
                      - shall-be-active
                    properties:
                      function-name:
                        type: string
                        description: >
                          'Invariant name of the parameter
                          from [/domain-controller/function=functionName/parameter=parameterName/parameter-name]'
                        # todo: Description and DataStructure to be revised
                      shall-be-active:
                        type: boolean
                        description: >
                          'If true, the function shall be executed as a part of the processing
                          from [/domain-controller/function=functionName/parameter=parameterName/parameter-value]'
              example:
                processing-sequence-name: 'p1PrepareAirInterfacePerformanceData'
                sequence:
                  - function-name: 'p1SetMostRecentTimestampAndDatavInDeviceTable'
                    shall-be-active: true
      responses:
        '204':
          description: 'Sequence of ValidationFunctions updated'
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'

  /v1/provide-data-store-item-for-device:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: provideDataStoreItemForDevice
      summary: 'Provides the dataStore item for an input device'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
                  description: 'The mount-name of the device for which data shall be returned.'
                timestamp:
                  type: string
                  description: 'Optional filter; if provided, the device.lot items shall be filtered for those where x-key (new-value) is newer than the timestamp'
              example:
                mount-name: '101250001'
                timestamp: '2024-03-06T00:00:00+01:00'
      responses:
        '200':
          description: 'DataStore item for device provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - device-item
                properties:
                  device-item:
                    required:
                      - mount-name
                      - lot
                    properties:
                      mount-name:
                        type: string
                        description: > 
                          'The mountName of the device, matching the mountName
                          from {$request.body#mount-name}'
                      lot:
                        type: array
                        x-key: new-value
                        description: >
                          'The lots contain the processed [/process-device] objects for the given mountName'
                        items:
                          type: object
                          description: >
                            'If {$request.body#timestamp} provided, only lots with x-key newer than this timestamp contained'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-020/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '470':
          $ref: '#/components/responses/470'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
  /v1/provide-data-store-item-for-interface:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: provideDataStoreItemForInterface
      summary: 'Provides the dataStore item for an input device interface'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
                - interface-ltp
              properties:
                mount-name:
                  type: string
                  description: 'The mount-name of the device for which the interface data shall be returned.'
                interface-ltp:
                  type: string
                  description: 'The LTP-ID of the interface for which data shall be returned.'
                timestamp:
                  type: string
                  description: 'Optional filter; if provided, the device.lot items containing the interface data shall be filtered for those where x-key (new-value) is newer than the timestamp'
              example:
                mount-name: '123273221'
                interface-ltp: 'RF-2146697744'
                timestamp: '2024-03-06T00:00:00+01:00'
      responses:
        '200':
          description: 'DataStore item for device interface provided'
          content:
            application/json:
              schema:
                oneOf:
                - description: 'air-interface'
                  type: object
                  properties:
                    air-interface:
                      type: object
                      description: 'air-interface as item of air-interface-list in [OutputApt.yaml] schema'
                - description: 'ethernet-container'
                  properties:
                    ethernet-container:
                      type: object
                      description: 'ethernet-container as item of ethernet-container-list in [OutputApt.yaml] schema'
              examples:
                air-interface-example:
                  value:
                    air-interface:
                      air-interface-identifiers:
                        mount-name: '123273221'
                        link-endpoint-id: '325557888A'
                        link-id: '325557888'
                        logical-termination-point-id: 'RF-2146697744'
                        link-aggregation-identifiers:
                          - link-id: '325557888'
                          - interface-name: '325557889'
                      air-interface-configuration:
                        configured-atpc-is-on: true
                        configured-atpc-threshold-upper: 99
                        configured-atpc-threshold-lower: -45
                        configured-tx-power: -10
                        configured-modulation-minimum:
                          number-of-states: 4
                          name-at-lct: '4 QAM'
                          configured-capacity-minimum: 2
                        configured-modulation-maximum:
                          number-of-states: 1024
                          name-at-lct: '1024 QAM'
                          configured-capacity-maximum: 10
                      air-interface-performance-measurements-list:
                        - granularity-period: 'air-interface-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                          period-end-time: '2024-03-06T13:00:00+01:00'
                          transmit-level-minimum: 18
                          transmit-level-maximum: 22
                          transmit-level-average: 21
                          receive-level-minimum: -45
                          receive-level-maximum: -44
                          receive-level-average: -44
                          signal-to-noise-ratio-minimum: 0
                          signal-to-noise-ratio-maximum: 0
                          signal-to-noise-ratio-average: 0
                          cross-polarization-discrimination-minimum: 30
                          cross-polarization-discrimination-maximum: 31
                          cross-polarization-discrimination-average: 99
                          operated-transmission-modes-list:
                              - transmission-mode-name: '56000-1024-v2'
                                modulation-scheme-name-at-lct:
                                time: 897
                                capacity: 100
                              - transmission-mode-name: '56000-128-v4'
                                modulation-scheme-name-at-lct:
                                time: 3
                                capacity: 120
                          interval-capacity: 110
                          errorred-seconds: 10
                          severely-errorred-seconds: 2
                          consecutive-severely-errorred-seconds: 0
                          total-unavailability: 0
                          defect-blocks: 2
                          time-period: 890
                      transmission-mode-list:
                        - transmission-mode-name: '56000-1024-v2'
                          number-of-states: 1024
                          modulation-scheme-name-at-lct: '1024 QAM'
                          channel-bandwidth: 56000
                          code-rate: 94
                          symbol-rate-reduction-factor: 1
                        - transmission-mode-name: '7000-16-v2'
                          number-of-states: 16
                          modulation-scheme-name-at-lct: '16 QAM'
                          channel-bandwidth: 7000
                          code-rate: 86
                          symbol-rate-reduction-factor: 1
                ethernet-container-example:
                  value:
                    ethernet-container:
                      ethernet-container-identifiers:
                        mount-name: '123273221'
                        interface-name: 'WAN 1/1/1'
                        logical-termination-point-id: 'ETH-2134646913'
                      ethernet-container-performance-measurements-list:
                        - granularity-period: 'ethernet-container-2-0:GRANULARITY_PERIOD_TYPE_PERIOD-15-MIN'
                          period-end-time: '2024-03-07T00:15:00.0+00:00'
                          max-bytes-per-second-output: '100'
                          total-bytes-input: '9324688281'
                          total-bytes-output: '9800000000'
                          total-frames-input: '9047677'
                          total-frames-output: '9901000'
                          forwarded-frames-input: '500000'
                          forwarded-frames-output: '510000'
                          unicast-frames-input: '100000'
                          unicast-frames-output: '110000'
                          multicast-frames-input: 51945
                          multicast-frames-output: 10000
                          broadcast-frames-input: 15
                          broadcast-frames-output: 10
                          fragmented-frames-input: 1300
                          errored-frames-input: 4000
                          errored-frames-output: 4001
                          dropped-frames-input: 5000
                          dropped-frames-output: 1200
                          oversized-frames-ingress: '100000'
                          undersized-frames-ingress: '123000'
                          jabber-frames-ingress: '123123'
                          unknown-protocol-frames-input: '124785'
                          time-period: 899
                          transmit-traffic: 320
                          receive-traffic: 250
                          frame-loss: 12000
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-021/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '204':
          description: 'No relevant interface data found'
          headers:
            x-correlator:
              schema:
                type: string
                example: '550e8400-e29b-11d4-a716-446655440000'
            exec-time:
              schema:
                type: integer
                example: 1100
            backend-time:
              schema:
                type: integer
                example: 850
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
                example: 'EXPERIMENTAL'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-021/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'

        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '470':
          $ref: '#/components/responses/470'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'


########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
    '429':
      description: 'Response in case too many requests need to be executed in parallel or too many requests have been received within a time period. The maximum number of parallel requests is defined in an IntegerProfile with the service name as a prefix and MaxNumberOfParallelRequests as a suffix. Some time period to elapse for throttling incomming requests is defined in an IntegerProfile with the service name as a prefix and ThrottlingPeriod as a suffix'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 429
                maximum: 429
                format: int32
              message:
                type: string
                enum:
                  - 'Too many requests'
    '460':
      description: 'Response in case the mountName provided in the request is not found in the list of connected devices'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 460
                maximum: 460
                format: int32
              message:
                type: string
                enum:
                  - 'Not connected. Requested device is currently not in connected state at the controller'
    '461':
      description: 'Response in case the (parent) topology object provided in the request (body or path) is not found in the cache.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 461
                maximum: 461
                format: int32
              message:
                type: string
                enum:
                  - 'Not available. The topology (parent) object is currently not found in the cache.'
    '470':
      description: 'Response in case the resource specified in the request does not exist within the connected device'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 470
                maximum: 470
                format: int32
              message:
                type: string
                enum:
                  - 'Resource not existing. Device informs about addressed resource unknown'
    '471':
      description: 'Response in case the (child) topology object specified in the request (body or path) does not exist within the cache.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 471
                maximum: 471
                format: int32
              message:
                type: string
                enum:
                  - '(Child) topology object not existing. Cache informs about addressed resource unknown.'
    '502':
      description: 'Response in case the server is acting as a gateway or proxy and received an invalid response from the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 502
                maximum: 502
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway'
    '530':
      description: 'Response in case the referenced resource exists (e.g. device connected and resource exists in internal datatree), but response data is either not available, lost during transmission, incomplete or corrupted'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 530
                maximum: 530
                format: int32
              message:
                type: string
                enum:
                  - 'Data invalid. Response data not available, incomplete or corrupted'
    '531':
      description: 'Response in case the server is acting as a gateway or proxy and was unable to authenticate at the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 531
                maximum: 531
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway. Authentication at upstream server failed.'
    '532':
      description: 'Response in case the server is acting as a gateway or proxy and was unable to connect to the upstream server (device or application providing a consumed service)'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 532
                maximum: 532
                format: int32
              message:
                type: string
                enum:
                  - 'Bad Gateway. Upstream server not responding.'
    '533':
      description: 'Response in case the referenced resource for an connected device does not exist at the controller.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 533
                maximum: 533
                format: int32
              message:
                type: string
                enum:
                  - 'Resource unknown. The resource for the connected device does not exist at the Controller'
    '550':
      description: 'Response in case that the application wants to call a service specified by the requestor (e.g., to return data after a long taking  data retrieval) during a service call to the application and the service information cannot be found.'
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: integer
                minimum: 550
                maximum: 550
                format: int32
              message:
                type: string
                enum:
                  - 'Requestor information for callback execution not found.'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    genericRepresentation:
      type: object
      required:
        - response-value-list
        - consequent-action-list
      properties:
        response-value-list:
          type: array
          items:
            type: object
            required:
              - field-name
              - value
              - datatype
            properties:
              field-name:
                type: string
                description: >
                  'Field name
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/field-name]'
              value:
                type: string
                description: >
                  'Field value
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-configuration/value]'
              datatype:
                type: string
                description: >
                  'Field datatype
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/datatype]'
        consequent-action-list:
          type: array
          items:
            type: object
            required:
              - label
              - request
              - display-in-new-browser-window
            properties:
              label:
                type: string
                description: >
                  'Label that shall be presented on the button
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/label]'
              request:
                type: string
                description: >
                  'Request that shall be called, when button gets pressed
                  from
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-protocol}]
                  ://
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/ipv-4-address}
                  or
                  {/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/domain-name}]
                  :
                  [{/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-port}]
                  [{/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-configuration/consequent-operation-reference}]'
              input-value-list:
                type: array
                items:
                  type: object
                  required:
                    - field-name
                  properties:
                    field-name:
                      type: string
                      description: >
                        'Name of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/name]'
                    unit:
                      type: string
                      description: >
                        'Unit of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/unit]'
              display-in-new-browser-window:
                type: boolean
                description: >
                  'True in case Request shall be represented in a new browser window
                  from [/core-model-1-4:control-construct/profile-collection/profile=dpmdp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/display-in-new-browser-window]'
    logicalTerminationPoint:
      type: object
      required:
        - uuid
        - ltp-direction
        - client-ltp
        - server-ltp
        - layer-protocol
      properties:
        uuid:
          type: string
        ltp-direction:
          type: string
        client-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        server-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        layer-protocol:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - description: 'operation server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-server-interface-1-0:operation-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-server-interface-1-0:operation-server-interface-pac:
                    type: object
                    required:
                      - operation-server-interface-capability
                      - operation-server-interface-configuration
                    properties:
                      operation-server-interface-capability:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-server-interface-configuration:
                        type: object
                        required:
                          - life-cycle-state
                        properties:
                          life-cycle-state:
                            type: string
              - description: 'http server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-server-interface-1-0:http-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-server-interface-1-0:http-server-interface-pac:
                    type: object
                    required:
                      - http-server-interface-capability
                    properties:
                      http-server-interface-capability:
                        type: object
                        required:
                          - application-name
                          - release-number
                          - data-update-period
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
                          data-update-period:
                            type: string
              - description: 'tcp server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-server-interface-1-0:tcp-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-server-interface-1-0:tcp-server-interface-pac:
                    type: object
                    required:
                      - tcp-server-interface-configuration
                    properties:
                      tcp-server-interface-configuration:
                        type: object
                        required:
                          - description
                          - local-protocol
                          - local-address
                          - local-port
                        properties:
                          description:
                            type: string
                          local-protocol:
                            type: string
                          local-address:
                            type: object
                            properties:
                              ipv-4-address:
                                type: string
                              domain-name:
                                type: string
                          local-port:
                            type: integer
              - description: 'operation client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-client-interface-1-0:operation-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-client-interface-1-0:operation-client-interface-pac:
                    type: object
                    required:
                      - operation-client-interface-configuration
                      - operation-client-interface-status
                    properties:
                      operation-client-interface-configuration:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'elasticsearch client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac:
                    type: object
                    required:
                      - elasticsearch-client-interface-configuration
                      - elasticsearch-client-interface-status
                    properties:
                      elasticsearch-client-interface-configuration:
                        type: object
                        required:
                          - index-alias
                        properties:
                          index-alias:
                            type: string
                      elasticsearch-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'mongodb client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - mongodb-client-interface-1-0:mongodb-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  mongodb-client-interface-1-0:mongodb-client-interface-pac:
                    type: object
                    required:
                      - mongodb-client-interface-configuration
                      - mongodb-client-interface-status
                    properties:
                      mongodb-client-interface-configuration:
                        type: object
                        required:
                          - database-name
                          - collection-name
                        properties:
                          database-name:
                            type: string
                          collection-name:
                            type: string
                      mongodb-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'kafka client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - kafka-client-interface-1-0:kafka-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  kafka-client-interface-1-0:kafka-client-interface-pac:
                    type: object
                    required:
                      - kafka-client-interface-configuration
                      - kafka-client-interface-status
                    properties:
                      kafka-client-interface-configuration:
                        type: object
                        required:
                          - topic-name
                        properties:
                          topic-name:
                            type: string
                      kafka-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'http client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-client-interface-1-0:http-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-client-interface-1-0:http-client-interface-pac:
                    type: object
                    required:
                      - http-client-interface-configuration
                    properties:
                      http-client-interface-configuration:
                        type: object
                        required:
                          - application-name
                          - release-number
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
              - description: 'tcp client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-client-interface-1-0:tcp-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-client-interface-1-0:tcp-client-interface-pac:
                    type: object
                    required:
                      - tcp-client-interface-configuration
                    properties:
                      tcp-client-interface-configuration:
                        type: object
                        required:
                          - remote-protocol
                          - remote-address
                          - remote-port
                        properties:
                          remote-protocol:
                            type: string
                          remote-address:
                            type: object
                            properties:
                              ip-address:
                                type: object
                                properties:
                                  ipv-4-address:
                                    type: string
                              domain-name:
                                type: string
                          remote-port:
                            type: integer
    forwardingDomain:
      type: object
      required:
        - uuid
        - forwarding-construct
      properties:
        uuid:
          type: string
        forwarding-construct:
          type: array
          items:
            type: object
            required:
              - uuid
              - name
              - fc-port
            properties:
              uuid:
                type: string
              name:
                type: array
                items:
                  type: object
                  required:
                    - value-name
                    - value
                  properties:
                    value-name:
                      type: string
                    value:
                      type: string
              fc-port:
                type: array
                items:
                  type: object
                  required:
                    - local-id
                    - port-direction
                    - logical-termination-point
                  properties:
                    local-id:
                      type: string
                    port-direction:
                      type: string
                    logical-termination-point:
                      type: string
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: operation-key
    basicAuth:
      type: http
      scheme: basic
