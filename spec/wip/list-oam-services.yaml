  /v1/list-functions:
    post:
      operationId: v1ListFunctions
      summary: 'Provides list of identifiers of internal Functions'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of identifiers of internal Functions provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - list-of-functions
                properties:
                  list-of-functions:
                    type: array
                    items:
                      type: string
                      description: >
                        'operationId of internal Function
                        from [/processor-controller/function=*/function-name]'
                example:
                  list-of-functions:
                    - p1CreateDsfpOutputObjectFromCache
                    - p1SetOutOfLevelValuesToDefaultInDsfpOutput
                    - p1Inquire15minAirInterfaceKpisFromCacaAndSetInDsfpOutput
                    - p1Inquire15minEthernetContainerKpisFromCacaAndSetInDsfpOutput
                    - p1ReplaceOnfDefaultValuesinDsfpOutput
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'

  /v1/list-processing-sequences:
    post:
      operationId: v1ListProcessingSequences
      summary: 'Provides list of operationIds of ProcessingFunctions'
      tags:
        - IndividualManagement
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of operationIds of ProcessingFunctions provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - list-of-trigger-functions
                properties:
                  list-of-trigger-functions:
                    type: array
                    items:
                      type: string
                      description: >
                        'operationId of ProcessingFunction
                        from [/processor-controller/validation-sequence=*/_trigger-function]'
                example:
                  list-of-trigger-functions:
                    - todo
        '400':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '401':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '403':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '404':
          $ref: '#/components/responses/responseForErroredOamRequests'
        '500':
          $ref: '#/components/responses/responseForErroredOamRequests'
        default:
          $ref: '#/components/responses/responseForErroredOamRequests'