  /v1/regard-attribute-value-change:
    parameters:
      - $ref: '#/components/parameters/user'
      - $ref: '#/components/parameters/originator'
      - $ref: '#/components/parameters/x-correlator'
      - $ref: '#/components/parameters/trace-indicator'
      - $ref: '#/components/parameters/customer-journey'
    post:
      operationId: regardDeviceAttributeValueChange
      summary: 'Receives notifications about changes of values of attributes inside the devices'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - microwave-device-inventory-1-0:attribute-value-changed-notification
              properties:
                microwave-device-inventory-1-0:attribute-value-changed-notification:
                  type: object
                  required:
                    - counter
                    - timestamp
                    - object-path
                    - attribute-name
                    - new-value
                  properties:
                    counter:
                      type: integer
                      description: 'Sequence number of callbacks sent through this forwarding'
                    timestamp:
                      type: string
                      description: 'Time when the callback is send'
                    object-path:
                      type: string
                      description: 'Path (cache path as available at the MWDI API) to the object that holds the attribute that changed its value'
                    attribute-name:
                      type: string
                      description: 'Name of the attribute that changed its value'
                    new-value:
                      type: string
                      description: 'New value of the attribute'
              example:
                microwave-device-inventory-1-0:attribute-value-changed-notification:
                  counter: 132
                  timestamp: '2010-11-20T14:00:00+01:00'
                  object-path: '/core-model-1-4:network-control-domain=cache/control-construct=513250009/logical-termination-point=RF-2146697857/layer-protocol=2146697857/air-interface-2-0:air-interface-pac/air-interface-historical-performances'
                  attribute-name: 'time-of-latest-change'
                  new-value: '2010-11-20T13:59:00+01:00'
      responses:
        '204':
          description: 'Notification received'
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            exec-time:
              $ref: '#/components/headers/exec-time'
            backend-time:
              $ref: '#/components/headers/backend-time'
            life-cycle-state:
              $ref: '#/components/headers/life-cycle-state'
              description: >
                'Life cycle state of the consumed service
                find in [/core-model-1-4:control-construct/logical-termination-point=dpmdp-1-0-0-op-s-is-000/layer-protocol=0/operation-server-interface-1-0:operation-server-interface-pac/operation-server-interface-configuration/life-cycle-state]'
        '400':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '401':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '403':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '404':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        '470':
          $ref: '#/components/responses/470'
        '500':
          $ref: '#/components/responses/responseForErroredServiceRequests'
        default:
          $ref: '#/components/responses/responseForErroredServiceRequests'
      callbacks:
        NotifiedDeviceAttributeValueChangeCausesTriggeringProcessorOrchestrator:


        NotifiedDeviceAttributeValueChangeCausesUpdateOfCache:
          ReadClass: #[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][{$REQUEST_BODY#microwave-device-inventory-1-0:attribute-value-changed-notification/object-path but live replaced by cache}]
            get:
              responses:
                '200':
                  description: >
                    'IF this callback is called from /v1/regard-attribute-value-change
                      THEN REQUEST_BODY = {$request.body}
                    ELSE IF this callback is called from PromptForEmbeddingCausesCyclicNotificationProcessingToApplyDeviceAttributeValueChange
                      THEN REQUEST_BODY = {$PromptForEmbeddingCausesCyclicNotificationProcessingToApplyDeviceAttributeValueChange.applyDeviceAttributeValueChange.request.body}
                    #
                    Depends on addressed class'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '470':
                  $ref: '#/components/responses/470'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
          UpdateAndWriteClass: #[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-protocol]://[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/domain-name or /core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-address/ip-address/ipv-4-address]:[/core-model-1-4:control-construct/logical-termination-point=mwdi-2-0-1-tcp-c-es-1-0-0-000/layer-protocol=0/tcp-client-interface-1-0:tcp-client-interface-pac/tcp-client-interface-configuration/remote-port][{$REQUEST_BODY#microwave-device-inventory-1-0:attribute-value-changed-notification/object-path but live replaced by cache}]
            put:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      description: >
                        'IF this callback is called from /v1/regard-attribute-value-change
                          THEN REQUEST_BODY = {$request.body}
                        ELSE IF this callback is called from PromptForEmbeddingCausesCyclicNotificationProcessingToApplyDeviceAttributeValueChange
                          THEN REQUEST_BODY = {$PromptForEmbeddingCausesCyclicNotificationProcessingToApplyDeviceAttributeValueChange.applyDeviceAttributeValueChange.request.body}
                        #
                        Depends on addressed class
                        Attribute with name according to {$REQUEST_BODY#microwave-device-inventory-1-0:attribute-value-changed-notification/attribute-name}
                        to be updated with value according to {$REQUEST_BODY#microwave-device-inventory-1-0:attribute-value-changed-notification/new-value}'
              responses:
                '204':
                  description: 'Depends on addressed class'
                '400':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '401':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '403':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '404':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                '470':
                  $ref: '#/components/responses/470'
                '500':
                  $ref: '#/components/responses/responseForErroredServiceRequests'
                default:
                  $ref: '#/components/responses/responseForErroredServiceRequests'
